<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="265" fill="#fff"/><rect x="20" y="85" width="110" height="46" rx="6" fill="#cfe3f7" stroke="#ccc"/><text x="75.0" y="112.5" font-size="13" text-anchor="middle" fill="#222" font-weight="normal">Encoder</text><rect x="180" y="40" width="120" height="40" rx="6" fill="#fff" stroke="#c25e00"/><text x="240.0" y="64.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">z_mean = μ</text><rect x="180" y="135" width="120" height="40" rx="6" fill="#fff" stroke="#c25e00"/><text x="240.0" y="159.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">z_log_var</text><line x1="130" y1="100" x2="178" y2="62" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="130" y1="116" x2="178" y2="152" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="340" y="135" width="130" height="40" rx="6" fill="#fff" stroke="#c25e00"/><text x="405.0" y="159.5" font-size="12" text-anchor="middle" fill="#c25e00" font-weight="normal">σ = exp(½·log σ²)</text><line x1="300" y1="155" x2="338" y2="155" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="340" y="185" width="130" height="36" rx="6" fill="#e8f1fb" stroke="#1d6fb8"/><text x="405.0" y="207.5" font-size="13" text-anchor="middle" fill="#1d6fb8" font-weight="normal">ε ~ N(0, 1)</text><circle cx="525" cy="168" r="17" fill="#fff" stroke="#222"/><text x="525" y="173" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">×</text><line x1="470" y1="155" x2="509" y2="163" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="470" y1="203" x2="510" y2="176" stroke="#1d6fb8" stroke-width="1.6" marker-end="url(#ar)"/><circle cx="585" cy="80" r="17" fill="#fff" stroke="#222"/><text x="585" y="85" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">+</text><line x1="300" y1="60" x2="567" y2="76" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="535" y1="153" x2="575" y2="96" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="640" y="60" width="100" height="40" rx="6" fill="#d9efd9" stroke="#ccc"/><text x="690.0" y="84.5" font-size="13" text-anchor="middle" fill="#222" font-weight="normal">z → Decoder</text><line x1="602" y1="80" x2="638" y2="80" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><path d="M640 108 C 560 125, 420 120, 310 70" fill="none" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arb)"/><line x1="150" y1="240" x2="185" y2="240" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="192" y="244" font-size="11.5" text-anchor="start" fill="#b3261e" font-weight="normal">gradient ไหลกลับผ่าน μ และ σ ไปถึง encoder ได้</text><text x="192" y="261" font-size="11.5" text-anchor="start" fill="#1d6fb8" font-weight="normal">ε เป็นแค่ตัวเลขสุ่มจากนอกโมเดล ไม่ต้องหา gradient</text></svg>