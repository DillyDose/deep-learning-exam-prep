<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="270" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">scaled dot-product attention: MatMul(Q, K) → scale → mask → softmax → MatMul(V)</text><rect x="30" y="70" width="150" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="105.0" y="94.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">q · k</text><text x="105" y="140" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">[2, 0]</text><text x="105" y="162" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">q = [1,1,0,0]</text><line x1="180" y1="90" x2="213" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="215" y="70" width="150" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="290.0" y="94.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">÷ √d_k = 2</text><text x="290" y="140" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">[1, 0]</text><text x="290" y="162" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">d_k = 4</text><line x1="365" y1="90" x2="398" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="400" y="70" width="150" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="475.0" y="94.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">softmax</text><text x="475" y="140" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">[0.731, 0.269]</text><text x="475" y="162" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">รวมเป็น 1</text><line x1="550" y1="90" x2="583" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="585" y="70" width="150" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="660.0" y="94.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">× V</text><text x="660" y="140" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">[7.31, 2.69]</text><text x="660" y="162" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">v₁ = [10,0], v₂ = [0,10]</text><text x="130" y="196" font-size="11.5" text-anchor="middle" fill="#666" font-weight="normal">k₁ = [1,1,0,0] · k₂ = [0,0,1,1]</text><text x="380" y="226" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">ไม่ scale: softmax([2, 0]) = [0.881, 0.119] แหลมกว่า · d_k ใหญ่ dot product ใหญ่ softmax อิ่มตัว gradient หาย</text><text x="380" y="250" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">self-attention: Q, K, V มาจากลำดับเดียวกัน · cross-attention: Q จาก target, K และ V จาก source</text></svg>