<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="250" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">นับจำนวนตำแหน่งที่หน้าต่างวางได้ = ⌊(n + 2p − f) / s⌋ + 1</text><rect x="60" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="83.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">1</text><rect x="106" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="129.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">2</text><rect x="152" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="175.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">3</text><rect x="198" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="221.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">4</text><rect x="244" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="267.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">5</text><rect x="290" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="313.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">6</text><rect x="336" y="70" width="46" height="46" fill="#fff" stroke="#999"/><text x="359.0" y="98.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">7</text><rect x="63" y="130" width="132" height="14" rx="4" fill="#1d6fb8" fill-opacity="0.25" stroke="#1d6fb8"/><text x="129.0" y="141" font-size="11" text-anchor="middle" fill="#1d6fb8" font-weight="normal">ตำแหน่ง 1</text><rect x="155" y="152" width="132" height="14" rx="4" fill="#2e7d32" fill-opacity="0.25" stroke="#2e7d32"/><text x="221.0" y="163" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="normal">ตำแหน่ง 2</text><rect x="247" y="174" width="132" height="14" rx="4" fill="#6a3d9a" fill-opacity="0.25" stroke="#6a3d9a"/><text x="313.0" y="185" font-size="11" text-anchor="middle" fill="#6a3d9a" font-weight="normal">ตำแหน่ง 3</text><text x="402" y="98" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">n = 7, f = 3, p = 0, s = 2</text><text x="402" y="122" font-size="13" text-anchor="start" fill="#c25e00" font-weight="bold">⌊(7 − 3)/2⌋ + 1 = 3</text><text x="402" y="154" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">ถ้า n = 6: ⌊3/2⌋ + 1 = 2</text><text x="402" y="174" font-size="12" text-anchor="start" fill="#666" font-weight="normal">หน้าต่างที่ 3 ล้นขอบ จึงไม่นับ</text><text x="380" y="228" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">padding "same" (stride 1): p = (f − 1)/2 ทำให้ output เท่า input · ไม่ระบุ padding ใน Keras = "valid" (p = 0)</text></svg>