<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="370" fill="#fff"/><rect x="10" y="16" width="740" height="152" rx="8" fill="#fafafa" stroke="#ccc"/><text x="20" y="34" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Training: สอนให้ทาย noise</text><rect x="25" y="55" width="70" height="34" rx="6" fill="#e5f3e6" stroke="#2e7d32"/><text x="60.0" y="76.5" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="normal">รูป x₀</text><rect x="25" y="100" width="70" height="34" rx="6" fill="#e8f1fb" stroke="#1d6fb8"/><text x="60.0" y="121.5" font-size="13" text-anchor="middle" fill="#1d6fb8" font-weight="normal">สุ่ม t, ε</text><rect x="130" y="75" width="190" height="40" rx="6" fill="#fff" stroke="#ccc"/><text x="225.0" y="99.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">x_t = √ᾱ·x₀ + √(1−ᾱ)·ε</text><rect x="360" y="75" width="110" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="415.0" y="99.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">U-Net(x_t, t)</text><rect x="505" y="75" width="60" height="40" rx="6" fill="#fff" stroke="#c25e00"/><text x="535.0" y="99.5" font-size="15" text-anchor="middle" fill="#c25e00" font-weight="normal">ε̂</text><rect x="600" y="75" width="135" height="40" rx="6" fill="#fff" stroke="#ccc"/><text x="667.5" y="99.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">loss = ε̂ เทียบ ε</text><line x1="95" y1="72" x2="128" y2="88" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="95" y1="117" x2="128" y2="102" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="320" y1="95" x2="358" y2="95" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="470" y1="95" x2="503" y2="95" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="565" y1="95" x2="598" y2="95" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><path d="M60 136 C 200 152, 560 152, 660 118" fill="none" stroke="#1d6fb8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="380" y="164" font-size="11" text-anchor="middle" fill="#1d6fb8" font-weight="normal">ε ที่ใช้สร้าง x_t คือคำตอบที่ถูก</text><rect x="10" y="191" width="740" height="155" rx="8" fill="#fafafa" stroke="#ccc"/><text x="20" y="209" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Sampling: เริ่มจาก noise ล้วน ทำซ้ำ เช่น 20 ขั้น</text><rect x="20" y="235" width="100" height="40" rx="6" fill="#e8f1fb" stroke="#1d6fb8"/><text x="70.0" y="259.5" font-size="11" text-anchor="middle" fill="#1d6fb8" font-weight="normal">x_t (เริ่ม = noise)</text><rect x="145" y="235" width="100" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="195.0" y="259.5" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="normal">U-Net → ε̂</text><rect x="270" y="235" width="215" height="40" rx="6" fill="#fff" stroke="#ccc"/><text x="377.5" y="259.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">x̂₀ = (x_t − noise_rate·ε̂) / signal_rate</text><rect x="505" y="235" width="240" height="40" rx="6" fill="#fff" stroke="#ccc"/><text x="625.0" y="259.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">x_{t−1} = next_signal·x̂₀ + next_noise·ε̂</text><line x1="120" y1="255" x2="143" y2="255" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="245" y1="255" x2="268" y2="255" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="485" y1="255" x2="503" y2="255" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><path d="M627 277 C 600 320, 120 320, 65 278" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ar)"/><text x="345" y="340" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">วนกลับ: t ลดลงทีละ step_size = 1/diffusion_steps</text></svg>