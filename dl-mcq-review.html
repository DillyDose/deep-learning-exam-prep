น"], "answer": 2, "explanation": "<p>\\(\\beta\\) คือ \\\"สัดส่วนของอดีตที่เก็บไว้\\\" น้ำหนักของค่าที่ย้อนไป \\(k\\) ขั้นคือ \\(\\beta^k(1-\\beta)\\) — ลดแบบเอ็กซ์โพเนนเชียล ช่วงเวลาที่มีผลจริงจึงราว \\(1/(1-\\beta)\\) ค่า</p><p>\\(\\beta=0.9 \\Rightarrow 1/0.1 = 10\\) ค่า; \\(\\beta=0.98 \\Rightarrow 1/0.02 = 50\\) ค่า</p><p>\\(\\beta\\) น้อย = จำสั้น ปรับตัวไวแต่ยัง noisy; \\(\\beta\\) มาก = จำยาว นิ่งแต่ตอบสนองช้า (ที่ \\(\\beta=0.9\\) ต้องผ่าน 10 ก้าวกว่า \\(v\\) จะขึ้นถึง 65% ของค่าจริง ตามตาราง \\(1-\\beta^t\\))</p>", "ref": "Lesson 4 §4.1 (สไลด์หน้า 15)", "why_wrong_map": ["\\(\\beta\\) ไม่ได้ทำให้ \\(v\\) ใหญ่ขึ้น ค่าใหม่ได้น้ำหนัก \\(1-\\beta\\) ซึ่ง<i>ลดลง</i>เมื่อ \\(\\beta\\) เพิ่ม", "กลับทิศ: \\(\\beta\\) มากขึ้นคือจำ<i>ยาว</i>ขึ้น ไม่ใช่สั้นลง", "", "\\(\\beta\\) คุมความเรียบโดยตรง ส่วน bias correction เป็นผลพลอยได้อีกเรื่อง"]}, {"id": "L6-21", "topic": "ผลของ decay_steps ต่อสูตร scheduler", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ถ้าใช้สูตรเดิมแต่ปล่อย <code>decay_steps=10000</code> ตามค่าที่เขียนไว้ในสไลด์ แล้วเทรน 50 epoch โดยเริ่มที่ learning rate 0.03 จะเกิดอะไรขึ้น", "options": ["learning rate คงที่ 0.03 ตลอด เพราะเลขชี้กำลังเป็น 0 ทุก epoch ทำให้ตัวคูณเท่ากับ 1 พอดี", "learning rate ลดลงทีละน้อยแบบเรียบๆ จนเหลือราว 0.0003 ที่ epoch สุดท้ายของการเทรน", "เกิด error เพราะ decay_steps มากกว่าจำนวน epoch ที่เทรนจริง Keras จึงหารไม่ได้ตั้งแต่ต้น", "learning rate ดิ่งลงจนเหลือระดับ 1e-31 เหมือนกรณี decay_steps=2 เพราะสูตรคูณซ้อนเหมือนกัน"], "explanation": "<p>\\(\\lfloor (1+e)/10000 \\rfloor = 0\\) สำหรับทุก \\(e < 9999\\) ⇒ ตัวคูณ \\(0.9^{0} = 1\\) ⇒ \\(\\alpha_{new} = \\alpha \\times 1\\) ไม่เปลี่ยนเลยตลอด 50 epoch (สูตรทำงาน แต่ไม่มีผล)</p><p>เทียบกับ \\(s=2\\) ที่ใช้ในคาบ: เลขชี้กำลังโตเร็วและคูณซ้อนกันจน learning rate ดิ่งถึง \\(10^{-31}\\) — สองสุดขั้วนี้เกิดจากการแตะตัวเลขตัวเดียว</p>", "ref": "Lesson 6 §5.1 (สไลด์หน้า 10)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "จะลดได้ต้องมีเลขชี้กำลัง \\(\\ge 1\\) ซึ่งต้องรอถึง epoch ที่ 9999", "การหารด้วยเลขใหญ่กว่าไม่ทำให้เกิด error เพียงแต่ผลลัพธ์ปัดลงเป็น 0", "การดิ่งเป็น 1e-31 เกิดเมื่อ decay_steps เล็ก (เช่น 2) ทำให้ชั้นลดทอนเพิ่มทุก 2 epoch"]}, {"id": "L4-10", "lesson": 4, "topic": "SGD: Pros/Cons", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามสไลด์หน้า 9–10 ข้อได้เปรียบและเสียเปรียบของ SGD เทียบกับ Batch GD คือข้อใด?", "options": ["ได้เปรียบเพราะไม่ต้องตั้ง learning rate เองเลย แต่เสียเปรียบเพราะต้องสลับข้อมูลใหม่ทุก ๆ หนึ่ง iteration", "ได้เปรียบเพราะลู่เข้าจุดต่ำสุดได้แน่นอนทุกครั้ง แต่เสียเปรียบเพราะติดอยู่ใน local optimum ได้ง่ายกว่าเดิม", "ได้เปรียบเพราะให้ทิศที่แม่นยำกว่าในทุก iteration แต่เสียเปรียบเพราะใช้หน่วยความจำมากกว่ามากเมื่อชุดข้อมูลเทรนมีขนาดใหญ่ขึ้น", "ได้เปรียบเพราะก้าวเร็วและผ่าน local optima กับ flat region ได้ดีขึ้น แต่เสียเปรียบเพราะ noisy และไม่ได้ใช้การคูณเมทริกซ์"], "answer": 3, "explanation": "<p>SGD อัปเดตหลังเห็น <i>one training instance</i> (เรียกอีกชื่อว่า online learning)</p><p><b>Pros 1</b> faster training — มี 10,000 ตัวอย่าง SGD เดิน 10,000 ก้าวในเวลาที่ Batch GD เดิน 1 ก้าว<br><b>Pros 2</b> \"enhances navigation through local optima and flat regions (saddle points)\" — ความสั่นทำหน้าที่เขย่าให้หลุดหลุมตื้น</p><p><b>Cons 1</b> gradient so noisy อาจไปผิดทาง และ \"might not converge all the time\"<br><b>Cons 2</b> เสียความเร็วเพราะไม่ได้ใช้ matrix multiplication</p>", "ref": "Lesson 4 §3.3 (สไลด์หน้า 9–10)", "why_wrong_map": ["SGD ยังต้องตั้ง learning rate เหมือนเดิมทุกประการ", "SGD บริสุทธิ์ที่ lr คงที่จะวนรอบจุดต่ำสุด ไม่ยอมจอด และหนีหลุมได้<i>ดีกว่า</i>", "ตรงข้ามกับสไลด์: SGD ให้ทิศที่ noisy กว่า และใช้หน่วยความจำ<i>น้อย</i>กว่า", ""]}, {"id": "L1-06", "lesson": 1, "topic": "Steps to get the model", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "การสร้างโมเดลแบบมีพารามิเตอร์ (เช่น linear regression) ควรทำตามลำดับขั้นใด?", "options": ["Feature Scaling → Model Representation → Parameter Learning", "Define Cost Function → Model Representation → Feature Scaling", "Model Representation → Define Cost Function → Parameter Learning", "Model Representation → Parameter Learning → Define Cost Function"], "answer": 2, "explanation": "(1) <b>Model Representation</b> — เลือกรูปสูตรและพารามิเตอร์, (2) <b>Define Cost Function</b> — กำหนด feedback signal ที่ใช้เรียนรู้, (3) <b>Parameter Learning</b> — กำหนดว่าจะเรียนอย่างไร (เช่น gradient descent). ต้องมี cost ก่อน จึงจะรู้ว่าจะขยับพารามิเตอร์ไปทางไหน.", "ref": "Lesson 1 §1A (p.23)", "why_wrong_map": ["feature scaling เป็นการเตรียมข้อมูล ไม่ใช่หนึ่งในสามขั้นหลักของการสร้างโมเดล", "เอา feature scaling มาแทนขั้น parameter learning และสลับลำดับ", "", "สลับ cost function กับ parameter learning — ต้องนิยามสัญญาณป้อนกลับก่อน"]}, {"id": "L4-59", "lesson": 4, "topic": "Data augmentation ต้องรักษา label", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ในงานจำแนกตัวเลขเขียนมือที่ต้องแยก 6 ออกจาก 9 การแปลงแบบใดใช้เป็น data augmentation ไม่ได้ และเพราะอะไร?", "options": ["เลื่อนตำแหน่ง เพราะการเลื่อนทำให้พิกัดของ pixel เปลี่ยนไป ซึ่งเปลี่ยน label ของภาพนั้นไปด้วยเสมอ", "ย่อขนาด เพราะภาพที่เล็กลงจะมีรายละเอียดน้อยลง จึงทำให้ label ของภาพนั้นเชื่อถือไม่ได้อีกต่อไป", "หมุน 180° เพราะ 6 ที่หมุนแล้วหน้าตาเป็น 9 แต่ยังติด label เดิมว่า \"6\" โมเดลจึงถูกสอนด้วยข้อมูลที่ผิด", "หมุน 15° เพราะการหมุนไม่ว่ามุมใดก็ทำให้ตัวเลขเปลี่ยนความหมาย จึงห้ามใช้การหมุนกับงานจำแนกตัวเลขทุกกรณีเสมอ"], "answer": 2, "explanation": "นิยามของหน้า 34: augmentation คือการสร้าง training data เพิ่มแบบสังเคราะห์จาก existing training examples ด้วย random transformations และสไลด์ระบุประโยชน์ไว้สามคำคือทนต่อความแปรผันของ <b>position, orientation, size</b><br>กฎที่ซ่อนอยู่ในทุกตัวอย่าง: การแปลงต้อง <b>รักษา label</b> — เห็ดที่หมุน 15° ก็ยังเป็นเห็ด<br>แต่ในงาน 6 vs 9 การหมุน 180° ทำให้ภาพของ 6 กลายเป็นภาพของ 9 ขณะที่ระบบยังแปะ label ว่า \"6\" ⇒ โมเดลถูกสอนด้วยคู่ (ภาพ, label) ที่ผิด ยิ่ง augment ยิ่งแย่ลง<br>บทสรุป: ชุดการแปลงขึ้นกับตัวงาน ไม่ใช่สูตรสำเร็จที่ใช้ได้กับทุกงาน", "ref": "Lesson 4 §7 (สไลด์หน้า 34)", "why_wrong_map": ["position เป็นหนึ่งในสามคำที่สไลด์ระบุว่า augmentation ช่วยให้โมเดลทนได้ การเลื่อนไม่เปลี่ยน label", "size ก็เป็นหนึ่งในสามคำนั้น การย่อ-ขยายจึงเป็นการแปลงมาตรฐานที่ไม่เปลี่ยน label เช่นกัน", "", "การหมุนเล็กน้อย (เช่น \\(-15^\\circ\\) ถึง \\(+15^\\circ\\)) ยังรักษา label ไว้ จึงใช้ได้ตามปกติ"]}, {"id": "L2-07", "lesson": 2, "topic": "ทำไมต้องมี activation: ชั้นเชิงเส้นยุบเป็นชั้นเดียว", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ต่อสองชั้นโดยไม่มี activation: ชั้นแรก \\(a = 3x-1\\) ชั้นสอง \\(h = 2a+5\\) ฟังก์ชันรวม \\(h\\) เท่ากับข้อใด?", "options": ["\\(h = 6x+3\\) ซึ่งยังเป็นเส้นตรง การซ้อนชั้นจึงไม่เพิ่มความสามารถ", "\\(h = 6x+7\\) ซึ่งยังเป็นเส้นตรง การซ้อนชั้นจึงไม่เพิ่มความสามารถ", "\\(h = 5x+4\\) เพราะต้องเอาสัมประสิทธิ์ของสองชั้นมาบวกกันก่อน", "\\(h = 6x^2+3\\) เพราะการซ้อนสองชั้นทำให้ดีกรีของฟังก์ชันเพิ่มขึ้น"], "answer": 0, "explanation": "<p>แทน \\(a\\) ลงในชั้นสองตรง ๆ: \\(h = 2(3x-1)+5 = 6x-2+5 = 6x+3\\)</p>\n<p>ตรวจด้วยตัวเลข \\(x=1\\): \\(a = 2,\\ h = 2(2)+5 = 9\\) และ \\(6(1)+3 = 9\\) ✓</p>\n<p>ข้อสรุป: ต่อชั้นเชิงเส้นกี่ชั้นก็ยังได้เส้นตรงเส้นเดียว ถ้าใส่ sigmoid คั่น \\(h = 2g(3x-1)+5\\) ความชันจะไม่คงที่อีกต่อไป นั่นคือ “โค้ง” จริง — activation ที่ไม่เป็นเชิงเส้นจึงเป็นสิ่งที่ทำให้การซ้อนชั้นมีความหมาย</p>", "ref": "Lesson 2 §1A กล่อง “ต้องรู้ก่อน” (Lecture2.pdf p.6)", "why_wrong_map": ["", "คำนวณค่าคงที่ผิดเครื่องหมาย: \\(2(-1)+5 = +3\\) ไม่ใช่ \\(+7\\)", "เอาสัมประสิทธิ์มาบวกแทนที่จะคูณกัน (\\(3\\times2=6\\) ไม่ใช่ \\(3+2\\))", "การประกอบฟังก์ชันเชิงเส้นสองชั้นไม่ทำให้เกิดเทอมกำลังสอง"]}, {"id": "L2-13", "lesson": 2, "topic": "หน้าที่ของแต่ละ layer และการนับชั้น", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "โครงข่ายที่มี input \\(x_1,x_2\\) → hidden 3 node → output 1 node ตามวิธีนับชั้นของ neural network เรียกว่าอะไร และเพราะอะไร?", "options": ["“Deep NN” เพราะมีชั้นมากกว่าหนึ่งชั้นต่อกันตั้งแต่ input จนถึง output", "“1 Layer NN” เพราะนับเฉพาะ hidden layer ที่ทำหน้าที่เรียน representation", "“3 Layers NN” เพราะนับทุกคอลัมน์ที่วาดในแผนภาพ รวม input layer ด้วย", "“2 Layers NN” เพราะนับเฉพาะชั้นที่มีพารามิเตอร์ ไม่นับ input layer"], "answer": 3, "explanation": "<p>Input layer ทำหน้าที่ <b>receives the input data</b> เท่านั้น ไม่มีการคำนวณและไม่มีพารามิเตอร์ จึงไม่ถูกนับเป็น layer. Hidden layer เรียน useful features/patterns (representations) และ output layer รวม representation ให้เป็นคำทำนาย</p>\n<p>ดังนั้นแม้แผนภาพจะวาด 3 คอลัมน์ ก็เรียกว่า 2 Layers NN และเพราะมี hidden layer ชั้นเดียวจึงเรียกว่า <b>Shallow Neural Network</b></p>", "ref": "Lesson 2 §3 (Lecture2.pdf p.11–12)", "why_wrong_map": ["hidden layer ชั้นเดียวคือ shallow ไม่ใช่ deep", "output layer มีพารามิเตอร์ จึงต้องนับด้วย ได้ 2 ไม่ใช่ 1", "นับ input layer เป็นชั้นด้วย ซึ่งไม่ถูก เพราะ input layer ไม่มีพารามิเตอร์", ""]}, {"id": "L4-53", "lesson": 4, "topic": "เป้าหมายของ faster optimizer", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามสไลด์หน้า 5–6 เป้าหมายของการเปลี่ยนไปใช้ faster optimizer แทน gradient descent ธรรมดาคือข้อใด?", "options": ["เร็วขึ้นด้วยการตั้ง learning rate ให้สูงที่สุดเท่าที่โมเดลจะยังไม่ลู่ออก แล้วคงค่านั้นไว้ตลอดการเทรน", "เร็วขึ้นกว่า gradient descent ธรรมดา โดยยอมแลกกับการที่ผลสุดท้ายอาจไม่ลู่เข้าจุดต่ำสุดจริง ๆ", "เร็วขึ้นกว่า gradient descent ธรรมดา และยังรักษา correct trajectory เข้าหาจุดต่ำสุดเอาไว้ได้ด้วย", "เร็วขึ้นด้วยการลดจำนวน hidden layer ลง เพราะความช้าของการเทรนมาจากความลึกของเครือข่ายโดยตรง"], "answer": 2, "explanation": "หน้า 5 ระบุปัญหาข้อ 1 ว่า deep learning ทำงานกับ \"large volume of data\" และเป็นกระบวนการวนซ้ำ จึงเจอ slow training และปัญหา convergence<br>หน้า 6 ให้ทางแก้เป็นเงื่อนไข <b>คู่</b> เสมอ: ใช้ optimizer ที่ <b>faster</b> กว่า gradient descent โดยยัง <b>รักษา correct trajectory</b> (เดินถูกทางไปยังจุดต่ำสุด) — สไลด์หน้า 5 ใช้คำว่า reliable convergence คู่กับ faster optimizers<br>ตัวเลือกที่ทิ้งเงื่อนไขข้อที่สองไปเหลือแต่ \"เร็วขึ้น\" จึงไม่ครบตามสไลด์", "ref": "Lesson 4 §2 (สไลด์หน้า 5–6)", "why_wrong_map": ["การเพิ่ม \\(\\alpha\\) อย่างเดียวคือกับดักที่หน้า 18 เตือนไว้เองด้วยป้าย \"η too high: suboptimal\"", "สไลด์เรียกร้อง reliable convergence ควบคู่กับความเร็วเสมอ — เร็วอย่างเดียวแต่ไปไม่ถึงไม่มีประโยชน์", "", "ต้นเหตุที่สไลด์ระบุคือปริมาณข้อมูลและการวนซ้ำ และการลดความลึกไม่ใช่ทางแก้ที่สไลด์เสนอเลย"]}, {"id": "L4-02", "lesson": 4, "topic": "L-layer forward: สมการทั่วไป", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ถ้านิยาม \\(a^{[0]} := x\\) สมการ forward ที่ใช้ได้กับ <i>ทุก</i> layer \\(l\\) ตามหน้า 3 คือข้อใด?", "options": ["\\(z_j^{[l]} = \\theta_{j0}^{[l]} + \\sum_i \\theta_{ji}^{[l]} a_i^{[l+1]}\\) แล้ว \\(a_j^{[l]} = g(z_j^{[l]})\\)", "\\(z_j^{[l]} = \\sum_i \\theta_{ji}^{[l]} a_i^{[l-1]}\\) แล้ว \\(a_j^{[l]} = z_j^{[l]}\\) โดยไม่ต้องใช้ \\(g\\)", "\\(z_j^{[l]} = \\theta_{j0}^{[l]} + \\sum_i \\theta_{ji}^{[l]} x_i\\) แล้ว \\(a_j^{[l]} = g(z_j^{[l]})\\) ทุกชั้น", "\\(z_j^{[l]} = \\theta_{j0}^{[l]} + \\sum_i \\theta_{ji}^{[l]} a_i^{[l-1]}\\) แล้ว \\(a_j^{[l]} = g(z_j^{[l]})\\)"], "answer": 3, "explanation": "<p>หน้า 3 เขียนสองสมการที่หน้าตาเหมือนกันเป๊ะ ต่างแค่ขาเข้า: ชั้น 1 รับ \\(x_1,x_2\\) ส่วนชั้น \\(L\\) รับ \\(a^{[L-1]}\\) ถ้ามอง input เป็น \\(a^{[0]}\\) ก็ยุบเหลือสมการเดียวคือขาเข้าของชั้น \\(l\\) คือ activation ของชั้น \\(l-1\\) (ชั้นก่อนหน้า) บวก bias \\(\\theta_{j0}^{[l]}\\) แล้วผ่าน \\(g\\)</p><p>นี่คือเหตุผลที่เครือข่าย 20 ชั้นไม่ต้องเขียนสูตรใหม่ — เปลี่ยนเลขชั้นตายตัวเป็นตัวแปร \\(l\\) เท่านั้น</p>", "ref": "Lesson 4 §1.1 (สไลด์หน้า 3)", "why_wrong_map": ["ใช้ \\(a^{[l+1]}\\) คือดึงค่าจากชั้นที่ยังไม่ได้คำนวณ — forward เดินจากชั้นต่ำไปสูง", "ตัดทั้ง bias และ activation ทิ้ง เหลือแต่เชิงเส้น เครือข่ายจะยุบเป็นโมเดลเชิงเส้นชั้นเดียว", "ให้ทุกชั้นรับ \\(x\\) ตรง ๆ ซึ่งผิด ชั้นลึกรับผลลัพธ์ของชั้นก่อนหน้า ไม่ใช่ input ดิบ", ""]}, {"id": "L3-51", "lesson": 3, "topic": "นิยาม activation function", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดคือนิยามของ activation function ที่ถูกต้อง?", "options": ["linear function ที่รวมค่า input ทุกตัวแบบถ่วงน้ำหนักด้วย weight ของแต่ละเส้นที่เข้ามา", "ฟังก์ชันที่สุ่ม weight เริ่มต้นของแต่ละ node เพื่อทำลาย symmetry ก่อนเริ่มการเทรน", "ฟังก์ชันที่บีบค่าทุกตัวให้อยู่ในช่วง [0,1] เสมอ ไม่ว่าจะเลือกใช้ฟังก์ชันตัวใดก็ตาม", "nonlinear function ที่แปลงหรือบีบค่าที่รวมถ่วงน้ำหนักแล้ว ให้เป็น activation ของ node"], "answer": 3, "explanation": "activation function คือ nonlinear function ที่ \"transforms or compresses the weighted and summed input values in a node, yielding the neuron's activation\" — การทำงานใน node มีสองจังหวะเสมอ: \\(z=\\sum_{i=0}^{n}\\theta_i x_i\\) (รวมถ่วงน้ำหนัก รวม bias ที่ \\(i=0\\)) แล้วจึง \\(a=g(z)\\). คำว่า nonlinear ต้องอยู่ในนิยาม เพราะถ้าเป็น linear เครือข่ายจะยุบเป็นเส้นตรง.", "ref": "Lesson 3 §5 Activation Function (p.23)", "why_wrong_map": ["นั่นคือขั้น \\(z=\\sum\\theta x\\) ซึ่งเกิดก่อน activation ไม่ใช่ตัว activation", "นั่นคือ parameter initialization คนละเรื่องกัน", "จริงเฉพาะ sigmoid — ReLU ให้ \\([0,\\infty]\\) และ tanh ให้ \\([-1,1]\\)", ""]}, {"id": "L5-58", "lesson": 5, "topic": "BN เป็น layer แรก ⇒ ไม่ต้อง standardize เอง", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "สไลด์หน้า 14 ใส่ <code>BatchNormalization()</code> เป็นชั้นแรกต่อจาก Flatten เพื่อประโยชน์ใด?", "options": ["ไม่ต้องทำ weight initialization เลย เพราะ BN ตั้งค่า weight เริ่มต้นให้เอง", "ไม่ต้องใส่ activation ใน hidden layer เพราะ BN ทำหน้าที่แทนได้ทั้งหมดแล้ว", "ไม่ต้อง standardize ชุดเทรนเอง เพราะ BN ชั้นแรก normalize ข้อมูลดิบให้แล้ว", "ไม่ต้องแยกโหมด train กับ test เพราะ BN ใช้สถิติชุดเดียวกันทั้งสองโหมด"], "answer": 2, "explanation": "<p>ข้อความที่อาจารย์ทำสีไว้: ถ้า add a BN layer เป็น <b>first layer</b> ของเครือข่าย เราจะ <b>not need to standardize your training set</b> — เพราะ BN ชั้นแรกทำ z-score ให้ข้อมูลดิบเอง และทำให้อัตโนมัติกับข้อมูล test ด้วย.</p><p>ราคาที่จ่ายคือพารามิเตอร์: BN บน 784 ค่าหลัง Flatten มี \\(4\\times784=3{,}136\\) ตัว (trainable 1,568 / non-trainable 1,568) ⇒ total ของโมเดลขยับจาก 13,002 เป็น 16,266.</p>", "ref": "Lesson 5 §3.2 (สไลด์หน้า 14)", "why_wrong_map": ["BN ไม่ตั้ง weight ให้ แต่มันทำให้เรา less careful about initialization (คนละเรื่องกับ \"ไม่ต้องทำเลย\")", "BN ไม่ใช่ activation — ถ้าไม่มี activation ที่ไม่เป็นเชิงเส้น เครือข่ายทั้งก้อนยุบเหลือชั้นเดียว", "", "กลับด้าน: BN ต่างหากที่ต้องแยกสองโหมด (batch stats ตอนเทรน / moving average ตอน test)"]}, {"id": "L2-16", "lesson": 2, "topic": "Bias unit x₀ / a₀", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "bias unit \\(x_0\\) (และ \\(a_0^{[l]}\\)) ใน neural network คืออะไร?", "options": ["ค่า activation ของ node ตัวแรกในชั้นนั้น ก่อนผ่านฟังก์ชัน \\(g\\)", "หน่วยพิเศษที่มีค่าคงที่ \\(+1\\) เสมอ ทำให้มีเทอม \\(\\theta_0\\) ไว้เลื่อนเส้นแบ่ง", "หน่วยพิเศษที่มีค่าเท่ากับ 0 เสมอ จึงไม่ส่งผลต่อผลรวมถ่วงน้ำหนัก", "feature ตัวแรกของข้อมูลจริงที่อ่านมาจาก training example นั้น ๆ"], "answer": 1, "explanation": "<p>bias unit เป็นค่าตัวปรับที่กำหนดให้เท่ากับ \\(+1\\) เสมอ ⇒ เทอม \\(\\theta_0x_0 = \\theta_0\\) กลายเป็นค่าคงที่ที่เลื่อนเส้นแบ่งได้ และทำให้เขียน \\(z=\\sum_{i=0}^{n}\\theta_ix_i\\) เป็น dot product เดียวได้โดยไม่ต้องบวก \\(\\theta_0\\) แยก</p>\n<p>ผลที่ตามมาที่ต้องจำ: <b>จำนวนพารามิเตอร์ที่เข้า 1 node = (จำนวน node ต้นทาง) + 1 เสมอ</b> และ \\(a_0^{[1]}\\) คือ bias ที่ส่งเข้า layer 2 ไม่ใช่ activation ของ hidden node ตัวแรก (ตัวแรกคือ \\(a_1^{[1]}\\))</p>", "ref": "Lesson 2 §3 (Lecture2.pdf p.13, 45)", "why_wrong_map": ["activation ของ node ตัวแรกคือ \\(a_1^{[l]}\\) ไม่ใช่ \\(a_0^{[l]}\\)", "", "ถ้ามีค่า 0 เทอม \\(\\theta_0\\) จะหายไปทั้งก้อน — ของจริงคือ \\(+1\\)", "\\(x_0\\) เป็นค่าคงที่ที่เราเติมเอง ไม่ใช่ feature จากข้อมูล"]}, {"id": "L4-12", "lesson": 4, "topic": "Mini-batch: เศษของ batch สุดท้าย", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ข้อมูล 1,000 ตัวอย่าง batch size 64 ใน 1 epoch จะมีกี่ iteration และ mini-batch ก้อนสุดท้ายมีกี่ตัวอย่าง?", "options": ["16 iteration และก้อนสุดท้ายมี 64 ตัวอย่าง", "15 iteration และก้อนสุดท้ายมี 64 ตัวอย่าง", "15 iteration และก้อนสุดท้ายมี 40 ตัวอย่าง", "16 iteration และก้อนสุดท้ายมี 40 ตัวอย่าง"], "answer": 3, "explanation": "<p>สูตร: iteration ต่อ epoch \\(=\\lceil m/B\\rceil\\) ปัดขึ้นเพราะเศษที่เหลือยังนับเป็น 1 batch</p><p>ขั้นที่ 1 — \\(1000/64 = 15.625 \\Rightarrow \\lceil 15.625\\rceil = 16\\) iteration<br>ขั้นที่ 2 — 15 ก้อนแรกเต็ม \\(15\\times64=960\\) ตัวอย่าง<br>ขั้นที่ 3 — เหลือ \\(1000-960=40\\) ตัวอย่างเป็นก้อนสุดท้าย</p><p>ก้อนสุดท้ายที่เล็กกว่าเพื่อน จะให้ gradient ที่ noisy กว่าเล็กน้อยตามกฎ \\(1/\\sqrt{B}\\)</p>", "ref": "Lesson 4 §3.4 (สไลด์หน้า 11)", "why_wrong_map": ["ถูกที่จำนวน iteration แต่ก้อนสุดท้ายเต็ม 64 ไม่ได้ เพราะเหลือข้อมูลแค่ 40", "ผิดทั้งสองส่วน คือทั้งปัดลงและคิดว่าทุกก้อนเต็มพอดี", "ปัดลงแทนที่จะปัดขึ้น ทำให้ทิ้งตัวอย่าง 40 ตัวสุดท้ายไปเฉย ๆ", ""]}, {"id": "L1-51", "lesson": 1, "topic": "Binary classification: positive / negative class", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ใน binary classification ที่ \\(y\\in\\{0,1\\}\\) คลาส 1 และคลาส 0 มีความหมายอย่างไร และในระบบกรองอีเมลสแปม \"spam\" ควรเป็นคลาสใด?", "options": ["1 = positive class (finding something), 0 = negative class (absenting something); spam คือคลาส 1", "1 = คลาสที่พบบ่อยกว่าในชุดข้อมูล, 0 = คลาสที่พบน้อยกว่าในชุดข้อมูลนั้น; spam คือคลาส 0", "1 = positive class (finding something), 0 = negative class (absenting something); spam คือคลาส 0", "1 = คลาสที่เป็นผลดีต่อผู้ใช้, 0 = คลาสที่เป็นผลเสียต่อผู้ใช้ตามความหมายทั่วไป; spam คือคลาส 0"], "answer": 0, "explanation": "<b>\"1\" denotes positive class (finding something)</b> และ <b>\"0\" denotes negative class (absenting something)</b>. positive แปลว่า \"เจอสิ่งที่กำลังตามหา\" ไม่ได้แปลว่า \"ดี\" — ระบบกรองสแปมตามหาสแปม ดังนั้น spam = 1 = positive ทั้งที่สแปมเป็นเรื่องแย่. เรื่องนี้สำคัญเพราะ precision \\(=TP/(TP+FP)\\) และ recall \\(=TP/(TP+FN)\\) นับเฉพาะคลาส positive ถ้ากำหนด positive ผิดตัว ตัวเลขทั้งชุดจะพลิกทันที.", "ref": "Lesson 1 §5 (p.39), §7 (p.46)", "why_wrong_map": ["", "คลาส 0/1 ไม่ได้ผูกกับความถี่ของคลาส แต่ผูกกับสิ่งที่ระบบตามหา", "นิยามถูก แต่สิ่งที่ระบบกรองสแปมตามหาคือสแปม จึงต้องเป็นคลาส 1", "positive ไม่ได้แปลว่าผลดี — หมายถึงการเจอสิ่งที่ตามหา"]}, {"id": "L6-32", "topic": "สามหมวดของ hyperparameter", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามการแบ่งสามหมวดในสไลด์หน้า 20 ข้อใดเป็นสมาชิกของหมวด \"Learning and optimization\" ทั้งหมด", "options": ["ค่าแลมบ์ดาของ L2 regularization, อัตรา dropout, พารามิเตอร์ของ data augmentation", "learning rate และ decay schedule, batch size, optimization algorithm, weight initialization", "ชนิดของ activation, อัตรา dropout ของแต่ละชั้น, วิธี initialize ค่าน้ำหนักเริ่มต้น", "จำนวน hidden layer, ชนิดของ activation, จำนวน neuron ในแต่ละชั้นของเครือข่าย"], "explanation": "<p>สไลด์แบ่งไว้สามหมวด:</p><ul><li><b>Network architecture</b> — จำนวน hidden layer (depth), จำนวน neuron ต่อชั้น (width), activation type</li><li><b>Learning and optimization</b> — learning rate และ decay schedule, batch size, optimization algorithms, weight initialization, batch normalization, จำนวน iteration/epoch</li><li><b>Strategies to avoid overfitting</b> — L2 regularization, dropout layers, data augmentation</li></ul><p>จุดหลอกที่ออกบ่อย: สไลด์วงเล็บไว้ว่า Batch Normalization <mark class=\"src\" data-p=\"20\">also mitigate overfitting</mark> — มันตอบได้สองหมวด แต่ถ้าถามว่า \"จัดอยู่หมวดไหน\" ให้ตอบตามที่สไลด์จัดคือ Learning and optimization</p>", "ref": "Lesson 6 §8 (สไลด์หน้า 20)", "lesson": 6, "answer": 1, "why_wrong_map": ["ทั้งสามตัวอยู่ในหมวด Strategies to avoid overfitting", "", "ผสมข้ามหมวด — activation อยู่หมวดแรก dropout อยู่หมวดที่สาม", "ทั้งสามตัวอยู่ในหมวด Network architecture"]}, {"id": "L5-27", "lesson": 5, "topic": "คำนวณ μ ของ LayerNorm", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "จากเมทริกซ์ \\(z\\) บนสไลด์หน้า 18 (แถว = ตัวอย่าง, คอลัมน์ = 3 neuron) แถวที่ 4 คือ \\([3,\\ 900,\\ 0]\\) ค่า \\(\\mu^{(4)}\\) ของ LayerNorm เท่ากับเท่าใด?", "options": ["225.75", "975", "334.33", "301"], "answer": 3, "explanation": "LN เฉลี่ยตามแถว (ข้าม neuron ในตัวอย่างเดียว) หารด้วยจำนวน neuron = 3: \\(\\mu^{(4)}=(3+900+0)/3=903/3=301\\). ค่าอื่นของสไลด์: \\(\\mu^{(1)}=334.33,\\ \\mu^{(2)}=267.67,\\ \\mu^{(3)}=401.67\\). ส่วน BN เฉลี่ยตามคอลัมน์หารด้วย batch size 4 เช่น \\(\\mu_{2B}=975\\).", "ref": "Lesson 5 §4 (สไลด์หน้า 18)", "why_wrong_map": ["หารด้วย 4 (batch size) แทน 3 (จำนวน neuron)", "นั่นคือ μ ของ BN สำหรับ neuron ที่ 2 (คอลัมน์)", "นั่นคือ μ⁽¹⁾ ของแถวแรก", ""]}, {"id": "L4-39", "lesson": 4, "topic": "Early stopping: สัญญาณและข้อควรระวัง", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "Early stopping ใช้สัญญาณใดในการหยุดเทรน และอาจารย์เตือนอะไรไว้ในหน้า 33?", "options": ["ใช้จุดที่ validation error ต่ำสุด และเตือนว่ามันแก้ทั้ง bias และ variance พร้อมกันจนขาดความเป็นระบบ", "ใช้จุดที่ training error ลดถึงศูนย์ และเตือนว่ามันแก้ได้เฉพาะปัญหาด้าน bias เพียงอย่างเดียวเท่านั้น", "ใช้จุดที่ learning rate ลดต่ำกว่าเกณฑ์ และเตือนว่าจะทำให้เสีย computational cost มากกว่าเดิมมาก", "ใช้จำนวน epoch ที่ตั้งไว้ล่วงหน้า และเตือนว่าควรใช้ก่อนเลือก hyperparameter ตัวอื่นเสมอทุกครั้ง"], "answer": 0, "explanation": "<p>หน้า 32: ติดตามผลทุก epoch บน validation set แล้ว \"terminate the training when the validation error reaches a minimum\" โดยวงเล็บว่า \"(for a while or when you're sure the model won't improve)\" — คือรอดูสักพัก (คือพารามิเตอร์ patience)</p><p>ข้อดี: ไม่ต้องกังวลเรื่องเลือกจำนวน epoch และประหยัด computational cost เทียบกับการเทรนใหม่ทั้งรอบ</p><p>หน้า 33 เป็น<b>คำเตือน</b>: มันแก้ both bias and variance พร้อมกัน จึงเบี่ยงจาก systematic improvement process — คุณจะไม่รู้ว่าปัญหาจริงอยู่ด้านไหน และให้ใช้ \"once all model's hyperparameters have been chosen\"</p>", "ref": "Lesson 4 §6.3 (สไลด์หน้า 32–33)", "why_wrong_map": ["", "ต้องเป็น validation error ไม่ใช่ training error", "early stopping ไม่เกี่ยวกับเกณฑ์ของ learning rate และช่วย<i>ประหยัด</i> cost", "เป็นการเปลี่ยนจำนวน epoch ให้ตัดสินจากข้อมูล และต้องใช้<i>หลัง</i>เลือก hyperparameter"]}, {"id": "L2-22", "lesson": 2, "topic": "list ของ Python vs ndarray", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "โค้ดต่อไปนี้พิมพ์อะไรออกมา?", "code": "import numpy as np\nA = list(range(3))\nB = list(range(3))\nprint(A + B)\n\nX = np.arange(3)\nY = np.arange(3)\nprint(X + Y)", "options": ["[0, 1, 2, 0, 1, 2] และ [0 2 4]", "[0 2 4] และ [0, 1, 2, 0, 1, 2]", "TypeError และ [0 2 4]", "[0, 2, 4] และ [0 2 4]"], "answer": 0, "explanation": "<p>ตัวดำเนินการ <code>+</code> ทำคนละอย่างกับสองชนิดข้อมูลนี้:</p>\n<ul><li><b>list ของ Python</b>: <code>+</code> คือการ <em>ต่อ list</em> (concatenate) ⇒ ได้ list ยาว 6 ช่อง <code>[0, 1, 2, 0, 1, 2]</code></li>\n<li><b>ndarray</b>: <code>+</code> คือ element-wise ⇒ <code>[0 2 4]</code> ยาว 3 ช่องเท่าเดิม</li></ul>\n<p>นี่คือเหตุผลที่โค้ดคำนวณเชิงเวกเตอร์ต้องสร้างข้อมูลด้วย <code>np.arange(n)</code> หรือ <code>np.array(...)</code> ถ้าใช้ list ธรรมดา การ “บวก” จะกลายเป็นคนละงานไปเลย</p>", "ref": "Lesson 2 §5 (Lecture2.pdf p.19)", "why_wrong_map": ["", "สลับผลของสองชนิดข้อมูลกัน", "list + list ไม่ error แต่ให้ list ที่ยาวขึ้น", "list ธรรมดาบวกกันแบบทีละช่องไม่ได้ ผลคือการต่อ list"]}, {"id": "L6-31", "topic": "คำนวณ Batch Normalization", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ค่า \\(z\\) ของ 1 neuron ใน mini-batch 4 ตัวอย่างคือ 2, 4, 6, 8 เมื่อ \\(\\gamma=1,\\ \\beta=0\\) (ละ \\(\\epsilon\\)) ค่า \\(\\hat z\\) ที่ส่งต่อไป activation คือชุดใด", "options": ["−1.500, −0.500, 0.500, 1.500", "−1.342, −0.447, 0.447, 1.342", "−3.000, −1.000, 1.000, 3.000", "−0.600, −0.200, 0.200, 0.600"], "explanation": "<p>\\(\\mu = (2+4+6+8)/4 = 5\\)</p><p>\\(\\sigma^2 = \\frac{(2-5)^2+(4-5)^2+(6-5)^2+(8-5)^2}{4} = \\frac{9+1+1+9}{4} = 5\\)</p><p>\\(\\hat z = (z-\\mu)/\\sqrt{\\sigma^2} = -3/\\sqrt5,\\ -1/\\sqrt5,\\ 1/\\sqrt5,\\ 3/\\sqrt5 = -1.342,\\ -0.447,\\ 0.447,\\ 1.342\\)</p><p>ลองเปลี่ยน \\(z\\) ให้ใหญ่ขึ้น 100 เท่า (200, 400, 600, 800): \\(\\mu = 500,\\ \\sigma^2 = 50000,\\ \\hat z = -300/\\sqrt{50000} = -1.342\\) — ได้ชุดเดิมเป๊ะ เพราะเศษและส่วนโตเป็นสัดส่วนเดียวกัน. นี่คือเหตุผลที่ BN แก้ได้ทั้ง exploding (ไม่ระเบิด) และ vanishing (ไม่ตกไปโซนอิ่มตัวของ tanh/sigmoid) ด้วยกลไกเดียว</p>", "ref": "Lesson 6 §7 (สไลด์หน้า 18)", "lesson": 6, "answer": 1, "why_wrong_map": ["ใช้ \\(\\sigma^2 = 4\\) (หารด้วย n−1 หรือเดาค่า) ทำให้ตัวหารเป็น 2", "", "ลบค่าเฉลี่ยแล้วแต่ลืมหารด้วย \\(\\sqrt{\\sigma^2}\\)", "หารด้วย \\(\\sigma^2 = 5\\) แทนที่จะหารด้วย \\(\\sqrt{\\sigma^2} = \\sqrt5\\)"]}, {"id": "L3-24", "lesson": 3, "topic": "Why not linear activation", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "เครือข่าย 1 input ใช้ \\(f(x)=x\\) ทุก node: layer 1 \\(z^{[1]}=4x-3\\), layer 2 \\(z^{[2]}=2a^{[1]}+5\\) ข้อใดถูกต้อง?", "options": ["\\(z^{[2]}=8x-1\\) ยังเป็น linear function ของ \\(x\\) ซ้อนกี่ชั้นก็ไม่เพิ่มความสามารถ", "\\(z^{[2]}=0\\) เสมอ เพราะ linear activation ทำให้ gradient หายไปทั้งเครือข่าย", "\\(z^{[2]}=8x+11\\) ยังเป็น linear function ของ \\(x\\) ซ้อนกี่ชั้นก็ไม่เพิ่มความสามารถ", "\\(z^{[2]}=8x^2-1\\) ดีกรีเพิ่มตามจำนวน layer จึงเรียนรู้ความสัมพันธ์ซับซ้อนได้"], "answer": 0, "explanation": "\\(a^{[1]}=z^{[1]}=4x-3\\) ⇒ \\(z^{[2]}=2(4x-3)+5=8x-6+5=8x-1\\) — ผลรวมเชิงเส้นของผลรวมเชิงเส้นยังเป็นเชิงเส้น. ในกรณีหลาย input ก็ได้รูป \\(z_1^{[2]}=a+bx_1+cx_2\\) (linear function) ซึ่ง \"not capable to learn complex relationship\" ⇒ hidden layer ต้องมี non-linearity ความลึกจึงมีความหมาย.", "ref": "Lesson 3 §5C (p.35)", "why_wrong_map": ["", "เครือข่ายยังให้ค่าไม่เป็นศูนย์และเทรนได้ แค่ได้เส้นตรง", "กระจายผิดเครื่องหมาย: 2×(−3) + 5 = −1 ไม่ใช่ +11", "ซ้อน linear ไม่ทำให้ดีกรีเพิ่ม"]}, {"id": "L1-01", "lesson": 1, "topic": "นิยาม ML (A. Samuel 1952)", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดอธิบาย Machine Learning ได้ถูกต้อง และบอกความต่างจาก Symbolic AI ได้ถูกทิศ?", "options": ["สาขาวิชาที่ให้คอมพิวเตอร์เรียนรู้ได้โดยไม่ต้องถูกโปรแกรมอย่างเจาะจง; ป้อน Rule แล้วได้ Answer", "สาขาวิชาที่ให้คอมพิวเตอร์เรียนรู้ได้โดยไม่ต้องถูกโปรแกรมอย่างเจาะจง; ป้อน Answer แล้วได้ Rule", "โปรแกรมคอมพิวเตอร์ที่ถูกเขียนกฎไว้ครบถ้วนอย่างเจาะจง; ป้อน Answer แล้วได้ Rule ออกมาเอง", "สาขาวิชาที่ให้คอมพิวเตอร์ถูกโปรแกรมแบบ implicitly ทีละกฎ; ป้อน Rule แล้วได้ Answer ออกมา"], "answer": 1, "explanation": "Machine Learning คือ <b>the field of study</b> that gives computers the <b>ability to learn</b> without being <b>explicitly programmed</b>. เทียบสองแนวทาง: Symbolic AI = Rule → Programming → Answer (คนเขียนกฎให้ เครื่องให้คำตอบ) ส่วน Machine Learning = Answer → Programming → Rule (ป้อนข้อมูลพร้อมคำตอบจริง แล้วเครื่องสรุปกฎเอง เช่นระบบแนะนำคำค้นที่เรียนจากประวัติการค้น).", "ref": "Lesson 1 §0A (p.7, p.20)", "why_wrong_map": ["นิยามถูกแต่ทิศกลับ — Rule → Answer คือ Symbolic AI", "", "ML เป็น 'สาขาวิชา' ไม่ใช่โปรแกรม และหัวใจคือไม่ต้องเขียนกฎเอง", "เปลี่ยน explicitly เป็น implicitly และทิศเป็นของ Symbolic AI"]}, {"id": "L3-39", "lesson": 3, "topic": "บรรทัด delta_1", "source": "ex_shallow_nn", "type": "code", "difficulty": "hard", "stem": "บรรทัดใดคำนวณ <code>delta_1</code> ของ hidden layer ได้ถูกต้อง (m ตัวอย่าง, hidden 8, output 1)?", "code": "delta_2 = a2 - y_matrix          # (m, 1)\ndelta_1 = #### your code #####", "options": ["np.dot(delta_2, Theta2)[:, 1:] * sigmoidGradient(z2)", "np.dot(delta_2, Theta2) * sigmoidGradient(z1)", "np.dot(delta_2, Theta2)[:, 1:] @ sigmoidGradient(z1)", "np.dot(delta_2, Theta2)[:, 1:] * sigmoidGradient(z1)"], "answer": 3, "explanation": "นี่คือ \\(\\delta^{(1)}=(\\theta^{[2]\\top}\\delta^{(2)})*g'(z^{[1]})\\) ในรูป row-per-example: <code>delta_2</code> (m,1) · <code>Theta2</code> (1,9) = (m,9). ตัดคอลัมน์ bias ด้วย <code>[:, 1:]</code> เหลือ (m,8) เพราะ \\(a_0^{[1]}\\) ไม่มี δ แล้วคูณ element-wise (<code>*</code>) กับ <code>sigmoidGradient(z1)</code> (m,8). ครบ 3 องค์ประกอบ: delta_2, Theta2 และ sigmoid gradient.", "ref": "ex_shallow_nn (2) Backpropagation", "why_wrong_map": ["ใช้ g′ ของ layer ผิด (z2 ขนาด (m,1)) — ต้องเป็นของ layer ที่กำลังหา δ", "ไม่ตัดคอลัมน์ bias ได้ (m,9) คูณกับ (m,8) ไม่ได้", "ใช้ matrix product แทน element-wise", ""]}, {"id": "L2-44", "lesson": 2, "topic": "ขนาด θ และจำนวนพารามิเตอร์ของโครงข่าย 3→5→2", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "โครงข่าย \\(3 \\to 5 \\to 2\\) (input 3 feature, hidden 5 node, output 2 node) ขนาดของ \\(\\theta^{[1]},\\theta^{[2]}\\) และจำนวนพารามิเตอร์รวมเป็นเท่าใด?", "options": ["\\(\\theta^{[1]}: 5\\times4,\\ \\theta^{[2]}: 2\\times5\\) รวม 30 ตัว", "\\(\\theta^{[1]}: 5\\times4,\\ \\theta^{[2]}: 2\\times6\\) รวม 32 ตัว", "\\(\\theta^{[1]}: 5\\times3,\\ \\theta^{[2]}: 2\\times5\\) รวม 25 ตัว", "\\(\\theta^{[1]}: 4\\times5,\\ \\theta^{[2]}: 6\\times2\\) รวม 32 ตัว"], "answer": 1, "explanation": "<p>ใช้กฎ \\(\\theta^{[l]}\\): (node ปลายทาง) × (node ต้นทาง + 1)</p>\n<ul><li>\\(\\theta^{[1]}\\): ปลายทาง 5 node, ต้นทาง 3 feature + bias ⇒ \\(5\\times4 = 20\\) ตัว</li>\n<li>\\(\\theta^{[2]}\\): ปลายทาง 2 node, ต้นทาง 5 hidden + bias ⇒ \\(2\\times6 = 12\\) ตัว</li></ul>\n<p>รวม \\(20+12 = 32\\) ตัว. เช็กมิติ: \\(\\theta^{[1]}a^{[0]} = (5\\times4)(4\\times1) = 5\\times1\\) ✓ และ \\(\\theta^{[2]}a^{[1]} = (2\\times6)(6\\times1) = 2\\times1\\) ✓</p>", "ref": "Lesson 2 §8 กล่องกลไก (Lecture2.pdf p.45, 49)", "why_wrong_map": ["ลืม bias ของ layer 2 เพียงชั้นเดียว ⇒ ขาดไป 2 ตัว", "", "ลืมคอลัมน์ bias ของทั้งสองชั้น", "สลับแถวกับคอลัมน์ทั้งสองเมทริกซ์ ⇒ คูณกับ \\(a\\) ไม่ได้ตามกฎมิติ"]}, {"id": "L3-18", "lesson": 3, "topic": "Tanh: อนุพันธ์และยอด", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดถูกต้องเกี่ยวกับอนุพันธ์ของ tanh \\(f(x)\\)?", "options": ["\\(f'(x)=f(x)(1-f(x))\\) มีค่าสูงสุด 0.25 ที่ \\(x=0\\) เท่ากับยอดของ sigmoid", "\\(f'(x)=1-f(x)^2\\) มีค่าสูงสุด 0.25 ที่ \\(x=0\\) ต่ำกว่ายอดของ sigmoid", "\\(f'(x)=1-f(x)^2\\) ไม่ลดลงเมื่อ \\(|x|\\) ใหญ่ จึงไม่มีปัญหา slow ที่ปลาย", "\\(f'(x)=1-f(x)^2\\) มีค่าสูงสุด 1 ที่ \\(x=0\\) สูงกว่ายอดของ sigmoid 4 เท่า"], "answer": 3, "explanation": "จาก quotient rule ได้ \\(f'(x)=1-f(x)^2\\). ที่ \\(x=0\\): \\(f=0\\) ⇒ \\(f'=1\\) ขณะที่ sigmoid มียอด \\(0.5\\times0.5=0.25\\) ⇒ ต่างกัน 4 เท่า ⇒ gradient ไหลผ่าน tanh ได้ดีกว่า. แต่ <b>both sigmoid and tanh slow when x is too large/small</b> — tanh ที่ \\(x=4\\) เหลือ 0.0013.", "ref": "Lesson 3 §5A.2–5A.3 (p.26–27)", "why_wrong_map": ["เป็นสูตรและยอดของ sigmoid ไม่ใช่ tanh", "สูตรถูกแต่ยอดผิด — 1−0² = 1 ไม่ใช่ 0.25", "tanh ก็ saturate ที่ปลายเช่นเดียวกับ sigmoid", ""]}, {"id": "L6-22", "topic": "ReduceLROnPlateau: factor และ min_lr", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ใช้ <code>ReduceLROnPlateau(monitor='val_loss', patience=4, factor=0.1, min_lr=0.001)</code> เริ่มที่ learning rate 0.03 หลังเกิดการลดครบ 3 ครั้ง learning rate จะเป็นเท่าใด", "options": ["0.0003", "0.003", "0.001", "0.00003"], "explanation": "<p>สูตร: \\(\\alpha_{new} = \\max(\\alpha \\times \\text{factor},\\ \\text{min\\_lr})\\)</p><p>ครั้งที่ 1: \\(\\max(0.03\\times0.1,\\ 0.001) = \\max(0.003, 0.001) = 0.003\\)<br>ครั้งที่ 2: \\(\\max(0.0003,\\ 0.001) = 0.001\\) (ถูกดันขึ้นมาถึงพื้น)<br>ครั้งที่ 3: \\(\\max(0.0001,\\ 0.001) = 0.001\\) (ค้างที่พื้น)</p><p>ลำดับคือ 0.03 → 0.003 → 0.001 → 0.001 … ตรงกับคอลัมน์ learning_rate ในไฟล์ csv ของการเทรนจริง (0.0300 ที่ epoch 1–9, 0.0030 ที่ 10–13, 0.0010 ตั้งแต่ epoch 14). min_lr คือตาข่ายกันตกที่ทำให้ไม่เกิดปัญหา learning rate หายวับแบบ LearningRateScheduler</p>", "ref": "Lesson 6 §5.2 (สไลด์หน้า 10)", "lesson": 6, "answer": 2, "why_wrong_map": ["คิดว่าครั้งที่ 2 ลดได้อิสระเป็น 0.0003 โดยลืมว่ามี min_lr เป็นพื้น", "หยุดนับที่การลดครั้งแรกเพียงครั้งเดียว", "", "คูณ 0.1 สามครั้งรวดโดยไม่มี min_lr มาจำกัดเลย"]}, {"id": "L4-27", "lesson": 4, "topic": "Bias correction: ทำไมต้องมี", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "เหตุใดการประมาณโมเมนต์ของ Adam จึงเป็น biased estimate และแก้อย่างไรตามสไลด์หน้า 23?", "options": ["เพราะ learning rate ยังสูงเกินไปในช่วงต้นของการเทรน จึงแก้ด้วยการลด \\(\\alpha\\) ลงในช่วง 10 ก้าวแรก", "เพราะเริ่มที่ \\(v_0=s_0=0\\) น้ำหนักรวมที่จ่ายไปจริงหลัง \\(t\\) ก้าวคือ \\(1-\\beta^t\\) จึงแก้ด้วยการหารด้วย \\(1-\\beta^t\\)", "เพราะเริ่มที่ \\(v_0=s_0=0\\) น้ำหนักรวมที่จ่ายไปจริงหลัง \\(t\\) ก้าวคือ \\(1-\\beta\\) จึงแก้ด้วยการหารด้วย \\(1-\\beta\\) ในทุกก้าว", "เพราะ gradient ของ mini-batch มี noise สูงในช่วงแรก จึงแก้ด้วยการเพิ่ม \\(\\epsilon\\) เข้าไปในตัวส่วนของสูตร"], "answer": 1, "explanation": "<p>กางสูตร EWA ออกจะเห็นว่าน้ำหนักรวมที่จ่ายไปจริงคือ \\((1-\\beta)(1+\\beta+\\dots+\\beta^{t-1}) = 1-\\beta^{t}\\) ซึ่ง<b>น้อยกว่า 1</b> ในช่วงแรก ค่าที่ได้จึงถูกดึงลงต่ำกว่าความจริง (สไลด์เรียกว่า \\\"ตามค่า gradient ต้นฉบับไม่ทัน\\\")</p><p>ที่ \\(\\beta=0.9,\\ t=1\\) จ่ายน้ำหนักไปแค่ 10% ค่าจึงเล็กกว่าจริง 10 เท่า — หารด้วยน้ำหนักที่จ่ายไปจริงก็ได้ค่าที่เทียบเท่าการจ่ายเต็ม 100% กลับคืนมา</p><p>ที่ \\(t\\) ใหญ่ \\(\\beta^t\\to0\\) ตัวหาร \\(\\to1\\) การแก้จึง \\\"ค่อย ๆ ปิดตัวเอง\\\"</p>", "ref": "Lesson 4 §5.3 (สไลด์หน้า 23)", "why_wrong_map": ["bias มาจากการเริ่มที่ศูนย์ ไม่ใช่จากขนาดของ learning rate", "", "ลืมเลขชี้กำลัง \\(t\\) — distractor ที่จับคนท่องสูตรโดยไม่เข้าใจ", "\\(\\epsilon\\) มีไว้กันหารด้วยศูนย์เท่านั้น ไม่ได้แก้ bias"]}, {"id": "L2-31", "lesson": 2, "topic": "shape ของผลคูณเมื่อ argument เป็น 1 มิติ vs 2 มิติ", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "โค้ดต่อไปนี้พิมพ์สองบรรทัด ข้อใดอธิบายผลได้ถูกต้อง?", "code": "import numpy as np\nx = np.array([[2,0],[1,3]])\nz = np.array([[4],[1]])   # shape (2,1)\nw = np.array([4,1])       # shape (2,)\nprint(np.dot(x,z), np.dot(x,z).shape)\nprint(np.dot(x,w), np.dot(x,w).shape)", "options": ["ค่าตัวเลขต่างกันเพราะ w ถูกตีความเป็น row vector จึงได้ 9 กับ 3 แทน", "บรรทัดสุดท้าย error เพราะคูณเมทริกซ์ 2 มิติกับ array 1 มิติไม่ได้", "ค่าตัวเลขเหมือนกันคือ 8 กับ 7 และ shape ก็เหมือนกันคือ (2, 1) ทั้งคู่", "ค่าตัวเลขเหมือนกันคือ 8 กับ 7 แต่ shape ต่างกันคือ (2, 1) และ (2,)"], "answer": 3, "explanation": "<p>ตัวเลขมาจากการคูณเดียวกันทั้งคู่: \\(2(4)+0(1)=8\\) และ \\(1(4)+3(1)=7\\)</p>\n<ul><li><code>np.dot(x,z)</code>: \\((2\\times2)(2\\times1)\\) ⇒ คืนเมทริกซ์คอลัมน์ <code>[[8],[7]]</code> shape <code>(2, 1)</code></li>\n<li><code>np.dot(x,w)</code>: <code>w</code> เป็น array 1 มิติ shape <code>(2,)</code> ⇒ ผลเป็น <code>[8 7]</code> shape <code>(2,)</code></li></ul>\n<p>ใน Python ไม่มีการกำหนดล่วงหน้าว่าเวกเตอร์ 1 มิติเป็น row หรือ column vector ⇒ เวลาเขียนโค้ดต้องดู shape ทุกครั้ง ไม่ใช่เดาจากสูตรบนกระดาษ (9 กับ 3 คือผลของ <code>np.dot(w,x)</code> ซึ่งเป็นการคูณคนละลำดับ)</p>", "ref": "Lesson 2 §5B (Lecture2.pdf p.34)", "why_wrong_map": ["9 กับ 3 คือ np.dot(w, x) คนละลำดับ — ในโค้ด x อยู่หน้า จึงได้ 8 กับ 7", "NumPy คูณเมทริกซ์กับ array 1 มิติได้ ไม่ error", "shape ไม่เท่ากัน: (2, 1) เทียบกับ (2,) — จุดนี้ออกสอบบ่อย", ""]}, {"id": "L1-17", "lesson": 1, "topic": "Logistic regression output", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ผลลัพธ์ \\(h_\\theta(x)\\) ของ logistic regression หมายถึงอะไร และ logistic function แปลงค่าจากช่วงใดไปช่วงใด?", "options": ["\\(h_\\theta(x)\\) คือความน่าจะเป็นที่ \\(y=1\\); logistic map จาก [0,1] ไป [−inf, inf]", "\\(h_\\theta(x)\\) คือความน่าจะเป็นที่ \\(y=0\\); logistic map จาก [−inf, inf] ไป [−1,1]", "\\(h_\\theta(x)\\) คือคลาส 0/1 โดยตรง; logistic map จาก [−inf, inf] ไป [0,1]", "\\(h_\\theta(x)\\) คือความน่าจะเป็นที่ \\(y=1\\); logistic map จาก [−inf, inf] ไป [0,1]"], "answer": 3, "explanation": "logistic regression ใช้ความน่าจะเป็นบอกโอกาสที่ x อยู่ใน <b>positive class ('1')</b>: \\(h_\\theta(x)=P(y=1\\mid x)\\). logistic function คือ <b>inverse of logit</b> — แปลงจาก [−inf, inf] ไป [0,1] คือเอาผลลัพธ์เชิงเส้น \\(z\\) มาบีบเป็นความน่าจะเป็น แล้วต้องมี threshold อีกชั้นจึงได้คลาส.", "ref": "Lesson 1 §5 (p.40–41)", "why_wrong_map": ["ทิศนั้นคือ logit ไม่ใช่ logistic", "เป็นของคลาสบวก (1) และช่วงคือ [0,1]", "ผลลัพธ์เป็นความน่าจะเป็น ต้องผ่าน threshold ก่อนเป็นคลาส", ""]}, {"id": "L1-12", "lesson": 1, "topic": "Gradient descent: one step", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ให้ \\(J(\\theta)=\\theta^2\\) (อนุพันธ์คือ \\(2\\theta\\)) เริ่มที่ \\(\\theta=3\\) และ \\(\\alpha=0.1\\) หลังอัปเดต 1 ครั้งด้วย \\(\\theta:=\\theta-\\alpha\\,\\partial J/\\partial\\theta\\) ได้ \\(\\theta\\) เท่าใด?", "options": ["2.7", "2.1", "2.4", "3.6"], "answer": 2, "explanation": "ความชันที่ \\(\\theta=3\\) คือ \\(2(3)=6\\) (บวก = ยืนบนทางขึ้นฝั่งขวาของชาม). อัปเดต: \\(3-0.1(6)=3-0.6=2.4\\) — ลดลง เข้าหาจุดต่ำสุดที่ \\(\\theta=0\\). เครื่องหมายลบทำให้เดินสวนความชันเสมอ: ความชันบวก ⇒ \\(\\theta\\) ลด, ความชันลบ ⇒ \\(\\theta\\) เพิ่ม, ความชัน 0 ⇒ หยุด.", "ref": "Lesson 1 §3.2 (p.30–31)", "why_wrong_map": ["ใช้ \\(\\theta\\) แทนอนุพันธ์ \\(2\\theta\\) (ลืมคูณ 2)", "ใช้ค่า \\(J=9\\) แทนความชัน", "", "บวก gradient แทนลบ = gradient ascent"]}, {"id": "L1-10", "lesson": 1, "topic": "MSE cost function", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ข้อมูล 2 จุด \\((1,2)\\) และ \\((2,4)\\) ใช้เส้น \\(h(x)=x\\) ค่า cost ตามสูตร MSE \\(J=\\frac{1}{m}\\sum(h(x^{(i)})-y^{(i)})^2\\) เท่ากับเท่าใด?", "options": ["-1.5", "5.0", "2.5", "1.5"], "answer": 2, "explanation": "ค่าทำนาย 1 และ 2; error \\(e_i = h-y\\) คือ \\(1-2=-1\\) และ \\(2-4=-2\\). ยกกำลังสอง: \\(1+4=5\\), หารด้วย \\(m=2\\) ⇒ \\(J=2.5\\). กำลังสองทำให้ error ติดลบไม่หักล้างกัน และลงโทษ error ใหญ่หนักกว่า; ถ้าเป็น MAE จะได้ \\((1+2)/2=1.5\\).", "ref": "Lesson 1 §3.1 (p.29)", "why_wrong_map": ["เฉลี่ย error ดิบโดยไม่ยกกำลังสอง — cost ติดลบไม่ได้", "ลืมหารด้วย m", "", "นั่นคือ MAE (ค่าสัมบูรณ์) ไม่ใช่ MSE"]}, {"id": "L6-04", "topic": "hook ตระกูล on_test_* กับ validation", "source": "callbacks_notebook", "type": "calc", "difficulty": "hard", "stem": "รัน <code>fit(X, y, validation_data=(Xval,yval), epochs=5, batch_size=32, callbacks=[my_callback2()])</code> โดย Xval มี 50 แถว callback ที่ดัก <code>on_test_begin</code> และ <code>on_test_batch_end</code> จะพิมพ์รวมทั้งหมดกี่บรรทัด", "code": "class my_callback2(Callback):\n  def on_test_begin(self, logs):\n    print(\"testing start\")\n  def on_test_batch_end(self, batch, logs):\n    print(f\"End of batch:{batch+1} with loss {logs['loss']:.4f}\")", "options": ["25 บรรทัด", "5 บรรทัด", "10 บรรทัด", "15 บรรทัด"], "explanation": "<p>hook ชื่อ <code>on_test_*</code> ไม่ได้แปลว่า test set ของเรา — มันหมายถึง \"โหมดประเมินผลโดยไม่อัปเดต weight\" ซึ่งเกิดขึ้น<b>ทุกครั้งที่จบ epoch</b> เมื่อส่ง validation_data เข้าไป</p><p>จำนวน batch ของการประเมิน = \\(\\lceil 50/32 \\rceil = 2\\) (batch size ของ validation ใช้ค่าเดียวกับที่ตั้งใน fit)</p><p>ต่อ 1 epoch จึงพิมพ์ <code>testing start</code> 1 บรรทัด + <code>End of batch</code> 2 บรรทัด = 3 บรรทัด ⇒ \\(5 \\times 3 = 15\\) บรรทัด ตรงกับ log ที่รันในคาบ</p>", "ref": "callbacks notebook cell my_callback2", "lesson": 6, "answer": 3, "why_wrong_map": ["เอาจำนวน batch ของ train (\\(\\lceil 150/32 \\rceil = 5\\)) มาคูณ 5 epoch แทนที่จะใช้จำนวน batch ของ validation", "คิดว่า on_test_* ถูกเรียกครั้งเดียวต่อ epoch โดยไม่มี hook ระดับ batch", "นับเฉพาะบรรทัด End of batch ลืมบรรทัด testing start ที่พิมพ์ทุกต้นรอบประเมิน", ""]}, {"id": "L2-39", "lesson": 2, "topic": "ชุด θ ของ gate (¬x₁)∧(¬x₂)", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "neuron เดียว \\(h=g(\\theta_0+\\theta_1x_1+\\theta_2x_2)\\) (sigmoid, ปัด \\(g(\\pm10)\\) เป็น 1/0) ต้องให้ output เป็น 1 <b>เฉพาะ</b>เมื่อ \\(x_1=x_2=0\\) คือ gate \\((\\neg x_1)\\wedge(\\neg x_2)\\) ต้องใช้ \\((\\theta_0,\\theta_1,\\theta_2)\\) ชุดใด?", "options": ["(−10, −20, −20)", "(−30, 20, 20)", "(10, −20, −20)", "(−10, 20, 20)"], "answer": 2, "explanation": "<p>ตรวจด้วยตัวเลข \\(h=g(10-20x_1-20x_2)\\):</p>\n<ul><li>\\((0,0)\\): \\(z=10 \\Rightarrow \\approx1\\) ✓ (ตรงเงื่อนไข “0 ทั้งคู่”)</li>\n<li>\\((0,1)\\) และ \\((1,0)\\): \\(z=-10 \\Rightarrow \\approx0\\)</li>\n<li>\\((1,1)\\): \\(z=-30 \\Rightarrow \\approx0\\)</li></ul>\n<p>สังเกตโครงสร้าง: bias เป็นบวก (\\(+10\\)) ส่วน weight เป็นลบทั้งคู่ (\\(-20\\)) — <b>ตรงข้ามกับ OR ทุกเครื่องหมาย</b> ซึ่งสมเหตุสมผลเพราะมันคือ NOR (“NOT ของ OR”). ชุดอื่นที่ควรจำ: AND \\((-30,20,20)\\), OR \\((-10,20,20)\\)</p>", "ref": "Lesson 2 §7 (Lecture2.pdf p.47)", "why_wrong_map": ["สลับเครื่องหมายของ bias — จะได้ 0 ทุกกรณีเพราะ \\(z\\le-10\\) เสมอ", "นี่คือ AND gate (ให้ 1 เฉพาะเมื่อเป็น 1 ทั้งคู่)", "", "นี่คือ OR gate (ให้ 1 เมื่อมีอย่างน้อยหนึ่งตัวเป็น 1)"]}, {"id": "L1-18", "lesson": 1, "topic": "Decision boundary: linear", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ให้ \\(\\theta_0=-3,\\ \\theta_1=1,\\ \\theta_2=1\\) และทำนาย \\(y=1\\) เมื่อ \\(\\theta_0+\\theta_1x_1+\\theta_2x_2\\ge 0\\) ที่จุด \\(x_1=1,\\ x_2=1\\) โมเดลทำนายอะไร และ \\(h\\) เทียบกับ 0.5 เป็นอย่างไร?", "options": ["\\(y=1\\) เพราะ \\(z=+1\\) จึงได้ \\(h>0.5\\)", "\\(y=0\\) เพราะ \\(z=-5\\) จึงได้ \\(h<0.5\\)", "\\(y=1\\) เพราะ \\(z=-1\\) จึงได้ \\(h>0.5\\)", "\\(y=0\\) เพราะ \\(z=-1\\) จึงได้ \\(h<0.5\\)"], "answer": 3, "explanation": "\\(z=-3+1(1)+1(1)=-1<0\\) ⇒ \\(g(-1)<0.5\\) ⇒ ทำนาย \\(y=0\\). ไม่ต้องคำนวณ sigmoid จริง ดูแค่เครื่องหมายของ \\(z\\): \\(z>0\\Rightarrow 1\\), \\(z<0\\Rightarrow 0\\), \\(z=0\\Rightarrow\\) unpredictable (0.5). Decision boundary คือ \\(z=0\\): \\(x_1+x_2=3\\) — จุด (1,1) มีผลรวม 2 จึงอยู่ฝั่ง \\(y=0\\).", "ref": "Lesson 1 §5 (p.42–43)", "why_wrong_map": ["ลืม \\(\\theta_0=-3\\) หรือกลับเครื่องหมาย", "คิด \\(\\theta_0\\) ผิดเป็น −3−1−1", "\\(z\\) ติดลบ ⇒ sigmoid < 0.5 เสมอ", ""]}, {"id": "L6-30", "topic": "ลำดับ layer แบบ normalize before", "source": "tensorboard_notebook", "type": "code", "difficulty": "medium", "stem": "ต้องการเขียนบล็อกแบบ \"normalize before\" ตามสไลด์หน้า 18 ลำดับ layer ที่ถูกต้องคือข้อใด", "options": ["Dense(5, activation='relu', kernel_initializer='he_normal') → BatchNormalization()", "BatchNormalization() → Dense(5, kernel_initializer='he_normal') → Activation('relu')", "Dense(5, kernel_initializer='he_normal') → Activation('relu') → BatchNormalization()", "Dense(5, kernel_initializer='he_normal') → BatchNormalization() → Activation('relu')"], "explanation": "<p>\"normalize before\" = normalize ก่อนผ่าน activation ⇒ Dense ต้อง<b>ไม่</b>ใส่ <code>activation=</code> เพื่อให้คืนค่า \\(z\\) ดิบออกมา แล้วผ่าน <code>BatchNormalization()</code> ก่อน จึงค่อย <code>Activation('relu')</code></p><p>ผลคือ input ของ ReLU อยู่ในช่วงที่ควบคุมได้เสมอ. ตัวเลือกที่สองคือรูปแบบ \"normalize after\" ซึ่ง notebook ในคาบเอามาเทียบ — ทั้งสองแบบใช้ได้ ตำราถกเถียงกันว่าแบบไหนดีกว่า</p><p>ประเด็นของหน้า 18: learning rate 0.10 (หรือ 0.2 ในคาบ) ที่เคยทำให้โมเดลพังในหน้า 17 กลับใช้ได้เมื่อแทรก BN — ในคาบรุ่น normalize after ที่ lr 0.2 ได้ accuracy 0.7937 / loss 0.4558 เทียบกับ 0.5088 / 0.6943 ของรุ่นไม่มี BN</p>", "ref": "Lesson 6 §7 (สไลด์หน้า 18) · tensorboard notebook", "lesson": 6, "answer": 3, "why_wrong_map": ["นี่คือรูปแบบ normalize after เพราะ activation ถูกคำนวณไปแล้วใน Dense", "การ normalize input ก่อนเข้า Dense ไม่ใช่ความหมายของ normalize before ในสไลด์", "เท่ากับ normalize after เช่นกัน เพียงแต่แยก Activation ออกมาเป็น layer", ""]}, {"id": "L2-02", "lesson": 2, "topic": "ทำไม polynomial expansion ถึง impractical", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อความ “Explicit polynomial feature expansion becomes impractical as the number of input features and polynomial degree increase” หมายความว่าอย่างไร?", "options": ["polynomial สร้าง decision boundary ที่ไม่เป็นเส้นตรงไม่ได้เลยไม่ว่าจะกี่เทอม", "polynomial feature ทำให้ gradient descent ลู่เข้าไม่ได้เพราะฟังก์ชันไม่ต่อเนื่อง", "การแตกเทอมเองทำได้ แต่จำนวนเทอมระเบิดจนใช้งานจริงไม่ไหวเมื่อ feature เยอะ", "polynomial ใช้ได้เฉพาะกับข้อมูลภาพขาวดำเท่านั้น ใช้กับภาพสีไม่ได้"], "answer": 2, "explanation": "<p>คำสำคัญคือ <b>explicit</b> (แจกแจงเทอมออกมาเองทีละตัว) ไม่ใช่ “non-linear ทำไม่ได้”. โพลิโนเมียลยังสร้างขอบเขตโค้งได้ดีเหมือนเดิม แต่ที่พังคือ <em>จำนวนเทอม</em>: \\(2n+\\frac{n(n-1)}{2}\\) ⇒ 100 feature ดีกรี 2 ได้ 5,150 เทอม และภาพสีเล็ก ๆ ที่มีหลายพัน feature จะได้หลายล้านเทอม</p>\n<p>ทางออกคือให้ hidden node เรียน “ผลรวมเชิงเส้น + nonlinearity” เอง แทนการที่เราต้องบอกว่าให้คูณ feature ไหนกับ feature ไหน</p>", "ref": "Lesson 2 §1 (Lecture2.pdf p.2)", "why_wrong_map": ["สลับความหมาย — polynomial ทำ non-linear boundary ได้ ปัญหาอยู่ที่จำนวนเทอม", "ประโยคนี้พูดถึงจำนวนเทอม ไม่ได้พูดถึงความลู่เข้าของ gradient descent", "", "เอาเรื่องชนิดข้อมูลภาพมาปนกับข้อจำกัดของ polynomial"]}, {"id": "L2-06", "lesson": 2, "topic": "นิยาม dense / fully connected layer และลำดับการคำนวณใน node", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "โครงข่ายที่ประกอบด้วย <b>dense layer</b> (fully connected layer) มีลักษณะอย่างไร และแต่ละ node สร้าง output ตามลำดับใด?", "options": ["ทุก node ของชั้นก่อนหน้าต่อเข้าทุก node ของชั้นถัดไป และแต่ละ node รับ input มาคูณ weight รวมกัน แล้วจึงส่งผ่าน activation", "ทุก node ของชั้นก่อนหน้าต่อเข้าทุก node ของชั้นถัดไป และแต่ละ node ส่ง input ผ่าน activation ก่อน แล้วจึงนำผลไปคูณกับ weight", "แต่ละ node เลือกต่อกับ node ของชั้นก่อนหน้าเพียงตัวเดียวที่มี weight สูงสุด แล้วคูณ weight ก่อนส่งผ่าน activation", "ทุก node ของชั้นก่อนหน้าต่อเข้าทุก node ของชั้นถัดไป และแต่ละ node รวม input ด้วย weight แล้วส่งค่าออกตรง ๆ ไม่ใช้ activation"], "answer": 0, "explanation": "<ul><li><b>Dense / fully connected</b> = ทุก node ของชั้นก่อนหน้าต่อเข้าทุก node ของชั้นถัดไป <em>ไม่มีเส้นไหนขาด</em> (เช่น input 5 ตัวต่อเข้า hidden 4 node ⇒ เส้นเชื่อม \\(5\\times4=20\\) เส้น)</li>\n<li><b>ลำดับในทุก node</b> = รับ inputs ของชั้นก่อนหน้า → คูณ weight แล้วบวกกันได้ \\(z\\) → ส่งผ่าน activation ได้ \\(a=g(z)\\)</li></ul>\n<p>ลำดับนี้ห้ามสลับ: ถ้าเอา activation ขึ้นก่อน สูตร \\(z=\\sum_{i=0}^{n}\\theta_i x_i\\) จะไม่มีความหมาย และถ้าตัด activation ทิ้ง ทั้งโครงข่ายจะยุบเหลือสมการเชิงเส้นชุดเดียว — ซ้อนกี่ชั้นก็มีกำลังอธิบายเท่ากับชั้นเดียว</p>", "ref": "Lesson 2 §1A (Lecture2.pdf p.6)", "why_wrong_map": ["", "สลับลำดับเป็น “activation ก่อน แล้วค่อยคูณ weight” ซึ่งเป็นตัวลวงยอดฮิตของหน้านี้", "ขัดกับคำว่า fully connected — ไม่มีการเลือกรับจาก node เดียว ทุกเส้นต่อครบ", "ตัด activation ออก ทำให้ซ้อนกี่ชั้นก็ยุบเป็นเส้นตรงเส้นเดียว"]}, {"id": "L3-31", "lesson": 3, "topic": "Regularization: L1/L2 และข้อควรจำ", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดถูกต้องเกี่ยวกับ regularization?", "options": ["L2 (Ridge) ใช้กำลังสองของพารามิเตอร์ และต้องรายงาน cost ที่รวมเทอมนี้ตอนประเมินผล", "L2 (Ridge) ตัด feature ที่ไม่สำคัญทิ้ง ทำให้เหลือ feature น้อยลงหลังเทรนเสร็จ", "L2 (Lasso) ใช้ค่าสัมบูรณ์ของพารามิเตอร์ และเทอมนี้ใส่ใน cost เฉพาะตอนเทรนเท่านั้น", "L2 (Ridge) ใช้กำลังสองของพารามิเตอร์ และเทอมนี้ใส่ใน cost เฉพาะตอนเทรนเท่านั้น"], "answer": 3, "explanation": "L2 = Ridge = <i>square of the value of parameters</i>; L1 = Lasso = <i>absolute value</i>. L2 นิยมกว่าเพราะ Lasso \"not amenable to gradient descent\" และแกว่งเมื่อ feature correlated. หลักการคือ <b>Keep all features</b> แต่บีบ weight ให้เล็ก (towards zero but not zero). และ regularization term should only be added to the cost function during training — ตอนประเมินผลใช้ค่าที่ไม่มี penalty.", "ref": "Lesson 3 §7 Regularization (p.41–43)", "why_wrong_map": ["ตอนประเมินต้องใช้ unregularized performance measure", "regularization keep all features ไม่ได้ตัดทิ้ง", "จับคู่ L2 กับ Lasso/ค่าสัมบูรณ์ผิด", ""]}, {"id": "L4-35", "lesson": 4, "topic": "Inverted dropout: เหตุผลของการหาร", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "เหตุใด inverted dropout จึงต้องหาร activation ที่เหลือด้วย keep_prob ระหว่างเทรน?", "options": ["เพื่อใช้ keep_prob เป็น learning rate ตัวใหม่ของ layer นั้น ซึ่งทำให้ layer ที่ปิดมากเรียนช้าลง", "เพื่อชดเชยผลรวม input ที่หายไปจาก node ที่ถูกปิด ให้ค่าคาดหวังตรงกับตอน test ที่เปิดครบทุก node", "เพื่อทำให้ค่า activation ทุกตัวเล็กลงเสมอ ซึ่งช่วยลดขนาดของ gradient ที่ไหลย้อนกลับไปด้วย", "เพื่อให้ผลรวมของ activation ทั้งหมดใน layer นั้นเท่ากับ 1 เสมอ เหมือนการทำ softmax ที่ชั้น output"], "answer": 1, "explanation": "<p>อาจารย์เน้นว่าเรื่องนี้ \"crucial\": ถ้าไม่ scale ตอนเทรน พอถึงตอน test neuron จะ \"ถูกเชื่อมกับ input neuron มากกว่าตอนเทรน\" — ตอนเทรนเพื่อนบ้านเปิดแค่ 90% แต่ตอน test เปิดครบ 100% ผลรวมจึงใหญ่เกินกว่าที่มันเคยเรียนมา</p><p>ตรวจด้วยคณิตศาสตร์: \\(E\\left[\\dfrac{a\\cdot D}{\\text{keep\\_prob}}\\right] = \\dfrac{a\\times\\text{keep\\_prob}}{\\text{keep\\_prob}} = a\\) — เท่ากับค่าเดิมพอดี</p><p>ตัวคูณตาม keep_prob: 0.9 ⇒ ×1.111, 0.8 ⇒ ×1.25, 0.5 ⇒ ×2</p>", "ref": "Lesson 4 §6.2 (สไลด์หน้า 29)", "why_wrong_map": ["keep_prob ไม่ใช่ learning rate คนละบทบาทกันโดยสิ้นเชิง", "", "การหารด้วยค่าที่น้อยกว่า 1 ทำให้ค่า<i>ใหญ่</i>ขึ้น ไม่ใช่เล็กลง", "dropout ไม่ได้บังคับให้ผลรวมเป็น 1 นั่นคือหน้าที่ของ softmax"]}, {"id": "L1-23", "lesson": 1, "topic": "Precision–recall trade-off (threshold)", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ระบบคัดกรองมะเร็งต้องการ \"ห้ามพลาดผู้ป่วยจริง\" ควรเลื่อน threshold ของ logistic regression อย่างไร และจะเกิดผลอะไร?", "options": ["เพิ่ม threshold ⇒ recall สูงขึ้น แต่ precision มักลดลง", "ลด threshold ⇒ ทั้ง precision และ recall สูงขึ้นพร้อมกัน", "เพิ่ม threshold ⇒ precision สูงขึ้น และ recall ก็สูงขึ้นด้วย", "ลด threshold ⇒ recall สูงขึ้น แต่ precision มักลดลง"], "answer": 3, "explanation": "\"ห้ามพลาดผู้ป่วยจริง\" = ลด FN = ต้องการ recall สูง. ลด threshold ⇒ ทำนายบวกมากขึ้น ⇒ FN ลด (recall ↑) แต่ FP เพิ่ม (precision ↓). หลักทั่วไปคือ <b>increasing precision reduces recall (vice versa)</b> เมื่อเลื่อน threshold.", "ref": "Lesson 1 §7 (p.46)", "why_wrong_map": ["threshold สูงขึ้น ทำนายบวกน้อยลง recall จึงลด", "สองค่านี้มักสวนทางกันเมื่อเลื่อน threshold", "ขัดกับ trade-off ระหว่าง precision กับ recall", ""]}, {"id": "L5-17", "lesson": 5, "topic": "BN: ความหมายของ γ β ε", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ในสูตร BN \\(z_{norm}=\\dfrac{z-\\mu_B}{\\sqrt{\\sigma_B^2+\\epsilon}},\\ \\tilde z=\\gamma z_{norm}+\\beta\\) ข้อใดถูกต้อง?", "options": ["γ, β เรียนรู้ด้วย gradient descent ส่วน ε คือ learning rate ของ BN", "γ, β คือ moving mean และ moving variance ส่วน ε คือค่า momentum", "γ, β เป็น hyperparameter ที่ต้องตั้งเอง ส่วน ε กันการหารด้วยศูนย์", "γ, β เรียนรู้ด้วย gradient descent ส่วน ε มีไว้กันการหารด้วยศูนย์"], "answer": 3, "explanation": "ตามสไลด์หน้า 12: ตัวห้อย B = mini-batch, \\(m_B\\) = จำนวนตัวอย่างใน batch, \\(\\epsilon\\) = เลขจิ๋วกันหารศูนย์ (ปกติ \\(10^{-7}\\)), \\(\\gamma\\) = scale, \\(\\beta\\) = shift/offset — <i>two new parameter vectors per layer</i> ที่<b>เรียนรู้ได้</b>เหมือน \\(\\theta\\). moving mean/variance เป็นอีกคู่ที่ non-trainable ใช้ตอน test.", "ref": "Lesson 5 §3.1 (สไลด์หน้า 12)", "why_wrong_map": ["ε ไม่เกี่ยวกับ learning rate", "moving stats แยกจาก γ, β; momentum เป็น hyperparameter อีกตัว", "γ, β เป็น trainable ไม่ใช่ hyperparameter", ""]}, {"id": "L1-08", "lesson": 1, "topic": "Dataset notation m, n", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ตารางข้อมูลบ้านมี 50 แถว แต่ละแถวมีคอลัมน์ขนาด, ห้องนอน, ห้องน้ำ, อายุบ้าน และคอลัมน์ price เป็น \\(y\\) ถ้าใช้ linear regression หลายตัวแปร ค่า \\(m\\), \\(n\\) และจำนวนพารามิเตอร์ \\(\\theta\\) คือเท่าใด?", "options": ["\\(m=4,\\ n=50\\), มี 5 พารามิเตอร์", "\\(m=50,\\ n=4\\), มี 5 พารามิเตอร์", "\\(m=50,\\ n=4\\), มี 4 พารามิเตอร์", "\\(m=50,\\ n=5\\), มี 6 พารามิเตอร์"], "answer": 1, "explanation": "\\(m\\) = number of training examples = จำนวนแถว = 50; \\(n\\) = จำนวน feature (ไม่นับ \\(y\\)) = 4. Hypothesis \\(h_\\theta(x)=\\theta_0+\\theta_1x_1+\\dots+\\theta_4x_4\\) มี \\(n+1=5\\) พารามิเตอร์ เพราะมี \\(\\theta_0\\) (intercept/bias) เพิ่มมาอีกตัว (เคล็ด \\(x_0=1\\)).", "ref": "Lesson 1 §1B (p.26), §2 (p.28)", "why_wrong_map": ["สลับ m (แถว) กับ n (feature)", "", "ลืม \\(\\theta_0\\) — n feature ต้องมี n+1 พารามิเตอร์", "นับ price (y) เป็น feature ด้วย"]}, {"id": "L5-33", "lesson": 5, "topic": "None ใน model.summary()", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ใน <code>model.summary()</code> ของโมเดล MNIST ทุกชั้นมี output shape ขึ้นต้นด้วย <code>None</code> เช่น (None, 16) หมาย ม</p>\n<p>\\(\\begin{bmatrix}2+(-4)&-1+2\\\\3+1&0+5\\end{bmatrix}=\\begin{bmatrix}-2&1\\\\4&5\\end{bmatrix}\\)</p>\n<p>การบวกต้องการให้ <b>ขนาดเท่ากันเป๊ะทั้งสองมิติ</b> (ต่างจากการคูณที่ขอแค่มิติ “ใน” ตรงกัน) และเป็น element-wise operation แบบเดียวกับ <code>X + Y</code> ของ NumPy</p>", "ref": "Lesson 2 §5B (Lecture2.pdf p.29–30)", "why_wrong_map": ["", "บวกผิดเครื่องหมายที่ช่อง (1,2): \\(-1+2=+1\\) ไม่ใช่ \\(-3\\)", "ไปคูณเมทริกซ์แทนที่จะบวก", "ลบแทนที่จะบวก (\\(2-(-4)=6\\))"]}, {"id": "L1-31", "lesson": 1, "topic": "More examples: high variance vs high bias", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "การเก็บตัวอย่างข้อมูลฝึกเพิ่ม (more training examples) ช่วยแก้ปัญหาในกรณีใด?", "options": ["ช่วยกรณี high bias แต่ไม่ช่วยมากในกรณี high variance", "ช่วยกรณี high variance แต่ไม่ช่วยมากในกรณี high bias", "ไม่ช่วยทั้งสองกรณี ต้องใช้ regularization อย่างเดียว", "ช่วยทั้งสองกรณีเท่ากัน เพราะข้อมูลยิ่งมากยิ่งดีเสมอ"], "answer": 1, "explanation": "<b>More examples does help in high variance case! (not help much in high bias case)</b>. เส้นตรง \\(\\theta_0+\\theta_1x\\) พลาดเท่าเดิมไม่ว่ามีกี่จุด เพราะข้อจำกัดอยู่ที่รูปสมการ; ส่วน polynomial degree สูงที่บิดตัวไปมาตอนข้อมูลน้อย จะถูกจุดข้อมูลที่แน่นขึ้นบีบให้เรียบ. จึงต้องวินิจฉัยด้วย \\(J_{train}, J_{cv}\\) ก่อนลงทุนเก็บข้อมูล.", "ref": "Lesson 1 §11 (p.58)", "why_wrong_map": ["สลับสองกรณี — กับดักที่พบบ่อยที่สุด", "", "การเก็บข้อมูลเพิ่มช่วยได้ชัดในกรณี high variance", "high bias เติมข้อมูลไปก็ไม่ช่วย เพราะปัญหาอยู่ที่ความจุของโมเดล"]}, {"id": "L2-49", "lesson": 2, "topic": "Xθ ของ 3 training example", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ให้ \\(h_\\theta(x)=2+x_1+3x_2\\) กับตัวอย่างสามแถว \\((x_1,x_2) = (1,0),(1,1),(2,1)\\) เมื่อเขียนเป็น \\(X\\theta\\) ได้คำทำนายชุดใด?", "options": ["\\([5,\\ 6,\\ 9]^\\top\\)", "\\([1,\\ 4,\\ 5]^\\top\\)", "\\([2,\\ 5,\\ 6]^\\top\\)", "\\([3,\\ 6,\\ 7]^\\top\\)"], "answer": 3, "explanation": "<p>อ่าน \\(\\theta=[2,1,3]^\\top\\) จากสมการ แล้ว <b>เติมคอลัมน์ \\(x_0=1\\) ไว้หน้าสุด</b> ของ \\(X\\):</p>\n<p>\\(X=\\begin{bmatrix}1&1&0\\\\1&1&1\\\\1&2&1\\end{bmatrix}_{3\\times3}\\) และเช็กมิติก่อนคูณ: \\((3\\times3)(3\\times1)=3\\times1\\) ✓</p>\n<p>คูณทีละแถว: \\(2+1+0=3\\), \\(2+1+3=6\\), \\(2+2+3=7\\) ⇒ \\([3,6,7]^\\top\\)</p>\n<p>ตรวจด้วย for loop ก็ได้ค่าเดียวกัน แต่แบบเมทริกซ์เสร็จในคำสั่งเดียว</p>", "ref": "Lesson 2 §6 (Lecture2.pdf p.41)", "why_wrong_map": ["สลับ \\(\\theta_1\\) กับ \\(\\theta_2\\) ⇒ ใช้ \\(2+3x_1+x_2\\)", "ลืมคอลัมน์ \\(x_0=1\\) ⇒ bias \\(\\theta_0=2\\) หายไปทั้งก้อน", "ใช้ bias เป็น 1 (ค่าของ \\(x_0\\)) แทนที่จะเป็น \\(\\theta_0=2\\)", ""]}, {"id": "L3-05", "lesson": 3, "topic": "Chain rule: โครงสร้างของ ∂J/∂θ[1]", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "เครือข่าย input → hidden → output (\\(L=2\\)) ผลคูณตาม chain rule ของ \\(\\partial J/\\partial\\theta^{[1]}\\) คือข้อใด?", "options": ["\\(\\frac{\\partial J}{\\partial z^{[1]}}\\frac{\\partial z^{[1]}}{\\partial a^{[1]}}\\frac{\\partial a^{[1]}}{\\partial z^{[2]}}\\frac{\\partial z^{[2]}}{\\partial\\theta^{[1]}}\\)", "\\(\\frac{\\partial J}{\\partial z^{[2]}}\\frac{\\partial z^{[2]}}{\\partial a^{[1]}}\\frac{\\partial a^{[1]}}{\\partial z^{[1]}}\\frac{\\partial z^{[1]}}{\\partial\\theta^{[1]}}\\)", "\\(\\frac{\\partial J}{\\partial z^{[2]}}\\frac{\\partial z^{[2]}}{\\partial\\theta^{[2]}}\\frac{\\partial a^{[1]}}{\\partial z^{[1]}}\\frac{\\partial z^{[1]}}{\\partial\\theta^{[1]}}\\)", "\\(\\frac{\\partial J}{\\partial z^{[2]}}\\frac{\\partial z^{[2]}}{\\partial a^{[1]}}\\frac{\\partial z^{[1]}}{\\partial\\theta^{[1]}}\\)"], "answer": 1, "explanation": "ไล่ &quot;เส้นทาง&quot; ที่ \\(\\theta^{[1]}\\) ส่งผลถึง \\(J\\): \\(\\theta^{[1]}\\to z^{[1]}\\to a^{[1]}\\to z^{[2]}\\to J\\) มี 4 ทอด ⇒ 4 ตัวคูณ อ่านจาก cost ย้อนกลับ: \\(\\frac{\\partial J}{\\partial z^{[2]}}\\) (= \\(\\delta^{[2]}\\)) · \\(\\frac{\\partial z^{[2]}}{\\partial a^{[1]}}\\) (= \\(\\theta^{[2]}\\)) · \\(\\frac{\\partial a^{[1]}}{\\partial z^{[1]}}\\) (= \\(g'\\)) · \\(\\frac{\\partial z^{[1]}}{\\partial\\theta^{[1]}}\\) (= \\(x\\)). ส่วน \\(\\theta^{[2]}\\) มีแค่ 2 ทอด — จำนวนทอด = ระยะทางจาก weight ถึง cost.", "ref": "Lesson 3 §2 Apply Chain Rule (p.6)", "why_wrong_map": ["กลับทิศโซ่ (อ่านจาก input ไป output) ทำให้แต่ละทอดไม่ต่อกัน", "", "ใส่ ∂z[2]/∂θ[2] ซึ่งเป็นทอดของ weight ชั้นสุดท้าย ไม่ได้อยู่บนเส้นทางของ θ[1]", "ขาดทอด ∂a[1]/∂z[1] (g′) — ลืมผ่าน activation"]}, {"id": "L6-17", "topic": "กติกาการใช้ BackupAndRestore", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใด<b>ไม่ตรง</b>กับกติกาของ BackupAndRestore ที่สไลด์หน้า 9 ระบุไว้", "options": ["callback จะรีสตาร์ตการเทรนให้เองโดยอัตโนมัติทันทีที่ตรวจพบว่ามีไฟล์สำรองค้างอยู่ในโฟลเดอร์", "เมื่อเริ่มเทรนใหม่ ระบบจะเทรนต่อจาก checkpoint ล่าสุด ไม่ได้ย้อนกลับไปเริ่มที่ epoch แรก", "มีไฟล์ checkpoint เพียงไฟล์เดียวอยู่ตลอดเวลา เพราะการสำรองครั้งใหม่เขียนทับของเก่าเสมอ", "ตัวโมเดลและอาร์กิวเมนต์ของ compile กับ fit ต้องเหมือนเดิมทุกตัว ไม่เช่นนั้น checkpoint ใช้ไม่ได้"], "explanation": "<p>สไลด์ระบุไว้ว่า <mark class=\"src\" data-p=\"9\">Users must manually restart training by calling .fit()</mark> — callback ไม่ได้รีสตาร์ตให้เอง มันแค่ \"จำได้ว่าค้างไว้ตรงไหน\" เมื่อเราสั่งรันใหม่</p><p>อีกสามข้อตรงกับสไลด์: <mark class=\"src\" data-p=\"9\">Only one checkpoint file exists at any time</mark>, <mark class=\"src\" data-p=\"9\">If training is restarted, it resumes from the most recent checkpoint</mark> และโมเดล/อาร์กิวเมนต์ต้อง <mark class=\"src\" data-p=\"9\">remain unchanged</mark></p><p>ข้อควรระวังเพิ่ม: ถ้าไม่ตั้ง <code>delete_checkpoint=True</code> แล้วรันการทดลองใหม่ในโฟลเดอร์เดิม Keras จะนึกว่าเป็นการเทรนที่ค้างอยู่แล้วข้าม epoch ไปดื้อๆ</p>", "ref": "Lesson 6 §4 (สไลด์หน้า 9)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "ตรงกับสไลด์ — การเทรนรอบใหม่เริ่มต่อจาก checkpoint ล่าสุด", "ตรงกับสไลด์ — backup ใหม่เขียนทับของเก่า จึงเหลือไฟล์เดียวเสมอ", "ตรงกับสไลด์ — ถ้าเปลี่ยนโมเดลหรืออาร์กิวเมนต์ สถานะที่เก็บไว้จะเข้ากันไม่ได้"]}, {"id": "L2-14", "lesson": 2, "topic": "สัญกรณ์ θ_ij^[l]", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "โครงข่ายที่มี input \\(x_1,x_2\\) และใช้สัญกรณ์ \\(\\theta_{ij}^{[l]}\\) สำหรับ weight ของ layer \\(l\\) พารามิเตอร์ \\(\\theta_{21}^{[1]}\\) หมายถึงเส้นเชื่อมใด?", "options": ["เส้นจาก bias unit เข้า node ที่ 21 ของ layer 1", "เส้นจาก node ที่ 2 ของ layer 1 เข้า node ที่ 1 ของ layer 2", "เส้นจาก \\(x_2\\) เข้า node ที่ 1 ของ layer 1", "เส้นจาก \\(x_1\\) เข้า node ที่ 2 ของ layer 1"], "answer": 3, "explanation": "<p>กฎการอ่าน: เลขในวงเล็บเหลี่ยมคือ <b>layer ปลายทาง</b> (\\([1]\\) = layer 1), subscript ตัวหน้าคือ <b>node ปลายทาง</b> (\\(i=2\\)) และ subscript ตัวหลังคือ <b>node ต้นทางใน layer ก่อนหน้า</b> (\\(j=1\\) คือ \\(x_1\\))</p>\n<p>จำสั้น ๆ ว่า “ปลายทางก่อน ต้นทางทีหลัง” — ลำดับนี้ทำให้ \\(z=\\theta a\\) ตรงกับกฎคูณ matrix–vector พอดี (แถว = ปลายทาง, คอลัมน์ = ต้นทาง) ถ้าสลับ \\(i,j\\) มิติจะคูณกันไม่ได้</p>", "ref": "Lesson 2 §3 (Lecture2.pdf p.12–13)", "why_wrong_map": ["อ่าน subscript สองตัวติดกันเป็นเลข 21 ตัวเดียว", "อ่าน \\([1]\\) เป็น layer ต้นทางแทนที่จะเป็น layer ปลายทาง", "สลับ \\(i\\) กับ \\(j\\) (คิดว่าต้นทางมาก่อน) — ตัวลวงที่พบบ่อยที่สุด", ""]}, {"id": "L3-32", "lesson": 3, "topic": "Regularization: gradient แยก j=0", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "เมื่อใส่ L2 regularization สูตร gradient \\(D_{ij}^{(l)}\\) ของ \\(\\theta_{ij}^{(l)}\\) คือข้อใด?", "options": ["\\(j=0\\): \\(\\frac{1}{m}\\Delta_{ij}+\\frac{\\lambda}{m}\\theta_{ij}\\); \\(j\\ge1\\): \\(\\frac{1}{m}\\Delta_{ij}\\)", "ทุก \\(j\\): \\(\\frac{1}{m}\\Delta_{ij}+\\frac{\\lambda}{m}\\theta_{ij}\\) รวมคอลัมน์ bias ด้วย", "\\(j=0\\): \\(\\frac{1}{m}\\Delta_{ij}\\); \\(j\\ge1\\): \\(\\frac{1}{m}\\Delta_{ij}+\\frac{\\lambda}{m}\\theta_{ij}\\)", "\\(j=0\\): \\(\\frac{1}{m}\\Delta_{ij}\\); \\(j\\ge1\\): \\(\\frac{1}{m}\\Delta_{ij}-\\frac{\\lambda}{m}\\theta_{ij}\\)"], "answer": 2, "explanation": "คอลัม
