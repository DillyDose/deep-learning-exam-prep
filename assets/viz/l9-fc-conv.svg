<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">แทน FC ด้วย conv: parameter เท่าเดิม แต่ภาพใหญ่ขึ้นได้ output เป็นตาราง</text><text x="130" y="56" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">เดิม (หลัง flatten 5×5×20 = 180)</text><text x="430" y="56" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">fully convolutional</text><text x="650" y="56" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">parameter</text><rect x="40" y="70" width="100" height="32" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="90.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">FC 200</text><text x="150" y="91" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">180·200 + 200</text><rect x="330" y="70" width="110" height="32" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="385.0" y="90.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">conv 3×3, 200</text><text x="450" y="91" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">(9·20 + 1)·200</text><text x="650" y="91" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="bold">36,200</text><rect x="40" y="116" width="100" height="32" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="136.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">FC 200</text><text x="150" y="137" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">200·200 + 200</text><rect x="330" y="116" width="110" height="32" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="385.0" y="136.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">conv 1×1, 200</text><text x="450" y="137" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">(200 + 1)·200</text><text x="650" y="137" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="bold">40,200</text><rect x="40" y="162" width="100" height="32" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="182.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">softmax 4</text><text x="150" y="183" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">200·4 + 4</text><rect x="330" y="162" width="110" height="32" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="385.0" y="182.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">conv 1×1, 4</text><text x="450" y="183" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">(200 + 1)·4</text><text x="650" y="183" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="bold">804</text><text x="380" y="228" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">ภาพ 32×32 → ...5×5×20 → conv 3×3 ได้ 1×1×200 → 1×1×4 คือ 4 คะแนนของหน้าต่างเดียว</text><text x="380" y="252" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">ตัด conv กลางออก: 15×15×10 → conv 3×3 ได้ 13×13×200 → 13×13×4</text><text x="380" y="276" font-size="12.5" text-anchor="middle" fill="#2e7d32" font-weight="bold">13 × 13 = 169 หน้าต่างจาก forward ครั้งเดียว · ส่วนที่ซ้อนกันคำนวณร่วมกัน</text></svg>