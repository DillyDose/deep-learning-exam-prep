<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">memory ใหม่ = (gate เขียน) × ค่าใหม่ + (gate เก็บ) × ค่าเดิม</text><text x="190" y="54" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">GRU</text><rect x="30" y="70" width="90" height="36" rx="6" fill="#d9efd9" stroke="#2e7d32"/><text x="75.0" y="92.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">c̃ = 0.4</text><rect x="30" y="140" width="90" height="36" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="75.0" y="162.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">c⟨t−1⟩ = 1.0</text><rect x="150" y="70" width="100" height="36" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="200.0" y="92.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Γu = 0.5</text><rect x="150" y="140" width="100" height="36" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="200.0" y="162.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">1 − Γu = 0.5</text><line x1="120" y1="88" x2="148" y2="88" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="120" y1="158" x2="148" y2="158" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><circle cx="290" cy="123" r="13" fill="#fff" stroke="#222"/><text x="290" y="128" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">+</text><line x1="250" y1="88" x2="280" y2="114" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="250" y1="158" x2="280" y2="132" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="190" y="210" font-size="13.5" text-anchor="middle" fill="#1d6fb8" font-weight="bold">c⟨t⟩ = 0.2 + 0.5 = 0.7</text><text x="560" y="54" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">LSTM</text><rect x="400" y="70" width="90" height="36" rx="6" fill="#d9efd9" stroke="#2e7d32"/><text x="445.0" y="92.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">c̃ = 0.4</text><rect x="400" y="140" width="90" height="36" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="445.0" y="162.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">c⟨t−1⟩ = 1.0</text><rect x="520" y="70" width="100" height="36" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="570.0" y="92.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Γu = 0.5</text><rect x="520" y="140" width="100" height="36" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="570.0" y="162.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Γf = 0.9</text><line x1="490" y1="88" x2="518" y2="88" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="490" y1="158" x2="518" y2="158" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><circle cx="660" cy="123" r="13" fill="#fff" stroke="#222"/><text x="660" y="128" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">+</text><line x1="620" y1="88" x2="650" y2="114" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="620" y1="158" x2="650" y2="132" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="560" y="210" font-size="13.5" text-anchor="middle" fill="#1d6fb8" font-weight="bold">c⟨t⟩ = 0.2 + 0.9 = 1.1</text><text x="195" y="236" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">สองน้ำหนักรวมเป็น 1 เสมอ · a = c</text><text x="560" y="236" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">Γu กับ Γf อิสระ c เกิน 1 ได้</text><text x="560" y="258" font-size="12" text-anchor="middle" fill="#c25e00" font-weight="normal">a = Γo · tanh(c) = 0.6 × 0.8005 = 0.480</text><text x="380" y="288" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Γu = 0: ค่าเดิมถูกคัดลอกต่อโดยไม่ผ่าน tanh · gradient คูณด้วย 1 จึงไม่หาย</text></svg>