<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="260" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">parameter ของ conv layer = (f × f × n_C + 1) × จำนวน filter</text><rect x="60" y="60" width="70" height="70" fill="#fde7d4" stroke="#c25e00"/><rect x="86" y="70" width="70" height="70" fill="#fde7d4" stroke="#c25e00"/><rect x="112" y="80" width="70" height="70" fill="#fde7d4" stroke="#c25e00"/><rect x="138" y="90" width="70" height="70" fill="#fde7d4" stroke="#c25e00"/><text x="130" y="196" font-size="12" text-anchor="middle" fill="#c25e00" font-weight="normal">filter หนึ่งตัว 3×3×3</text><text x="130" y="214" font-size="12" text-anchor="middle" fill="#c25e00" font-weight="normal">= 27 weight + 1 bias</text><text x="260" y="112" font-size="15" text-anchor="start" fill="#222" font-weight="bold">× 10 filter</text><text x="260" y="140" font-size="15" text-anchor="start" fill="#c25e00" font-weight="bold">= 28 × 10 = 280</text><text x="470" y="70" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">ไม่มีในสูตร:</text><text x="470" y="92" font-size="12" text-anchor="start" fill="#222" font-weight="normal">• ขนาดภาพ (32×32 หรือ 1000×1000 ก็ 280)</text><text x="470" y="112" font-size="12" text-anchor="start" fill="#222" font-weight="normal">• padding และ stride</text><text x="470" y="140" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">ต้องมีในสูตร:</text><text x="470" y="162" font-size="12" text-anchor="start" fill="#222" font-weight="normal">• n_C ของ input ชั้นนั้น (ไม่ใช่ของภาพเดิม)</text><text x="470" y="182" font-size="12" text-anchor="start" fill="#222" font-weight="normal">• +1 bias ต่อ filter</text><text x="380" y="248" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">channel ของ filter ต้องเท่ากับ channel ของ input · channel ของ output = จำนวน filter</text></svg>