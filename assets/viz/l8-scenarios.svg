<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">เลือกระดับ fine-tune จากสองปัจจัย: ขนาดข้อมูล และความคล้ายกับ source</text><rect x="170" y="60" width="270" height="100" fill="#fff" stroke="#999"/><text x="305.0" y="82" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">#1 small + similar</text><text x="305.0" y="102" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">feature extractor</text><rect x="205" y="114" width="200" height="14" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="405" y="114" width="0" height="14" fill="#fde7d4" stroke="#c25e00"/><text x="305.0" y="150" font-size="11.5" text-anchor="middle" fill="#666" font-weight="normal">ล็อกทั้ง conv base</text><rect x="440" y="60" width="270" height="100" fill="#fff" stroke="#999"/><text x="575.0" y="82" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">#2 large + similar</text><text x="575.0" y="102" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">fine tune ส่วนท้าย</text><rect x="475" y="114" width="140" height="14" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="615" y="114" width="60" height="14" fill="#fde7d4" stroke="#c25e00"/><text x="575.0" y="150" font-size="11.5" text-anchor="middle" fill="#666" font-weight="normal">freeze 60%–80%</text><rect x="170" y="160" width="270" height="100" fill="#fff" stroke="#999"/><text x="305.0" y="182" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">#3 small + different</text><text x="305.0" y="202" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">fine tune จากส่วนต้น</text><rect x="205" y="214" width="84" height="14" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="289" y="214" width="116" height="14" fill="#fde7d4" stroke="#c25e00"/><text x="305.0" y="250" font-size="11.5" text-anchor="middle" fill="#666" font-weight="normal">freeze 33%–50%</text><rect x="440" y="160" width="270" height="100" fill="#fff" stroke="#999"/><text x="575.0" y="182" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">#4 large + different</text><text x="575.0" y="202" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">fine tune ทั้งโมเดล</text><rect x="475" y="214" width="0" height="14" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="475" y="214" width="200" height="14" fill="#fde7d4" stroke="#c25e00"/><text x="575.0" y="250" font-size="11.5" text-anchor="middle" fill="#666" font-weight="normal">freeze 0%</text><text x="305.0" y="52" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">ข้อมูลน้อย</text><text x="575.0" y="52" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">ข้อมูลมาก</text><text x="160" y="114.0" font-size="12" text-anchor="end" fill="#222" font-weight="bold">domain คล้าย</text><text x="160" y="214.0" font-size="12" text-anchor="end" fill="#222" font-weight="bold">domain ต่าง</text><text x="380" y="284" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">ข้อมูลมากขึ้น → เทรนได้มากชั้นขึ้น · domain ต่างขึ้น → ต้องปลดลึกถึงชั้นต้น</text></svg>