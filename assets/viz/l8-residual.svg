<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="260" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">residual block: บวก x กลับเข้า output ทำให้ gradient มีทางลัด</text><text x="190" y="50" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">บล็อกธรรมดา</text><text x="60" y="112" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">x</text><line x1="70" y1="107" x2="110" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="110" y="88" width="70" height="38" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="145.0" y="111.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Layer 1</text><line x1="180" y1="107" x2="200" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="200" y="88" width="70" height="38" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="235.0" y="111.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Layer 2</text><line x1="270" y1="107" x2="320" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="190" y="160" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="bold">h(x) = f(x)</text><text x="190" y="184" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal">∂h/∂x = ∂f/∂x</text><text x="190" y="208" font-size="12.5" text-anchor="middle" fill="#b3261e" font-weight="bold">ถ้า ∂f/∂x = 0.01 → 0.01</text><text x="190" y="232" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">weight เป็น 0 ได้ output 0 สัญญาณหาย</text><text x="570" y="50" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">residual block</text><text x="440" y="112" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">x</text><line x1="450" y1="107" x2="490" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="490" y="88" width="70" height="38" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="525.0" y="111.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Layer 1</text><line x1="560" y1="107" x2="580" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="580" y="88" width="70" height="38" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="615.0" y="111.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Layer 2</text><circle cx="682" cy="107" r="12" fill="#fff" stroke="#222"/><text x="682" y="112" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">+</text><line x1="650" y1="107" x2="670" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="694" y1="107" x2="720" y2="107" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><path d="M465.0,107.0 L465.0,70.0 L682.0,70.0 L682.0,93.0" fill="none" stroke="#2e7d32" stroke-width="2"/><text x="570" y="64" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">skip connection</text><text x="570" y="160" font-size="13" text-anchor="middle" fill="#c25e00" font-weight="bold">h(x) = f(x) + x</text><text x="570" y="184" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal">∂h/∂x = ∂f/∂x + 1</text><text x="570" y="208" font-size="12.5" text-anchor="middle" fill="#2e7d32" font-weight="bold">ถ้า ∂f/∂x = 0.01 → 1.01</text><text x="570" y="232" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">weight เป็น 0 ได้ h(x) = x (identity)</text></svg>