<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">สามแนวทาง transfer learning: ส่วนไหนถูก freeze (ฟ้า) ส่วนไหนเทรน (ส้ม)</text><text x="20" y="76" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">1. as a classifier</text><rect x="190" y="56" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="217.0" y="76.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block1</text><rect x="248" y="56" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="275.0" y="76.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block2</text><rect x="306" y="56" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="333.0" y="76.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block3</text><rect x="364" y="56" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="391.0" y="76.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block4</text><rect x="422" y="56" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="449.0" y="76.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block5</text><rect x="480" y="56" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="507.0" y="76.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">head</text><text x="190" y="108" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">ใช้ทั้งตัว head เดิม 1,000 class · ไม่เทรนเลย</text><text x="20" y="148" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">2. as feature detector</text><rect x="190" y="128" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="217.0" y="148.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block1</text><rect x="248" y="128" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="275.0" y="148.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block2</text><rect x="306" y="128" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="333.0" y="148.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block3</text><rect x="364" y="128" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="391.0" y="148.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block4</text><rect x="422" y="128" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="449.0" y="148.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block5</text><rect x="480" y="128" width="54" height="32" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="507.0" y="148.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">head ใหม่</text><text x="190" y="180" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">conv base ล็อกทั้งหมด · head ใหม่เทรนจากศูนย์</text><text x="20" y="220" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">3. fine tuning</text><rect x="190" y="200" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="217.0" y="220.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block1</text><rect x="248" y="200" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="275.0" y="220.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block2</text><rect x="306" y="200" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="333.0" y="220.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block3</text><rect x="364" y="200" width="54" height="32" rx="6" fill="#cfe3f7" stroke="#1d6fb8"/><text x="391.0" y="220.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block4</text><rect x="422" y="200" width="54" height="32" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="449.0" y="220.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">block5</text><rect x="480" y="200" width="54" height="32" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="507.0" y="220.5" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">head ใหม่</text><text x="190" y="252" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">ล็อกส่วนต้น · ปลด block ท้าย + head ใหม่ เทรนร่วมกัน</text><text x="560" y="70" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">VGG16 จริง</text><text x="560" y="92" font-size="12" text-anchor="start" fill="#1d6fb8" font-weight="normal">conv base 14,714,688</text><text x="560" y="112" font-size="12" text-anchor="start" fill="#1d6fb8" font-weight="normal">head เดิม 123,642,856</text><text x="560" y="146" font-size="12" text-anchor="start" fill="#222" font-weight="normal">แนวทาง 2: trainable</text><text x="560" y="164" font-size="13" text-anchor="start" fill="#c25e00" font-weight="bold">6,423,041</text><text x="560" y="196" font-size="12" text-anchor="start" fill="#222" font-weight="normal">แนวทาง 3: + block5 (3 conv)</text><text x="560" y="214" font-size="13" text-anchor="start" fill="#c25e00" font-weight="bold">13,502,465</text><text x="560" y="246" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Total ของ 2 และ 3 เท่ากัน</text><text x="560" y="264" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">21,137,729</text></svg>