<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="250" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">IoU = พื้นที่ซ้อน ÷ พื้นที่รวม · ตัวส่วนคือ union ไม่ใช่พื้นที่กรอบเดียว</text><rect x="60" y="50" width="120" height="120" fill="#1d6fb8" fill-opacity="0.12" stroke="#1d6fb8" stroke-width="2"/><rect x="120" y="110" width="120" height="120" fill="#c25e00" fill-opacity="0.12" stroke="#c25e00" stroke-width="2"/><rect x="120" y="110" width="60" height="60" fill="#f7c873" stroke="#222"/><text x="150" y="145" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">4</text><text x="90" y="80" font-size="12" text-anchor="middle" fill="#1d6fb8" font-weight="normal">B₁ 4×4</text><text x="210" y="215.0" font-size="12" text-anchor="middle" fill="#c25e00" font-weight="normal">B₂ 4×4</text><text x="400" y="70" font-size="13" text-anchor="start" fill="#222" font-weight="normal">B₁ = 16 · B₂ = 16</text><text x="400" y="98" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ซ้อน: (4 − 2) × (4 − 2) = 4</text><text x="400" y="126" font-size="13" text-anchor="start" fill="#222" font-weight="normal">รวม: 16 + 16 − 4 = 28</text><text x="400" y="160" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">IoU = 4/28 ≈ 0.14</text><text x="400" y="190" font-size="12" text-anchor="start" fill="#666" font-weight="normal">ซ้อนกัน 25% ของแต่ละกรอบ แต่ IoU แค่ 0.14</text><text x="400" y="210" font-size="12" text-anchor="start" fill="#666" font-weight="normal">ที่เกณฑ์ 0.5 ถือว่าคนละวัตถุ</text></svg>