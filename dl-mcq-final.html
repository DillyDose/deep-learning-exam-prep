<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Learning MCQ Final</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">

<style>
:root {
  --bg: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #55554f;
  --rule: #e2ddd2;
  --accent: #a5502c;
  --accent-soft: #f6ece3;
  --good: #2f6d3e;
  --good-bg: #e8f3ea;
  --bad: #a5342c;
  --bad-bg: #f9e9e7;
  --code-bg: #f4f2eb;
  --panel: #faf9f5;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: -apple-system, "Helvetica Neue", "Noto Sans Thai", "Sukhumvit Set", Arial, sans-serif;
  font-size: 17px; line-height: 1.6;
  max-width: 820px; margin: 0 auto; padding: 2rem 16px 5rem;
}
h1 { font-size: 1.7rem; margin: 0 0 .2em; }
.sub { color: var(--ink-soft); margin: 0 0 1.2em; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
.panel h2 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; font-size: .88rem; background: #fff; cursor: pointer; user-select: none; }
.chip input { margin: 0; }
button { font: inherit; font-size: .9rem; border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: .75rem; color: var(--ink-soft); }
.stat .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--rule); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.weak { margin: 10px 0 0; padding-left: 1.2em; font-size: .92rem; }
.weak li { margin: 2px 0; }
.weak a { color: var(--bad); }
.progress { font-size: .9rem; color: var(--ink-soft); margin: 18px 0 8px; }
.q { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; margin: 0 0 16px; background: #fff; scroll-margin-top: 12px; }
.q.done-good { border-left: 5px solid var(--good); }
.q.done-bad { border-left: 5px solid var(--bad); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: .74rem; margin-bottom: 8px; }
.tag { border-radius: 4px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent); }
.tag.t-code { background: #e7eef8; color: #2b5a91; }
.tag.t-calc { background: #efe8f6; color: #6a3d8f; }
.tag.d-easy { background: #eaf3e8; color: #3d6b33; }
.tag.d-medium { background: #f7f0dc; color: #7a5b12; }
.tag.d-hard { background: #f8e4e1; color: #8e3a2f; }
.num { font-weight: 700; color: var(--ink-soft); margin-right: 4px; }
.stem { margin: 0 0 10px; }
pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: .84rem; line-height: 1.45; margin: 8px 0 12px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
:not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; text-align: left; width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--rule); background: #fff; font-size: .97rem; line-height: 1.5; }
.opt .L { font-weight: 700; min-width: 1.4em; color: var(--ink-soft); }
.opt:not([disabled]):hover { background: var(--panel); border-color: var(--accent); }
.opt[disabled] { cursor: default; color: var(--ink); }
.opt.correct { background: var(--good-bg); border-color: var(--good); }
.opt.correct .L { color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .L { color: var(--bad); }
.verdict { margin: 10px 0 0; font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.explain { margin-top: 10px; padding: 12px 14px; background: var(--panel); border-radius: 9px; border: 1px solid var(--rule); font-size: .95rem; }
.explain h4 { margin: 10px 0 4px; font-size: .85rem; color: var(--accent); }
.explain h4:first-child { margin-top: 0; }
.explain ul { margin: 4px 0; padding-left: 1.2em; }
.explain .ref { margin-top: 8px; font-size: .82rem; color: var(--ink-soft); }
.empty { color: var(--ink-soft); padding: 30px 0; text-align: center; }
.katex { font-size: 1.02em; }
@media (max-width: 560px) { body { font-size: 16px; } .q { padding: 14px 12px; } }
</style>
</head>

<h1>Deep Learning MCQ Final</h1>
<p class="sub">ข้อสอบทบทวน final Lesson 7-15 + โค้ดและ notebook ในห้อง ยากกว่าระดับข้อสอบจริงเพื่อฝึกความเข้าใจ · ลำดับข้อคงที่ ปิดแล้วกลับมาทำต่อได้ · ตอบแล้วเห็นผลทันที กด “ดูเฉลย” เมื่อไม่เข้าใจ · export ผลเป็น JSON ไปให้ AI วิเคราะห์ได้</p>

75, 1.0", "1.0, 0.75, 0.5, 0.25"], "answer": 3, "explanation": "<p>step_size = 1/4 · diffusion_times = 1 − step × 0.25 เริ่มจาก noise ล้วนที่ t = 1 แล้วถอยลง</p>", "ref": "Lesson 14 §5.2", "code": "step_size = 1.0 / diffusion_steps\nfor step in range(diffusion_steps):\n    diffusion_times = tf.ones((num_images, 1, 1, 1)) - step * step_size", "why_wrong_map": ["เดินหน้าแทนถอยหลัง", "ใช้ step 0.2", "ไม่ได้เริ่มที่ 1", ""]}, {"id": "L8-15", "lesson": 8, "topic": "top-5 error", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "จับคู่ข้อใดถูกตามตาราง ILSVRC", "options": ["VGG 16 layers top-5 error 15.3%", "AlexNet 8 layers top-5 error 4.49%", "GoogLeNet 22 layers top-5 error 6.67%", "ResNet-152 top-5 error 7.3%"], "answer": 2, "explanation": "<p>AlexNet 8 / 15.3% · VGG 16 / 7.3% · GoogLeNet 22 / 6.67% · ResNet-152 152 / 4.49%</p>", "ref": "Lesson 8 §1.1", "why_wrong_map": ["15.3% เป็นของ AlexNet", "4.49% เป็นของ ResNet", "", "7.3% เป็นของ VGG"]}, {"id": "L14-06", "lesson": 14, "topic": "noise variance รวม", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "α₁ = 0.8 α₂ = 0.5 variance ของ noise ที่สะสมใน x₂ เท่าใด", "options": ["0.3", "0.7", "0.4", "0.6"], "answer": 3, "explanation": "<p>ᾱ₂ = 0.4 · noise รวม 1 − 0.4 = 0.6 ตรวจทีละขั้น: 0.5(1 − 0.8) + (1 − 0.5) = 0.1 + 0.5 = 0.6</p>", "ref": "Lesson 14 §2.3", "why_wrong_map": ["ลืมขั้นที่ 2", "ไม่ลดส่วนแรก", "นั่นคือ ᾱ", ""]}, {"id": "L11-21", "lesson": 11, "topic": "บวกไม่ใช่ต่อ", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "token embedding 512 มิติรวมกับ positional embedding อย่างไร ได้กี่มิติ", "options": ["ต่อกัน ได้ 513", "ต่อกัน ได้ 1,024", "บวกกัน ได้ 512", "คูณทีละมิติ ได้ 512"], "answer": 2, "explanation": "<p>The embeddings consist of two components that are combined through addition มิติจึงเท่าเดิม</p>", "ref": "Lesson 11 §5.1", "why_wrong_map": ["ไม่ได้เพิ่มเลขตำแหน่ง 1 มิติ", "ไม่ได้ต่อ", "", "ไม่ได้คูณ"]}, {"id": "L13-24", "lesson": 13, "topic": "di onnected layer ทำ classification · output layer ให้ความน่าจะเป็น</p>", "ref": "Lesson 7 §1.3", "why_wrong_map": ["input แค่รับภาพ", "", "pooling ลดขนาด", "conv สกัด feature"]}, {"id": "L7-27", "lesson": 7, "topic": "augmentation ทำงานเมื่อไร", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "data augmentation ที่เป็น preprocessing layer ในโมเดลทำงานตอนใด", "options": ["ทุกครั้งที่ predict เพื่อให้ผลทายสุ่มต่างกัน", "ตอนเทรนเท่านั้น ตอน predict ภาพผ่านไปไม่ถูกแปลง", "ครั้งเดียวก่อนเทรน แล้วเก็บภาพใหม่ลงดิสก์ถาวร", "เฉพาะตอน evaluate เพื่อทดสอบความทนของโมเดล"], "answer": 1, "explanation": "<p>augmentation layer สุ่มแปลงภาพใหม่ทุก batch ระหว่างเทรน ไม่ได้สร้าง dataset ใหม่ถาวร ตอน inference เป็น identity</p>", "ref": "Lesson 7 §6.5", "why_wrong_map": ["inference ไม่สุ่ม", "", "สไลด์บอกว่า not permanently create and store", "ไม่ทำตอน evaluate"]}, {"id": "L7-13", "lesson": 7, "topic": "pooling มี parameter ไหม", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "MaxPooling2D(2) มี parameter ให้เรียนกี่ตัว", "options": ["1", "เท่ากับจำนวน channel", "4", "0"], "answer": 3, "explanation": "<p>pooling เลือกค่าสูงสุดในหน้าต่าง ไม่มี weight หรือ bias pool size และ stride เป็น hyperparameter</p>", "ref": "Lesson 7 §5.1", "why_wrong_map": ["ไม่มี bias", "pooling ทำทีละ channel แต่ไม่มี parameter", "หน้าต่าง 2×2 ไม่ใช่ weight", ""]}, {"id": "L8-20", "lesson": 8, "topic": "สามแนวทาง transfer", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "แนวทางใดล็อก feature extractor ทั้งหมดแล้วเทรน classifier ใหม่จากศูนย์", "options": ["fine tuning บางส่วนของ conv base", "pretrained model as feature detector", "train from scratch ทั้งโมเดลใหม่", "pretrained model as a classifier"], "answer": 1, "explanation": "<p>feature detector: freeze a feature extractor part แล้ว add a new classifier ที่ train from scratch · classifier ใช้ตรงๆ ไม่เทรน · fine tuning ล็อกแค่บางส่วน</p>", "ref": "Lesson 8 §5.1", "why_wrong_map": ["ล็อกแค่บางส่วน", "", "ไม่ได้ใช้ pretrained weight", "ไม่เทรนอะไรเลย"]}, {"id": "L10-28", "lesson": 10, "topic": "Bi-LSTM IMDB parameter", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "Embedding(10000, 64) → Bidirectional(LSTM(16)) → Dense(1, sigmoid) มี parameter รวมเท่าใด", "options": ["650,401", "645,217", "640,033", "650,368"], "answer": 0, "explanation": "<p>Embedding 10,000 × 64 = 640,000 · LSTM ทิศเดียว m = 64: 4 × [16·80 + 16] = 5,184 · สองทิศ 10,368 · output ยาว 32 · Dense 32 + 1 = 33 · รวม 650,401</p>", "ref": "Lesson 10 §6.2", "why_wrong_map": ["", "คิด LSTM ทิศเดียว", "ลืม LSTM", "ลืม Dense"]}, {"id": "L8-01", "lesson": 8, "topic": "LeNet-5", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "LeNet-5 conv ชั้นที่สองใช้ 16 filter ขนาด 5×5 กับ input 14×14×6 มี parameter เท่าใด", "options": ["2,400", "1,216", "2,416", "416"], "answer": 2, "explanation": "<p>(5·5·6 + 1)·16 = 151·16 = 2,416 ขนาด 14×14 ไม่อยู่ในสูตร</p>", "ref": "Lesson 8 §1.2", "why_wrong_map": ["ลืม bias", "ใช้ filter 8 ตัว", "", "ลืม channel 6"]}, {"id": "L8-14", "lesson": 8, "topic": "ตารางเปรียบเทียบ", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "จากตาราง comparison สถาปัตยกรรมใดมี parameter มากที่สุด", "options": ["Inception 6.4M", "VGGNet 138M", "AlexNet 62M", "ResNet-152 60.3M"], "answer": 1, "explanation": "<p>VGG มี 138M เพราะ FC ใหญ่ ทั้งที่ใช้ 3×3 ส่วน Inception น้อยที่สุด 6.4M ResNet-152 ลึกเกือบ 10 เท่าของ VGG16 แต่ parameter ไม่ถึงครึ่ง</p>", "ref": "Lesson 8 §3.3", "why_wrong_map": ["น้อยที่สุด", "", "62M น้อยกว่า 138M", "ลึกสุดไม่ใช่ parameter มากสุด"]}, {"id": "L10-09", "lesson": 10, "topic": "vanishing", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ตัวคูณ gradient ต่อ step 0.5 ย้อนไป 10 step เหลือประมาณเท่าใด", "options": ["0.001", "0.1", "0.5", "0.05"], "answer": 0, "explanation": "<p>0.5¹⁰ = 1/1024 ≈ 0.001 สัญญาณจากอดีตไกลแทบหาย</p>", "ref": "Lesson 10 §2.3", "why_wrong_map": ["", "ยกกำลังผิด", "ไม่ยกกำลัง", "คูณ 0.5 กับ 0.1"]}, {"id": "L15-10", "lesson": 15, "topic": "tool แก้ข้อจำกัด LLM", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "LLM คำนวณตัวเลขไม่น่าเชื่อถือ ตารางหน้า 14 แนะนำให้แก้อย่างไร", "options": ["ดึงข้อมูลปัจจุบันจากระบบภายนอกผ่าน API", "query ฐานข้อมูลลูกค้าด้วย tool เฉพาะ", "รันฟังก์ชัน Python แบบ deterministic เป็น tool", "เพิ่ม temperature ให้โมเดลลองหลายคำตอบ"], "answer": 2, "explanation": "<p>numerical calculations may be unreliable → execute deterministic Python functions</p>", "ref": "Lesson 15 §2.2", "why_wrong_map": ["แก้ความรู้ที่เก่า", "แก้การเข้าถึงข้อมูลส่วนตัว", "", "ไม่ได้ช่วยความแม่นยำ"]}, {"id": "L10-11", "lesson": 10, "topic": "GRU Γu = 0", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "GRU ที่ Γ_u = 0 ทุก step มีผลอย่างไร", "options": ["memory ถูกแทนด้วย input ล่าสุดทุก step", "memory ถูกลบเป็นศูนย์ทุก step ที่ผ่านไป", "คัดลอก memory ต่อไม่เปลี่ยน gradient จึงไม่หาย", "เกิด exploding gradient ขึ้นทันทีในการเทรน"], "answer": 2, "explanation": "<p>c⟨t⟩ = 0·c̃ + 1·c⟨t−1⟩ ค่าเดิมผ่านไปตรงๆ ไม่ผ่าน tanh ไม่คูณ weight gradient ตามเส้นทางนี้ถูกคูณด้วย 1</p>", "ref": "Lesson 10 §3.1", "why_wrong_map": ["นั่นคือ Γ_u = 1", "ศูนย์คือไม่เขียนใหม่ ไม่ใช่ลบ", "", "ตัวคูณ 1 ไม่ระเบิด"]}, {"id": "L15-08", "lesson": 15, "topic": "foundation model ทำอะไร", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดไม่ใช่หน้าที่ของ foundation model ใน agent ตามตารางหน้า 12", "options": ["รัน get_refund_status() และอ่านฐานข้อมูลเอง", "สร้าง parameter เช่นดึง customer ID", "เข้าใจเจตนาของคำขอที่ลูกค้าพิมพ์มา", "เลือก tool ที่เหมาะกับคำขอจากรายการ"], "answer": 0, "explanation": "<p>โมเดลสร้าง tool call แบบมีโครงสร้าง orchestration layer ตีความแล้วรันฟังก์ชันจริง</p>", "ref": "Lesson 15 §2.1", "why_wrong_map": ["", "เป็นหน้าที่", "เป็นหน้าที่", "เป็นหน้าที่"]}, {"id": "L11-06", "lesson": 11, "topic": "sample_next", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "โค้ดนี้ temperature=0.01 กับ predictions [0.2, 0.5, 0.1, 0.2] คืนค่าอะไรเกือบทุกครั้ง", "options": ["0", "3", "1", "สุ่มเท่าๆ กันทั้ง 0–3"], "answer": 2, "explanation": "<p>หาร log ด้วย 0.01 เท่ากับยกกำลัง 100 ตัวที่ 0.5 กลบตัวอื่นหมด multinomial ได้ one-hot [[0 1 0 0]] argmax = 1</p>", "ref": "Lesson 11 §1.2", "code": "def sample_next(predictions, temperature=1.0):\n    predictions = np.asarray(predictions).astype(\"float64\")\n    predictions = np.log(predictions) / temperature\n    exp_preds = np.exp(predictions)\n    predictions = exp_preds / np.sum(exp_preds)\n    probas = np.random.multinomial(1, predictions, 1)\n    return np.argmax(probas)", "why_wrong_map": ["index 0 คือ 0.2", "index 3 คือ 0.2", "", "นั่นคือ T สูงมาก"]}, {"id": "L10-30", "lesson": 10, "topic": "TF-IDF vs sequence", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ผลบน IMDB ของอาจารย์บอกอะไร", "options": ["bigram TF-IDF 0.892 ชนะ Bi-LSTM 0.882", "ทั้งสองวิธีได้ accuracy เท่ากันพอดี", "TF-IDF เป็น dense representation จึงเร็ว", "Bi-LSTM ชนะเพราะเห็นลำดับคำครบทุกคำ"], "answer": 0, "explanation": "<p>สำหรับ sentiment ของรีวิว การมีบางคำบอกคำตอบได้มากแล้ว Bi-LSTM ยัง overfit training loss 0.02 test loss 0.298 TF-IDF ยังเป็น sparse</p>", "ref": "Lesson 10 §6.2", "why_wrong_map": ["", "ต่างกัน 0.01", "TF-IDF เป็น sparse", "ตัวเลขกลับกัน"]}, {"id": "L8-30", "lesson": 8, "topic": "Swin downsampling", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "Swin Transformer ใช้อะไรลดขนาดเชิงพื้นที่ระหว่าง stage", "options": ["Stride 2 convolution", "ไม่มีการลดขนาด", "Patch Merging", "Max pooling"], "answer": 2, "explanation": "<p>ตาราง CNN vs ViT vs Swin: downsampling ของ Swin คือ Patch Merging ได้ 56 → 28 → 14 → 7 channel 96 → 192 → 384 → 768</p>", "ref": "Lesson 8 §6.2", "why_wrong_map": ["Swin ไม่ใช้ conv", "นั่นคือ ViT ดั้งเดิม", "", "เป็นของ CNN"]}, {"id": "L7-24", "lesson": 7, "topic": "output layer", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "งานจำแนก MNIST 10 คลาส label เป็นเลข 0–9 ไม่ได้ one-hot ควรใช้ output และ loss อะไร", "options": ["Dense(10, relu) + mean_squared_error", "Dense(10, softmax) + sparse_categorical_crossentropy", "Dense(10, softmax) + categorical_crossentropy", "Dense(1, sigmoid) + binary_crossentropy"], "answer": 1, "explanation": "<p>10 คลาสใช้ softmax 10 node label เป็น integer จึงใช้ sparse_categorical_crossentropy ถ้า label เป็น one-hot จึงใช้ categorical_crossentropy</p>", "ref": "Lesson 7 §6.4", "why_wrong_map": ["regression loss ไม่ใช่ classification", "", "categorical ต้องการ label one-hot", "binary ใช้กับ 2 คลาส"]}, {"id": "L10-06", "lesson": 10, "topic": "unrolled", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "แผนภาพ RNN unrolled สาม step หมายถึงอะไร", "options": ["RNN ตัวเดียววาดซ้ำตามเวลา ใช้ weight ชุดเดียว", "สามโมเดลที่เทรนแยกกันแล้วนำผลมาเฉลี่ย", "RNN สาม layer ซ้อนกันที่ weight ต่างกัน", "สาม batch ที่ป้อนเข้าโมเดลพร้อมกันในรอบเดียว"], "answer": 0, "explanation": "<p>unrolled คือวาด cell เดียวกันที่เวลาต่างกัน ไม่ใช่ layer ซ้อน</p>", "ref": "Lesson 10 §1.3", "why_wrong_map": ["", "ไม่ใช่ ensemble", "ไม่ใช่ deep RNN", "ไม่ใช่ batch"]}, {"id": "L7-02", "lesson": 7, "topic": "parameter ของ dense กับภาพ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ภาพสี 64×64 flatten แล้วเข้า Dense 100 node มี parameter เท่าใด", "options": ["1,228,900", "1,228,800", "12,388", "409,700"], "answer": 0, "explanation": "<p>input = 64 × 64 × 3 = 12,288 ค่า · weight = 12,288 × 100 = 1,228,800 · บวก bias 100 ได้ 1,228,900</p>", "ref": "Lesson 7 §1.2", "why_wrong_map": ["", "ลืม bias 100 ตัว", "บวกแทนการคูณกับจำนวน node", "ลืมคูณ 3 channel คิดแบบ grayscale"]}, {"id": "L14-15", "lesson": 14, "topic": "ประมาณ x̂₀", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "x_t = 1.2 noise_rate = 0.6 signal_rate = 0.8 โมเดลทาย ε̂ = 1 ค่า x̂₀ เท่าใด", "options": ["1.5", "0.96", "0.6", "0.75"], "answer": 3, "explanation": "<p>x̂₀ = (x_t − noise_rate·ε̂)/signal_rate = (1.2 − 0.6)/0.8 = 0.75</p>", "ref": "Lesson 14 §5.1", "why_wrong_map": ["บวกแทนลบ", "คูณแทนหาร", "ลืมหาร signal", ""]}, {"id": "L10-17", "lesson": 10, "topic": "clipping", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "gradient [9, 12] clip ด้วย norm 5 ได้อะไร", "options": ["[4.5, 6]", "[9, 12]", "[5, 5]", "[3, 4]"], "answer": 3, "explanation": "<p>norm = √(81 + 144) = 15 · คูณ 5/15 = 1/3 ได้ [3, 4] ทิศเดิม</p>", "ref": "Lesson 10 §4.1", "why_wrong_map": ["หารสอง", "ไม่ clip", "ตัดทีละค่า ทิศเปลี่ยน", ""]}, {"id": "L9-14", "lesson": 9, "topic": "Grad-CAM alpha", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "gradient ของ channel หนึ่ง 2×2 คือ [[0.5, −0.1], [0.3, 0.1]] alpha เท่าใด", "options": ["0.2", "0.25", "0.5", "0.8"], "answer": 0, "explanation": "<p>alpha คือค่าเฉลี่ยของ gradient ทั้งแผ่น (0.5 − 0.1 + 0.3 + 0.1)/4 = 0.8/4 = 0.2</p>", "ref": "Lesson 9 §3.3", "why_wrong_map": ["", "หาร 3.2", "ค่าสูงสุด", "ผลรวม ไม่ใช่ค่าเฉลี่ย"]}, {"id": "L7-01", "lesson": 7, "topic": "Dense กับภาพ", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "เหตุผลสองข้อที่สไลด์ให้ว่าทำไมไม่ใช้ dense network กับภาพคืออะไร", "options": ["dense network เทรนด้วย backprop ไม่ได้ และภาพมีค่าเกิน 1", "dense network ใช้ activation ไม่ได้ และภาพสีมีหลาย channel เกินไป", "parameter น้อยเกินไปจึง underfit และภาพต้องเป็น grayscale เท่านั้น", "parameter โตตามขนาดภาพ และ flatten แล้วความสัมพันธ์เชิงตำแหน่งหาย"], "answer": 3, "explanation": "<p>สไลด์หน้า 4 ให้สองข้อ: computational complexity เพราะ weight ชั้นแรก = จำนวน pixel × จำนวน node ซึ่งโตตามพื้นที่ภาพ และ loss of spatial information เพราะ flatten แล้ว pixel ที่ติดกันในแนวตั้งถูกแยกห่างกัน</p>", "ref": "Lesson 7 §1.2", "why_wrong_map": ["dense เทรนด้วย backprop ได้ และค่าภาพ normalize ได้", "dense ใช้ activation ได้ปกติ ปัญหาไม่ใช่จำนวน channel", "ปัญหาคือ parameter มากเกิน ไม่ใช่น้อยเกิน", ""]}, {"id": "L11-25", "lesson": 11, "topic": "multi , "options": ["1.20", "0.80", "0.85", "0.90"], "answer": 1, "explanation": "<p>BPTT บวก gradient ทุก step = 0.4 · W_a = 1.0 − 0.5 × 0.4 = 0.80</p>", "ref": "Lesson 10 §2.2", "why_wrong_map": ["บวกแทนลบ", "", "หาร 4 ก่อน", "ใช้แค่ step แรก"]}, {"id": "L14-11", "lesson": 14, "topic": "loss", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "loss ของการเทรน diffusion ใน notebook ของคาบกับบนสไลด์ต่างกันอย่างไร", "options": ["ทั้งคู่ใช้ KL divergence ระหว่างรูปที่สร้างกับจริง", "notebook ใช้ MAE สไลด์ว่า MSE ทั้งคู่เทียบ noise", "notebook ใช้ cross-entropy สไลด์ใช้ KL divergence", "notebook ใช้ MSE ระหว่างรูปสะอาดกับรูปที่สร้าง"], "answer": 1, "explanation": "<p>ทั้งสองวัดความต่างระหว่าง ε̂ กับ ε จริง ต่างแค่ L1 กับ L2</p>", "ref": "Lesson 14 §3.2", "why_wrong_map": ["ไม่ใช่ VAE", "", "ไม่ใช่ classification", "เทียบ noise ไม่ใช่รูป"]}, {"id": "L15-13", "lesson": 15, "topic": "knowledge base vs memory vs state", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ประเภทปัญหาที่ classifier ตัดสินแล้ว เช่น billing ของคำขอที่กำลังทำอยู่ ควรอยู่ส่วนใด", "options": ["long-term memory", "tool definition", "state", "knowledge base"], "answer": 2, "explanation": "<p>state ติดตามข้อมูลของ workflow ปัจจุบันระหว่างขั้น เช่น issue_type tool results response knowledge base เก็บนโยบาย memory เก็บ interaction ที่ผ่านมา</p>", "ref": "Lesson 15 §2.3", "why_wrong_map": ["ข้าม session", "ไม่ใช่ข้อมูลระหว่างทำงาน", "", "เก็บนโยบาย"]}, {"id": "L14-14", "lesson": 14, "topic": "DownBlock", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "DownBlock ของ U-Net ในบทลดขนาดด้วยอะไร", "options": ["Conv2D strides=2", "MaxPooling2D", "AveragePooling2D", "Conv2DTranspose"], "answer": 2, "explanation": "<p>trap ของบท: DownBlock ใช้ AveragePooling2D ไม่ใช่ stride</p>", "ref": "Lesson 14 §4.2", "why_wrong_map": ["ไม่ใช่วิธีในบท", "ไม่ใช่ max", "", "ใช้ขยาย"]}, {"id": "L11-01", "lesson": 11, "topic": "language model target", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "เทรน language model จากประโยค 6 token x และ y สัมพันธ์กันอย่างไร", "options": ["y คือ x ที่เลื่อนไป 1 ตำแหน่ง ได้ 5 โจทย์ต่อประโยค", "y คือ x กลับลำดับ ได้ 6 โจทย์ต่อประโยค", "y คือ label แยกที่คนกำกับไว้ ได้ 1 โจทย์ต่อประโยค", "y คือ token สุดท้ายเท่านั้น ได้ 1 โจทย์ต่อประโยค"], "answer": 0, "explanation": "<p>x = vectorized[:, :-1] · y = vectorized[:, 1:] ทุก step มี target คือ token ถัดไป ประโยค 6 token ให้ 5 คู่</p>", "ref": "Lesson 11 §1.1", "why_wrong_map": ["", "ไม่ได้กลับลำดับ", "ไม่ต้องมี label แยก", "ทุก step มี target"]}, {"id": "L9-28", "lesson": 9, "topic": "confidence score", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "p_c = 0.8 class score ของ dog = 0.6 confidence ของ dog เท่าใด", "options": ["0.60", "0.80", "1.40", "0.48"], "answer": 3, "explanation": "<p>confidence = P(object) × class score = 0.8 × 0.6 = 0.48</p>", "ref": "Lesson 9 §6.2", "why_wrong_map": ["ลืมคูณ p_c", "ใช้แค่ p_c", "บวกแทนคูณ", ""]}, {"id": "L15-01", "lesson": 15, "topic": "นิยาม agentic AI", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดไม่อยู่ในนิยาม agentic AI บนสไลด์", "options": ["ใช้ tool และระบบภายนอกแล้วปรับ action ตามผล", "ให้เหตุผล วางแผน ตัดสินใจ และลงมือทำเพื่อเป้าหมาย", "มีความอิสระระดับหนึ่ง ลดการสั่งทุกขั้น", "ต้องทำงานโดยไม่มีคนดูแลเลยทุกกรณี"], "answer": 3, "explanation": "<p>สไลด์ย้ำว่า agent มีระดับความอิสระต่างกันได้ not every AI agent needs to operate independently of human supervision</p>", "ref": "Lesson 15 §1.1", "why_wrong_map": ["เป็นข้อสอง", "เป็นข้อแรกของนิยาม", "เป็นข้อสาม", ""]}, {"id": "L9-16", "lesson": 9, "topic": "Grad-CAM ชั้นไหน", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ทำไม Grad-CAM ใช้ feature map ของ conv layer ชั้นสุดท้าย", "options": ["สมดุลความหมายระดับสูงกับตำแหน่ง ชั้นถัดไปไม่มีตำแหน่ง", "เป็นชั้นเดียวที่มี gradient ไม่เป็นศูนย์ในโมเดล", "เป็นชั้นที่มีจำนวน parameter มากที่สุดในโมเดล", "มีขนาดเท่าภาพ input จึงไม่ต้อง up-sample เลย"], "answer": 0, "explanation": "<p>ผู้เขียน Grad-CAM ระบุว่า last convolutional layers have the best compromise between high-level semantics and detailed spatial information feature map ยังเล็กกว่าภาพจึงต้อง up-sample</p>", "ref": "Lesson 9 §3.3", "why_wrong_map": ["", "ชั้นอื่นก็มี gradient", "ไม่เกี่ยวกับจำนวน parameter", "ต้อง up-sample"]}, {"id": "L13-15", "lesson": 13, "topic": "KL ต่อมิติ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "KL ต่อมิติ = ½(σ² + μ² − 1 − log σ²) ถ้า μ = 1 σ = 1 มีค่าเท่าใด", "options": ["0", "0.5", "1", "2"], "answer": 1, "explanation": "<p>½(1 + 1 − 1 − 0) = 0.5</p>", "ref": "Lesson 13 §3.4", "why_wrong_map": ["นั่นคือ μ = 0", "", "ลืม ½", "μ = 2"]}, {"id": "L11-22", "lesson": 11, "topic": "self-attention ด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "self-attention ไม่มี projection v₁ = [1, 0] v₂ = [1, 0] v₃ = [0, 1] scale ด้วย √2 v₃ ใหม่ใกล้ค่าใด", "options": ["[0.42, 0.58]", "[0, 1]", "[0.67, 0.33]", "[0.50, 0.50]"], "answer": 3, "explanation": "<p>dot ของ v₃ กับทุกตัว: [0, 0, 1] หาร √2 = [0, 0, 0.707] · softmax: e⁰ = 1, 1, e^0.707 = 2.028 รวม 4.028 ได้ [0.248, 0.248, 0.503] · v₃ ใหม่ = 0.248[1,0] + 0.248[1,0] + 0.503[0,1] ≈ [0.50, 0.50]</p>", "ref": "Lesson 11 §5.2", "why_wrong_map": ["ลืม scale ได้ softmax [0.21, 0.21, 0.58]", "คิดว่า v₃ ไม่ถูกผสมกับตัวอื่น", "สลับแกน", ""]}, {"id": "L15-02", "lesson": 15, "topic": "ระดับ agency", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ระบบที่ใช้ LLM จัดหมวดคำขอแล้วเดินตาม branch ที่นักพัฒนาเขียนไว้ จัดอยู่ระดับใด", "options": ["tool-using agent", "autonomous agent", "rule-based system", "AI workflow"], "answer": 3, "explanation": "<p>มี LLM ช่วยตัดสินแค่การจัดหมวด ลำดับงานยังกำหนดโดยนักพัฒนา rule-based ไม่มีโมเดล tool-using agent เลือก tool เอง autonomous วางแผนและปรับแผน</p>", "ref": "Lesson 15 §1.1", "why_wrong_map": ["workflow นี้ไม่ได้เลือก tool เอง", "ไม่ได้วางแผนหลายขั้น", "rule-based ไม่ใช้ LLM", ""]}, {"id": "L7-23", "lesson": 7, "topic": "MNIST model summary", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "โมเดลนี้มี parameter รวมเท่าใด", "options": ["347,136", "331,146", "347,146", "346,698"], "answer": 2, "explanation": "<p>Conv 28→26 parameter (9·1 + 1)·32 = 320 · pool 13 · flatten 13·13·32 = 5,408 · Dense(64) 5,408·64 + 64 = 346,176 · Dense(10) 64·10 + 10 = 650 · รวม 320 + 346,176 + 650 = 347,146</p>", "ref": "Lesson 7 §6.4", "code": "model = keras.Sequential([\n    keras.Input(shape=(28, 28, 1)),\n    keras.layers.Conv2D(32, 3, activation=\"relu\"),\n    keras.layers.MaxPooling2D(2),\n    keras.layers.Flatten(),\n    keras.layers.Dense(64, activation=\"relu\"),\n    keras.layers.Dense(10, activation=\"softmax\"),\n])", "why_wrong_map": ["ลืม bias ของ Dense(10)", "ใช้ flatten ผิด", "", "ลืม conv ได้เฉพาะ dense บางส่วน"]}, {"id": "L9-30", "lesson": 9, "topic": "DETR", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดตรงกับ DETR ดั้งเดิม", "options": ["ทำได้เร็วกว่า CNN detector ทุกตัวจึงมาแทนทั้งหมด", "มองเป็น set prediction ใช้ object query และไม่ต้องใช้ anchor หรือ NMS", "ใช้ anchor 9 ตัวที่ 3 scale และ NMS แบบ YOLOv3", "ใช้ selective search เสนอ ROI แล้วจำแนกด้วย Transformer"], "answer": 1, "explanation": "<p>DETR ทายเซตวัตถุครั้งเดียว แต่ละ query จับคู่วัตถุไม่ซ้ำ จึงไม่มีกรอบซ้ำให้ NMS สไลด์ย้ำว่า Transformer เป็นอีกทาง ไม่ได้มาแทน CNN detector</p>", "ref": "Lesson 9 §6.4", "why_wrong_map": ["สไลด์บอกว่าไม่ได้มาแทน", "", "นั่นคือ YOLOv3", "นั่นคือ R-CNN"]}, {"id": "L10-25", "lesson": 10, "topic": "Embedding layer", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "<code>Embedding(input_dim=8000, output_dim=50)</code> มี parameter เท่าใด และข้อความ 30 คำได้ output ต่อประโยคเท่าใด", "options": ["8,050 และ (30, 50)", "400,000 และ (30, 50)", "400,050 และ (50, 30)", "400,000 และ (30, 8000)"], "answer": 1, "explanation": "<p>matrix 8,000 × 50 = 400,000 ไม่มี bias · แต่ละคำได้ vector 50 มิติ</p>", "ref": "Lesson 10 §5.3", "why_wrong_map": ["บวกแทนคูณ", "", "ไม่มี bias และแกนสลับ", "นั่นคือ one-hot"]}, {"id": "L9-17", "lesson": 9, "topic": "target vector", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "detection 4 คลาส target ต่อกรอบยาวกี่ค่า", "options": ["9", "4", "8", "5"], "answer": 0, "explanation": "<p>p_c 1 + กรอบ 4 + one-hot 4 = 9 คือ 5 + K</p>", "ref": "Lesson 9 §4.1", "why_wrong_map": ["", "แค่คลาส", "ลืม p_c", "ลืมคลาส"]}, {"id": "L7-21", "lesson": 7, "topic": "Keras Conv2D", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "บรรทัดนี้สร้าง layer แบบใด", "options": ["conv 3 filter ขนาด 32×32 padding same", "conv 32 filter 3×3 padding valid เพราะไม่ระบุ stride", "conv 32 filter ขนาด 3×3 ที่ไม่มี bias", "conv 32 filter 3×3 padding same กว้างสูงเท่า input"], "answer": 3, "explanation": "<p>argument แรกคือจำนวน filter = 32 argument ที่สองคือ kernel_size = 3 padding='same' ทำให้ stride 1 ได้ขนาดเท่าเดิม Conv2D มี bias เป็นค่า default</p>", "ref": "Lesson 7 §6.3", "code": "keras.layers.Conv2D(32, 3, padding=\"same\", activation=\"relu\")", "why_wrong_map": ["สลับลำดับ argument", "ระบุ padding='same' ชัดเจนแล้ว", "use_bias default True", ""]}, {"id": "L7-30", "lesson": 7, "topic": "receptive field ตาม Hubel", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อค้นพบใดจาก visual cortex กลายเป็นหลักของ CNN", "options": ["neuron ตอบสนองบริเวณเล็ก และระดับสูงรวมผลระดับล่าง", "สมองประมวลภาพเป็นเส้นตรงทีละแถวจากบนลงล่าง", "neuron ทุกตัวเชื่อมกับทุก pixel ของลานสายตา", "สมองแยกสีก่อนเสมอแล้วจึงเห็นรูปร่างของวัตถุ"], "answer": 0, "explanation": "<p>Hubel &amp; Wiesel พบ local receptive field และ neuron ระดับสูงทำงานจาก output ของ neuron ระดับล่างที่อยู่ใกล้กัน CNN จึงต่อเฉพาะที่และซ้อนชั้นจาก feature ง่ายไปซับซ้อน</p>", "ref": "Lesson 7 §1.3", "why_wrong_map": ["", "ไม่ใช่การอ่านทีละแถว", "นั่นคือ dense", "ไม่ใช่ข้อค้นพบบนสไลด์"]}, {"id": "L9-02", "lesson": 9, "topic": "วงเล็บสองชุด", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "ใน <code>x = layers.Dense(32, activation='relu')(input_tensor)</code> วงเล็บชุดที่สองทำอะไร", "options": ["ระบุ activation function ของ layer", "กำหนดจำนวน node ของ layer นั้น", "เรียก layer บน tensor แล้วได้ tensor ใหม่", "กำหนด shape ของ input ทั้งโมเดล"], "answer": 2, "explanation": "<p>วงเล็บแรกสร้าง instance ของ layer วงเล็บที่สองเรียก layer เหมือนฟังก์ชันบน tensor จึงเรียก functional API</p>", "ref": "Lesson 9 §1.1", "why_wrong_map": ["activation อยู่วงเล็บแรก", "จำนวน node อยู่วงเล็บแรก", "", "shape อยู่ที่ Input"]}, {"id": "L15-14", "lesson": 15, "topic": "multi-agent cost", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดเป็นข้อเสียของ multi-agent เทียบ single-agent ตามตาราง", "options": ["เหมาะกับงานที่นิยามชัดและไม่ซับซ้อนเท่านั้น", "ต้องประสานระหว่าง agent และอาจเรียกโมเดลมากขึ้น", "แต่ละ agent จะถนัดงานเฉพาะด้านไม่ได้เลย", "overhead ในการประสานงานต่ำกว่า single-agent"], "answer": 1, "explanation": "<p>multi-agent: requires inter-agent coordination · may require more model calls · เหมาะกับงานซับซ้อนที่แยกย่อยได้</p>", "ref": "Lesson 15 §2.4", "why_wrong_map": ["นั่นคือ single-agent", "", "ถนัดเฉพาะได้", "กลับกัน"]}, {"id": "L13-27", "lesson": 13, "topic": "FID IS", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ทิศของตัวชี้วัด GAN ข้อใดถูก", "options": ["FID ยิ่งสูงยิ่งดี · Inception score ยิ่งต่ำยิ่งดี", "FID และ Inception score ยิ่งต่ำยิ่งดี", "FID และ Inception score ยิ่งสูงยิ่งดี", "FID ยิ่งต่ำยิ่งดี · Inception score ยิ่งสูงยิ่งดี"], "answer": 3, "explanation": "<p>FID เป็นระยะห่างจากรูปจริง ยิ่งน้อยยิ่งใกล้ · IS เป็นคะแนน ยิ่งมากยิ่งดี</p>", "ref": "Lesson 13 §5.2", "why_wrong_map": ["กลับทิศ", "IS ยิ่งสูงยิ่งดี", "FID เป็น distance", ""]}, {"id": "L9-20", "lesson": 9, "topic": "IoU แนวนอน", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "กรอบ A (0,0)–(6,2) กรอบ B (3,0)–(9,2) IoU เท่าใด", "options": ["2/3", "1/4", "1/3", "1/2"], "answer": 2, "explanation": "<p>A = 12 B = 12 ซ้อน x 3 ถึง 6 y 0 ถึง 2 = 6 · union 24 − 6 = 18 · 6/18 = 1/3</p>", "ref": "Lesson 9 §4.3", "why_wrong_map": ["สลับ", "หารด้วยผลรวมไม่ลบซ้อน", "", "หารด้วยพื้นที่กรอบเดียว"]}, {"id": "L9-25", "lesson": 9, "topic": "FC เป็น conv", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "feature 4×4×16 ต่อ FC 50 node แทนด้วย conv ใดที่ parameter เท่ากัน", "options": ["conv 1×1 จำนวน 50 filter", "conv 4×4 จำนวน 16 filter", "conv 3×3 จำนวน 50 filter", "conv 4×4 จำนวน 50 filter"], "answer": 3, "explanation": "<p>FC: 256·50 + 50 = 12,850 · conv 4×4 กับ 16 channel 50 filter: (16·16 + 1)·50 = 12,850 output 1×1×50 FC ชั้นแรกเท่ากับ conv ที่ kernel เท่าขนาด feature map</p>", "ref": "Lesson 9 §5.3", "why_wrong_map": ["1×1 ใช้แทน FC ชั้นถัดไป", "จำนวน filter ต้องเท่าจำนวน node", "kernel ไม่ครอบทั้ง feature map", ""]}, {"id": "L9-03", "lesson": 9, "topic": "parameter wide & deep", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "input_A 4 feature ไป concat ตรง input_B 10 feature ผ่าน Dense(20) สองชั้น แล้ว concat เข้า Dense(1) มี parameter รวมเท่าใด", "options": ["585", "640", "685", "665"], "answer": 3, "explanation": "<p>hidden1 10·20 + 20 = 220 · hidden2 20·20 + 20 = 420 · concat 4 + 20 = 24 · output 24 + 1 = 25 · รวม 665</p>", "ref": "Lesson 9 §1.2", "why_wrong_map": ["ใช้ hidden1 รับ input_A", "ลืม output layer", "คิด concat ยาว 44", ""]}, {"id": "L10-04", "lesson": 10, "topic": "ความยาวลำดับกับ parameter", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "SimpleRNN(16) กับลำดับยาว 10 เทียบลำดับยาว 100 จำนวน parameter เป็นอย่างไร", "options": ["ลำดับยาว 100 น้อยกว่าเพราะ gradient หาย", "ขึ้นกับ batch size ไม่ใช่ความยาวลำดับ", "ลำดับยาว 100 มีมากกว่าราว 10 เท่า", "เท่ากัน เพราะ weight ชุดเดียวใช้ทุก step"], "answer": 3, "explanation": "<p>W_a W_x W_y shared at each time step สูตร parameter ไม่มีความยาวลำดับ</p>", "ref": "Lesson 10 §1.3", "why_wrong_map ayer ก่อนหน้าให้ 16 ค่า latent 2 มิติ Dense z_mean และ z_log_var มี parameter รวมเท่าใด", "options": ["34", "68", "64", "136"], "answer": 1, "explanation": "<p>แต่ละตัว 16·2 + 2 = 34 · สองตัวแยกกัน 68</p>", "ref": "Lesson 13 §3.3", "why_wrong_map": ["นับตัวเดียว", "", "ลืม bias", "คูณซ้ำ"]}, {"id": "L10-20", "lesson": 10, "topic": "delay", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "sampling_rate = 6 sequence_length = 72 ทายอุณหภูมิ 12 ชั่วโมงหลังจุดสุดท้าย delay ตามสูตรของโค้ดเท่าใด", "options": ["83", "432", "504", "498"], "answer": 3, "explanation": "<p>delay = sampling_rate × (sequence_length + 12 − 1) = 6 × 83 = 498</p>", "ref": "Lesson 10 §4.4", "why_wrong_map": ["ลืมคูณ 6", "ลืม 12", "ลืม −1", ""]}, {"id": "L10-10", "lesson": 10, "topic": "GRU update", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "GRU simplified c̃ = 0.6 c⟨t−1⟩ = −0.4 Γ_u = 0.25 ค่า c⟨t⟩ เท่าใด", "options": ["0.15", "−0.45", "0.35", "−0.15"], "answer": 3, "explanation": "<p>Γ_u·c̃ + (1 − Γ_u)·c_prev = 0.25·0.6 + 0.75·(−0.4) = 0.15 − 0.30 = −0.15</p>", "ref": "Lesson 10 §3.1", "why_wrong_map": ["สลับเครื่องหมาย", "ใช้ Γ_u กับ c_prev", "ลืมคูณ c_prev ด้วย 0.75", ""]}, {"id": "L13-22", "lesson": 13, "topic": "label กลับด้าน", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "ในโค้ด DCGAN ของอาจารย์ <code>misleading_labels = ops.zeros((batch_size, 1))</code> เป็นศูนย์เพราะอะไร", "options": ["โหลดแบบโฟลเดอร์เดียว รูปจริงเป็น 0 ศูนย์จึงหมายถึงจริง", "ศูนย์ทำให้ gradient ของ discriminator เป็นศูนย์ไปด้วย", "generator ต้องการให้ discriminator ทายว่าเป็นของปลอม", "ใช้ศูนย์เพื่อปิดการทำ label smoothing ในจังหวะนี้"], "answer": 0, "explanation": "<p>โค้ดนี้กลับด้านจากทฤษฎี combined labels ให้รูปปลอมเป็น ones รูปจริงเป็น zeros หลักการเดิม: label ของ G คือ label ของรูปจริง</p>", "ref": "Lesson 13 §4.5", "why_wrong_map": ["", "อัปเดตเฉพาะ weight ของ G อยู่แล้ว", "G อยากให้ทายว่าจริง", "smoothing อยู่ที่บรรทัด +0.05 noise"]}, {"id": "L13-16", "les to_save=[\"pre_classifier\", \"classifier\"],\n)", "why_wrong_map": ["ไม่ใช่ส่วนเดียวที่ล็อก", "เทรนเต็มผ่าน modules_to_save", "", "ได้ LoRA"]}, {"id": "L12-28", "lesson": 12, "topic": "head parameter", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "head ที่มี pre_classifier 768 → 768 และ classifier 768 → 4 มี parameter เท่าใด", "options": ["593,668", "593,664", "3,076", "590,592"], "answer": 0, "explanation": "<p>(768·768 + 768) + (768·4 + 4) = 590,592 + 3,076 = 593,668</p>", "ref": "Lesson 12 §6.2", "why_wrong_map": ["", "ลืม bias ของ classifier", "นับแค่ classifier", "ลืม classifier"]}, {"id": "L8-18", "lesson": 8, "topic": "modern CNN", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "รุ่นใดใช้ compound scaling เพิ่ม depth, width, resolution ร่วมกัน", "options": ["MobileNet", "ConvNeXt", "EfficientNet", "DenseNet"], "answer": 2, "explanation": "<p>EfficientNet ของ Tan &amp; Le scale ทั้งสามมิติอย่างมีหลัก DenseNet คือ feature reuse MobileNet คือ depthwise separable เพื่อความเบา ConvNeXt คือ CNN ที่ได้แรงบันดาลใจจาก Transformer</p>", "ref": "Lesson 8 §4.1", "why_wrong_map": ["separable conv เพื่อมือถือ", "ปรับ ResNet ตาม Transformer", "", "dense connection"]}, {"id": "L10-24", "lesson": 10, "topic": "embedding analogy", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "embedding man = (1, 1) woman = (1, 3) king = (4, 1) คำที่ใกล้ king − man + woman ควรอยู่ที่จุดใด", "options": ["(1, 3)", "(4, −1)", "(4, 3)", "(6, 5)"], "answer": 2, "explanation": "<p>woman − man = (0, 2) เลื่อน king ไปทิศเดียวกันได้ (4, 3) แบบ Dog → Wolf ขนานกับ Cat → Tiger</p>", "ref": "Lesson 10 §5.3", "why_wrong_map": ["ไม่ได้บวก king", "ลบผิดทิศ", "", "บวกทุกค่า"]}, {"id": "L12-26", "lesson": 12, "topic": "torch.no_grad", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "ทำไม extract_hidden_states ครอบด้วย <code>with torch.no_grad():</code>", "options": ["ไม่ได้เทรน จึงปิด gradient ประหยัด memory", "เพื่อย้าย ten source": "lesson", "type": "concept", "difficulty": "medium", "stem": "รูปสูตร mean + std × ε ใน diffusion ต่างจาก VAE ที่จุดประสงค์อย่างไร", "options": ["diffusion ใช้กระโดด x₀ ไป x_t · VAE ใช้ให้ gradient ผ่าน μ σ", "diffusion ใช้ให้ gradient ผ่าน β · VAE ใช้รวม noise หลายขั้น", "ทั้งสองใช้สูตรนี้แทน loss function ระหว่างเทรน", "ทั้งสองใช้สูตรนี้เพื่อลดจำนวน parameter ของโมเดล"], "answer": 0, "explanation": "<p>รูปคล้ายกันแต่ใช้ต่างจุด diffusion กระโดดหลายขั้นเพื่อเทรนเร็ว VAE ทำให้การสุ่มหาอนุพันธ์ได้</p>", "ref": "Lesson 14 §2.3", "why_wrong_map": ["", "สลับ", "ไม่ใช่ loss", "ไม่ได้ลด parameter"]}, {"id": "L14-12", "lesson": 14, "topic": "U-Net skip", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "skip connection ข้ามฝั่ง encoder ไป decoder ของ U-Net ในบทรวมกันด้วยอะไร และต่างจากใน ResidualBlock อย่างไร", "options": ["ข้ามฝั่งใช้ Add · ResidualBlock ใช้ Concatenate", "ข้ามฝั่งใช้ Concatenate · ResidualBlock ใช้ Add", "ข้ามฝั่งและ ResidualBlock ใช้ Add ทั้งคู่", "ข้ามฝั่งและ ResidualBlock ใช้ Concatenate"], "answer": 1, "explanation": "<p>UpBlock ต่อ channel ชั่วคราว เช่น 16×16×128 ต่อ 16×16×96 ได้ 224 แล้ว ResidualBlock ลดลง ส่วน residual บวกตรง</p>", "ref": "Lesson 14 §4.2", "why_wrong_map": ["สลับ", "", "ข้ามฝั่งไม่ได้บวก", "residual ไม่ได้ต่อ"]}, {"id": "L9-21", "lesson": 9, "topic": "mAP", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "4 class มี AP = 0.9, 0.7, 0.6, 0.4 mAP เท่าใด", "options": ["0.90", "0.65", "0.60", "2.60"], "answer": 1, "explanation": "<p>(0.9 + 0.7 + 0.6 + 0.4)/4 = 2.6/4 = 0.65</p>", "ref": "Lesson 9 §4.3", "why_wrong_map": ["ค่าสูงสุด", "", "ใช้มัธยฐานผิด", "ผลรวม"]}, {"id": "L9-11", "lesson": 9, "topic": "loss เดียว", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "compile โมเดลสอง output ด้วย <code>loss=\"mse\"</code> ตัวเดียว เกิดอะไรขึ้น", "options": ["Keras ใช้ mse กับทั้งสอง output", "error เพราะต้องส่ง list ของ loss เสมอ", "ใช้ mse เฉลี่ยของสอง output เป็น output เดี ัด [:, :-1] และ [:, 1:] แล้วยาวเท่ากันทั้งคู่"], "answer": 3, "explanation": "<p>ฝั่งสเปนยาว 21 ตัดแล้วเหลือ 20 เท่าฝั่งอังกฤษ batch จึงมี shape (64, 20) ทุกตัว</p>", "ref": "Lesson 11 §2.2", "why_wrong_map": ["ไม่ใช่เหตุผลทางภาษา", "ไม่เกี่ยวกับ UNK", "encoder อ่านฝั่งอังกฤษ", ""]}, {"id": "L7-05", "lesson": 7, "topic": "filter คือ weight", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ใน CNN ค่าใน filter ได้มาอย่างไร", "options": ["สุ่มครั้งเดียวตอนเริ่มแล้วไม่เปลี่ยนอีกเลย", "เรียนจากข้อมูลด้วย backpropagation เหมือน weight ทั่วไป", "กำหนดเองด้วยมือ เช่น Sobel แล้วล็อกไว้ตลอดการเทรน", "คำนวณจากค่าเฉลี่ยของ pixel ใน training set"], "answer": 1, "explanation": "<p>filter คือ weight ที่เรียนได้ เริ่มจากค่าสุ่มแล้วปรับด้วย gradient เหมือน weight ของ dense filter แบบ Sobel เป็นแค่ตัวอย่างที่คนออกแบบเพื่อให้เห็นภาพ</p>", "ref": "Lesson 7 §2.3", "why_wrong_map": ["ถ้าไม่ปรับก็เรียนไม่ได้", "", "Sobel เป็นตัวอย่างอธิบาย CNN ไม่ล็อก filter", "ไม่มีขั้นตอนเฉลี่ย pixel เพื่อสร้าง filter"]}, {"id": "L15-24", "lesson": 15, "topic": "ThreadPoolExecutor", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "tool สามตัวรอ I/O ตัวละ 1 วินาที รันด้วย <code>ThreadPoolExecutor(max_workers=1)</code> ใช้เวลาประมาณเท่าใด", "options": ["1 วินาที", "6 วินาที", "3 วินาที", "0.33 วินาที"], "answer": 2, "explanation": "<p>worker เดียวรันทีละงาน เท่ากับ sequential 3 × 1 = 3 วินาที max_workers=3 จึงได้ราว 1 วินาทีแบบใน lab</p>", "ref": "Lesson 15 §4.3", "why_wrong_map": ["ต้อง 3 worker", "เกินจริง", "", "เร็วกว่าตัวช้าสุดไม่ได้"]}, {"id": "L14-30", "lesson": 14, "topic": "diffusion vs GAN", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "จุดเด่นของ diffusion เทียบ GAN ตามแนวบทเรียนคืออะไร", "options": ["สร้างรูปเร็วกว่า GAN เพราะ forward เพียงครั้งเดียว", "เทรนเสถียรด้วยการทาย noise แต่สร้างรูปช้าเพราะหลายขั้น", "เสี่ยง mode collapse มากกว่า GAN เพราะไม่มีคนตรวจ", "ไม่ต้องมี network ใดเลยในการสร้างรูปจาก noise"], "answer": 1, "explanation": "<p>diffusion เทรนแบบ regression ของ noise ไม่ต้องแข่งสองฝ่าย ข้อเสียคือ sampling หลายสิบถึงหลายร้อยขั้น</p>", "ref": "Lesson 14 §5", "why_wrong_map": ["sampling หลายขั้น", "", "mode collapse เป็นปัญหาเด่นของ GAN", "ต้องมี U-Net"]}, {"id": "L12-16", "lesson": 12, "topic": "cosine similarity", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "q = [1, 0, 1] d₁ = [1, 0, 0] d₂ = [1, 1, 1] cosine ของ d₁ และ d₂ ประมาณเท่าใด", "options": ["0.5 และ 0.667", "0.707 และ 0.816", "1 และ 2", "0.707 และ 0.577"], "answer": 1, "explanation": "<p>cos(q, d₁) = 1/(√2 · 1) = 0.707 · cos(q, d₂) = 2/(√2 · √3) = 0.816</p>", "ref": "Lesson 12 §4.2", "why_wrong_map": ["หารผิด", "", "ใช้ dot product ไม่ normalize", "หาร √3 อย่างเดียว"]}, {"id": "L13-06", "lesson": 13, "topic": "output layer AE", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "decoder ของ autoencoder Fashion MNIST ที่ pixel อยู่ในช่วง 0–1 ควรจบด้วยอะไร", "options": ["Conv2D(3, 3, tanh) กับ hinge loss ต่อ pixel", "Conv2D(1, 3, relu) กับ categorical cross-entropy", "Conv2D(1, 3, sigmoid, same) กับ binary cross-entropy", "Dense(10, softmax) กับ sparse categorical"], "answer": 2, "explanation": "<p>sigmoid ให้ค่า 0–1 ตรงกับ pixel ที่ normalize ภาพ grayscale มี 1 channel loss เป็น binary cross-entropy ต่อ pixel</p>", "ref": "Lesson 13 §2.3", "why_wrong_map": ["ภาพ grayscale 1 channel", "relu ไม่จำกัดบน และไม่ใช่ multiclass", "", "ไม่ใช่การจำแนก"]}, {"id": "L7-14", "lesson": 7, "topic": "max pooling ด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "max pooling 2×2 stride 2 บน [[1,3,2,0],[4,2,1,5],[0,1,3,2],[2,6,1,1]] ได้ผลอะไร", "options": ["[[3,5],[6,3]]", "[[4,5],[6,2]]", "[[2.5,2],[2.25,1.75]]", "[[4,5],[6,3]]"], "answer": 3, "explanation": "<p>มุมซ้ายบน max(1,3,4,2) = 4 · ขวาบน max(2,0,1,5) = 5 · ซ้ายล่าง max(0,1,2,6) = 6 · ขวาล่าง max(3,2,1,1) = 3</p>", "ref": "Lesson 7 §5.1", "why_wrong_map": ["ซ้ายบนลืม 4", "ขวาล่างเลือกค่าผิด", "นั่นคือ average pooling", ""]}, {"id": "L7-03", "lesson": 7, "topic": "convolution ด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "patch 3×3 คือ [[1,2,0],[0,1,3],[2,1,1]] filter คือ [[1,0,−1],[1,0,−1],[1,0,−1]] ผล convolution ตำแหน่งนี้เท่าใด", "options": ["−4", "3", "−1", "1"], "answer": 2, "explanation": "<p>filter = คอลัมน์ซ้าย × 1 + คอลัมน์ขวา × (−1) · คอลัมน์ซ้าย 1 + 0 + 2 = 3 · คอลัมน์ขวา 0 + 3 + 1 = 4 · 3 − 4 = −1</p>", "ref": "Lesson 7 §2.1", "why_wrong_map": ["รวมเฉพาะคอลัมน์ขวาแล้วติดลบ", "รวมคอลัมน์กลางเข้าไปด้วย", "", "กลับเครื่องหมาย คิดขวาลบซ้าย"]}, {"id": "L15-11", "lesson": 15, "topic": "tool ที่แก้ไขระบบ", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "cancel_order ต่างจาก get_order_status ในแง่การออกแบบอย่างไร", "options": ["เปลี่ยนระบบภายนอก จึงต้องอนุญาตและตรวจเข้มกว่า", "ต้องรันพร้อมกันกับ tool อื่นทุกครั้งเสมอ", "ไม่ต้องตรวจ argument เพราะ LLM เลือกแล้ว", "ต้องใช้ embedding ในการเลือก tool เท่านั้น"], "answer": 0, "explanation": "<p>Tools that modify external systems generally require stronger authorization and validation than read-only tools</p>", "ref": "Lesson 15 §2.2", "why_wrong_map": ["", "ไม่เกี่ยว topology", "ต้องตรวจเสมอ", "ไม่เกี่ยว selection strategy"]}, {"id": "L10-29", "lesson": 10, "topic": "masking", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "<code>Embedding(10, 8, mask_zero=True).compute_mask([[3, 5, 0, 0]])</code> ได้อะไร", "options": ["[[False, False, True, True]]", "[[1, 1, 1, 1]]", "[[True, True, False, False]]", "[[3, 5]]"], "answer": 2, "explanation": "<p>mask_zero=True ถือว่า 0 คือ padding True คือ token จริง False คือตำแหน่งที่ข้าม</p>", "ref": "Lesson 10 §6.3", "why_wrong_map": ["กลับค่า", "ไม่ได้ mask", "", "mask ไม่ได้ตัด token"]}, {"id": "L15-28", "lesson": 15, "topic": "LLM ในเชนตัดสินสิทธิ์ไหม", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "ใน customer_support_chain ใครตัดสินว่า refund_eligible เป็น True", "options": ["StrOutputParser แปลงผลลัพธ์ให้เป็น True", "check_refund_eligibility ตามกฎ 14 วัน LLM แค่อธิบาย", "PromptTemplate คำนวณจาก days_since_delivery", "LLM อ่าน prompt แล้วตัดสินสิทธิ์ด้วยตัวเอง"], "answer": 1, "explanation": "<p>notebook ระบุว่า LLM explains the computed decision; it does not determine eligibility กฎอยู่ในโค้ด deterministic</p>", "ref": "Lesson 15 §5.2", "why_wrong_map": ["parser แปลงเป็น string", "", "template แค่เติมข้อความ", "LLM แค่อธิบาย"]}, {"id": "L9-22", "lesson": 9, "topic": "NMS", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "class car มีกรอบ 0.9, 0.85, 0.6 confidence threshold 0.7 IoU ของ 0.85 กับ 0.9 คือ 0.3 NMS threshold 0.5 เหลือกรอบใด", "options": ["0.9 เท่านั้น", "0.9, 0.85, 0.6", "0.9 และ 0.85", "0.85 และ 0.6"], "answer": 2, "explanation": "<p>ทิ้ง 0.6 เพราะต่ำกว่า 0.7 · เลือก 0.9 · 0.85 มี IoU 0.3 ต่ำกว่า 0.5 จึงไม่ถูก suppress ถือเป็นอีกคัน</p>", "ref": "Lesson 9 §4.2", "why_wrong_map": ["suppress ทั้งที่ IoU ต่ำ", "ลืม confidence threshold", "", "ทิ้งกรอบสูงสุด"]}, {"id": "L8-29", "lesson": 8, "topic": "Swin cost", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "feature map 32×32 = 1,024 patch window 8×8 = 64 patch Swin คิดกี่คู่ เทียบ global attention", "options": ["65,536 เทียบ 1,048,576", "65,536 เทียบ 1,024", "4,096 เทียบ 1,048,576", "16 เทียบ 1,048,576"], "answer": 0, "explanation": "<p>window = 1,024/64 = 16 · คู่ต่อ window 64² = 4,096 · รวม 16 × 4,096 = 65,536 · global 1,024² = 1,048,576 ถูกกว่า 16 เท่า</p>", "ref": "Lesson 8 §6.2", "why_wrong_map": ["", "global ไม่ใช่ 1,024", "นับ window เดียว", "นับจำนวน window"]}, {"id": "L14-09", "lesson": 14, "topic": "cosine schedule", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "offset cosine schedule ที่ signal_rate = 0.6 noise_rate เท่าใด", "options": ["0.6", "0.8", "0.4", "0.36"], "answer": 1, "explanation": "<p>signal = cos θ noise = sin θ จึง signal² + noise² = 1 · noise = √(1 − 0.36) = 0.8</p>", "ref": "Lesson 14 §2.4", "why_wrong_map": ["เท่ากัน", "", "คิดว่ารวมกันเป็น 1", "ยกกำลังสองผิด"]}, {"id": "L7-08", "lesson": 7, "topic": "same padding", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "filter 7×7 stride 1 ต้อง pad ข้างละกี่ช่องให้ output เท่า input", "options": ["7", "3", "6", "1"], "answer": 1, "explanation": "<p>same: p = (f − 1)/2 = (7 − 1)/2 = 3 เพื่อให้ n + 2p − f + 1 = n</p>", "ref": "Lesson 7 §3.2", "why_wrong_map": ["เท่าขนาด filter", "", "รวมทั้งสองข้างแล้ว ไม่ใช่ข้างละ", "ใช้ได้กับ filter 3×3 เท่านั้น"]}, {"id": "L11-12", "lesson": 11, "topic": "sampled softmax", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ทำไมใช้ sampled softmax ได้แค่ตอนเทรน", "options": ["ตอนเทรนไม่ต้องใช้ softmax เลยตลอดการเทรน", "ต้องรู้คำที่ถูกเพื่อเลือก logit แต่ inference ไม่รู้", "sampled softmax ช้ากว่า softmax ปกติทุกกรณี", "ตอน inference vocabulary จะเล็กลงเองโดยอัตโนมัติ"], "answer": 1, "explanation": "<p>sampled softmax ดู logit ของคำที่ถูกกับคำผิดที่สุ่มมา จึงต้องรู้คำที่ถูก ตอน inference ต้องคำนวณ softmax ทั้ง vocabulary</p>", "ref": "Lesson 11 §3.1", "why_wrong_map": ["ยังใช้ softmax โดยประมาณ", "", "มันเร็วกว่า", "vocabulary คงเดิม"]}, {"id": "L12-03", "lesson": 12, "topic": "สไลด์ 99.89%", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "สไลด์หน้า 14 แสดง logit [−4.3630, 4.6859] และพิมพ์ POSITIVE 99.89% ข้อใดถูก", "options": ["99.89% ถูกเพราะเป็นค่า score ก่อนผ่าน softmax", "softmax ได้ราว 99.99% ตัวเลขบนสไลด์คลาดเคลื่อน", "logit ต้องผ่าน sigmoid แยกตัวจึงได้ 99.89%", "99.89% ถูกเพราะ softmax หารด้วยจำนวนคลาสด้วย"], "answer": 1, "explanation": "<p>ผลต่าง 9.0489 · P(NEG) = 1/(1 + e^9.0489) ≈ 0.000118 · P(POS) ≈ 99.99% ถ้าจะได้ 99.89% ผลต่างต้องราว 6.8 ข้อสอบให้ logit มาให้คำนวณเอง</p>", "ref": "Lesson 12 §2.1", "why_wrong_map": ["logit ไม่ใช่ความน่าจะเป็น", "", "sigmoid ของ 4.6859 ได้ 0.991 ก็ไม่ใช่ 99.89%", "softmax ไม่หารจำนวนคลาส"]}, {"id": "L13-01", "lesson": 13, "topic": "generative model", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "โมเดลใดเป็น generative model", "options": ["โมเดลที่ทายราคาบ้านออกมาเป็นตัวเลข", "โมเดลที่หากรอบของวัตถุในรูปภาพ", "โมเดลที่สุ่มสร้างรูปใบหน้าใหม่ได้หลายแบบ", "โมเดลที่บอกว่ารูปเป็นแมว 0.9 ทุกครั้ง"], "answer": 2, "explanation": "<p>generative ต้องให้ผลเป็นข้อมูลชนิดเดียวกับ training data และสุ่มได้หลายแบบ โมเดลจำแนก ทำนาย หรือ detection ไม่ได้สร้างข้อมูลใหม่</p>", "ref": "Lesson 13 §1.1", "why_wrong_map": ["regression", "detection", "", "classification"]}, {"id": "L9-26", "lesson": 9, "topic": "sliding window ใน forward เดียว", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "classifier ออกแบบให้ feature 5×5×20 → conv 5×5 200 filter → conv 1×1 4 filter ป้อน feature 9×9×20 ได้ output shape อะไร", "options": ["1×1×4", "9×9×4", "5×5×4", "4×4×4"], "answer": 2, "explanation": "<p>9 − 5 + 1 = 5 conv 1×1 คงขนาด ได้ 5×5×4 คือ 25 หน้าต่างจาก forward เดียว</p>", "ref": "Lesson 9 §5.3", "why_wrong_map": ["ขนาดที่ออกแบบไว้", "ลืมลดขนาด", "", "ลืม +1"]}, {"id": "L8-17", "lesson": 8, "topic": "Xception สมมติฐาน", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "depthwise separable convolution ตั้งสมมติฐานว่าอะไร", "options": ["ภาพทุกภาพมีขอบแนวตั้งมากกว่าขอบแนวนอน", "channel ของภาพอิสระต่อกันจึงไม่ต้องผสมเลย", "pattern เชิงพื้นที่กับข้าม channel แยกกันโมเดลได้", "filter ขนาดใหญ่ดีกว่า filter เล็กหลายชั้นเสมอ"], "answer": 2, "explanation": "<p>depthwise ทำ spatial filter ทีละ channel แล้ว pointwise 1×1 ผสมข้าม channel ทีหลัง ผสม channel ยังเกิด ไม่ได้ทิ้ง</p>", "ref": "Lesson 8 §4.2", "why_wrong_map": ["ไม่เกี่ยวกับทิศของขอบ", "ยังผสม channel ด้วย pointwise", "", "ขัดกับแนวคิด 3×3 ของ VGG"]}, {"id": "L8-04", "lesson": 8, "topic": "AlexNet ข้อเสีย", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อเสียของ AlexNet ที่ VGG มาแก้คืออะไร", "options": ["ไม่มี fully connected layer จึงจำแนกภาพไม่ได้", "hyperparameter เยอะ kernel stride padding ต่างทุกชั้น", "ใช้ sigmoid ทั้ง network จึงเกิด vanishing gradient", "ตื้นเกินไปจนเรียน feature ที่ซับซ้อนไม่ได้"], "answer": 1, "explanation": "<p>สไลด์ระบุ many hyperparameters to tune VGG ตอบด้วย one uniform configuration: conv 3×3 stride 1 same และ pool 2×2 stride 2 ทุกชั้น</p>", "ref": "Lesson 8 §1.3", "why_wrong_map": ["AlexNet มี FC สามชั้น", "", "AlexNet ใช้ ReLU", "AlexNet ลึก 8 ชั้นซึ่งลึกที่สุดในยุคนั้น"]}, {"id": "L15-17", "lesson": 15, "topic": "LangChain method", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "method ใดให้ tool definition กับโมเดล", "options": ["chain.invoke()", "llm.invoke()", "tool.invoke()", "llm.bind_tools()"], "answer": 3, "explanation": "<p>bind_tools ให้โมเดลรู้จัก schema ของ tool · tool.invoke รัน tool · chain.invoke รันลำดับ · llm.invoke เรียก LLM</p>", "ref": "Lesson 15 §3.1", "why_wrong_map": ["รัน chain", "เรียกโมเดลเฉยๆ", "รัน tool", ""]}, {"id": "L12-05", "lesson": 12, "topic": "extractive QA", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "question-answering ใน pipeline แบบบนสไลด์ให้คำตอบอย่างไร", "options": ["ค้นข้อมูลบนเว็บแล้วสรุปเป็นคำตอบให้", "สร้างคำตอบใหม่จากความรู้ที่ pretrain มาแล้ว", "เลือกช่วงข้อความใน context ที่ตอบ ไม่แต่งใหม่", "จัดหมวดคำถามเป็นหนึ่งใน label ที่กำหนดไว้"], "answer": 2, "explanation": "<p>extractive QA คืน answer เป็น span เช่น context[0:23] = The music was beautiful score 0.2515 ต่ำเพราะ context ไม่ได้พูดถึงหนังตรงๆ</p>", "ref": "Lesson 12 §2.2", "why_wrong_map": ["pipeline ไม่ค้นเว็บ", "นั่นคือ generative QA", "", "นั่นคือ classification"]}, {"id": "L11-23", "lesson": 11, "topic": "scaled dot-product", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "q·k₁ = 4 q·k₂ = 0 d_k = 16 หลัง scale ได้คะแนนอะไร", "options": ["[4, 0]", "[0.25, 0]", "[2, 0]", "[1, 0]"], "answer": 3, "explanation": "<p>หารด้วย √d_k = √16 = 4 ได้ [1, 0]</p>", "ref": "Lesson 11 §6.1", "why_wrong_map": ["ไม่ scale", "หารด้วย d_k", "หาร 2", ""]}, {"id": "L14-28", "lesson": 14, "topic": "สุ่ม t ตอนเทรน", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ทำไมการกระโดด x₀ → x_t ในขั้นเดียวสำคัญตอนเทรน", "options": ["ทำให้ไม่ต้องใช้ network สำหรับทาย noise", "ทำให้การ sampling ใช้ขั้นเดียวก็พอแล้ว", "ทำให้ diffusion schedule ไม่ต้องมีค่า β", "สุ่ม t ใดก็ได้แล้วได้ noisy image ทันทีไม่ต้องวน"], "answer": 3, "explanation": "<p>สูตร x_t = √ᾱ x₀ + √(1 − ᾱ) ε ทำให้เทรนได้เร็ว ไม่ต้องวน t ขั้น</p>", "ref": "Lesson 14 §2.3", "why_wrong_map": ["ยังต้องทาย noise", "sampling ยังต้องหลายขั้น", "ᾱ มาจาก β", ""]}, {"id": "L15-03", "lesson": 15, "topic": "ML เดิมใน agent", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "โมเดล ML เดิมที่ทายความเสี่ยง refund ใช้กับ agentic system ได้อย่างไร", "options": ["ใช้แทน orchestration layer ของระบบ", "ใช้แทน memory ของ agent ได้เลย", "ใส่เป็น tool ให้ agent เรียกใช้", "ใช้ไม่ได้ ต้องเทรน foundation model ใหม่"], "answer": 2, "explanation": "<p>สไลด์หน้า 4: traditional ML models can also be integrated into agentic systems as tools</p>", "ref": "Lesson 15 §1.1", "why_wrong_map": ["orchestration คนละหน้าที่", "memory คนละหน้าที่", "", "ใช้ได้"]}, {"id": "L13-20", "lesson": 13, "topic": "discriminator loss", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "รูปปลอม label 0 discriminator ทาย 0.75 binary cross-entropy เท่าใด", "options": ["0.75", "−log 0.25 ≈ 1.39", "−log 0.75 ≈ 0.29", "−log 0.5 ≈ 0.69"], "answer": 1, "explanation": "<p>label 0 ใช้ −log(1 − p) = −log 0.25 ≈ 1.386 ทายผิดมากจึงถูกลงโทษมาก</p>", "ref": "Lesson 13 §4.3", "why_wrong_map": ["ไม่ใช่ loss", "", "ใช้สูตรของ label 1", "ค่าสุ่ม"]}, {"id": "L14-23", "lesson": 14, "topic": "latent channel", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "latent ของ Stable Diffusion มีกี่ channel", "options": ["1", "3", "4", "8"], "answer": 2, "explanation": "<p>latent 64×64×4 สำหรับรูป 512×512×3</p>", "ref": "Lesson 14 §6.2", "why_wrong_map": ["ไม่ใช่ grayscale", "นั่นคือ RGB", "", "ไม่ใช่"]}, {"id"  "เทรนเร็วขึ้นโดยไม่มีผลต่อคุณภาพของรูปเลย"], "answer": 1, "explanation": "<p>β ชั่งน้ำหนักสอง loss KL มากขึ้นดัน latent ให้ใกล้ N(0, 1) มากขึ้น reconstruction ถูกลดความสำคัญลง</p>", "ref": "Lesson 13 §3.5", "why_wrong_map": ["KL ไม่คงที่", "", "นั่นคือ β ต่ำ", "ไม่ใช่เรื่องความเร็ว"]}, {"id": "L14-20", "lesson": 14, "topic": "denormalize", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "หลัง reverse diffusion ทำไมต้อง denormalize", "options": ["เพื่อปรับ schedule กลับไปเป็นแบบ linear", "เพื่อลบ noise ที่ยังเหลืออยู่หลังจบ loop", "เพื่อเปลี่ยน latent 4 channel ให้เป็นภาพ RGB", "รูปถูก normalize ก่อนเทรน ต้องแปลงกลับเป็นช่วง pixel"], "answer": 3, "explanation": "<p>normalize ให้สมมติฐาน Var(x₀) = 1 ใช้ได้ ตอนแสดงผลจึงต้องคืนสเกลเดิมแล้ว clip</p>", "ref": "Lesson 14 §5.3", "why_wrong_map": ["ไม่เกี่ยวกับ schedule", "noise ถูกลบใน loop แล้ว", "นั่นคือ VAE decoder ของ Stable Diffusion", ""]}, {"id": "L13-17", "lesson": 13, "topic": "KL code", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "โค้ดนี้ z_mean = 0 z_log_var = 0 ทุกมิติ ได้ kl_loss เท่าใด", "options": ["0.5", "−0.5", "0", "1"], "answer": 2, "explanation": "<p>−0.5 × (1 + 0 − 0 − e⁰) = −0.5 × 0 = 0 ตรงกับ μ = 0 σ = 1</p>", "ref": "Lesson 13 §3.4", "code": "kl_loss = -0.5 * (1 + z_log_var - ops.square(z_mean) - ops.exp(z_log_var))\nkl_loss = ops.mean(ops.sum(kl_loss, axis=1))", "why_wrong_map": ["ลืม −1 จาก exp", "คิดเครื่องหมายผิด", "", "ลืม 1"]}, {"id": "L8-28", "lesson": 8, "topic": "ViT vs CNN", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดตรงกับคุณสมบัติของ ViT ตามสไลด์", "options": ["ใช้ convolution ขนาดเล็กแทน self-attention ในชั้นแรก", "inductive bias น้อยกว่า CNN จึงพึ่ง pretraining ขนาดใหญ่", "มี feature map หลายระดับโดยธรรมชาติเหมือนกับ CNN", "ต้องการข้อมูลน้อยกว่า CNN เพราะเห็นทั้งภาพได้ทันที"], "answer": 1, "explanation": "<p>ViT ไม่มี convolution ไม่มีความเชื่อตั้งต้นว่า pixel ใกล้กันเกี่ยวกัน ต้องเรียนจากข้อมูลเอง จึงต้องการ large-scale pretraining และ ViT ดั้งเดิมไม่เป็นลำดับชั้น</p>", "ref": "Lesson 8 §6.1", "why_wrong_map": ["ViT ไม่ใช้ convolution", "", "นั่นคือ Swin หรือ CNN", "ตรงข้าม ต้องการข้อมูลมาก"]}, {"id": "L15-09", "lesson": 15, "topic": "local vs API tool", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "tool ใดเป็น API-based tool", "options": ["lookup_order ที่เรียก requests.get ไป backend ภายนอก", "calculate_refund ที่คำนวณยอดในโปรแกรม", "validate_customer_id ที่ใช้ regex", "get_invoice ที่คืน dict ข้อมูลจำลอง"], "answer": 0, "explanation": "<p>API-based tool คุยกับบริการภายนอกผ่าน API local tool ทำงานในแอปเอง</p>", "ref": "Lesson 15 §2.2", "why_wrong_map": ["", "local", "local", "local"]}, {"id": "L10-27", "lesson": 10, "topic": "TextVectorization index", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "vocabulary คือ [\"\", \"[UNK]\", \"the\", \"cat\", \"sat\"] ข้อความ \"The dog sat\" ได้ลำดับ index อะไร", "options": ["[2, 4]", "[2, 1, 4]", "[2, 0, 4]", "[3, 1, 5]"], "answer": 1, "explanation": "<p>standardize เป็นตัวพิมพ์เล็ก the = 2 · dog ไม่อยู่ใน vocabulary จึงเป็น OOV index 1 · sat = 4 index 0 สงวนไว้สำหรับ padding</p>", "ref": "Lesson 10 §6.1", "why_wrong_map": ["ตัดคำที่ไม่รู้จักทิ้ง", "", "0 คือ padding ไม่ใช่ OOV", "นับ index เริ่ม 1"]}, {"id": "L11-28", "lesson": 11, "topic": "ทำไมต้อง mask", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ถ้าไม่มี causal mask ใน decoder ตอนเทรนจะเกิดอะไร", "options": ["encoder จะมองไม่เห็นประโยคต้นทางที่ต้องแปล", "decoder เห็นคำในอนาคตของ target จึงโกงด้วยการ copy", "เทรนแบบขนานไม่ได้อีกต่อไปต้องทำทีละ step", "softmax จะรวมกันไม่เป็น 1 ในแต่ละแถว"], "answer": 1, "explanation": "<p>ตอนเทรน decoder เห็น target ทั้งประโยคพร้อมกัน mask ทำให้ตำแหน่ง i เห็นแค่ j ≤ i ยังคำนวณขนานได้</p>", "ref": "Lesson 11 §6.3", "why_wrong_map": ["encoder ไม่ใช้ causal mask", "", "mask ไม่ได้ทำให้เทรนแบบขนานไม่ได้", "softmax ยังรวมเป็น 1"]}, {"id": "L14-07", "lesson": 14, "topic": "linear schedule", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ใน linear_diffusion_schedule ค่า beta ที่ diffusion_time = 0.5 เท่าใด", "options": ["0.01", "0.01005", "0.02", "0.0101"], "answer": 1, "explanation": "<p>beta = 0.0001 + 0.5 × (0.02 − 0.0001) = 0.0001 + 0.00995 = 0.01005</p>", "ref": "Lesson 14 §2.4", "code": "min_rate = 0.0001\nmax_rate = 0.02\nbetas = min_rate + diffusion_times * (max_rate - min_rate)", "why_wrong_map": ["ลืม min_rate", "", "นั่นคือ max_rate", "ปัดผิด"]}, {"id": "L11-29", "lesson": 11, "topic": "encoder block", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "feed-forward ใน encoder embed_dim 128 dense_dim 512 มี parameter เท่าใด", "options": ["65,664", "66,048", "131,712", "131,072"], "answer": 2, "explanation": "<p>(128 × 512 + 512) + (512 × 128 + 128) = 66,048 + 65,664 = 131,712</p>", "ref": "Lesson 11 §6.2", "why_wrong_map": ["นับแค่ชั้นที่สอง", "นับแค่ชั้นแรก", "", "ลืม bias"]}, {"id": "L14-01", "lesson": 14, "topic": "ส่วนที่เรียนได้", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ส่วนใดของ diffusion model มี parameter ที่ต้องเรียน", "options": ["reverse process ที่ทาย noise", "forward process ที่เติม noise", "ε ที่สุ่มจาก N(0, I) แต่ละขั้น", "diffusion schedule ของ β ทุกขั้น"], "answer": 0, "explanation": "<p>forward เติม noise ตาม schedule ที่กำหนดไว้ก่อน ไม่มีอะไรให้เรียน network ถูกใช้ใน reverse process เพื่อทาย noise</p>", "ref": "Lesson 14 §1.1", "why_wrong_map": ["", "ไม่มี parameter", "สุ่ม ไม่ได้เรียน", "กำหนดไว้ล่วงหน้า"]}, {"id": "L13-30", "lesson": 13, "topic": "VAE loss", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "reconstruction loss 120 KL ของ latent 2 มิติคือ 0.5 และ 1.5 ใช้ β = 1 total loss เท่าใด", "options": ["240", "122", "121", "120"], "answer": 1, "explanation": "<p>KL รวมทุกมิติ 0.5 + 1.5 = 2 · total = 120 + 2 = 122</p>", "ref": "Lesson 13 §3.4", "why_wrong_map": ["คูณผิด", "", "เฉลี่ย KL แทนรวม", "ลืม KL"]}, {"id": "L15-21", "lesson": 15, "topic": "messages ครั้งที่สอง", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ข้อใดเป็น messages ที่ถูกสำหรับเรียก LLM ครั้งที่สองใน parallel execution", "options": ["[HumanMessage(query), *tool_messages]", "[HumanMessage(query), ai_msg, *tool_messages]", "[*tool_messages] ส่งเฉพาะผลของ tool", "[ai_msg, *tool_messages] โดยไม่มีคำถาม"], "answer": 1, "explanation": "<p>ต้องมีคำถามเดิม AIMessage ที่มี tool calls และ ToolMessage ทุกตัว *tool_messages แตก list ออกมา</p>", "ref": "Lesson 15 §4.3", "why_wrong_map": ["ขาด AIMessage ที่ ToolMessage อ้างถึง", "", "ขาดคำถามและ tool call", "ขาดคำถามเดิม"]}, {"id": "L13-21", "lesson": 13, "topic": "generator loss", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตอนเทรน generator label ของรูปปลอมที่ส่งเข้า discriminator ตั้งเป็นอะไร", "options": ["ไม่ใช้ label เพราะ G เรียนแบบ unsupervised", "label สุ่มครึ่งจริงครึ่งปลอมในแต่ละ batch", "label ของรูปปลอม เพื่อให้ D แยกได้แม่นขึ้น", "label เดียวกับรูปจริง เพื่อดันให้ D ทายว่าจริง"], "answer": 3, "explanation": "<p>misleading labels บอกว่าทุกรูปเป็นของจริง gradient จึงดัน G ไปทางที่ D เชื่อ ในโค้ดของอาจารย์รูปจริงคือ 0 จึงใช้ zeros</p>", "ref": "Lesson 13 §4.5", "why_wrong_map": ["ยังใช้ loss ของ D กับ label", "ไม่สุ่ม", "นั่นคือการเทรน D", ""]}, {"id": "L13-07", "lesson": 13, "topic": "ปัญหา AE", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "autoencoder reconstruct ได้ชัด แต่สุ่มจุดใน latent แล้วได้รูปเพี้ยน สาเหตุตามบทเรียนคืออะไร", "options": ["loss เป็น binary cross-entropy แทน MSE", "latent ไม่ต่อเนื่องและไม่มีการแจกแจงที่นิยามไว้", "decoder มีจำนวน parameter น้อยเกินไป", "encoder ใช้ stride มากเกินไปจนข้อมูลหาย"], "answer": 1, "explanation": "<p>reconstruct ได้กับสร้างของใหม่ได้เป็นคนละเรื่อง จุดที่ไม่มีภาพเทรนแมปไปอาจไม่มีความหมาย VAE แก้ด้วยการบังคับ latent ให้ใกล้ N(0, 1)</p>", "ref": "Lesson 13 §2.5", "why_wrong_map": ["loss ไม่ใช่สาเหตุ", "", "ขนาด decoder ไม่ใช่ปัญหาหลัก", "stride ไม่ใช่สาเหตุ"]}, {"id": "L7-07", "lesson": 7, "topic": "stride กับ floor", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "input 15×15 filter 3×3 padding 1 stride 2 ได้ขนาดเท่าใด", "options": ["15×15", "7×7", "8×8", "9×9"], "answer": 2, "explanation": "<p>⌊(15 + 2 − 3)/2⌋ + 1 = ⌊14/2⌋ + 1 = 8</p>", "ref": "Lesson 7 §3.3", "why_wrong_map": ["คิดว่า padding 1 ทำให้ขนาดคงเดิมแม้ stride 2", "ลืม padding ได้ ⌊12/2⌋ + 1 = 7", "", "ปัดขึ้นผิดจุด"]}, {"id": "L10-26", "lesson": 10, "topic": "CBOW vs SkipGram", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ประโยค 5 คำ หน้าต่าง 1 ข้าง SkipGram สร้างคู่ (center, context) ได้กี่คู่", "options": ["8", "4", "10", "5"], "answer": 0, "explanation": "<p>คำหัวท้ายมีเพื่อนบ้าน 1 คำ คำกลางสามคำมี 2 คำ: 1 + 2 + 2 + 2 + 1 = 8 · CBOW ได้ 5 sample คือหนึ่งต่อคำกลาง</p>", "ref": "Lesson 10 §5.3", "why_wrong_map": ["", "ลืมคำหัวท้าย", "คิดว่าทุกคำมี 2 คำ", "นั่นคือ CBOW"]}, {"id": "L10-22", "lesson": 10, "topic": "กลยุทธ์ทำนาย", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "กลยุทธ์ใดที่ error สะสมเมื่อทำนายไกลขึ้น", "options": ["direct multi-output ทายทั้ง 10 ค่าครั้งเดียว", "direct forecasting ของ horizon เดียว", "forecast at every time step ทุกตำแหน่ง", "recursive ที่ป้อนค่าที่ทายกลับเป็น input"], "answer": 3, "explanation": "<p>recursive ใช้ x̂₅₁ ทาย x̂₅₂ error ของ step ก่อนจึงติดไป ข้อความที่อาจารย์ทำสีคือ Larger errors for later time steps!!</p>", "ref": "Lesson 10 §4.3", "why_wrong_map": ["ไม่ป้อนกลับ", "ทายค่าเดียว", "ไม่ป้อนค่าที่ทายกลับ", ""]}, {"id": "L12-12", "lesson": 12, "topic": "LoRA เริ่มต้น", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "ตอนเริ่มเทรน LoRA ตั้ง B = 0 ผลคืออะไร", "options": ["gradient ของ A เป็นศูนย์ตลอดจึงไม่ได้เรียนเลย", "BA = 0 โมเดลเริ่มทำงานเหมือน pretrained ทุกประการ", "inference ช้าลงเพราะต้องคูณ matrix เพิ่มสองตัว", "W₀ ถูกตั้งค่าเป็นศูนย์ไปพร้อมกับ B ด้วย"], "answer": 1, "explanation": "<p>h = W₀x + (α/r)BAx ถ้า B = 0 ส่วนเพิ่มเป็นศูนย์ โมเดลเริ่มเหมือนเดิม B ได้ gradient ก่อนแล้ว A ตามมา ตอน inference รวม W₀ + (α/r)BA เป็น matrix เดียว ไม่ช้า</p>", "ref": "Lesson 12 §4.1", "why_wrong_map": ["B มี gradient จาก A ที่ไม่ศูนย์ แล้ว A เรียนตาม", "", "รวม matrix ได้จึงไม่ช้า", "W₀ ถูกล็อกไว้เดิม"]}, {"id": "L14-04", "lesson": 14, "topic": "ᾱ", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "α₁ = 0.9 α₂ = 0.9 α₃ = 0.5 ค่า ᾱ₃ เท่าใด", "options": ["0.5", "2.3", "0.405", "0.81"], "answer": 2, "explanation": "<p>ᾱ คือผลคูณ 0.9 × 0.9 × 0.5 = 0.405</p>", "ref": "Lesson 14 §2.3", "why_wrong_map": ["ใช้แค่ขั้นสุดท้าย", "บวกแทนคูณ", "", "ลืมขั้นที่ 3"]}, {"id": "L12-13", "lesson": 12, "topic": "trainable ใน workshop", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "DistilBERT 6 layer d = 768 LoRA r = 8 ที่ q_lin และ v_lin บวก head pre_classifier 768→768 และ classifier 768→6 trainable รวมเท่าใด", "options": ["595,206", "742,662", "147,456", "66,958,086"], "answer": 1, "explanation": "<p>adapter 6 × 2 × (8·768 + 768·8) = 147,456 · head 590,592 + 4,614 = 595,206 · รวม 742,662</p>", "ref": "Lesson 12 §4.1", "why_wrong_map": ["นับแค่ head", "", "นับแค่ adapter", "นั่นคือ full fine-tuning"]}, {"id": "L7-26", "lesson": 7, "topic": "RandomTranslation", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ภาพ 50×50 ใช้ <code>RandomTranslation(0.2, 0.2)</code> เลื่อนได้สูงสุดกี่ pixel ในแต่ละแกน", "options": ["5", "10", "20", "0.2"], "answer": 1, "explanation": "<p>0.2 × 50 = 10 pixel แต่ละทิศ ค่าเป็นสัดส่วนของขนาดภาพ</p>", "ref": "Lesson 7 §6.5", "why_wrong_map": ["หารสองผิด", "", "คิดเป็นเปอร์เซ็นต์ ×100", "คิดเป็น pixel ตรงๆ"]}, {"id": "L15-07", "lesson": 15, "topic": "ห้าส่วนประกอบ", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ส่วนใดของ agentic system ทำหน้าที่ประสานว่าเรียก model tool memory เมื่อไร", "options": ["orchestration", "knowledge base", "memory", "foundation model"], "answer": 0, "explanation": const LESSON_NAMES = {7:"L7 CNN",8:"L8 Architectures & Transfer",9:"L9 Functional API & Detection",10:"L10 RNN/LSTM & Embeddings",11:"L11 Attention & Transformer",12:"L12 Hugging Face & LoRA",13:"L13 AE/VAE/GAN",14:"L14 Diffusion",15:"L15 Agentic AI"};
const TYPE_NAMES = {concept:"แนวคิด", code:"code", calc:"คำนวณ"};
const DIFF_NAMES = {easy:"ง่าย", medium:"กลาง", hard:"ยาก"};
const SOURCE_NAMES = {lesson:"lesson", notebook:"notebook"};
const LETTERS = ["A","B","C","D"];
const KEY = "dl-mcq-final-v1";

let answers = {};   // id -> {choice, correct, tries}
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { answers = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
let order = [];
let sessionAnswered = {}; // for "wrong" mode: questions re-answered in this view
const openExplain = new Set();

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildFilters() {
  const lf = document.getElementById("lessonFilters");
  for (const n of [7,8,9,10,11,12,13,14,15]) {
    const c = QUESTIONS.filter(q => q.lesson === n).length;
    lf.insertAdjacentHTML("beforeend", `<label class="chip"><input type="checkbox" class="lf" value="${n}" checked> ${LESSON_NAMES[n]} <span style="color:var(--ink-soft)">(${c})</span></label>`);
  }
  const tf = document.getElementById("typeFilters");
  for (const t of ["concept","calc","code"]) {
    const c = QUESTIONS.filter(q => q.type === t).length;
    tf.insertAdjacentHTML("beforeend", `<label class="chip"><input type="checkbox" class="tf" value="${t}" checked> ${TYPE_NAMES[t]} <span style="color:var(--ink-soft)">(${c})</span></label>`);
  }
  document.querySelectorAll(".lf,.tf,input[name=mode]").forEach(el => el.addEventListener("change", () => { sessionAnswered = {}; newOrder(); }));
}

function currentPool() {
  const ls = new Set([...document.querySelectorAll(".lf:checked")].map(e => +e.value));
  const ts = new Set([...document.querySelectorAll(".tf:checked")].map(e => e.value));
  const mode = document.querySelector("input[name=mode]:checked").value;
  return QUESTIONS.filter(q => ls.has(q.lesson) && ts.has(q.type)).filter(q => {
    const a = answers[q.id];
    if (mode === "unanswered") return !a || sessionAnswered[q.id];
    if (mode === "wrong") return (a && !a.correct) || sessionAnswered[q.id];
    return true;
  });
}

function newOrder() { order = currentPool().map(q => q.id); openExplain.clear(); render(); }

function renderMath(el) {
  if (typeof renderMathInElement !== "function") return;
  renderMathInElement(el, { delimiters: [ {left:"$$",right:"$$",display:true}, {left:"\\[",right:"\\]",display:true}, {left:"\\(",right:"\\)",display:false} ], ignoredTags: ["script","noscript","style","textarea","pre","code"], throwOnError: false });
}

function cardHTML(q, idx) {
  const a = sessionAnswered[q.id] || (document.querySelector("input[name=mode]:checked").value === "wrong" ? null : answers[q.id]);
  const done = !!a;
  const cls = done ? (a.choice === q.answer ? "done-good" : "done-bad") : "";
  let opts = q.options.map((o, i) => {
    let c = "opt";
    if (done && i === q.answer) c += " correct";
    if (done && i === a.choice && i !== q.answer) c += " wrong";
    return `<button class="${c}" data-q="${q.id}" data-i="${i}" ${done ? "disabled" : ""}><span class="L">${LETTERS[i]}.</span><span>${o}</span></button>`;
  }).join("");
  let verdict = "";
  if (done) {
    verdict = a.choice === q.answer
      ? `<div class="verdict good">ถูกต้อง — คำตอบคือ ${LETTERS[q.answer]}</div>`
      : `<div class="verdict bad">ยังไม่ถูก — คุณตอบ ${LETTERS[a.choice]} · คำตอบที่ถูกคือ ${LETTERS[q.answer]}</div>`;
    verdict += `<div class="actions"><button data-explain="${q.id}">${openExplain.has(q.id) ? "ซ่อนเฉลย" : "ดูเฉลย"}</button></div>`;
    if (openExplain.has(q.id)) {
      const ww = q.options.map((o, i) => i === q.answer ? "" : `<li><b>${LETTERS[i]}.</b> ${q.why_wrong_map[i]}</li>`).join("");
      verdict += `<div class="explain"><h4>ทำไม ${LETTERS[q.answer]} ถูก</h4><div>${q.explanation}</div><h4>ตัวเลือกอื่นผิดเพราะ</h4><ul>${ww}</ul><div class="ref">ทบทวนที่: ${esc(q.ref)}</div></div>`;
    }
  }
  const code = q.code ? `<pre><code>${esc(q.code)}</code></pre>` : "";
  return `<div class="q ${cls}" id="card-${q.id}">
    <div class="meta"><span class="tag">${LESSON_NAMES[q.lesson]}</span><span class="tag t-${q.type}">${TYPE_NAMES[q.type]}</span><span class="tag d-${q.difficulty}">${DIFF_NAMES[q.difficulty]}</span>${done ? `<span class="tag" style="background:#f1f1ee;color:var(--ink-soft)">${esc(q.topic)}</span>` : ""}</div>
    <div class="stem"><span class="num">${idx + 1}.</span>${q.stem}</div>${code}
    <div class="opts">${opts}</div>${verdict}</div>`;
}

function render() {
  const list = document.getElementById("list");
  if (!order.length) { list.innerHTML = `<div class="empty">ไม่มีข้อในชุดนี้ ${document.querySelector("input[name=mode]:checked").value === "wrong" ? "— ยังไม่มีข้อที่ตอบผิด 🎉" : ""}</div>`; }
  else list.innerHTML = order.map((id, i) => cardHTML(byId[id], i)).join("");
  renderMath(list);
  const done = order.filter(id => answers[id]).length;
  document.getElementById("progress").textContent = order.length ? `กำลังแสดง ${order.length} ข้อ · ทำไปแล้วในชุดนี้ ${done} ข้อ` : "";
  renderStats();
}

function rerenderCard(id) {
  const el = document.getElementById("card-" + id);
  const idx = order.indexOf(id);
  const tmp = document.createElement("div");
  tmp.innerHTML = cardHTML(byId[id], idx);
  const nu = tmp.firstElementChild;
  el.replaceWith(nu);
  renderMath(nu);
  renderStats();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.opt");
  if (b && !b.disabled) {
    const q = byId[b.dataset.q], i = +b.dataset.i;
    const prev = answers[q.id];
    answers[q.id] = { choice: i, correct: i === q.answer, tries: (prev ? prev.tries : 0) + 1, everWrong: (prev && prev.everWrong) || i !== q.answer };
    sessionAnswered[q.id] = answers[q.id];
    save();
    rerenderCard(q.id);
    return;
  }
  const x = e.target.closest("button[data-explain]");
  if (x) { const id = x.dataset.explain; openExplain.has(id) ? openExplain.delete(id) : openExplain.add(id); rerenderCard(id); }
});

function pct(c, n) { return n ? Math.round(100 * c / n) : 0; }
function renderStats() {
  const st = document.getElementById("stats");
  const all = QUESTIONS.filter(q => answers[q.id]);
  const cor = all.filter(q => answers[q.id].correct).length;
  let html = `<div class="stat"><div class="k">ทำไปแล้ว</div><div class="v">${all.length}/${QUESTIONS.length}</div><div class="bar"><i style="width:${pct(all.length, QUESTIONS.length)}%"></i></div></div>`;
  html += `<div class="stat"><div class="k">ถูก (ล่าสุด)</div><div class="v">${cor}/${all.length} · ${pct(cor, all.length)}%</div><div class="bar"><i style="width:${pct(cor, all.length)}%"></i></div></div>`;
  for (const n of [7,8,9,10,11,12,13,14,15]) {
    const qs = QUESTIONS.filter(q => q.lesson === n && answers[q.id]);
    const c = qs.filter(q => answers[q.id].correct).length;
    html += `<div class="stat"><div class="k">${LESSON_NAMES[n]}</div><div class="v">${qs.length ? pct(c, qs.length) + "%" : "–"}</div><div class="k">${c}/${qs.length} ข้อที่ทำ</div><div class="bar"><i style="width:${pct(c, qs.length)}%"></i></div></div>`;
  }
  for (const t of ["concept","calc","code"]) {
    const qs = QUESTIONS.filter(q => q.type === t && answers[q.id]);
    const c = qs.filter(q => answers[q.id].correct).length;
    html += `<div class="stat"><div class="k">ประเภท: ${TYPE_NAMES[t]}</div><div class="v">${qs.length ? pct(c, qs.length) + "%" : "–"}</div><div class="k">${c}/${qs.length}</div><div class="bar"><i style="width:${pct(c, qs.length)}%"></i></div></div>`;
  }
  st.innerHTML = html;
  const wrong = QUESTIONS.filter(q => answers[q.id] && !answers[q.id].correct);
  const w = document.getElementById("weakWrap");
  if (!wrong.length) { w.innerHTML = `<p class="k" style="color:var(--ink-soft);font-size:.9rem;margin:10px 0 0">ยังไม่มีข้อที่ผิด — จุดอ่อนจะขึ้นที่นี่ พร้อมตำแหน่งที่ควรกลับไปอ่าน</p>`; return; }
  w.innerHTML = `<p style="margin:12px 0 0;font-size:.9rem"><b>หัวข้อที่ยังผิดอยู่ (${wrong.length})</b> — กดเพื่อไปที่ข้อ หรือเลือกโหมด “เฉพาะข้อที่ผิด” เพื่อทำซ้ำ</p><ul class="weak">` +
    wrong.sort((a, b) => a.lesson - b.lesson).map(q => `<li><a href="#card-${q.id}" data-jump="${q.id}">L${q.lesson} · ${esc(q.topic)}</a> <span style="color:var(--ink-soft)">— ${esc(q.ref)}</span></li>`).join("") + `</ul>`;
}

document.getElementById("weakWrap").addEventListener("click", e => {
  const a = e.target.closest("a[data-jump]");
  if (!a) return;
  if (!document.getElementById("card-" + a.dataset.jump)) { e.preventDefault(); alert("ข้อนี้ไม่อยู่ในชุดที่กรองไว้ตอนนี้ — เปิดตัวกรองบท/ประเภทให้ครอบคลุมก่อน"); }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  const next = order.find(id => !answers[id]);
  if (!next) { alert("ทำครบทุกข้อในชุดนี้แล้ว"); return; }
  document.getElementById("card-" + next).scrollIntoView({ behavior: "smooth", block: "start" });
});
function buildExport() {
  const items = QUESTIONS.filter(q => answers[q.id]).map(q => {
    const a = answers[q.id];
    return { id: q.id, lesson: q.lesson, lessonName: LESSON_NAMES[q.lesson], topic: q.topic, source: q.source,
      type: q.type, difficulty: q.difficulty, ref: q.ref,
      question: q.stem.replace(/<[^>]+>/g, "").trim(),
      chosen: LETTERS[a.choice], chosenText: q.options[a.choice].replace(/<[^>]+>/g, "").trim(),
      correctLetter: LETTERS[q.answer], correctText: q.options[q.answer].replace(/<[^>]+>/g, "").trim(),
      isCorrect: a.correct, attempts: a.tries, everWrong: !!a.everWrong };
  });
  const byLesson = {};
  for (const n of [7,8,9,10,11,12,13,14,15]) {
    const qs = items.filter(i => i.lesson === n);
    byLesson[LESSON_NAMES[n]] = { answered: qs.length, correct: qs.filter(i => i.isCorrect).length, total: QUESTIONS.filter(q => q.lesson === n).length };
  }
  const byType = {};
  for (const t of ["concept","calc","code"]) {
    const qs = items.filter(i => i.type === t);
    byType[t] = { answered: qs.length, correct: qs.filter(i => i.isCorrect).length };
  }
  return {
    exportedAt: new Date().toISOString(),
    source: "Deep Learning MCQ Review (Lessons 1-6 + ex1-3 + in-class notebooks)",
    totals: { questionsInBank: QUESTIONS.length, answered: items.length, correct: items.filter(i => i.isCorrect).length },
    byLesson, byType,
    weakTopics: items.filter(i => !i.isCorrect).map(i => ({ id: i.id, lesson: i.lessonName, topic: i.topic, ref: i.ref })),
    answersRaw: answers,
    items
  };
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = buildExport();
  if (!data.totals.answered) { alert("ยังไม่มีข้อที่ทำ — ตอบอย่างน้อย 1 ข้อก่อน"); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `dl-mcq-result-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const incoming = d.answersRaw || d;
      let n = 0;
      for (const [id, a] of Object.entries(incoming)) {
        if (!byId[id] || !a || typeof a.choice !== "number") continue;
        answers[id] = { choice: a.choice, correct: a.choice === byId[id].answer, tries: a.tries || 1, everWrong: !!a.everWrong || a.choice !== byId[id].answer };
        n++;
      }
      save(); sessionAnswered = {}; newOrder();
      alert(`นำเข้าแล้ว ${n} ข้อ`);
    } catch (err) { alert("ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON ที่ export จากหน้านี้"); }
    e.target.value = "";
  };
  r.readAsText(f);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("ล้างคำตอบทั้งหมดแล้วเริ่มใหม่?")) return;
  answers = {}; sessionAnswered = {}; save(); newOrder();
});

document.addEventListener("DOMContentLoaded", () => { buildFilters(); newOrder(); });
</script>
