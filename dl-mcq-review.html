8{,}000/64=750\\) — ตรงกับแถบ <code>750/750</code> ใน log.</p><p>ขั้น 3: หนึ่ง batch = หนึ่งก้าว gradient descent ⇒ \\(750\\times40=30{,}000\\) ครั้ง. เทียบกับ batch gradient descent เต็มชุดที่อัปเดตแค่ 40 ครั้ง ⇒ มากกว่า 750 เท่า นี่คือเหตุผลที่ mini-batch เรียนเร็วกว่าต่อ epoch.</p>", "ref": "Lesson 5 §5.10 (สไลด์หน้า 31)", "why_wrong_map": ["", "ลืมหัก validation_split 20%: \\(\\lceil60{,}000/64\\rceil=938\\) แล้วคูณ 40", "นั่นคือจำนวน batch ต่อ <b>หนึ่ง</b> epoch ยังไม่ได้คูณด้วย 40 epoch", "นั่นคือจำนวนตัวอย่างที่ใช้เทรน ไม่ใช่จำนวนก้าวอัปเดต"]}, {"id": "L4-38", "lesson": 4, "topic": "Dropout: other issues และการ debug", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "กราฟ training cost ตอนเปิด dropout แกว่งกว้างจนดูไม่ออกว่าดีขึ้นหรือยัง อาจารย์แนะนำให้ทำอย่างไร (หน้า 30)?", "options": ["ปิด dropout ชั่วคราวแล้วดูว่า cost ลดลงปกติไหม ถ้ายังไม่ลดแปลว่าปัญหาอยู่ที่ learning rate หรือโค้ด", "เปลี่ยนไปดู training accuracy เพียงอย่างเดียว เพราะ cost ที่มี dropout ใช้ตัดสินอะไรไม่ได้เลย", "เพิ่ม dropout rate ขึ้นอีกจนกว่ากราฟจะเรียบ เพราะการแกว่งแปลว่าตั้ง dropout rate ไว้ต่ำเกินไป", "หยุดเทรนทันทีแล้วเปลี่ยน optimizer เป็น Adam เพราะการแกว่งแปลว่า optimizer ปัจจุบันไม่เหมาะ"], "answer": 0, "explanation": "<p>หน้า 30 บอกว่า dropout ใส่ความสุ่มเข้ามา เพราะ neuron ที่ถูกปิดต่างกันทุก iteration ⇒ training cost แกว่ง และ \"harder to use for debugging convergence\" (กราฟของอาจารย์แกว่งกว้าง 0.3–0.5 จนจบ 50,000 iteration)</p><p>ขั้นตอนที่แนะนำ: <b>ปิด dropout ชั่วคราว</b> → ดูว่า cost ลดปกติไหม → ถ้าไม่ลดแปลว่าปัญหาอยู่ที่อื่น (learning rate, gradient, implementation) → เมื่อยืนยันแล้วจึงเปิด dropout กลับมาเทรนจริง</p><p>และใช้การเทียบ training กับ validation เป็นตัวตัดสินว่า dropout มากหรือน้อยไป</p>", "ref": "Lesson 4 §6.2 (สไลด์หน้า 30)", "why_wrong_map": ["", "cost ยังใช้ได้ เพียงต้องดูแนวโน้มหรือปิด dropout ชั่วคราว", "การแกว่งเป็นผลปกติของความสุ่ม ไม่ใช่สัญญาณว่าตั้งค่าผิด", "การแกว่งไม่ได้บ่งชี้ว่า optimizer ไม่เหมาะ"]}, {"id": "L3-08", "lesson": 3, "topic": "Backprop: สูตร δ ของ hidden layer", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "สูตรส่ง error ย้อนกลับจาก layer \\(l\\) ไป layer \\(l-1\\) ข้อใดเขียนถูกต้อง (\\(*\\) = element-wise)?", "options": ["\\(\\delta^{(l-1)}=(\\theta^{[l]})^{\\top}\\delta^{(l)} * g'(z^{[l]})\\)", "\\(\\delta^{(l-1)}=(\\theta^{[l-1]})^{\\top}\\delta^{(l)} * g'(z^{[l-1]})\\)", "\\(\\delta^{(l-1)}=\\theta^{[l]}\\,\\delta^{(l)} * g'(z^{[l-1]})\\)", "\\(\\delta^{(l-1)}=(\\theta^{[l]})^{\\top}\\delta^{(l)} * g'(z^{[l-1]})\\)"], "answer": 3, "explanation": "อ่านทีละตัวคูณ: \\((\\theta^{[l]})^\\top\\) = weight ที่เชื่อม layer \\(l-1\\) ไป layer \\(l\\) (transpose เพื่อกระจาย error ย้อนทิศ), \\(\\delta^{(l)}\\) = error ปลายทาง, \\(g'(z^{[l-1]})\\) = ความชันของ activation <i>ที่ layer ที่กำลังหา δ ให้</i>. ตรวจด้วยมิติ: \\(\\theta^{[2]}\\) ขนาด \\(1\\times4\\) ⇒ \\(\\theta^{[2]\\top}\\delta^{[2]}\\) เป็น \\(4\\times1\\) ตัดแถว bias เหลือ \\(3\\times1\\) ตรงกับ \\(g'(z^{[1]})\\) ขนาด \\(3\\times1\\).", "ref": "Lesson 3 §4 Backprop Algorithm (p.18)", "why_wrong_map": ["subscript ผิดชั้น — g′ ต้องเป็นของ layer l−1 ที่กำลังหา δ ไม่ใช่ layer ต้นทางของ δ", "ใช้ weight ผิดชุด — θ[l−1] เชื่อม layer l−2 กับ l−1 ไม่ได้เชื่อมกับ δ[l]", "ลืม transpose — θ[l] ขนาด (s_l × s_{l−1}+1) คูณกับ δ[l] ไม่ได้ในทิศย้อนกลับ", ""]}, {"id": "L4-29", "lesson": 4, "topic": "AdamW", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามสไลด์หน้า 25 อะไรคือความต่างที่แท้จริงระหว่าง AdamW กับการใช้ Adam ร่วมกับ L2 regularization?", "options": ["AdamW เปลี่ยนไปใช้ L1 แทน L2 จึงได้โมเดลที่เบาบางและมี weight จำนวนมากเท่ากับศูนย์พอดีหลังเทรน", "AdamW ตั้ง \\(\\beta_1\\) กับ \\(\\beta_2\\) ใหม่ให้เท่ากัน จึงควบคุมแรง regularization ได้ตรงกว่าเดิมมาก", "AdamW แยก weight decay เป็นขั้นต่างหาก เทอม \\(\\alpha\\lambda\\theta\\) จึงไม่ถูกหารด้วย \\(\\sqrt{s}\\) ของ adaptive scaling", "AdamW เลิกใช้ adaptive scaling ทั้งหมด เหลือเพียงการหด weight ด้วย weight decay อย่างเดียวในทุก step ของการเทรนโมเดลทั้งหมด"], "answer": 2, "explanation": "<p>\\(\\theta_i := \\theta_i - \\alpha\\,\\dfrac{v_i}{\\sqrt{s_i}+\\epsilon} - \\alpha\\lambda\\theta_i\\) — เทอมสุดท้าย \\\"shrinks the weights directly\\\"</p><p>ทำไมสำคัญ: ถ้าใช้ Adam + L2 เทอม \\(\\lambda\\theta\\) จะถูกบวกเข้าไปใน gradient แล้วทั้งก้อนถูกหารด้วย \\(\\sqrt{s}\\) ⇒ ตัวอย่างในบท: P ที่ \\(\\sqrt{\\hat s}=10\\) ได้ decay \\(8\\times10^{-7}\\) แต่ Q ที่ \\(\\sqrt{\\hat s}=0.1\\) ได้ \\(8\\times10^{-5}\\) — แรงต่างกัน 100 เท่าทั้งที่ตั้ง \\(\\lambda\\) ค่าเดียวกัน</p><p>AdamW จึงให้ \\\"more direct and predictable control of regularization\\\"</p>", "ref": "Lesson 4 §5.5 (สไลด์หน้า 25)", "why_wrong_map": ["AdamW ไม่เกี่ยวกับการเปลี่ยนชนิดของ penalty เป็น L1", "AdamW ใช้ \\(\\beta_1,\\beta_2\\) ค่าเดิมของ Adam ทุกอย่าง", "", "AdamW ยังทำ adaptive update เหมือน Adam ทุกประการ"]}, {"id": "L3-25", "lesson": 3, "topic": "Activation ที่ output layer", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดจับคู่ชนิดงานกับ activation ที่แนะนำสำหรับ output layer ได้ถูกต้อง?", "options": ["Regression: ReLU · Binary: tanh · Multiclass: Softmax", "Regression: linear · Binary: sigmoid · Multiclass: Softmax", "Regression: linear · Binary: Softmax · Multiclass: sigmoid", "Regression: sigmoid · Binary: linear · Multiclass: Softmax"], "answer": 1, "explanation": "ที่ output เลือกตาม &quot;ชนิดงาน&quot;: Regression → linear (หรือไม่ใส่) \\(f(x)=x\\) เพราะต้องทำนายค่าเท่าไรก็ได้; Binary → sigmoid*** ให้ค่าใน [0,1] ตีความเป็นความน่าจะเป็น; Multiclass → Softmax*** (Rescaling outputs so they add up to 1.0) หรือ sigmoid ทีละ node. linear ใช้ที่ output ได้เพราะไม่มีชั้นถัดไปมายุบรวม.", "ref": "Lesson 3 §6 (p.36)", "why_wrong_map": ["regression ควรใช้ linear ให้ทำนายได้ทุกค่า และ binary ควรใช้ sigmoid", "", "Softmax 1 node ให้ 1 เสมอ; binary ใช้ sigmoid", "sigmoid ที่ regression บีบค่าเหลือ [0,1] ทำนายราคาจริงไม่ได้"]}, {"id": "L3-11", "lesson": 3, "topic": "Backprop intuition: gradient ใหญ่เมื่อไร", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ใน backpropagation gradient ของ weight \\(\\theta_{ij}^{[l]}\\) (จาก node \\(j\\) ของ layer ก่อนหน้า ไป node \\(i\\) ของ layer \\(l\\)) จะใหญ่เมื่อใด?", "options": ["เมื่อ \\(\\delta_j\\) ของ node ต้นทางใหญ่ และ \\(a_i\\) ของ node ปลายทางไม่เล็ก", "เมื่อค่าของ weight \\(\\theta_{ij}^{[l]}\\) ตัวนั้นเองมีขนาดใหญ่กว่าตัวอื่น", "เมื่อ \\(\\delta_i\\) ของ node ปลายทางใหญ่ และ \\(a_j\\) ของ node ต้นทางไม่เล็ก", "เมื่อ learning rate \\(\\alpha\\) ใหญ่ เพราะ α อยู่ในสูตร \\(\\partial J/\\partial\\theta\\)"], "answer": 2, "explanation": "\\(\\partial J/\\partial\\theta_{ij}^{[l]}=a_j^{[l-1]}\\delta_i^{(l)}\\) = (error ของปลายทาง) × (ค่าที่ไหลมาจากต้นทาง). ถ้า weight ใดนำไปสู่ node ที่มีส่วนทำให้ loss สูงมาก (\\(\\delta\\) ของปลายทางใหญ่) gradient ของ weight นั้นก็ใหญ่ตาม. กลับกัน node ปลายทางที่ \\(\\delta=0\\) ทำให้ gradient เป็น 0 แม้ \\(a\\) ของต้นทางจะมีค่ามาก.", "ref": "Lesson 3 §4 Intuition (p.18)", "why_wrong_map": ["สลับต้นทาง/ปลายทาง — δ เป็นของปลายทาง (i), a เป็นของต้นทาง (j)", "ขนาด weight ไม่อยู่ในสูตร gradient ของตัวมันเอง (ไม่นับ regularization)", "", "α ใช้ตอน update ไม่อยู่ในค่า gradient"]}, {"id": "L4-58", "lesson": 4, "topic": "ex2: บรรทัด regularization term", "source": "ex2", "type": "code", "difficulty": "medium", "stem": "บรรทัด reg_term ที่ต้องเติมใน nnCostFunction ของ ex2 ใช้ <code>temp1[:, 1:]</code> แทนที่จะใช้ temp1 ทั้งก้อน เพราะเหตุใด?", "code": "temp1 = Theta1      # (10, 3)\ntemp2 = Theta2      # (1, 11)\n\n# Fill your code for Add regularization term (1 lines of code)\nreg_term = (lambda_/(2*m)) * (np.sum(np.square(temp1[:, 1:]))\n                            + np.sum(np.square(temp2[:, 1:])))", "options": ["เพื่อตัดตัวอย่างแรกของชุดเทรนออก เพราะค่าของมันถูกใช้ไปแล้วในการคำนวณ cost ส่วนหลักก่อนหน้า", "เพื่อตัดคอลัมน์สุดท้ายซึ่งเป็นชั้น output ออก เพราะสไลด์ระบุว่าชั้น output ไม่ต้องถูก regularize", "เพื่อตัดคอลัมน์แรกซึ่งเป็น bias ออก เพราะ L2 regularization ลงโทษเฉพาะ weight ไม่ลงโทษ bias", "เพื่อตัดแถวแรกซึ่งเป็น hidden unit ตัวแรกออก เพราะ unit ตัวนั้นทำหน้าที่แทน bias ของทั้งชั้น"], "answer": 2, "explanation": "Theta1 มีขนาด \\(10\\times3\\) และ Theta2 มีขนาด \\(1\\times11\\) โดย <b>คอลัมน์ที่ 0 ของทั้งคู่คือ bias</b> (เพราะ a0 และ a1 ถูกเติมคอลัมน์ของเลข 1 ไว้ข้างหน้า)<br><code>[:, 1:]</code> จึงหมายถึง \"ทุกแถว ตั้งแต่คอลัมน์ที่ 1 เป็นต้นไป\" = ตัด bias ทิ้ง — ตรงกับคำว่า kernel ของ Keras ที่ regularize เฉพาะเมทริกซ์ weight<br>ตัวหาร \\(2m\\) มาจากรูปสูตร \\(\\frac{\\lambda}{2m}\\sum w^2\\) และในฝั่ง gradient ก็สอดคล้องกัน: <code>Theta1_grad[:, 1:] += (lambda_/m) * Theta1[:, 1:]</code> ซึ่งก็ข้ามคอลัมน์ bias เช่นกัน<br>(ข้อสังเกตของโน้ตบุ๊กเอง: บรรทัด J ที่ถูกใช้จริงไม่ได้บวก reg_term เข้าไป — มีแต่ฝั่ง gradient ที่ใส่เทอมนี้)", "ref": "ex2 cell nnCostFunction (reg_term 1 บรรทัด)", "why_wrong_map": ["temp1 คือเมทริกซ์ weight ไม่ใช่เมทริกซ์ข้อมูล การสไลซ์นี้จึงไม่เกี่ยวกับตัวอย่างในชุดเทรนเลย", "สไลซ์นี้ตัดคอลัมน์แรก ไม่ใช่คอลัมน์สุดท้าย และชั้น output ก็ถูก regularize ด้วย (เทอมของ temp2)", "", "<code>[:, 1:]</code> สไลซ์บนแกนคอลัมน์ ไม่ใช่แกนแถว แถวของ Theta1 คือ hidden unit ซึ่งไม่ถูกตัด"]}, {"id": "L6-52", "topic": "Grid vs Random Layout: ค่าที่ต่างกันของปุ่มสำคัญ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ตามรูป Grid Layout และ Random Layout ในสไลด์หน้า 25–26 ถ้ามี hyperparameter 2 ตัว (ตัวหนึ่งสำคัญ อีกตัวแทบไม่มีผล) และให้งบเท่ากันคือเทรน 9 ครั้ง Grid Search แบบ 3×3 กับ Random Search จะได้ทดสอบค่าของ \"ตัวที่สำคัญ\" กี่ค่าที่ต่างกัน ตามลำดับ", "options": ["3 ค่า และ 9 ค่า", "9 ค่า และ 3 ค่า", "3 ค่า และ 3 ค่า", "9 ค่า และ 9 ค่า"], "explanation": "<p>Grid \\(3\\times3\\): จุดทั้ง 9 เรียงเป็นตาราง ⇒ แกนของพารามิเตอร์สำคัญมีแค่ 3 พิกัด และแต่ละพิกัดถูกลองซ้ำ 3 ครั้งโดยเปลี่ยนเฉพาะปุ่มที่ไม่มีผล ⇒ จ่ายค่าเทรน 9 ครั้ง แต่ได้ข้อมูลของปุ่มสำคัญแค่ \\(9/3 = 3\\) ค่า</p><p>Random: แต่ละ trial สุ่มค่าของทุกปุ่มใหม่หมด ⇒ ไม่มีจุดไหนมีพิกัดซ้ำกันเลย ⇒ ปุ่มสำคัญถูกทดสอบครบ 9 ค่าที่ต่างกัน ด้วยงบเท่ากันเป๊ะ</p><p>นี่คือเหตุผลที่สไลด์เขียนว่า Random Search ให้ <mark class=\"src\" data-p=\"26\">fewer, more diverse combinations</mark> และ <mark class=\"src\" data-p=\"26\">more efficient than Grid Search</mark> โดยเฉพาะเมื่อ <mark class=\"src\" data-p=\"26\">only some hyperparameters have a strong effect on model performance</mark> ซึ่งเป็นสถานการณ์ปกติของ deep learning</p>", "ref": "Lesson 6 §9 (สไลด์หน้า 25–26)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "สลับข้าง — Grid ต่างหากที่ถูกจำกัดอยู่ที่ 3 พิกัดบนแกนของปุ่มสำคัญ", "Random ไม่ได้ถูกบังคับให้ใช้พิกัดซ้ำ จึงได้ 9 ค่าที่ต่างกัน ไม่ใช่ 3", "Grid 3×3 มีแค่ 3 พิกัดต่อแกน การเป็น 9 ค่าเกิดได้เฉพาะกับการสุ่ม"]}, {"id": "L6-23", "topic": "เทียบ LearningRateScheduler / ReduceLROnPlateau / CSVLogger", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดเปรียบเทียบสาม callback ของ §5 ได้ถูกต้อง", "options": ["Scheduler ตัดสินจากค่า monitor ที่วัดได้จริง, ReduceLROnPlateau ตัดสินจากเลข epoch ตามตาราง, CSVLogger แค่จดผลลงไฟล์", "Scheduler ตัดสินจากเลข epoch ตามตารางที่ตั้งไว้, ReduceLROnPlateau ตัดสินจากค่า monitor ที่วัดได้จริง, CSVLogger หยุดเทรนเมื่อ loss นิ่ง", "Scheduler ตัดสินจากเลข epoch ตามตารางที่ตั้งไว้, ReduceLROnPlateau ตัดสินจากค่า monitor ที่วัดได้จริง, CSVLogger แค่จดผลลงไฟล์", "Scheduler ตัดสินจากเลข batch สะสมของการเทรน, ReduceLROnPlateau ตัดสินจากค่า loss ของ train, CSVLogger แค่จดผลลงไฟล์"], "explanation": "<p><b>LearningRateScheduler</b> = ตารางเวลาที่ตั้งไว้ล่วงหน้า ตัดสินจากเลข epoch เท่านั้น เราต้องเขียนสูตรเอง และไม่มีพื้นกันตก</p><p><b>ReduceLROnPlateau</b> = ปฏิกิริยาต่อผลจริง ใช้เกณฑ์เดียวกับ EarlyStopping (monitor, patience, min_delta) ต่างกันตรงที่เมื่อครบเงื่อนไข EarlyStopping \"หยุด\" แต่ตัวนี้ \"ลด learning rate แล้วไปต่อ\" และมี min_lr เป็นพื้น</p><p><b>CSVLogger</b> = ง่ายที่สุดในบท รับแค่ชื่อไฟล์ แล้ว <mark class=\"src\" data-p=\"10\">streams the results from each epoch into a CSV file</mark> — ไม่คำนวณ ไม่ตัดสินใจ ไม่กระทบการเทรน คอลัมน์ที่ได้คือ epoc best_weights กับผล evaluate", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามตารางผล evaluate ในสไลด์หน้า 3 ถ้า<b>ไม่</b>ตั้ง <code>restore_best_weights=True</code> โมเดลที่เหลือในหน่วยความจำจะให้ val_loss เท่าใด และเป็นของ epoch ไหน", "options": ["val_loss 0.5149 ของ epoch 36 ซึ่งเป็น epoch สุดท้ายที่เทรน ไม่ใช่ epoch ที่ดีที่สุด", "val_loss 0.3819 ของ epoch 31 เพราะเป็นตัวเลขที่วัดจากชุดข้อมูลที่โมเดลไม่เคยเห็นมาก่อน", "val_loss 0.4750 ของ epoch 31 ซึ่งเป็น epoch ที่ดีที่สุด เพราะ Keras คืนให้อัตโนมัติอยู่แล้ว", "val_loss 0.4806 ของ epoch 28 ซึ่งเป็นค่าเริ่มต้นของ best ก่อนเข้าช่วงที่ val_loss ไต่ขึ้น"], "explanation": "<p>สไลด์หน้า 3 ให้ผลเทียบสามชุด: validation ตอน restore = loss 0.4750 (epoch 31), validation ตอนไม่ restore = loss 0.5149 (epoch 36), test ด้วย weight ที่ restore แล้ว = loss 0.3819</p><p>เหตุผลเชิงกลไก: การหยุดเกิดขึ้นหลังจากแย่ติดกันครบ patience รอบ ⇒ weight ในมือตอนหยุดย่อมเป็นของ epoch แย่ๆ เสมอ. ส่วนต่าง \\(0.5149-0.4750 = 0.0399\\) คือกำไรที่ได้จากการเติมอาร์กิวเมนต์ตัวเดียว</p>", "ref": "Lesson 6 §2 (สไลด์หน้า 3)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "0.3819 คือ test loss ไม่ใช่ validation loss และวัดจากโมเดลที่ restore แล้ว", "Keras ไม่คืน weight ให้เองเพราะ default คือ False ต้องสั่งเอง", "0.4806 คือ val_loss ของ epoch 28 ซึ่งไม่ใช่ epoch ที่การเทรนหยุด"]}, {"id": "L3-29", "lesson": 3, "topic": "k-fold cross validation", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "training set 1,000 ตัวอย่าง ทำ 5-fold cross validation แต่ละรอบเทรนและวัดผลด้วยกี่ตัวอย่าง และทำกี่รอบ?", "options": ["เทรน 800 วัดผล 200 ทำซ้ำ 5 รอบ", "เทรน 200 วัดผล 800 ทำซ้ำ 5 รอบ", "เทรน 800 วัดผล 200 ทำซ้ำ 4 รอบ", "เทรน 750 วัดผล 250 ทำซ้ำ 4 รอบ"], "answer": 0, "explanation": "k-fold: &quot;dividing the dataset into k subsets (folds). The model is trained on k-1 folds and validated on the remaining fold, with this process repeated k times&quot;. \\(1000/5=200\\) ต่อ fold ⇒ เทรน \\(4\\times200=800\\), วัด 200, ทำ 5 รอบ (ทุก fold ได้เป็นตัววัด 1 ครั้ง) แล้วเฉลี่ยคะแนน 5 รอบ.", "ref": "Lesson 3 §6A Cross Validation (p.39)", "why_wrong_map": ["", "สลับเป็นเทรนบน 1 fold วัดบน k−1 fold", "นับรอบเป็น k−1 — ต้องทำครบ k รอบ", "แบ่งเป็น 4 fold แทน 5"]}, {"id": "L5-26", "lesson": 5, "topic": "BatchNorm vs LayerNorm: แกนที่เฉลี่ย", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดอธิบายความต่างระหว่าง BatchNorm กับ LayerNorm ได้ถูกต้องตามสไลด์หน้า 18?", "options": ["BN normalize แต่ละ neuron ข้ามตัวอย่าง; LN normalize neuron ภายในแต่ละตัวอย่าง", "BN normalize neuron ภายในแต่ละตัวอย่าง; LN normalize แต่ละ neuron ข้ามตัวอย่าง", "LN เฉลี่ยทุกตัวเลขทั้ง mini-batch รวมกันเป็นค่าเดียว แล้วใช้กับทุก neuron", "ทั้งสองเฉลี่ยข้ามตัวอย่างเหมือนกัน ต่างกันแค่ LN ไม่มี γ และ β ให้เรียนรู้"], "answer": 0, "explanation": "วลีตัวหนาบนสไลด์: <b>BatchNorm normalizes each neuron across examples</b> (ลงตามคอลัมน์) และ LayerNorm <b>normalize the neurons within each individual example</b> (ไปตามแถว). สูตรเดียวกัน ต่างแค่แกน และ <i>Similar to BN, LN also uses Scaling and shifting</i> (มี γ, β).", "ref": "Lesson 5 §4 (สไลด์หน้า 18)", "why_wrong_map": ["", "สลับสองนิยามกัน", "ไม่ได้เฉลี่ยรวมทั้งเมทริกซ์", "LN ก็มี scaling and shifting"]}, {"id": "L1-41", "lesson": 1, "topic": "gradient line", "source": "ex1", "type": "code", "difficulty": "hard", "stem": "logistic regression แบบ vectorized: <code>a0</code> คือ X ที่เติมคอลัมน์ 1 แล้ว (m×(n+1)), <code>a1 = sigmoid(a0 @ Theta1.T)</code> (m×1) และ <code>y_matrix</code> (m×1) บรรทัดใดคำนวณ <code>Theta1_grad</code> ตามสูตร \\(\\frac{1}{m}\\sum(h-y)x_j\\) ได้ถูกต้อง?", "options": ["np.dot(a0.T, (a1 - y_matrix)) * m", "np.dot((a1 - y_matrix).T, X) / m", "np.dot((y_matrix - a1).T, a0) / m", "np.dot((a1 - y_matrix).T, a0) / m"], "answer": 3, "explanation": "<code>a1 - y_matrix</code> คือ \\(h-y\\) ของทุกตัวอย่าง (m×1). คูณ <code>(a1 - y_matrix).T @ a0</code> = (1×m)(m×(n+1)) = 1×(n+1) คือผลรวม \\(\\sum_i(h^{(i)}-y^{(i)})x_j^{(i)}\\) ของทุก j พร้อมกัน แล้วหารด้วย m. ใช้ a0 (มี bias) เพื่อให้ได้ gradient ของ \\(\\theta_0\\) ด้วย และ shape 1×(n+1) ตรงกับ Theta1.", "ref": "ex1 cell (9); Lesson 1 §6 (p.45)", "why_wrong_map": ["คูณ m แทนการหาร (และได้ shape (n+1)×1)", "ใช้ X ที่ไม่มี bias ⇒ ขาด gradient ของ θ₀ ได้ shape 1×n", "กลับเครื่องหมาย ⇒ gradient descent จะเดินขึ้นเขา", ""]}, {"id": "L5-07", "lesson": 5, "topic": "Symmetry breaking / zero init", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ถ้าตั้ง weight และ bias ทุกตัวเป็น 0 ในเครือข่ายที่มี hidden layer จะเกิดอะไรขึ้นระหว่างเทรน?", "options": ["gradient ของทุก weight ระเบิดเป็น NaN ภายในไม่กี่ step แรกของการเทรน", "hidden node แต่ละตัวแยกกันเรียน feature ต่างกันได้เร็วกว่าการสุ่ม weight", "hidden node ทุกตัวได้ค่าและ gradient เท่ากันตลอด เหมือนมี node เดียว", "โมเดลเรียนได้ตามปกติ เพียงแต่ลู่เข้าช้ากว่า He initialization เล็กน้อย"], "answer": 2, "explanation": "ไล่เลข 2→2→1: forward ได้ \\(a^{[1]}_1=a^{[1]}_2=g(0)=0.5\\); backward \\(\\delta^{[1]}=\\theta^{[2]}\\delta^{[2]}g'=0\\) และ gradient ของ \\(\\theta^{[2]}\\) ทั้งสองตัวเท่ากัน (−0.25) ⇒ หลังอัปเดตยังเท่ากัน วนซ้ำตลอด. สไลด์หน้า 4: weight ต้อง <b>random (not the same)</b> เพื่อเลี่ยง <b>redundant nodes</b> = symmetry breaking.", "ref": "Lesson 5 §2.1 (สไลด์หน้า 4)", "why_wrong_map": ["zero init ทำให้ gradient เป็น 0/เท่ากัน ไม่ได้ระเบิด", "กลับด้าน: ความสมมาตรทำให้ทุก node เรียนเหมือนกัน", "", "ไม่ใช่แค่ช้า — node ซ้ำกันตลอดกาล (cost ค้าง 0.693 ในการทดลอง)"]}, {"id": "L3-35", "lesson": 3, "topic": "Binary classification: จำนวน δ และ gradient", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "เครือข่าย binary classification: input 3 → hidden 6 → output 1 (sigmoid) ต้องคำนวณ \\(\\delta\\) ของ hidden layer กี่ค่า และ gradient ของ \\(\\theta^{[1]}\\) กี่ค่าต่อตัวอย่าง?", "options": ["δ 6 ค่า, gradient ของ θ[1] 18 ค่า", "δ 3 ค่า, gradient ของ θ[1] 24 ค่า", "δ 6 ค่า, gradient ของ θ[1] 24 ค่า", "δ 7 ค่า, gradient ของ θ[1] 28 ค่า"], "answer": 2, "explanation": "\\(\\delta_j^{(1)}=\\theta_{1j}^{[2]}\\delta_1^{(2)}g'(z_j^{[1]})\\) สำหรับ \\(j=1..6\\) — \\(a_0^{[1]}\\) (bias) ไม่มี δ เพราะเป็นค่าคงที่ 1 ไม่ได้มาจาก z ⇒ 6 ค่า. gradient \\(\\partial J/\\partial\\theta_{ji}^{[1]}=\\delta_j^{(1)}x_i\\) มี \\(6\\times(3+1)=24\\) ค่า และของ \\(\\theta^{[2]}\\) อีก \\(1\\times7=7\\) ค่า รวม 31 = จำนวนพารามิเตอร์ทั้งหมด.", "ref": "Lesson 3 §8 (p.47–48)", "why_wrong_map": ["ลืมคอลัมน์ bias ของ x (x₀) — ต้องเป็น 6×4", "นับ δ เท่าจำนวน input แทนจำนวน hidden node", "", "คิด δ ให้ bias unit ด้วย — มิติเพี้ยนทั้งเครือข่าย"]}, {"id": "L5-30", "lesson": 5, "topic": "Circle script: kernel_initializer default", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ในสคริปต์ Circle Dataset (สไลด์หน้า 22) ถ้าลบ <code>kernel_initializer='he_normal'</code> ออก Dense จะใช้ initializer ใด และคู่ที่สไลด์แนะนำสำหรับ ReLU คืออะไร?", "code": "model.add(Dense(10, activation='relu', kernel_initializer='he_normal', input_shape=(2,)))", "options": ["zeros (default); ReLU ควรคู่กับ He เท่านั้น", "glorot_uniform (default); ReLU ควรคู่กับ LeCun", "glorot_uniform (default); ReLU ควรคู่กับ He", "he_normal (default); ReLU ควรคู่กับ Xavier"], "answer": 2, "explanation": "Dense ของ Keras ใช้ <code>glorot_uniform</code> เป็นค่า default. สไลด์หน้า 8 ให้ He คู่กับ ReLU/Leaky ReLU จึงระบุ <code>kernel_initializer='he_normal'</code> ในทุก hidden layer ของสคริปต์. (สคริปต์นี้จบด้วย <code>Dense(1, activation='sigmoid')</code> + <code>binary_crossentropy</code> และ <code>Adam(learning_rate=0.03)</code>).", "ref": "Lesson 5 §5.1 (สไลด์หน้า 22)", "why_wrong_map": ["default ไม่ใช่ zeros (zero init ทำให้ node สมมาตร)", "LeCun แนะนำคู่กับ SELU", "", "he_normal ไม่ใช่ default และคู่ activation สลับ"]}, {"id": "L4-19", "lesson": 4, "topic": "โค้ด Momentum ใน Keras", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "ต้องการ Momentum ตามสไลด์หน้า 16 (\\(\\alpha=0.001,\\ \\beta=0.9\\)) บรรทัดใดถูกต้อง?", "options": ["keras.optimizers.Momentum(lr=0.001, beta=0.9)", "keras.optimizers.RMSprop(lr=0.001, rho=0.9)", "keras.optimizers.SGD(lr=0.9, momentum=0.001)", "keras.optimizers.SGD(lr=0.001, momentum=0.9)"], "answer": 3, "explanation": "<p>อาจารย์เขียนไว้ตรง ๆ ว่า \"Implementing Momentum optimization in Keras is just use the SGD optimizer and set its momentum hyperparameter\" — Keras ไม่มีคลาสชื่อ Momentum</p><p><code>lr</code> คือ \\(\\alpha\\) (ตัวคูณขนาดก้าวในบรรทัด \\(\\theta:=\\theta-\\alpha v\\)) ส่วน <code>momentum</code> คือ \\(\\beta\\) ซึ่งตั้งได้ระหว่าง 0 (high friction = ไม่มี momentum) ถึง 1 (no friction) โดยค่าปกติคือ 0.9</p>", "ref": "Lesson 4 §4.2 (สไลด์หน้า 16)", "why_wrong_map": ["ไม่มีคลาส Momentum ใน keras.optimizers", "RMSprop เป็นคนละอัลกอริทึม และ rho คือตัวเฉลี่ย gradient กำลังสอง", "สลับค่า \\(\\alpha\\) กับ \\(\\beta\\) ผิดช่อง — กับดักที่สไลด์เตือนไว้เอง", ""]}, {"id": "L2-33", "lesson": 2, "topic": "มิติของ X, θ และ Xθ เมื่อมีหลายตัวอย่าง", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ชุดข้อมูลมี 50 training example และ 4 feature (ยังไม่รวม \\(x_0\\)) เมื่อเขียนแบบ vectorized ขนาดของ \\(X\\), \\(\\theta\\) และ \\(X\\theta\\) คือข้อใด?", "options": ["\\(X: 50\\times5,\\ \\theta: 5\\times1,\\ X\\theta: 1\\times1\\)", "\\(X: 50\\times5,\\ \\theta: 5\\times1,\\ X\\theta: 50\\times1\\)", "\\(X: 50\\times4,\\ \\theta: 4\\times1,\\ X\\theta: 50\\times1\\)", "\\(X: 5\\times50,\\ \\theta: 50\\times1,\\ X\\theta: 5\\times1\\)"], "answer": 1, "explanation": "<p>กติกาของ vectorization: <b>1 แถว = 1 training example, 1 คอลัมน์ = 1 feature</b> และคอลัมน์แรกคือ \\(x_0=1\\) ทั้งแถว</p>\n<ul><li>\\(X\\): \\(m\\times(n+1) = 50\\times5\\)</li>\n<li>\\(\\theta\\): \\((n+1)\\times1 = 5\\times1\\)</li>\n<li>\\(X\\theta\\): \\((50\\times\\mathbf{5})(\\mathbf{5}\\times1) = 50\\times1\\) ⇒ คำทำนายของทุกตัวอย่างเรียงเป็นคอลัมน์เดียว ได้มาในการคูณครั้งเดียว</li></ul>\n<p>กับดักที่พบบ่อย: ลืมคอลัมน์ \\(x_0\\) ทำให้เขียน \\(X\\) เป็น \\(m\\times n\\) หรือคิดว่าผลลัพธ์เป็นสเกลาร์ทั้งที่มีหลายตัวอย่าง</p>", "ref": "Lesson 2 §6 (Lecture2.pdf p.40)", "why_wrong_map": ["ผลลัพธ์เป็นสเกลาร์ได้เฉพาะตอนมีตัวอย่างเดียว", "", "ลืมคอลัมน์ \\(x_0=1\\) ซึ่งต้องเติมเข้าไปเป็นคอลัมน์แรกเสมอ", "สลับแถวกับคอลัมน์ของ \\(X\\) (1 แถวต้องเป็น 1 ตัวอย่าง)"]}, {"id": "L3-55", "lesson": 3, "topic": "เติมสองบรรทัดของ forward", "source": "ex_shallow_nn", "type": "code", "difficulty": "medium", "stem": "ในการคำนวณ forward ช่องที่ต้องเติมคือ <code>a1 = ...</code> และ <code>z2 = ...</code> (ก่อนเติม bias ค่า a1 มี shape (m,8) และ Theta2 มี shape (1,9)) ข้อใดถูกต้อง?", "code": "a0 = np.concatenate([np.ones((m, 1)), X], axis=1)\nz1 = np.dot(a0, Theta1.T)\na1 = sigmoid(z1)\na1 = #### your code #####\nz2 = #### your code #####\na2 = sigmoid(z2)", "options": ["a1 = np.concatenate([np.ones((m,1)), a1], axis=1) ; z2 = np.dot(a1, Theta2)", "a1 = np.concatenate([np.ones((m,1)), a1], axis=1) ; z2 = np.dot(a1, Theta2.T)", "a1 = np.concatenate([a1, np.ones((m,1))], axis=1) ; z2 = np.dot(Theta2, a1)", "a1 = np.concatenate([np.ones((m,1)), a1], axis=0) ; z2 = np.dot(a1, Theta2.T)"], "answer": 1, "explanation": "ขั้นแรกคือ add bias: ต่อคอลัมน์ของเลข 1 ไว้ <em>ด้านหน้า</em> ด้วย axis=1 ⇒ a1 กลายเป็น (m,9) ตรงกับ 9 คอลัมน์ของ Theta2 ที่คอลัมน์ 0 เป็นช่อง bias. ขั้นที่สอง: Theta2 มี shape (1,9) ⇒ ต้อง transpose เป็น (9,1) ก่อน ⇒ (m,9)·(9,1) = (m,1) ซึ่งตรงกับ y_matrix ที่เป็น (m,1). รูปแบบนี้เหมือนบรรทัด <code>z1 = np.dot(a0, Theta1.T)</code> ทุกประการ.", "ref": "ex_shallow_nn (2) nnCostFunction forward; Lesson 3 §4 (p.17)", "why_wrong_map": ["ไม่ transpose — (m,9)·(1,9) คูณกันไม่ได้ มิติไม่ตรง", "", "วาง bias ไว้คอลัมน์สุดท้ายและสลับลำดับ dot ทำให้ไม่ตรงกับ Theta2", "axis=0 ต่อเป็นแถว ทำให้จำนวนตัวอย่างเพิ่มแทนที่จะเพิ่มคอลัมน์ bias"]}, {"id": "L6-46", "topic": "จำนวน trial ของแต่ละ tuner", "source": "tuning_notebook", "type": "code", "difficulty": "medium", "stem": "ใน notebook IMDB ตั้ง <code>kt.RandomSearch(..., max_trials=30)</code> และ <code>kt.Hyperband(..., max_epochs=30, factor=3)</code> ผลที่ปรากฏคือ RandomSearch จบที่ Trial 30 แต่ Hyperband จบที่ Trial 90 เพราะอะไร", "options": ["Hyperband ตั้ง max_epochs=30 จึงเทรนทุก configuration ครบ 30 epoch แล้วคูณด้วย factor=3 ได้ 90 พอดี", "RandomSearch นับเฉพาะ trial ที่ผ่านเกณฑ์ ส่วน Hyperband นับ trial ที่ถูกตัดทิ้งระหว่างทางเข้าไปด้วย", "Hyperband รัน 3 รอบของ RandomSearch ต่อกัน เพราะ factor=3 หมายถึงจำนวนรอบการค้นหาทั้งหมด", "Hyperband ไม่ได้กำหนดจำนวน trial ตรงๆ แต่รันหลาย bracket หลายรอบ จำนวน trial จึงมาจาก max_epochs กับ factor"], "explanation": "<p><code>RandomSearch</code> รับ <code>max_trials</code> ตรงๆ = สุ่มมา 30 ชุดแล้วจบ (<mark class=\"src\" data-p=\"26\">a specified number of randomly selected hyperparameter combinations</mark>)</p><p><code>Hyperband</code> ไม่มี max_trials — จำนวน trial เกิดจากโครงสร้าง bracket: <code>max_epochs</code> (= max_iter) กับ <code>factor</code> (= \\(\\eta\\)) กำหนดว่ามีกี่ bracket แต่ละ bracket มีกี่รอบและแต่ละรอบเริ่มด้วย configuration กี่ตัว ⇒ รวมกันได้ 90 trial ในคาบนี้ (และ 211 trial ในตัวอย่างของสไลด์หน้า 31)</p><p>ผลลัพธ์ในคาบ: RandomSearch ได้ Best val_loss 0.2654 ใน 6 นาที 57 วินาที ส่วน Hyperband ได้ 0.2646 ใน 15 นาที 38 วินาที</p>", "ref": "tuning notebook · RandomSearch / Hyperband cells", "lesson": 6, "answer": 3, "why_wrong_map": ["max_epochs คืองบสูงสุดต่อโมเดลหนึ่งตัว ไม่ได้เอามาคูณกับ factor เป็นจำนวน trial", "ทั้งสอง tuner นับทุก trial ที่รัน ไม่มีการนับเฉพาะตัวที่ผ่านเกณฑ์", "factor คือตัวหารจำนวนผู้รอดในแต่ละรอบ ไม่ใช่จำนวนรอบการค้นหา", ""]}, {"id": "L4-49", "lesson": 4, "topic": "ex2: validation curve ของ dropout", "source": "ex2", "type": "code", "difficulty": "medium", "stem": "จากผล validation curve ของ dropout ใน ex2 ควรเลือกค่าใด และมันหมายถึง dropout rate เท่าใด?", "options": ["เลือก keep_prob = 0.5 (ปิด node มากที่สุด) ซึ่งเท่ากับ dropout rate 0.1", "เลือก keep_prob = 0.6 (val error 0.2634 ต่ำสุด) ซึ่งเท่ากับ dropout rate 0.6", "เลือก keep_prob = 0.9 (val error 0.2438 ต่ำสุด) ซึ่งเท่ากับ dropout rate 0.1", "เลือก keep_prob = 0.9 (val error 0.2438 ต่ำสุด) ซึ่งเท่ากับ dropout rate 0.9"], "answer": 2, "explanation": "<p>อ่านคอลัมน์ validation: 0.5 → 0.3306, 0.6 → 0.2634, 0.7 → 0.2742, 0.8 → 0.2653, <b>0.9 → 0.2438 (ต่ำสุด)</b> ⇒ เลือก keep_prob = 0.9 ตามที่คอมเมนต์ในโน้ตบุ๊กเขียนไว้ (\"in my case 0.9\")</p><p>แปลงเป็น dropout rate: \\(\\text{rate} = 1-\\text{keep\\_prob} = 0.1\\) ซึ่งอยู่ปลายล่างของช่วง 0.1–0.5 ที่สไลด์หน้า 28 แนะนำ — สมเหตุสมผลเพราะเครือข่ายนี้เล็กมาก (hidden 10 unit) การปิดครึ่งหนึ่ง (keep_prob 0.5) ทำให้ train error พุ่งเป็น 0.2404 และ val แย่ที่สุด คือ underfit</p><p>ผลลัพธ์: retrain ด้วย keep_prob 0.9 ได้ test accuracy 86% เทียบกับ 88% ของ L2 ที่ \\(\\lambda=0.03\\)</p>", "ref": "ex2 cell validationCurve_dropout (ผลตาราง keep_prob)", "code": "KEEP PROB\tTrain Error\tValidation Error\n 0.500000\t0.240401\t0.330565\n 0.600000\t0.218293\t0.263417\n 0.700000\t0.199537\t0.274162\n 0.800000\t0.181791\t0.265326\n 0.900000\t0.165354\t0.243792", "why_wrong_map": ["keep_prob 0.5 ให้ผลแย่ที่สุดในตาราง และ rate ของมันคือ 0.5", "อ่านค่าต่ำสุดผิดแถว 0.6 ให้ 0.2634 ไม่ใช่ค่าต่ำสุด", "", "สับสน keep_prob กับ dropout rate ซึ่งเป็นค่าตรงข้ามกัน"]}, {"id": "L4-44", "lesson": 4, "topic": "ex2: รูปร่างของ mask D", "source": "ex2", "type": "code", "difficulty": "hard", "stem": "ใน ex2 (input 2, hidden 10, output 1, ชุดเทรน 150 แถว) mask <code>D = np.random.rand(*a1.shape)</code> มีขนาดเท่าใด?", "options": ["(150, 1)", "(150, 10)", "(10, 150)", "(150, 11)"], "answer": 1, "explanation": "<p><code>a1 = relu(z1)</code> โดย <code>z1 = a0 @ Theta1.T</code> ซึ่ง <code>a0</code> คือ (150, 3) และ <code>Theta1.T</code> คือ (3, 10) ⇒ <code>a1</code> คือ <b>(150, 10)</b></p><p>จุดสำคัญ: dropout ถูกทำ<b>ก่อน</b>บรรทัด <code>a1 = np.concatenate([np.ones(...), a1], axis=1)</code> ที่เติมคอลัมน์ bias ⇒ mask จึงมี 10 คอลัมน์ ไม่ใช่ 11 — เราไม่ dropout ตัว bias ที่มีค่าเป็น 1 เสมอ</p><p>แต่ละแถวของ D คือการสุ่มของตัวอย่างนั้น ๆ ดังนั้นตัวอย่างต่างกันก็ถูกปิดคนละ node</p>", "ref": "ex2 cell nnCostFunction", "code": "a0 = np.concatenate([np.ones((m, 1)), X], axis=1)   # (150, 3)\nz1 = np.dot(a0, Theta1.T)                            # Theta1: (10, 3)\na1 = relu(z1)\nD = np.random.rand(*a1.shape)", "why_wrong_map": ["เข้าใจว่า mask มีตัวเดียวต่อตัวอย่าง แต่จริง ๆ สุ่มแยกรายหน่วย", "", "สลับแกน — แถวคือตัวอย่าง คอลัมน์คือ hidden unit", "นับคอลัมน์ bias เข้าไปด้วย แต่ dropout ทำก่อนเติม bias"]}, {"id": "L4-25", "lesson": 4, "topic": "Adam: องค์ประกอบและค่า default", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "Adam รวมแนวคิดของอะไรเข้าด้วยกัน และค่า default ตามสไลด์หน้า 22 คือข้อใด?", "options": ["Batch GD กับ SGD โดยเก็บขนาด batch สองค่าไว้สลับใช้ในแต่ละ iteration ด้วย \\(\\beta_1=0.9,\\ \\beta_2=0.999\\)", "Momentum กับ RMSProp โดยเก็บ \\(v\\) (โมเมนต์ที่หนึ่ง) และ \\(s\\) (โมเมนต์ที่สอง) ด้วย \\(\\beta_1=0.999,\\ \\beta_2=0.9\\)", "L1 กับ L2 regularization โดยเก็บค่า \\(\\lambda\\) สองค่าไว้ปรับการอัปเดต ด้วย \\(\\beta_1=0.9,\\ \\beta_2=0.999\\)", "Momentum กับ RMSProp โดยเก็บ \\(v\\) (โมเมนต์ที่หนึ่ง) และ \\(s\\) (โมเมนต์ที่สอง) ด้วย \\(\\beta_1=0.9,\\ \\beta_2=0.999\\)"], "answer": 3, "explanation": "<p>Adam (Kingma &amp; Ba, 2014) เดินสองสมการคู่กันทุกก้าว: \\(v := \\beta_1 v + (1-\\beta_1)g\\) (ส่วน Momentum) และ \\(s := \\beta_2 s + (1-\\beta_2)g^2\\) (ส่วน RMSProp) แล้วอัปเดต \\(\\theta := \\theta - \\alpha\\,v/\\sqrt{s+\\epsilon}\\)</p><p>ค่า default: \\(\\beta_1=0.9\\) (momentum decay), \\(\\beta_2=0.999\\) (scaling decay), \\(\\epsilon=10^{-7}\\) และ \\(v,s\\) เริ่มที่ 0</p><p>ทำไม \\(\\beta_2\\) ใหญ่กว่า: \\(s\\) วัด \\\"สเกลของ gradient\\\" ซึ่งควรนิ่งมาก (จำยาว ~1000 ก้าว) ส่วน \\(v\\) ชี้ \\\"ทิศตอนนี้\\\" ซึ่งควรไวกว่า (~10 ก้าว)</p>", "ref": "Lesson 4 §5.2 (สไลด์หน้า 22)", "why_wrong_map": ["Adam ไม่เกี่ยวกับการสลับ batch size", "สลับค่า 0.9 กับ 0.999 — ต้องจำว่าตัวกำลังสอง (\\(\\beta_2\\)) ใหญ่กว่า", "\\(\\beta\\) ไม่ใช่ \\(\\lambda\\) ของ regularization", ""]}, {"id": "L6-20", "topic": "คำนวณ learning rate ของ scheduler (คูณซ้อน)", "source": "callbacks_notebook", "type": "calc", "difficulty": "hard", "stem": "compile ด้วย <code>Adam(learning_rate=0.03)</code> แล้วใช้ scheduler ด้านล่าง (Keras ส่ง learning rate ปัจจุบันเข้ามาเป็นอาร์กิวเมนต์ตัวที่สองเสมอ) learning rate ที่ใช้ใน epoch index 3 คือเท่าใด", "code": "def lr_function(epoch, lr=0.01, decay_rate=0.9, decay_steps=2):\n  exp = np.floor((1+epoch) / decay_steps)\n  alpha = lr * (decay_rate ** exp)\n  return float(alpha)", "options": ["0.027000", "0.019683", "0.021870", "0.024300"], "explanation": "<p>เลขชี้กำลัง \\(\\lfloor (1+e)/2 \\rfloor\\) ของ epoch index 0–3 คือ 0, 1, 1, 2</p><p>กับดักสำคัญ: ตัวแปร <code>lr</code> คือค่า<b>ปัจจุบัน</b>ที่ Keras ส่งเข้ามา (ค่า default 0.01 ในนิยามฟังก์ชันไม่เคยถูกใช้) จึงคูณซ้อนทับของเดิมไปเรื่อยๆ:</p><p>\\(e=0:\\ 0.03\\times0.9^{0} = 0.03\\)<br>\\(e=1:\\ 0.03\\times0.9^{1} = 0.027\\)<br>\\(e=2:\\ 0.027\\times0.9^{1} = 0.0243\\)<br>\\(e=3:\\ 0.0243\\times0.9^{2} = 0.0243\\times0.81 = 0.019683\\)</p><p>ตรงกับ log ที่รันในคาบ (epoch 5 พิมพ์ 0.015943229757249357). ถ้าเทรนยาว 50 epoch เลขชี้กำลังสะสม \\(\\sum_{e=0}^{49}\\lfloor (1+e)/2 \\rfloor = 625\\) ⇒ \\(0.03\\times0.9^{625} \\approx 7.56\\times10^{-31}\\) โมเดลหยุดเรียนรู้</p>", "ref": "Lesson 6 §5.1 · callbacks notebook LearningRateScheduler", "lesson": 6, "answer": 1, "why_wrong_map": ["เป็นค่าของ epoch index 1 ไม่ใช่ index 3", "", "ใช้เลขชี้กำลังเป็น 3 ตรงๆ แทนที่จะปัดลงเป็น 2 ตามสูตร floor", "คิดจากค่าตั้งต้น 0.03 ทุกครั้ง (0.03×0.9²) โดยลืมว่าสูตรคูณซ้อน"]}, {"id": "L5-46", "lesson": 5, "topic": "train_test_split vs validation_split", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ข้อใดถูกต้องเกี่ยวกับโค้ดสไลด์หน้า 36 เทียบกับ <code>fit(..., validation_split=0.2)</code>?", "code": "from sklearn.model_selection import train_test_split\nXrain, Xval, y_train, yval = train_test_split(X, y, test_size = 0.2)\nmodel.fit(Xrain, y_train, validation_data=(Xval,yval))", "options": ["ได้ 48,000/12,000 เหมือนกัน แต่ validation_split สุ่มสลับก่อนแบ่ง", "ได้ 48,000/12,000 เหมือนกัน แต่ train_test_split สุ่มสลับก่อนแบ่ง", "ได้ 12,000/48,000 เพราะ test_size=0.2 คือสัดส่วนของชุดที่ใช้เทรน", "train_test_split มาจาก keras.utils จึงใช้ร่วมกับ validation_split ได้"], "answer": 1, "explanation": "<code>train_test_split</code> มาจาก <b>sklearn.model_selection</b> คืนค่า 4 ก้อนตามลำดับ X_train, X_val, y_train, y_val; <code>test_size=0.2</code> = กัน 20% เป็นชุดที่สอง ⇒ 48,000 / 12,000 และสุ่มสลับก่อน. ส่วน <code>validation_split</code> ของ Keras ตัด 20% <b>ท้าย</b>ชุดโดยไม่สุ่ม. ใช้ <code>validation_data=(Xval,yval)</code> กับ validation_split พร้อมกันไม่ได้.", "ref": "Lesson 5 §6.2 (สไลด์หน้า 36)", "why_wrong_map": ["สลับกัน: validation_split ตัดท้ายไม่สุ่ม", "", "test_size คือสัดส่วนชุดที่สอง", "มาจาก sklearn และไม่ใช้คู่กัน"]}, {"id": "L2-34", "lesson": 2, "topic": "บรรทัด gradient แบบ vectorized", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ในฟังก์ชัน gradientDescent เวอร์ชัน vectorized บรรทัด <code>(np.dot(X, theta) - y).dot(X)</code> ให้ผลลัพธ์เป็นอะไร เมื่อ X มีขนาด m×(n+1)?", "options": ["เมทริกซ์ขนาด m×(n+1) คือค่าคลาดเคลื่อนถ่วงน้ำหนักทีละช่อง", "เวกเตอร์ยาว m ช่อง คือค่าคลาดเคลื่อนของแต่ละ training example", "เวกเตอร์ยาว n+1 ช่อง คือ gradient ของพารามิเตอร์ทุกตัวพร้อมกัน", "สเกลาร์ตัวเดียว คือค่า cost เฉลี่ยของรอบการอัปเดตนั้น"], "answer": 2, "explanation": "<p>ไล่มิติทีละขั้น:</p>\n<ol><li><code>np.dot(X, theta)</code> ⇒ \\((m\\times(n{+}1))((n{+}1)\\times1)\\) = เวกเตอร์ยาว \\(m\\) (คำทำนายทุกตัวอย่าง)</li>\n<li><code>- y</code> ⇒ ยังยาว \\(m\\) (เวกเตอร์ความผิดพลาด)</li>\n<li><code>.dot(X)</code> ⇒ \\((m,)\\cdot(m\\times(n{+}1))\\) = เวกเตอร์ยาว \\(n+1\\)</li></ol>\n<p>ช่องที่ \\(j\\) ของผลลัพธ์คือ \\(\\sum_i (h^{(i)}-y^{(i)})x_j^{(i)}\\) ซึ่งตรงกับเทอมผลรวมในสูตร \\(\\theta_j := \\theta_j - \\frac{\\alpha}{m}\\sum_i(h^{(i)}-y^{(i)})x_j^{(i)}\\) พอดี — ได้ gradient ครบทุกตัวในคำสั่งเดียว และอัปเดตพร้อมกันโดยอัตโนมัติ (ไม่ต้องทำ theta1 แยกเหมือนเวอร์ชันลูป)</p>", "ref": "Lesson 2 §6 (Lecture2.pdf p.43)", "why_wrong_map": ["การ dot ยุบแกน \\(m\\) ทิ้ง จึงไม่เหลือเป็นเมทริกซ์", "นั่นคือผลของ \\(X\\theta - y\\) ก่อนจะ dot กับ \\(X\\) อีกที", "", "cost คำนวณด้วย np.sum(np.square(h - y)) ต่างหาก"]}, {"id": "L4-06", "lesson": 4, "topic": "4 ปัญหาของ deep network", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามสไลด์หน้า 5 อาจารย์ระบุว่า deep learning model เป็น \"overfitting in nature\" ด้วยเหตุผลใด?", "options": ["เพราะโมเดลมีพารามิเตอร์จำนวนมหาศาล และจะยิ่งเสี่ยงขึ้นเมื่อตัวอย่างไม่พอหรือข้อมูลมี noise มาก", "เพราะโมเดลใช้ activation แบบไม่เชิงเส้น ซึ่งทำให้ cost function มี local minimum จำนวนมาก", "เพราะโมเดลมักตั้ง learning rate สูงเกินไป ทำให้ก้าวกระโดดจนจำข้อมูลเทรนได้ทั้งหมดอย่างรวดเร็ว", "เพราะโมเดลใช้ mini-batch ขนาดเล็ก ทำให้ gradient แกว่งจนโมเดลจำรายละเอียดของแต่ละก้อนไว้"], "answer": 0, "explanation": "<p>สไลด์หน้า 5 บอกว่าโมเดลที่มี \"millions of parameters\" เสี่ยง overfit training set อย่างรุนแรง และขยายความว่าจะหนักขึ้นเมื่อ <i>ตัวอย่างไม่พอ</i> หรือ <i>ข้อมูลมี noise มาก</i></p><p>ให้แยกให้ออก: จำนวนพารามิเตอร์คือ <b>ต้นเหตุ</b> ส่วนอีกสองข้อคือ <b>ตัวขยายความเสี่ยง</b> และจำไว้ว่า \"จำนวนพารามิเตอร์\" (ตัวขับ overfit) กับ \"ความลึก\" (ตัวขับ vanishing) เป็นคนละปริมาณ — \\([2,10,10,10,1]\\) มี 261 พารามิเตอร์ ขณะที่ \\([2,50,1]\\) ที่ตื้นกว่ามี 201</p>", "ref": "Lesson 4 §2 (สไลด์หน้า 5)", "why_wrong_map": ["", "local minima เป็นปัญหาคนละข้อ (Cons2 ของ Batch GD หน้า 8)", "สไลด์ระบุต้นเหตุเป็นจำนวนพารามิเตอร์ ไม่ใช่ learning rate", "mini-batch ที่ noisy เป็นเรื่องของ optimizer ไม่ใช่สาเหตุของ overfit ตามสไลด์"]}, {"id": "L1-03", "lesson": 1, "topic": "Timeline AI/ML/DL", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ปีใดที่ Yann LeCun รวม convolutional neural network เข้ากับ backpropagation จนอ่านตัวเลขลายมือได้สำเร็จ ซึ่งนับเป็นการใช้งาน neural network จริงครั้งแรก?", "options": ["1989", "2010", "2014", "1943"], "answer": 0, "explanation": "เส้นเวลาสำคัญ: <b>1943</b> McCulloch–Pitts (artificial neuron แรก), <b>1989</b> LeCun: CNN + backpropagation อ่านลายมือ (first successful practical application of neural nets), <b>2010</b> deep learning เริ่มพุ่ง, <b>2014</b> GANs, <b>2017</b> Transformer. ช่องว่าง 1943 → 1989 → 2010 บอกว่าทฤษฎีมีมานาน สิ่งที่มาทีหลังคือข้อมูลและ GPU.", "ref": "Lesson 1 §0A (p.11)", "why_wrong_map": ["", "2010 คือช่วงที่ deep learning เริ่มพุ่ง", "2014 คือปีของ GANs", "1943 คือ McCulloch–Pitts สร้างแบบจำลอง neuron ยังไม่มี backprop"]}, {"id": "L6-29", "topic": "อาการของ exploding gradient", "source": "tensorboard_notebook", "type": "concept", "difficulty": "easy", "stem": "สามอาการของ exploding gradient ที่สไลด์หน้า 17 ระบุไว้คือข้อใด", "options": ["weight ของ layer ล่างแทบไม่เปลี่ยน, loss ลดช้ามากผิดปกติ, และ accuracy ค้างที่ระดับการเดาสุ่ม", "loss ลดเร็วผิดปกติในช่วงแรก, validation loss ไต่ขึ้นเรื่อยๆ, และ weight ทุกชั้นมีค่าเท่ากันหมด", "โมเดลจับข้อมูล train ไม่ได้ (loss แย่), overfit กับ training set อย่างรุนแรง, และ loss กลายเป็น NaN", "โมเดลจับข้อมูล train ไม่ได้ (loss แย่), ไม่เสถียร loss เปลี่ยนแรงระหว่าง update, และ loss กลายเป็น NaN"], "explanation": "<p>สไลด์ไล่อาการไว้สามข้อตรงๆ: <mark class=\"src\" data-p=\"17\">The model is unable to get traction on your training data (e.g. poor loss)</mark>, <mark class=\"src\" data-p=\"17\">The model is unstable, resulting in large changes in loss from update to update</mark> และ <mark class=\"src\" data-p=\"17\">The model loss goes to NaN during training</mark></p><p>สไลด์สรุปว่า exploding ทำให้เกิด <mark class=\"src\" data-p=\"17\">unstable network</mark> ที่ at best เรียนรู้จากข้อมูลไม่ได้ และ at worst ได้ weight เป็น NaN ที่อัปเดตต่อไม่ได้อีก</p><p>ในคาบ อาจารย์ดัน <code>SGD(learning_rate=0.2, momentum=0.9)</code> บนโมเดล ReLU+He ผลคือ accuracy 0.5088 / loss 0.6943 ที่ epoch 50 — โครงสร้างโมเดลไม่ใช่ตัวปัญหา ตัวแปรเดียวที่เปลี่ยนคือ learning rate</p>", "ref": "Lesson 6 §7 (สไลด์หน้า 17) · tensorboard notebook", "lesson": 6, "answer": 3, "why_wrong_map": ["นั่นคืออาการของ vanishing gradient ที่ weight ชั้นล่างแทบไม่ขยับ", "อธิบายอาการ overfitting ทั่วไป ไม่ใช่สามอาการที่สไลด์ระบุ", "exploding ไม่ได้ทำให้ overfit — อาการที่สองคือความไม่เสถียรของ loss", ""]}, {"id": "L6-45", "topic": "นับพารามิเตอร์ของโมเดล IMDB ที่ชนะการจูน", "source": "tuning_notebook", "type": "calc", "difficulty": "hard", "stem": "โมเดลสุดท้ายของ notebook IMDB มี input เป็น multi-hot ขนาด 10,000 ช่อง → Dense(64, relu) → Dropout(0.4) → Dense(1, sigmoid) มี trainable parameter กี่ตัว", "options": ["640,129", "640,064", "640,065", "641,000"], "explanation": "<p>Dense ชั้นแรก: \\(10000\\times64 + 64 = 640{,}000 + 64 = 640{,}064\\)</p><p>Dropout: 0 พารามิเตอร์ (เป็นแค่การสุ่มปิด unit ไม่มีตัวเลขให้เรียนรู้)</p><p>Dense output: \\(64\\times1 + 1 = 65\\)</p><p>รวม \\(640{,}064 + 65 = 640{,}129\\) ตรงกับ <code>Total params: 640,129 (2.44 MB)</code> ในคาบ</p><p>ต่อยอด: เมื่อเซฟเป็น .keras แล้วโหลดกลับ summary จะขึ้น Optimizer params 1,280,260 ซึ่ง \\(\\approx 2\\times640{,}129 = 1{,}280{,}258\\) บวกตัวแปรเดี่ยวอีก 2 ตัว — หลักการเดียวกับ 524 ของโมเดล circle</p>", "ref": "tuning notebook · final_model.summary()", "lesson": 6, "answer": 0, "why_wrong_map": ["", "นับเฉพาะ Dense ชั้นแรก ลืม output layer อีก 65 ตัว", "ลืม bias ของ Dense ชั้นแรก 64 ตัว", "ปัดตัวเลขโดยไม่ได้คำนวณ bias ของทั้งสองชั้นให้ครบ"]}, {"id": "L1-32", "lesson": 1, "topic": "L2 regularization penalty", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ใช้ L2 penalty \\(\\frac{\\lambda}{m}\\sum_{j=1}^{n}\\theta_j^2\\) กับ \\(\\theta_0=5,\\ \\theta_1=2,\\ \\theta_2=-1\\), \\(\\lambda=2\\), \\(m=4\\) ค่าปรับที่บวกเข้า cost คือเท่าใด?", "options": ["1.5", "2.5", "15.0", "5.0"], "answer": 1, "explanation": "ผลรวมเริ่มที่ \\(j=1\\) ⇒ ไม่ปรับ \\(\\theta_0\\): \\(\\theta_1^2+\\theta_2^2=4+1=5\\). คูณ \\(\\lambda/m=2/4=0.5\\) ⇒ \\(2.5\\). กำลังสองทำให้ \\(\\theta_2=-1\\) ถูกปรับเท่ากับ +1. regularization แบบนี้ keep all features แต่กด \\(\\theta\\) ให้เล็กลง towards zero but not zero.", \theta^{[1]}\\) เป็น \\(8\\times4\\) และ \\(\\theta^{[2]}\\) เป็น \\(1\\times9\\). จึงคลี่แต่ละเมทริกซ์ (ravel, row-major) แล้วต่อกันเป็นเวกเตอร์ยาว 32+9=41 และ reshape กลับเมื่อจะใช้คำนวณ.", "ref": "Lesson 3 §4A.4 Unrolling (p.22)", "why_wrong_map": ["", "จำนวนสมาชิกเท่าเดิม ไม่ได้ลดลง", "unroll ไม่เปลี่ยนขนาดใด ๆ และ forward ใช้รูปเมทริกซ์เดิมหลัง reshape", "ravel/concatenate ไม่สุ่มลำดับ และต้องคงลำดับไว้เพื่อ reshape กลับ"]}, {"id": "L6-14", "topic": "เติมโค้ด ModelCheckpoint แบบเลือกตัวที่ดีที่สุด", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ต้องการให้ไฟล์ที่เหลือบนดิสก์เป็น weight ของ epoch ที่ <b>val_loss ต่ำที่สุด</b> บรรทัดใดถูกต้อง", "options": ["ModelCheckpoint(p, save_weights_only=True, save_best_only=True, monitor='val_loss', mode='min')", "ModelCheckpoint(p, save_weights_only=True, save_best_only=True, monitor='val_loss', mode='max')", "ModelCheckpoint(p, save_weights_only=True, save_best_only=False, monitor='val_loss', mode='min')", "ModelCheckpoint(p, save_weights_only=True, save_best_only=True, monitor='val_loss', save_freq=1)"], "explanation": "<p>ต้องครบสามอย่าง: <code>save_best_only=True</code> (ไม่งั้นเซฟทุก epoch), <code>monitor='val_loss'</code> (ตัวเลขที่ใช้ตัดสิน) และ <code>mode='min'</code> ให้สอดคล้องกับ val_loss ที่ยิ่งน้อยยิ่งดี</p><p>กับดักที่สไลด์เตือน: ถ้าใส่ <code>mode='max'</code> กับ val_loss จะกลายเป็นเซฟเฉพาะตอน loss สูงสุด = ได้โมเดลที่แย่ที่สุด. ส่วน <code>mode='auto'</code> (default) Keras เดาให้เองจากชื่อ metric แต่ถ้าระบุเองต้องระบุให้ถูกทิศ</p>", "ref": "Lesson 6 §3 (สไลด์หน้า 7)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "mode='max' กับ val_loss จะเซฟตอน loss สูงสุด ได้โมเดลที่แย่ที่สุดแทน", "save_best_only=False ทำให้เซฟทุก epoch จึงเหลือไฟล์ของ epoch สุดท้าย", "save_freq=1 หมายถึงเซฟทุก 1 batch ไม่ใช่เงื่อนไขที่ทำให้ได้ตัวที่ดีที่สุด และไม่มี mode"]}, {"id": "L3-19", "lesson": 3, "topic": "ปัญหา not zero-centered ของ sigmoid", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "ถ้า hidden layer ใช้ sigmoid gradient ของ weight ทุกเส้นที่เข้า output node เดียวกันคือ \\((h-y)\\,a_j^{[1]}\\) ผลที่ตามมาคือข้อใด?", "options": ["เพราะ \\(a_j>0\\) ทุกตัว gradient ทั้งแถวเครื่องหมายเดียวกัน จึงต้องเดินซิกแซก", "เพราะ \\(a_j\\) อยู่ใน [−1,1] gradient แต่ละตัวอิสระต่อกัน จึงเดินเฉียงตรงได้", "เพราะ \\(a_j>0\\) ทุกตัว gradient ทุกตัวเป็นบวกเสมอ weight จึงลดลงพร้อมกันทุกรอบ", "เพราะ \\(a_j<0\\) บางตัว gradient ทั้งแถวหักล้างกันเป็นศูนย์ จึงไม่เรียนรู้เลย"], "answer": 0, "explanation": "sigmoid ให้ \\(a_j\\in(0,1)\\) บวกเสมอ ⇒ เครื่องหมายของ gradient ทุกตัวในแถวถูกกำหนดโดย \\((h-y)\\) ตัวเดียว ⇒ weight ทั้งแถวได้แค่ &quot;ขึ้นพร้อมกัน&quot; หรือ &quot;ลงพร้อมกัน&quot;. ถ้าเป้าหมายอยู่ทิศ \\(w_1\\) ขึ้น \\(w_2\\) ลง ต้องสลับไปมาเป็นซิกแซก ⇒ ช้า. tanh (zero-centered, [−1,1]) ไม่มีข้อจำกัดนี้ — จึงเป็น &quot;outputs - not zero-centered&quot; ในช่องข้อเสียของ sigmoid.", "ref": "Lesson 3 §5A.4 (p.28)", "why_wrong_map": ["", "นี่คือพฤติกรรมของ tanh ไม่ใช่ sigmoid", "เครื่องหมายขึ้นกับ (h−y) ซึ่งเป็นได้ทั้งบวกและลบ ไม่ใช่บวกเสมอ", "sigmoid ไม่ให้ค่าลบ และเครื่องหมายเดียวกันไม่หักล้างกัน"]}, {"id": "L2-35", "lesson": 2, "topic": "gradient descent หนึ่งรอบด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ให้ \\(X=\\begin{bmatrix}1&1\\\\1&2\\\\1&3\\end{bmatrix}\\), \\(y=[2,4,6]^\\top\\), \\(\\theta\\) เริ่มที่ \\([0,0]^\\top\\), \\(\\alpha=0.3\\), \\(m=3\\) หลังอัปเดต gradient descent \\(\\theta:=\\theta-\\frac{\\alpha}{m}(X\\theta-y)^\\top X\\) หนึ่งรอบ \\(\\theta\\) เป็นเท่าใด?", "options": ["\\([2.8,\\ 1.2]^\\top\\)", "\\([1.2,\\ 2.8]^\\top\\)", "\\([-1.2,\\ -2.8]^\\top\\)", "\\([3.6,\\ 8.4]^\\top\\)"], "answer": 1, "explanation": "<ol><li>ทำนาย: \\(h = X\\theta = [0,0,0]^\\top\\) ⇒ \\(h-y = [-2,-4,-6]^\\top\\)</li>\n<li>\\((h-y)^\\top X\\) ทีละคอลัมน์:\n<ul><li>\\(x_0\\): \\(-2-4-6 = -12\\)</li>\n<li>\\(x_1\\): \\(-2(1)-4(2)-6(3) = -28\\)</li></ul></li>\n<li>อัปเดต: \\(\\theta \\leftarrow [0,0]^\\top - \\frac{0.3}{3}[-12,-28]^\\top = [1.2,\\ 2.8]^\\top\\)</li></ol>\n<p>cost (MSE) ลดจาก \\(J\\approx18.67\\) เหลือ \\(\\approx8.27\\) ในก้าวเดียว — gradient ติดลบแปลว่าต้อง<b>เพิ่ม</b> \\(\\theta\\) เพื่อลด cost</p>", "ref": "Lesson 2 §6 (Lecture2.pdf p.43)", "why_wrong_map": ["สลับตำแหน่งของ \\(\\theta_0\\) กับ \\(\\theta_1\\) ในเวกเตอร์คำตอบ", "", "เครื่องหมายผิด — gradient เป็นลบ การลบค่าลบจึงทำให้ \\(\\theta\\) เพิ่มขึ้น", "ลืมหารด้วย \\(m=3\\) (ใช้ \\(\\alpha\\) เปล่า ๆ แทน \\(\\alpha/m\\))"]}, {"id": "L2-10", "lesson": 2, "topic": "นิยาม MLP", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดคือนิยามโครงสร้างของ Multilayer Perceptron (MLP) ที่ถูกต้อง?", "options": ["ชั้นของ TLU หลายชั้นที่ต่อกันโดยไม่มี output layer แยกออกมาต่างหาก", "input layer 1 ชั้น + ชั้นของ TLU อย่างน้อยสองชั้น (hidden) + output layer 1 ชั้น", "input layer ที่นับเป็นชั้นของ TLU ด้วย + hidden layer 1 ชั้นเท่านั้น + output layer", "input layer 1 ชั้น + ชั้นของ TLU หนึ่งชั้นหรือมากกว่า (hidden) + output layer 1 ชั้น"], "answer": 3, "explanation": "<p>นิยาม: “An MLP is composed of one input layer, <b>one or more</b> layers of TLUs, called hidden layers, and one final layer of TLUs called the output layer.”</p>\n<p>จุดที่มักพลาด: (1) hidden layer คือ “หนึ่งชั้นหรือมากกว่า” ไม่ใช่ “อย่างน้อยสองชั้น”; (2) input layer ไม่ใช่ชั้นของ TLU (ไม่มีการคำนวณ) จึงไม่ถูกนับเป็น layer ที่มีพารามิเตอร์ — โครงข่าย input→hidden→output จึงเรียกว่า “2 Layers NN”</p>\n<p>ปัจจุบันแม้ใช้ sigmoid/ReLU แทน step function ก็ยังเรียกว่า MLP (loosely speaking)</p>", "ref": "Lesson 2 §2 (Lecture2.pdf p.10)", "why_wrong_map": ["MLP มี output layer ของ TLU แยกออกมาหนึ่งชั้นเสมอ", "นิยามใช้คำว่า one or more ไม่ใช่อย่างน้อยสองชั้น", "input layer ไม่ได้เป็นชั้นของ TLU และ hidden ไม่ได้จำกัดที่ 1 ชั้น", ""]}, {"id": "L4-15", "lesson": 4, "topic": "EWMA: คำนวณด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ใช้ \\(v_t=\\beta v_{t-1}+(1-\\beta)\\,\\text{value}_t\\) โดย \\(\\beta=0.9,\\ v_0=0\\) ถ้าค่าที่วัดได้สองก้าวแรกคือ 2 แล้ว 4 ค่า \\(v_2\\) เท่ากับเท่าใด?", "options": ["2.00", "0.60", "3.80", "0.58"], "answer": 3, "explanation": "<p>ขั้นที่ 1 — \\(v_1 = 0.9(0)+0.1(2) = 0.2\\) (ได้แค่ 0.2 ทั้งที่ค่าจริงคือ 2 เพราะ 90% ของน้ำหนักจ่ายให้ \\(v_0=0\\))</p><p>ขั้นที่ 2 — \\(v_2 = 0.9(0.2)+0.1(4) = 0.18+0.4 = 0.58\\)</p><p>สังเกตว่า \\(v\\) ยังต่ำกว่าค่าจริงมาก เพราะน้ำหนักรวมที่จ่ายไปจริงหลัง 2 ก้าวคือ \\(1-0.9^2 = 0.19\\) เท่านั้น — นี่คือ bias ที่ Adam ต้องแก้ด้วยการหารด้วย \\(1-\\beta^t\\)</p>", "ref": "Lesson 4 §4.1 (สไลด์หน้า 15)", "why_wrong_map": ["เข้าใจว่า EWA คืนค่าล่าสุด/ค่าเฉลี่ยธรรมดา ซึ่งไม่ใช่", "เผลอคิด \\(v_1\\) เป็น 0.2 แล้วบวก 0.4 ตรง ๆ โดยลืมคูณ \\(\\beta\\) กับ \\(v_1\\)", "สลับน้ำหนัก: ให้ค่าใหม่หนัก 0.9 และค่าเก่าหนัก 0.1", ""]}, {"id": "L2-40", "lesson": 2, "topic": "Forward ของโครงข่าย 2 ชั้นที่ประกอบจาก gate", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "โครงข่าย 2 ชั้น (sigmoid, ปัด \\(g(\\pm10)\\) ขึ้นไปเป็น 1/0): \\(a_1^{[1]}=g(-30+20x_1+20x_2)\\), \\(a_2^{[1]}=g(-10+20x_1+20x_2)\\), \\(h=g(-10-20a_1^{[1]}+20a_2^{[1]})\\) ที่ \\((x_1,x_2)=(1,1)\\) ได้ผลใด?", "options": ["\\(h\\approx0\\) เพราะ \\(a_1^{[1]}\\approx1,\\ a_2^{[1]}\\approx1 \\Rightarrow z^{[2]}=-10\\)", "\\(h\\approx1\\) เพราะ \\(a_1^{[1]}\\approx1,\\ a_2^{[1]}\\approx1 \\Rightarrow z^{[2]}=30\\)", "\\(h\\approx1\\) เพราะ \\(a_1^{[1]}\\approx0,\\ a_2^{[1]}\\approx1 \\Rightarrow z^{[2]}=10\\)", "\\(h\\approx0\\) เพราะ \\(a_1^{[1]}\\approx0,\\ a_2^{[1]}\\approx0 \\Rightarrow z^{[2]}=-10\\)"], "answer": 0, "explanation": "<p>ชั้น hidden ก่อน:</p>\n<ul><li>\\(a_1^{[1]} = g(-30+20+20) = g(10) \\approx 1\\) (AND: “เป็น 1 ทั้งคู่” ⇒ ใช่)</li>\n<li>\\(a_2^{[1]} = g(-10+20+20) = g(30) \\approx 1\\) (OR: “มีอย่างน้อยหนึ่งตัว” ⇒ ใช่)</li></ul>\n<p>ชั้น output: \\(z^{[2]} = -10-20(1)+20(1) = -10 \\Rightarrow h = g(-10) \\approx 0\\)</p>\n<p>ครบทั้งสี่กรณีได้ \\([0,1,1,0]\\) = XOR: output ให้ 1 เมื่อ OR เป็นจริง<b>แต่</b> AND ไม่เป็นจริง (weight \\(-20\\) ของ \\(a_1\\) ทำหน้าที่ “หักล้าง” กรณีที่เป็น 1 ทั้งคู่)</p>", "ref": "Lesson 2 §7 (Lecture2.pdf p.46–47)", "why_wrong_map": ["", "ลืมว่า weight ของ \\(a_1^{[1]}\\) เป็น \\(-20\\) จึงบวกแทนที่จะลบ", "\\(a_1^{[1]}\\) ที่ \\((1,1)\\) คือ \\(g(10)\\approx1\\) ไม่ใช่ 0 (AND ทำงานพอดี)", "\\(a_2^{[1]}\\) ที่ \\((1,1)\\) คือ \\(g(30)\\approx1\\) และ \\(a_1^{[1]}\\) ก็เป็น 1 ไม่ใช่ 0"]}, {"id": "L2-20", "lesson": 2, "topic": "ขนาดของ θ ต้องใหญ่พอให้ sigmoid อิ่มตัว", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ย่อ \\(\\theta\\) ของ AND gate ลง 20 เท่าเป็น \\((-1.5,\\,1,\\,1)\\) (ทิศทางและสัดส่วนเดิม) ที่ \\((x_1,x_2)=(1,1)\\) จะเกิดอะไรขึ้น?", "options": ["ได้ \\(g(-0.5)=0.378\\) ⇒ กลายเป็น NAND เพราะเครื่องหมายกลับด้าน", "ได้ \\(g(0.5)=0.622\\) ซึ่งถือว่าเท่ากับ 1 พอดี gate ยังเด็ดขาดเหมือนเดิม", "ได้ \\(g(0)=0.5\\) พอดี เพราะการย่อสเกลทำให้ \\(z\\) เป็นศูนย์เสมอ", "ได้ \\(g(0.5)=0.622\\) ทิศทางถูกแต่ยังไม่อิ่มตัว gate จึงไม่เด็ดขาด"], "answer": 3, "explanation": "<p>\\(z = -1.5+1(1)+1(1) = 0.5 \\Rightarrow g(0.5) = 0.622\\) ไม่ใช่ \\(\\approx 1\\) อีกต่อไป และที่ \\((0,1)\\) ได้ \\(g(-0.5)=0.378\\) ซึ่งก็ไม่ใกล้ 0</p>\n<p>ข้อสรุป: \\(\\theta\\) ต้อง <b>ใหญ่พอ</b> ไม่ใช่แค่ทิศทางถูก — เส้นตัดสิน \\(z=0\\) อยู่ที่เดิมทุกประการ แต่ sigmoid ยังไม่เข้าเขตอิ่มตัว คำตอบจึงแกว่งอยู่แถว 0.5</p>\n<p>การอิ่มตัวนี้เป็นดาบสองคม — ดีตอนตั้ง gate ด้วยมือ แต่ทำให้อนุพันธ์เข้าใกล้ 0 ซึ่งเป็นต้นเหตุของ vanishing gradient</p>", "ref": "Lesson 2 §4 กล่องกลไก (Lecture2.pdf p.16)", "why_wrong_map": ["เครื่องหมายไม่ได้กลับด้าน \\(-1.5+1+1 = +0.5\\)", "0.622 ห่างจาก 1 มาก จะปัดเป็น 1 ไม่ได้ (เทียบ \\(g(10)=0.99995\\))", "\\(z\\) ไม่ได้เป็นศูนย์ การย่อสเกลย่อค่าลง แต่ยังไม่เป็น 0", ""]}, {"id": "L5-40", "lesson": 5, "topic": "np.argmin + 1 = best epoch", "source": "ex3", "type": "code", "difficulty": "medium", "stem": "ถ้า <code>history.history['val_loss']</code> เริ่มต้นด้วย <code>[0.3333, 0.2895, 0.2927, 0.3559, ...]</code> และค่าหลังจากนั้นสูงกว่าทั้งหมด โค้ดนี้พิมพ์ค่าใด?", "code": "best_epoch = int(np.argmin(history.history['val_loss'])) + 1\nprint(\"Best epoch:\", best_epoch)", "options": ["Best epoch: 3", "Best epoch: 2", "Best epoch: 1", "Best epoch: 0"], "answer": 1, "explanation": "<code>np.argmin</code> คืน <b>ดัชนีแบบ zero-based</b> ของค่าที่น้อยที่สุด: 0.2895 อยู่ index 1 ⇒ +1 ได้ epoch 2 (epoch นับจาก 1). โน้ตบุ๊ก MNIST ทำแบบเดียวกันได้ Best epoch: 13 (val_loss 0.1642). จากนั้น build/compile ใหม่แล้ว fit ด้วย <code>epochs=best_epoch</code>.", "ref": "ex3 cell (2) retrain; Lecture5 MNIST notebook cell 21", "why_wrong_map": ["เลือกค่าถัดไป / นับผิดตำแหน่ง", "", "ลืม +1 (ตอบเป็น index)", "คิดว่า argmin คืนค่าต่ำสุดที่ index 0"]}, {"id": "L2-12", "lesson": 2, "topic": "Linear separability: งานใดต้องมี hidden layer", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามเกณฑ์ linear separability งานใดที่ TLU เดี่ยว (perceptron ตัวเดียว) ทำ<b>ไม่ได้</b>?", "options": ["AND ของ \\(x_1, x_2\\)", "XNOR ของ \\(x_1, x_2\\)", "majority ของ \\(x_1, x_2, x_3\\)", "OR ของ \\(x_1, x_2\\)"], "answer": 1, "explanation": "<p>เกณฑ์คือ “แบ่งสองคลาสด้วยไฮเปอร์เพลนเดียวได้ไหม” ไม่ใช่ “โจทย์ดูยากไหม”</p>\n<ul><li>AND: \\(\\text{step}(x_1+x_2-1.5)\\) ⇒ เส้นเดียวพอ</li>\n<li>OR: \\(\\text{step}(x_1+x_2-0.5)\\) ⇒ เส้นเดียวพอ</li>\n<li>majority of 3: \\(\\text{step}(x_1+x_2+x_3-1.5)\\) ⇒ เรียงตามผลบวกแล้วตัดที่ 1.5 ได้เลย เส้นเดียวพอ</li>\n<li>XNOR (และ XOR): คลาสสลับมุมแบบกระดานหมากรุก \\((0,0)\\) กับ \\((1,1)\\) อยู่คลาสเดียวกัน แต่ \\((0,1),(1,0)\\) อยู่อีกคลาส — ไม่มีเส้นตรงเส้นเดียวแบ่งได้ ⇒ ต้องมี hidden layer</li></ul>", "ref": "Lesson 2 §2 กล่องกลไก (Lecture2.pdf p.9–10)", "why_wrong_map": ["AND แยกได้ด้วยเส้นเดียว \\(x_1+x_2\\ge1.5\\)", "", "majority of 3 แยกได้ด้วยเส้นเดียว \\(x_1+x_2+x_3\\ge1.5\\)", "OR แยกได้ด้วยเส้นเดียว \\(x_1+x_2\\ge0.5\\)"]}, {"id": "L1-14", "lesson": 1, "topic": "Why parameter learning (analytical vs GD)", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดถูกต้องเกี่ยวกับการแก้หา \\(\\theta\\) แบบ analytical (normal equation) เทียบกับ gradient descent?", "options": ["ถ้าแก้ analytical ได้ควรใช้ก่อน แต่ข้อจำกัดคือใช้ได้กับข้อมูลที่มี feature เดียว", "gradient descent ดีกว่าเสมอทุกกรณี เพราะ normal equation ให้คำตอบที่ไม่แม่นยำ", "ถ้าแก้ analytical ได้ควรใช้ก่อน แต่ต้อง invert matrix จึงแพงมากเมื่อข้อมูล/feature ใหญ่", "ควรใช้การไล่ลองทุกชุดพารามิเตอร์ เพราะถูกจำกัดแค่จำนวนข้อมูล ไม่ใช่ทรัพยากร"], "answer": 2, "explanation": "ถ้า analytical solution ทำได้ แนะนำให้แก้ตรง ๆ ก่อน; เมื่อ <b>analytical solutions are not possible</b> จึงใช้ optimization algorithm เช่น gradient descent. ข้อจำกัดของ normal equation \\(\\theta=(X^\\top X)^{-1}X^\\top y\\) คือต้อง invert matrix ซึ่งแพงมากเมื่อข้อมูลหรือ feature ใหญ่. อีกสองเหตุผลที่ต้องใช้ parameter learning: มองกราฟ cost ไม่เห็นเมื่อมิติสูง และการไล่ลองทุกชุดพารามิเตอร์ถูกจำกัดด้วย computational resources.", "ref": "Lesson 1 §3A (p.37)", "why_wrong_map": ["ใช้กับหลาย feature ได้ ปัญหาคือแพงเมื่อ feature เยอะ", "normal equation ให้คำตอบแม่นยำ จุดอ่อนคือราคาการคำนวณ", "", "การไล่ลองทุกชุดถูกจำกัดด้วย computational resources ต่างหาก"]}, {"id": "L2-09", "lesson": 2, "topic": "ประวัติ 3 ยุค: ใครทำอะไรปีไหน", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดจับคู่ผลงานในประวัติของ ANN กับเจ้าของและความสามารถได้ถูกต้อง?", "options": ["Rosenblatt (1943) เสนอ TLU ที่มี weight ปรับค่าได้ และแก้ XOR ได้ตั้งแต่ต้น", "Minsky (1969) เสนอ perceptron ตัวแรกที่ทำ binary classification เชิงเส้นได้", "McCulloch &amp; Pitts (1943) เสนอนิวรอนแบบ binary ที่ยังไม่มี weight เป็นตัวเลข", "McCulloch &amp; Pitts (1957) เสนอ perceptron ที่มี weight ปรับค่าได้ต่อเส้นเชื่อม"], "answer": 2, "explanation": "<p>ลำดับเหตุการณ์: <b>1943 McCulloch &amp; Pitts</b> — simple model ที่ input/output เป็น binary, activate เมื่อจำนวน input ที่ active เกินเกณฑ์, <em>ปรับได้แค่เกณฑ์ ยังไม่มี weight เป็นตัวเลข</em>; <b>1957 Rosenblatt Perceptron</b> — TLU ที่รับ input เป็นตัวเลขจริง มี weight ต่อเส้นเชื่อม ใช้ step function ทำ binary classification เชิงเส้น; <b>1969 Minsky et al.</b> — แสดงว่า perceptron เดี่ยวแก้ XOR ไม่ได้ จากนั้น MLP (ซ้อนชั้น) จึงเป็นคำตอบ</p>", "ref": "Lesson 2 §2 (Lecture2.pdf p.8–10)", "why_wrong_map": ["ผิดทั้งปี (perceptron คือ 1957) และผิดว่า TLU เดี่ยวแก้ XOR ได้", "Minsky เป็นผู้ชี้ข้อจำกัด XOR ในปี 1969 ไม่ใช่ผู้เสนอ perceptron", "", "สลับชื่อกับปี — 1957 คือ Rosenblatt ไม่ใช่ McCulloch–Pitts"]}, {"id": "L5-25", "lesson": 5, "topic": "BN + Dropout ordering", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "สไลด์หน้า 17 แนะนำ <b>add dropout after BN</b> ด้วยเหตุผลใด?", "options": ["BN ทำงานได้เฉพาะตอน test ส่วน dropout ทำงานได้เฉพาะตอนเทรนเท่านั้นจริงๆ", "dropout ก่อน BN ทำให้ batch size ใหญ่ขึ้น ผล regularization ของ BN จึงหาย", "dropout หลัง BN ทำให้ BN มีพารามิเตอร์ trainable ลดลงครึ่งหนึ่งโดยอัตโนมัติ", "dropout ก่อน BN ทำให้ mean/variance ของ activation เปลี่ยน ล้างผลดีของ BN"], "answer": 3, "explanation": "คำอาจารย์: <i>If you apply dropout before normalization, the mean and variance of the activations could change, negating the benefits of batch normalization</i>. ตัวเลข: activation [1,2,3,4] mean 2.5; dropout ปิดสองตัวแล้วคูณ 2 ได้ [2,4,0,0] mean 1.5 ⇒ BN normalize ด้วยสถิติที่เพี้ยน. บล็อกมาตรฐาน: Dense → BN → Activation → Dropout.", "ref": "Lesson 5 §3.5 (สไลด์หน้า 17)", "why_wrong_map": ["BN ทำงานทั้งตอนเทรน (batch stats) และ test (moving stats)", "dropout ไม่เปลี่ยน batch size", "dropout ไม่มีพารามิเตอร์และไม่เปลี่ยนจำนวนพารามิเตอร์ของ BN", ""]}, {"id": "L6-16", "topic": "BackupAndRestore: จำนวน epoch ที่รันต่อ", "source": "callbacks_notebook", "type": "calc", "difficulty": "medium", "stem": "โค้ดด้านล่างถูกขัดจังหวะที่ <code>epoch == 4</code> (นับจาก 0) จากนั้นเรียก fit ใหม่ด้วยอาร์กิวเมนต์ชุดเดิม <code>len(history.history['loss'])</code> จะเป็นเท่าใด", "code": "class InterruptingCallback(keras.callbacks.Callback):\n  def on_epoch_begin(self, epoch, logs=None):\n    if epoch == 4:\n      raise RuntimeError('Interrupting!')\n\ncallback = keras.callbacks.BackupAndRestore(backup_dir=\"/tmp/backup\", save_freq='epoch')\n# รอบแรกถูกขัดจังหวะ จากนั้น\nhistory = model.fit(X, y, epochs=10, batch_size=1, callbacks=[callback], verbose=0)", "options": ["5", "4", "10", "6"], "explanation": "<p>epoch index 0, 1, 2, 3 ทำเสร็จไปแล้ว = 4 epoch ส่วน index 4 ยังไม่ทันเริ่มก็ถูก raise error. backup ล่าสุดจึงชี้ที่ index 4</p><p>เมื่อเรียก <code>fit(..., epochs=10)</code> ใหม่ callback อ่านไฟล์สำรองแล้วตั้งต้นที่ index 4 ⇒ รันต่อ index 4, 5, 6, 7, 8, 9 = \\(10-4 = 6\\) epoch ตรงกับผล <code>6</code> ที่พิมพ์ในคาบ</p><p>ข้อควรระวัง: เลขใน <code>epochs=</code> คือ \"เป้าหมายรวม\" ไม่ใช่ \"จำนวนที่จะรันเพิ่ม\" — ถ้าอยากเทรนต่ออีก 10 epoch จริงๆ ต้องใส่ <code>epochs=14</code></p>", "ref": "callbacks notebook · BackupAndRestore cell", "lesson": 6, "answer": 3, "why_wrong_map": ["5 เกิดจากนับ index 4 เป็น epoch ที่เสร็จแล้ว ทำให้เหลือ 10−5", "4 คือจำนวน epoch ที่ทำเสร็จไปแล้วก่อนถูกขัด ไม่ใช่จำนวนที่รันต่อ", "จะเป็น 10 ก็ต่อเมื่อ callback ไม่ได้กู้สถานะกลับมา ซึ่งขัดกับหน้าที่ของมัน", ""]}, {"id": "L2-27", "lesson": 2, "topic": "กฎมิติของการคูณเมทริกซ์", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ถ้า \\(A\\) มีขนาด \\(3\\times2\\) และ \\(B\\) มีขนาด \\(2\\times4\\) ข้อใดถูกต้อง?", "options": ["\\(BA\\) ได้ขนาด \\(4\\times3\\) ส่วน \\(AB\\) คูณไม่ได้เพราะ 2 ไม่ตรงกับ 2", "\\(AB\\) ได้ขนาด \\(2\\times2\\) และ \\(BA\\) ก็ได้ขนาด \\(2\\times2\\) เช่นเดียวกัน", "\\(AB\\) ได้ขนาด \\(3\\times4\\) ส่วน \\(BA\\) คูณไม่ได้เพราะ 4 ไม่ตรงกับ 3", "คูณไม่ได้ทั้งสองทาง เพราะเมทริกซ์สองตัวนี้มีขนาดไม่เท่ากันทุกมิติ"], "answer": 2, "explanation": "<p>กฎ: \\((m\\times \\mathbf{n})(\\mathbf{n}\\times p) = (m\\times p)\\) — ตัวเลขที่ติดกันตรงกลางต้องเท่ากันและจะ “หายไป” เหลือแค่ขอบนอก</p>\n<ul><li>\\(AB\\): \\((3\\times\\mathbf{2})(\\mathbf{2}\\times4)\\) ⇒ 2 ตรงกับ 2 ✓ ได้ \\(3\\times4\\)</li>\n<li>\\(BA\\): \\((2\\times\\mathbf{4})(\\mathbf{3}\\times2)\\) ⇒ 4 ไม่เท่ากับ 3 ✗ คูณไม่ได้</li></ul>\n<p>นี่เป็นอีกหลักฐานว่าการคูณเมทริกซ์สลับที่ไม่ได้: บางครั้งสลับแล้วไม่ใช่แค่ได้คนละคำตอบ แต่คูณไม่ได้เลย</p>", "ref": "Lesson 2 §5B (Lecture2.pdf p.31, 33)", "why_wrong_map": ["สลับบทบาทของสองเมทริกซ์ — \\(AB\\) ต่างหากที่คูณได้", "ผลลัพธ์ต้องเป็น (แถวของตัวหน้า × คอลัมน์ของตัวหลัง) ไม่ใช่มิติตรงกลาง", "", "เงื่อนไข “ขนาดเท่ากันทั้งสองตัว” เป็นของการบวก ไม่ใช่การคูณ"]}, {"id": "L2-28", "lesson": 2, "topic": "คูณเมทริกซ์ด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "คำนวณ \\(\\begin{bmatrix}2&1\\\\0&3\\end{bmatrix}\\begin{bmatrix}1&2\\\\1&0\\end{bmatrix}\\) ได้ผลเป็นข้อใด?", "options": ["\\(\\begin{bmatrix}3&3\\\\4&0\\end{bmatrix}\\)", "\\(\\begin{bmatrix}3&4\\\\3&0\\end{bmatrix}\\)", "\\(\\begin{bmatrix}2&7\\\\2&1\\end{bmatrix}\\)", "\\(\\begin{bmatrix}2&2\\\\0&0\\end{bmatrix}\\)"], "answer": 1, "explanation": "<p>แต่ละช่องคือ dot product ของ (แถวของตัวหน้า) กับ (คอลัมน์ของตัวหลัง):</p>\n<ul><li>ช่อง (1,1): \\((2,1)\\cdot(1,1) = 2+1 = 3\\)</li>\n<li>ช่อง (1,2): \\((2,1)\\cdot(2,0) = 4+0 = 4\\)</li>\n<li>ช่อง (2,1): \\((0,3)\\cdot(1,1) = 0+3 = 3\\)</li>\n<li>ช่อง (2,2): \\((0,3)\\cdot(2,0) = 0\\)</li></ul>\n<p>ถ้าสลับลำดับเป็น \\(BA\\) จะได้ \\(\\begin{bmatrix}2&7\\\\2&1\\end{bmatrix}\\) คนละคำตอบ — หลักฐานตัวเลขของ \\(AB \\ne BA\\)</p>", "ref": "Lesson 2 §5B (Lecture2.pdf p.35)", "why_wrong_map": ["คำนวณ dot ถูก แต่วางผลสลับแถวกับคอลัมน์ (ได้ transpose ของคำตอบ)", "", "นี่คือผลของการสลับลำดับ \\(BA\\) ซึ่งไม่เท่ากับ \\(AB\\)", "นี่คือการคูณทีละช่อง (element-wise) ไม่ใช่การคูณเมทริกซ์"]}, {"id": "L5-22", "lesson": 5, "topic": "Moving average update", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "BN มี moving mean สะสมไว้ = 10 และ mini-batch ล่าสุดได้ \\(\\mu_B=20\\) ถ้า momentum = 0.9 moving mean ใหม่เท่ากับเท่าใด?", "options": ["15", "19", "20", "11"], "answer": 3, "explanation": "\\(v_{new}=\\text{momentum}\\cdot v_{old}+(1-\\text{momentum})\\cdot\\mu_B=0.9(10)+0.1(20)=9+2=11\\). \"เชื่อของเก่า 90%\" ค่าจึงขยับช้าและนิ่ง. momentum ยิ่งใกล้ 1 (เช่น 0.99 default ของ Keras) ยิ่งนิ่งแต่ตามช้า.", "ref": "Lesson 5 §3.3 กล่อง Moving Average", "why_wrong_map": ["เฉลี่ยธรรมดาสองค่า", "สลับน้ำหนัก: 0.1(10)+0.9(20)", "แทนด้วยค่า batch ล่าสุดตรงๆ", ""]}, {"id": "L1-13", "lesson": 1, "topic": "Learning rate: cost overshoot", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "พล็อต \\(J(\\theta)\\) เทียบจำนวน iteration แล้วพบว่า cost สูงขึ้นเรื่อย ๆ จนระเบิด (Cost Overshoot) ควรแก้อย่างไร?", "options": ["เพิ่ม learning rate \\(\\alpha\\) เพราะก้าวเล็กเกินจนติดอยู่บนเนินเขา", "เพิ่มจำนวน iteration เพราะโมเดลยังเดินลงไปไม่ถึงก้นชามสักที", "เปลี่ยนเครื่องหมายสูตรเป็นบวก เพื่อให้ cost ย้อนกลับลงมาเอง", "ลด learning rate \\(\\alpha\\) เพราะก้าวใหญ่จนข้ามก้นชามไปฝั่งที่สูงกว่า"], "answer": 3, "explanation": "วิธี debug gradient descent คือพล็อต cost เทียบ iteration — ปกติ \\(J(\\theta)\\) ต้องลดลงทุกรอบ. ถ้า \\(\\alpha\\) ใหญ่เกิน แต่ละก้าวข้ามจุดต่ำสุดไปอีกฝั่งที่สูงกว่า ⇒ diverge (เช่น \\(J=\\theta^2\\) กับ \\(\\alpha=1.5\\): \\(\\theta\\) จาก 1 → −2 → 4 → −8 ห่างขึ้นทุกรอบ). วิธีแก้คือลด \\(\\alpha\\).", "ref": "Lesson 1 §3.3 (p.32–33)", "why_wrong_map": ["\\(\\alpha\\) เล็กเกินทำให้ช้า ไม่ทำให้ cost พุ่ง — และเพิ่ม \\(\\alpha\\) ยิ่งแย่", "เพิ่มรอบยิ่งทำให้ระเบิดหนักขึ้น", "เครื่องหมายบวกคือ gradient ascent ไต่ขึ้นเขา", ""]}, {"id": "L5-34", "lesson": 5, "topic": "นับพารามิเตอร์ MNIST 784→16→16→10", "source": "mnist_notebook", "type": "calc", "difficulty": "medium", "stem": "โมเดลในโน้ตบุ๊ก MNIST นี้มี <b>Total params</b> เท่าใด?", "code": "model = models.Sequential([\n    Dense(16, activation='relu', input_shape=(28 * 28,)),\n    Dense(16, activation='relu'),\n    Dense(10, activation='softmax')\n])\nmodel.summary()", "options": ["13,002", "12,560", "12,960", "13,170"], "answer": 0, "explanation": "สูตร \\(s_l\\times(s_{l-1}+1)\\): \\(16\\times785=12{,}560\\); \\(16\\times17=272\\); \\(10\\times17=170\\) ⇒ รวม 13,002 (trainable 13,002, non-trainable 0 เ loding ทำให้เรียนรู้ช้าโดยเฉพาะชั้นต้น ๆ", "vanishing ทำให้เรียนรู้ช้าโดยเฉพาะชั้นต้น ๆ ส่วน exploding ทำให้เทรนไม่เสถียรจนแกว่งหรือลู่ออก", "vanishing ทำให้ใช้หน่วยความจำมากเกินไป ส่วน exploding ทำให้ต้องลดขนาดของ batch size ลงเสมอทุกครั้ง"], "answer": 2, "explanation": "<p>จำเป็นคู่: <b>vanishing = ช้า, exploding = ระเบิด</b></p><p>ตัวเลขในบทนี้ยืนยันฝั่ง vanishing: โซ่ 3 ชั้นที่ใช้ sigmoid ให้ gradient ของชั้นแรกเล็กกว่าชั้นสุดท้ายราว 15.7 เท่า (0.2277 vs 0.0146) เพราะทุกทอดที่ย้อนต้องคูณ \\(g'\\le0.25\\) เพิ่มอีกตัว ส่วน exploding คือค่าที่โตขึ้นทุกทอดจน weight แกว่ง (oscillations) หรือลู่ออก (divergence)</p>", "ref": "Lesson 4 §2 (สไลด์หน้า 5)", "why_wrong_map": ["ทั้งคู่เป็นปัญหา ไม่ใช่ผลดี", "สลับผลของสองฝั่ง — เป็น distractor คลาสสิกที่สไลด์เตือนไว้", "", "ทั้งคู่ไม่ใช่ปัญหาเรื่องหน่วยความจำหรือ batch size"]}, {"id": "L4-37", "lesson": 4, "topic": "Dropout: unit ที่ถูกปิดกับการอัปเดตในรอบนั้น", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามขั้นตอนหน้า 31 ในรอบที่ unit ตัวหนึ่งของ hidden layer ถูก dropout ปิด เกิดอะไรขึ้นกับ \\(\\delta\\) และการอัปเดต weight ของ unit นั้นในรอบเดียวกัน?", "options": ["\\(\\delta\\) ของมันถูกขยายด้วย \\(1/\\text{keep\\_prob}\\) จึงใหญ่ขึ้น ⇒ weight ที่เกี่ยวข้องถูกอัปเดตแรงกว่าปกติ", "\\(\\delta\\) ของมันถูกเก็บพักไว้แล้วนำไปรวมในรอบถัดไป ⇒ weight ถูกอัปเดตสองเท่าในรอบที่มันกลับมาเปิด", "\\(\\delta\\) ของมันถูก mask คูณด้วย 0 จึงเป็นศูนย์ ⇒ weight ที่เกี่ยวข้องกับ unit นั้นไม่ถูกอัปเดตในรอบนี้", "\\(\\delta\\) ของมันคำนวณตามปกติทุกประการ ⇒ weight ที่เกี่ยวข้องถูกอัปเดตเท่ากับตอนที่ไม่ได้เปิด dropout"], "answer": 2, "explanation": "ฝั่ง backward ใช้ mask \\(D\\) ตัวเดิมกับ \\(\\delta\\) ดังนั้น unit ที่ \\(D=0\\) จะได้ \\(\\delta = 0\\)<br>ตัวอย่างของบทนี้: \\(\\delta=[0.4,-0.2,0.1,0.3]\\), \\(D=[1,0,1,1]\\), keep_prob 0.8 ⇒ \\(\\delta\\odot D = [0.4,0,0.1,0.3]\\) ⇒ หาร 0.8 ⇒ \\([0.5,\\ 0,\\ 0.125,\\ 0.375]\\) — unit ที่ 2 ได้ 0<br>สมเหตุสมผล เพราะรอบนี้ activation ของมันเป็นศูนย์ มันจึงไม่ได้มีส่วนร่วมกับผลลัพธ์เลย ทั้ง weight ที่วิ่งเข้าหามัน และ weight ที่วิ่งออกจากมัน (ซึ่งคูณกับ \\(a=0\\)) จึงได้ gradient เป็นศูนย์ทั้งคู่<br>รอบถัดไปสุ่ม mask ใหม่ unit ตัวนี้อาจกลับมาเปิดและถูกอัปเดตตามปกติ — ไม่มีการสะสมย้อนหลัง", "ref": "Lesson 4 §6.2 (สไลด์หน้า 31)", "why_wrong_map": ["การหารด้วย keep_prob ใช้กับตัวที่ <i>รอด</i> ส่วนตัวที่ถูกปิดคูณ 0 แล้วหารเท่าไรก็ยังเป็น 0", "ไม่มีกลไกสะสม \\(\\delta\\) ข้ามรอบ แต่ละ iteration สุ่ม mask ใหม่และคำนวณ gradient ใหม่ทั้งหมด", "", "ถ้า \\(\\delta\\) ยังคำนวณตามปกติ gradient จะไม่ใช่อนุพันธ์ของ forward ที่ปิด unit นั้นไปแล้ว"]}, {"id": "L4-42", "lesson": 4, "topic": "การบ้าน: ReLU + dropout บน Circle", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามแนวทางการบ้านหน้า 35 (ReLU + dropout บน Circle Dataset) ข้อใดถูกต้อง?", "options": ["hidden layer ใช้ ReLU แต่ output ต้องเป็น sigmoid และเส้นแบ่งเขตที่เรียบกว่าคือผลของ regularization", "hidden layer และ output ใช้ ReLU ทั้งหมด และเส้นแบ่งเขตที่หยักตามทุกจุดคือสัญญาณของโมเดลที่ดีที่สุดเสมอ", "hidden layer ใช้ ReLU แต่ output ต้องเป็น sigmoid และควรตั้ง dropout rate 0.5 ทุกชั้นเสมอ", "hidden layer ใช้ sigmoid แต่ output ต้องเป็น ReLU และควรเลิกใช้ dropout กับข้อมูลสองมิติ"], "answer": 0, "explanation": "<p>โจทย์ของอาจารย์: \"Try using ReLU as activation function (hidden layers) and dropout regularization!!!\" บน Circle Dataset ที่แยกด้วยเส้นตรงไม่ได้</p><p>งานนี้เป็น binary classification ⇒ output ต้องเป็น <b>sigmoid</b> 1 node เพื่อให้ได้ความน่าจะเป็น 0–1</p><p>ภาพสองภาพบนสไลด์: เส้นหยักไล่ตามทุกจุด = ฟิตแน่นเกิน (ตอบสนองต่อ noise) ส่วนเส้นเรียบเป็นวงกลม = ผลของ regularization ที่ยอมผิดไม่กี่จุดเพื่อได้รูปร่างที่ใกล้ความจริงของปัญหา</p><p>dropout rate ให้เลือกในช่วง 0.1–0.5 โดยเริ่มต่ำ ๆ เพราะเครือข่ายนี้เล็ก — 0.5 ทุกชั้นมักทำให้ underfit</p>", "ref": "Lesson 4 §7A (สไลด์หน้า 35)", "why_wrong_map": ["", "ReLU ที่ output ของงาน binary ให้ค่าที่ไม่ใช่ความน่าจะเป็น และเส้นหยักคืออาการ overfit", "0.5 ทุกชั้นแรงเกินไปสำหรับเครือข่ายเล็ก ทำให้ underfit", const LESSON_NAMES = {1:"L1 ML Foundations",2:"L2 NN Basics",3:"L3 Cost & Backprop",4:"L4 Deep NN & Optimizers",5:"L5 Init / BN / Keras",6:"L6 Callbacks & Tuning"};
const TYPE_NAMES = {concept:"แนวคิด", code:"code", calc:"คำนวณ"};
const DIFF_NAMES = {easy:"ง่าย", medium:"กลาง", hard:"ยาก"};
const SOURCE_NAMES = {lesson:"lesson", ex1:"ex1", ex2:"ex2", ex3:"ex3", ex_shallow_nn:"ex_shallow_nn (Lecture 4)", mnist_notebook:"MNIST notebook (Lecture 5)", callbacks_notebook:"Callbacks notebook (Lecture 6)", tensorboard_notebook:"TensorBoard notebook (Lecture 6)", tuning_notebook:"Tuning notebook (Lecture 6)"};
const LETTERS = ["A","B","C","D"];
const KEY = "dl-mcq-review-v1";

let answers = {};   // id -> {choice, correct, tries}
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { answers = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
let order = [];
let sessionAnswered = {}; // for "wrong" mode: questions re-answered in this view
const openExplain = new Set();

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildFilters() {
  const lf = document.getElementById("lessonFilters");
  for (const n of [1,2,3,4,5,6]) {
    const c = QUESTIONS.filter(q => q.lesson === n).length;
    lf.insertAdjacentHTML("beforeend", `<label class="chip"><input type="checkbox" class="lf" value="${n}" checked> ${LESSON_NAMES[n]} <span style="color:var(--ink-soft)">(${c})</span></label>`);
  }
  const tf = document.getElementById("typeFilters");
  for (const t of ["concept","calc","code"]) {
    const c = QUESTIONS.filter(q => q.type === t).length;
    tf.insertAdjacentHTML("beforeend", `<label class="chip"><input type="checkbox" class="tf" value="${t}" checked> ${TYPE_NAMES[t]} <span style="color:var(--ink-soft)">(${c})</span></label>`);
  }
  document.querySelectorAll(".lf,.tf,input[name=mode]").forEach(el => el.addEventListener("change", () => { sessionAnswered = {}; newOrder(); }));
}

function currentPool() {
  const ls = new Set([...document.querySelectorAll(".lf:checked")].map(e => +e.value));
  const ts = new Set([...document.querySelectorAll(".tf:checked")].map(e => e.value));
  const mode = document.querySelector("input[name=mode]:checked").value;
  return QUESTIONS.filter(q => ls.has(q.lesson) && ts.has(q.type)).filter(q => {
    const a = answers[q.id];
    if (mode === "unanswered") return !a || sessionAnswered[q.id];
    if (mode === "wrong") return (a && !a.correct) || sessionAnswered[q.id];
    return true;
  });
}

function newOrder() { order = currentPool().map(q => q.id); openExplain.clear(); render(); }

function renderMath(el) {
  if (typeof renderMathInElement !== "function") return;
  renderMathInElement(el, { delimiters: [ {left:"$$",right:"$$",display:true}, {left:"\\[",right:"\\]",display:true}, {left:"\\(",right:"\\)",display:false} ], ignoredTags: ["script","noscript","style","textarea","pre","code"], throwOnError: false });
}

function cardHTML(q, idx) {
  const a = sessionAnswered[q.id] || (document.querySelector("input[name=mode]:checked").value === "wrong" ? null : answers[q.id]);
  const done = !!a;
  const cls = done ? (a.choice === q.answer ? "done-good" : "done-bad") : "";
  let opts = q.options.map((o, i) => {
    let c = "opt";
    if (done && i === q.answer) c += " correct";
    if (done && i === a.choice && i !== q.answer) c += " wrong";
    return `<button class="${c}" data-q="${q.id}" data-i="${i}" ${done ? "disabled" : ""}><span class="L">${LETTERS[i]}.</span><span>${o}</span></button>`;
  }).join("");
  let verdict = "";
  if (done) {
    verdict = a.choice === q.answer
      ? `<div class="verdict good">ถูกต้อง — คำตอบคือ ${LETTERS[q.answer]}</div>`
      : `<div class="verdict bad">ยังไม่ถูก — คุณตอบ ${LETTERS[a.choice]} · คำตอบที่ถูกคือ ${LETTERS[q.answer]}</div>`;
    verdict += `<div class="actions"><button data-explain="${q.id}">${openExplain.has(q.id) ? "ซ่อนเฉลย" : "ดูเฉลย"}</button></div>`;
    if (openExplain.has(q.id)) {
      const ww = q.options.map((o, i) => i === q.answer ? "" : `<li><b>${LETTERS[i]}.</b> ${q.why_wrong_map[i]}</li>`).join("");
      verdict += `<div class="explain"><h4>ทำไม ${LETTERS[q.answer]} ถูก</h4><div>${q.explanation}</div><h4>ตัวเลือกอื่นผิดเพราะ</h4><ul>${ww}</ul><div class="ref">ทบทวนที่: ${esc(q.ref)}</div></div>`;
    }
  }
  const code = q.code ? `<pre><code>${esc(q.code)}</code></pre>` : "";
  return `<div class="q ${cls}" id="card-${q.id}">
    <div class="meta"><span class="tag">${LESSON_NAMES[q.lesson]}</span><span class="tag t-${q.type}">${TYPE_NAMES[q.type]}</span><span class="tag d-${q.difficulty}">${DIFF_NAMES[q.difficulty]}</span>${done ? `<span class="tag" style="background:#f1f1ee;color:var(--ink-soft)">${esc(q.topic)}</span>` : ""}</div>
    <div class="stem"><span class="num">${idx + 1}.</span>${q.stem}</div>${code}
    <div class="opts">${opts}</div>${verdict}</div>`;
}

function render() {
  const list = document.getElementById("list");
  if (!order.length) { list.innerHTML = `<div class="empty">ไม่มีข้อในชุดนี้ ${document.querySelector("input[name=mode]:checked").value === "wrong" ? "— ยังไม่มีข้อที่ตอบผิด 🎉" : ""}</div>`; }
  else list.innerHTML = order.map((id, i) => cardHTML(byId[id], i)).join("");
  renderMath(list);
  const done = order.filter(id => answers[id]).length;
  document.getElementById("progress").textContent = order.length ? `กำลังแสดง ${order.length} ข้อ · ทำไปแล้วในชุดนี้ ${done} ข้อ` : "";
  renderStats();
}

function rerenderCard(id) {
  const el = document.getElementById("card-" + id);
  const idx = order.indexOf(id);
  const tmp = document.createElement("div");
  tmp.innerHTML = cardHTML(byId[id], idx);
  const nu = tmp.firstElementChild;
  el.replaceWith(nu);
  renderMath(nu);
  renderStats();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.opt");
  if (b && !b.disabled) {
    const q = byId[b.dataset.q], i = +b.dataset.i;
    const prev = answers[q.id];
    answers[q.id] = { choice: i, correct: i === q.answer, tries: (prev ? prev.tries : 0) + 1, everWrong: (prev && prev.everWrong) || i !== q.answer };
    sessionAnswered[q.id] = answers[q.id];
    save();
    rerenderCard(q.id);
    return;
  }
  const x = e.target.closest("button[data-explain]");
  if (x) { const id = x.dataset.explain; openExplain.has(id) ? openExplain.delete(id) : openExplain.add(id); rerenderCard(id); }
});

function pct(c, n) { return n ? Math.round(100 * c / n) : 0; }
function renderStats() {
  const st = document.getElementById("stats");
  const all = QUESTIONS.filter(q => answers[q.id]);
  const cor = all.filter(q => answers[q.id].correct).length;
  let html = `<div class="stat"><div class="k">ทำไปแล้ว</div><div class="v">${all.length}/${QUESTIONS.length}</div><div class="bar"><i style="width:${pct(all.length, QUESTIONS.length)}%"></i></div></div>`;
  html += `<div class="stat"><div class="k">ถูก (ล่าสุด)</div><div class="v">${cor}/${all.length} · ${pct(cor, all.length)}%</div><div class="bar"><i style="width:${pct(cor, all.length)}%"></i></div></div>`;
  for (const n of [1,2,3,4,5,6]) {
    const qs = QUESTIONS.filter(q => q.lesson === n && answers[q.id]);
    const c = qs.filter(q => answers[q.id].correct).length;
    html += `<div class="stat"><div class="k">${LESSON_NAMES[n]}</div><div class="v">${qs.length ? pct(c, qs.length) + "%" : "–"}</div><div class="k">${c}/${qs.length} ข้อที่ทำ</div><div class="bar"><i style="width:${pct(c, qs.length)}%"></i></div></div>`;
  }
  for (const t of ["concept","calc","code"]) {
    const qs = QUESTIONS.filter(q => q.type === t && answers[q.id]);
    const c = qs.filter(q => answers[q.id].correct).length;
    html += `<div class="stat"><div class="k">ประเภท: ${TYPE_NAMES[t]}</div><div class="v">${qs.length ? pct(c, qs.length) + "%" : "–"}</div><div class="k">${c}/${qs.length}</div><div class="bar"><i style="width:${pct(c, qs.length)}%"></i></div></div>`;
  }
  st.innerHTML = html;
  const wrong = QUESTIONS.filter(q => answers[q.id] && !answers[q.id].correct);
  const w = document.getElementById("weakWrap");
  if (!wrong.length) { w.innerHTML = `<p class="k" style="color:var(--ink-soft);font-size:.9rem;margin:10px 0 0">ยังไม่มีข้อที่ผิด — จุดอ่อนจะขึ้นที่นี่ พร้อมตำแหน่งที่ควรกลับไปอ่าน</p>`; return; }
  w.innerHTML = `<p style="margin:12px 0 0;font-size:.9rem"><b>หัวข้อที่ยังผิดอยู่ (${wrong.length})</b> — กดเพื่อไปที่ข้อ หรือเลือกโหมด “เฉพาะข้อที่ผิด” เพื่อทำซ้ำ</p><ul class="weak">` +
    wrong.sort((a, b) => a.lesson - b.lesson).map(q => `<li><a href="#card-${q.id}" data-jump="${q.id}">L${q.lesson} · ${esc(q.topic)}</a> <span style="color:var(--ink-soft)">— ${esc(q.ref)}</span></li>`).join("") + `</ul>`;
}

document.getElementById("weakWrap").addEventListener("click", e => {
  const a = e.target.closest("a[data-jump]");
  if (!a) return;
  if (!document.getElementById("card-" + a.dataset.jump)) { e.preventDefault(); alert("ข้อนี้ไม่อยู่ในชุดที่กรองไว้ตอนนี้ — เปิดตัวกรองบท/ประเภทให้ครอบคลุมก่อน"); }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  const next = order.find(id => !answers[id]);
  if (!next) { alert("ทำครบทุกข้อในชุดนี้แล้ว"); return; }
  document.getElementById("card-" + next).scrollIntoView({ behavior: "smooth", block: "start" });
});
function buildExport() {
  const items = QUESTIONS.filter(q => answers[q.id]).map(q => {
    const a = answers[q.id];
    return { id: q.id, lesson: q.lesson, lessonName: LESSON_NAMES[q.lesson], topic: q.topic, source: q.source,
      type: q.type, difficulty: q.difficulty, ref: q.ref,
      question: q.stem.replace(/<[^>]+>/g, "").trim(),
      chosen: LETTERS[a.choice], chosenText: q.options[a.choice].replace(/<[^>]+>/g, "").trim(),
      correctLetter: LETTERS[q.answer], correctText: q.options[q.answer].replace(/<[^>]+>/g, "").trim(),
      isCorrect: a.correct, attempts: a.tries, everWrong: !!a.everWrong };
  });
  const byLesson = {};
  for (const n of [1,2,3,4,5,6]) {
    const qs = items.filter(i => i.lesson === n);
    byLesson[LESSON_NAMES[n]] = { answered: qs.length, correct: qs.filter(i => i.isCorrect).length, total: QUESTIONS.filter(q => q.lesson === n).length };
  }
  const byType = {};
  for (const t of ["concept","calc","code"]) {
    const qs = items.filter(i => i.type === t);
    byType[t] = { answered: qs.length, correct: qs.filter(i => i.isCorrect).length };
  }
  return {
    exportedAt: new Date().toISOString(),
    source: "Deep Learning MCQ Review (Lessons 1-6 + ex1-3 + in-class notebooks)",
    totals: { questionsInBank: QUESTIONS.length, answered: items.length, correct: items.filter(i => i.isCorrect).length },
    byLesson, byType,
    weakTopics: items.filter(i => !i.isCorrect).map(i => ({ id: i.id, lesson: i.lessonName, topic: i.topic, ref: i.ref })),
    answersRaw: answers,
    items
  };
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = buildExport();
  if (!data.totals.answered) { alert("ยังไม่มีข้อที่ทำ — ตอบอย่างน้อย 1 ข้อก่อน"); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `dl-mcq-result-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const incoming = d.answersRaw || d;
      let n = 0;
      for (const [id, a] of Object.entries(incoming)) {
        if (!byId[id] || !a || typeof a.choice !== "number") continue;
        answers[id] = { choice: a.choice, correct: a.choice === byId[id].answer, tries: a.tries || 1, everWrong: !!a.everWrong || a.choice !== byId[id].answer };
        n++;
      }
      save(); sessionAnswered = {}; newOrder();
      alert(`นำเข้าแล้ว ${n} ข้อ`);
    } catch (err) { alert("ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON ที่ export จากหน้านี้"); }
    e.target.value = "";
  };
  r.readAsText(f);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("ล้างคำตอบทั้งหมดแล้วเริ่มใหม่?")) return;
  answers = {}; sessionAnswered = {}; save(); newOrder();
});

document.addEventListener("DOMContentLoaded", () => { buildFilters(); newOrder(); });
</script>
