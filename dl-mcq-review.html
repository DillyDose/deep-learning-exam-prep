r intelligence” เกี่ยวข้องกับ neural network เทียมอย่างไร?", "options": ["กำหนดเป็นกฎว่าโครงข่ายเทียมต้องมี 6 ชั้นจึงจะเรียนรู้แบบมนุษย์ได้", "บอกว่าสมองมนุษย์มี 4 ชั้นและ NN จึงนิยมใช้ 4 hidden layer ตามกัน", "อธิบายว่าเปลือกสมองไม่มีชั้น การแบ่ง layer เป็นเรื่องของคอมพิวเตอร์ล้วน", "อธิบายที่มาของแนวคิด “ชั้น” โดยยกเปลือกสมองที่มี 6 ชั้นเป็นแรงบันดาลใจ"], "answer": 3, "explanation": "<p>เปลือกสมองมนุษย์มี 6 ชั้น แต่ละชั้นแปลง input ให้กลายเป็นแนวคิด (concepts) ทีละขั้น ชั้นถัดไปรับผลของชั้นก่อนหน้า ไม่ใช่รับ input ดิบอีก — นี่คือที่มาของแนวคิด “ชั้น” ในโครงข่ายเทียม</p>\n<p>แต่ <b>จำนวนชั้นของ NN เป็นสิ่งที่เราเลือกเอง</b> (เป็น hyperparameter) การที่สมองมี 6 ชั้นไม่ได้บังคับว่า NN ต้องมี 6 ชั้น และคำว่า “deep” ก็แปลแค่ว่ามีหลายชั้น</p>", "ref": "Lesson 2 §1A (Lecture2.pdf p.5)", "why_wrong_map": ["เป็นแค่แรงบันดาลใจ ไม่ได้บังคับจำนวนชั้นของโครงข่าย", "เปลือกสมองมี 6 ชั้น ไม่ใช่ 4", "ตรงข้ามกับประโยค ซึ่งบอกว่าเปลือกสมองสร้างเป็นชั้นจริง", ""]}, {"id": "L6-37", "topic": "HyperBand: successive halving", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "HyperBand ที่ max_iter = 81, \\(\\eta = 3\\) ใน bracket \\(s=4\\) (เริ่มที่ 81 configuration งบตัวละ 1) รอบ \\(i=2\\) จะมี \\((n_i, r_i)\\) เท่าใด", "options": ["(3, 27)", "(9, 27)", "(27, 9)", "(9, 9)"], "explanation": "<p>สูตร: \\(n_i = \\lfloor n\\,\\eta^{-i} \\rfloor\\) และ \\(r_i = r\\,\\eta^{\\,i}\\)</p><p>\\(i=0: (81, 1)\\) → \\(i=1: (27, 3)\\) → \\(i=2: (\\lfloor 81/9 \\rfloor, 1\\times9) = (9, 9)\\) → \\(i=3: (3, 27)\\) → \\(i=4: (1, 81)\\)</p><p>สังเกตว่าทุกรอบใช้งบ \\(n_i\\times r_i = 81\\) เท่ากันพอดี เพราะ \"ได้งบเพิ่ม \\(\\eta\\) เท่า แต่คนรับลดลง \\(\\eta\\) เท่า\" จึงหักล้างกัน. ใน KerasTuner พารามิเตอร์ <code>max_epochs</code> และ <code>factor</code> คือ max_iter กับ \\(\\eta\\) ตัวเดียวกันนี้</p>", "ref": "Lesson 6 §9 (สไลด์หน้า 27)", "lesson": 6, "answer": 3, "why_wrong_map": ["(3, 27) คือรอบ i=3 ไม่ใช่ i=2", "(9, 27) สลับงบของรอบ i=3 มาใส่กับจำนวนผู้รอดของรอบ i=2", "(27, 9) จับคู่ผู้รอดของรอบ i=1 เข้ากับงบของรอบ i=2", ""]}, {"id": "L1-34", "lesson": 1, "topic": "Parameter vs Hyperparameter", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดเป็น model parameter (ไม่ใช่ hyperparameter)?", "options": ["coefficients และ intercept (\\(\\theta_0,\\dots,\\theta_n\\))", "regularization parameter \\(\\lambda\\) ใน cost function", "learning rate \\(\\alpha\\) ที่ใช้ใน gradient descent", "degree ของ polynomial ที่เลือกให้โมเดล"], "answer": 0, "explanation": "Model parameters คือคุณสมบัติของโมเดลที่ใช้ทำนาย และ <b>เรียนรู้ระหว่างการเทรน</b> — ไม่ได้ถูกกำหนดโดยผู้ใช้ เช่น coefficients และ intercept. Model hyperparameters คือค่าตั้งภายนอกที่กำหนดก่อนเทรน <b>เรียนจากข้อมูลฝึกไม่ได้</b> ต้อง tune เอง — เช่น regularization parameter, degree ของ polynomial, learning rate. เกณฑ์เร็ว: gradient descent อัปเดตเฉพาะ θ ไม่เคยแตะ α.", "ref": "Lesson 1 §11A (p.59)", "why_wrong_map": ["", "λ เป็น hyperparameter", "α เป็น hyperparameter ที่เราตั้งเอง", "degree เป็น hyperparameter (K ของ k-means ก็เช่นกัน)"]}, {"id": "L5-36", "lesson": 5, "topic": "Mini-batch ต่อ epoch (IMDB)", "source": "ex3", "type": "calc", "difficulty": "hard", "stem": "IMDB มี training 25,000 ตัวอย่าง เรียก <code>model.fit(X, y, epochs=20, batch_size=256, validation_split=0.4)</code> แถบความคืบหน้าจะแสดงกี่ mini-batch ต่อ epoch?", "options": ["98", "40", "59", "58"], "answer": 2, "explanation": "ขั้น 1: หัก validation 40% ⇒ \\(25{,}000\\times0.6=15{,}000\\) ตัวอย่างที่ใช้เทรนจริง. ขั้น 2: \\(15{,}000/256=58.6\\) (\\(256\\times58=14{,}848\\) เหลือ 152) ⇒ ปัดขึ้นเป็น <b>59</b> เพราะก้อนสุดท้ายที่ไม่เต็มก็ถูกใช้ — ตรงกับ log 59/59. ตอน retrain ไม่มี validation_split: \\(\\lceil25{,}000/256\\rceil=98\\) (log 98/98). เทียบ MNIST: \\(48{,}000/64=750\\). ระวัง \\(\\lceil10{,}000/256\\rceil=40\\) คือจำนวนก้อนของชุด validation ไม่ใช่ชุดเทรน.", "ref": "ex3 cell (2) fit log; Lesson 5 §5.10", "why_wrong_map": ["ลืมหัก validation (25,000/256)", "นับ batch ของชุด validation แทนชุดเทรน: ⌈(25,000×0.4)/256⌉ = ⌈10,000/256⌉ = 40", "", "ปัดลง ลืมก้อนสุดท้ายที่ไม่เต็ม"]}, {"id": "L6-02", "topic": "นับจำนวนครั้งที่ hook ถูกเรียก", "source": "callbacks_notebook", "type": "calc", "difficulty": "medium", "stem": "ใช้ callback ด้านล่างกับข้อมูล train 150 แถว, <code>epochs=3</code>, <code>batch_size=64</code> จะพิมพ์ออกมาทั้งหมดกี่บรรทัด", "code": "class my_callback(Callback):\n  def on_train_begin(self, logs):\n    print(\"training start\")\n  def on_train_batch_end(self, batch, logs):\n    print(f\"End of batch:{batch+1}\")\n  def on_epoch_end(self, epoch, logs):\n    print(f\"End of epoch:{epoch+1}\")", "options": ["10 บรรทัด", "12 บรรทัด", "13 บรรทัด", "16 บรรทัด"], "explanation": "<p>จำนวน batch ต่อ epoch = \\(\\lceil 150/64 \\rceil = \\lceil 2.34 \\rceil = 3\\) (batch สุดท้ายมี 22 แถว ก็ยังนับเป็น batch)</p><ul><li><code>on_train_begin</code> ถูกเรียก 1 ครั้ง (ต้นการเทรนเท่านั้น)</li><li><code>on_train_batch_end</code> ถูกเรียก \\(3 \\times 3 = 9\\) ครั้ง</li><li><code>on_epoch_end</code> ถูกเรียก 3 ครั้ง</li></ul><p>รวม \\(1+9+3 = 13\\) บรรทัด. ถ้าเปลี่ยนเป็น <code>batch_size=32</code> จะได้ \\(\\lceil 150/32 \\rceil = 5\\) batch/epoch ⇒ \\(1+15+3=19\\) บรรทัด — batch เล็กลงทำให้ hook ระดับ batch ถูกเรียกถี่ขึ้น</p>", "ref": "Lesson 6 §1 · callbacks notebook cell my_callback", "lesson": 6, "answer": 2, "why_wrong_map": ["ใช้ 2 batch ต่อ epoch (ปัดลงแทนปัดขึ้น) จึงได้ 1+6+3", "ลืมนับบรรทัด training start ที่ on_train_begin พิมพ์ครั้งเดียว", "", "เผลอคิดว่ามี on_epoch_begin พิมพ์ด้วยอีก 3 บรรทัด"]}, {"id": "L6-41", "topic": "ชนิดของ hyperparameter ใน KerasTuner", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "<code>hp.Int(\"units_0\", min_value=10, max_value=50, step=1)</code> ให้ค่าที่เป็นไปได้กี่ค่า", "options": ["41", "51", "50", "40"], "explanation": "<p>จำนวนเต็มตั้งแต่ 10 ถึง 50 ทีละ 1 รวมปลายทั้งสองข้าง ⇒ \\(50-10+1 = 41\\) ค่า (เลขเดียวกับที่ใช้คำนวณขนาด search space ใน §9)</p><p>ทบทวนชนิดของ \"ช่อง\" ที่สไลด์ระบุไว้สี่แบบ: <code>hp.Int</code> (จำนวนเต็มในช่วง), <code>hp.Float</code> (ทศนิยมในช่วง มี step หรือ sampling), <code>hp.Choice</code> (เลือก 1 จากรายการ เช่น activation ∈ {relu, elu, selu}), <code>hp.Boolean</code> (จริง/เท็จ เช่นจะใส่ Dropout layer หรือไม่)</p>", "ref": "Lesson 6 §10 (สไลด์หน้า 29)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "นับจาก 0 ถึง 50 ซึ่งเกินช่วงที่กำหนดไว้", "นับจาก 1 ถึง 50 โดยไม่ได้เริ่มที่ค่า min", "ลืมนับปลายข้างหนึ่ง (คิดเป็น 50−10)"]}, {"id": "L1-47", "lesson": 1, "topic": "วินิจฉัย underfit จาก accuracy", "source": "ex1", "type": "concept", "difficulty": "hard", "stem": "ใช้ logistic regression (node เดียว, feature \\(x_1,x_2\\) ดิบ) กับข้อมูลที่คลาส 1 กระจุกเป็นวงกลมตรงกลาง คลาส 0 ล้อมรอบ เทรนจน cost นิ่งแล้ว ได้ training accuracy 62% และ validation accuracy 60% สาเหตุหลักและวิธีแก้คือข้อใด?", "options": ["โมเดล overfit (high variance) — เพิ่ม regularization λ ให้แรงขึ้น", "learning rate ใหญ่เกินจน diverge — ลด α ลง 10 เท่าแล้วเทรนต่อ", "จำนวนรอบน้อยเกินไป — เพิ่มเป็น 20,000 รอบจะได้ accuracy 100%", "โมเดลให้ boundary เส้นตรง (high bias) — เพิ่ม feature ยกกำลัง/hidden layer"], "answer": 3, "explanation": "logistic regression node เดียวให้ decision boundary \\(\\theta_0+\\theta_1x_1+\\theta_2x_2=0\\) เป็นเส้นตรง แต่ข้อมูลแบ่งด้วยวงกลม (non-linear). cost นิ่งแปลว่าลู่เข้าแล้ว และ train กับ validation แย่พอ ๆ กัน = high bias — ปัญหาคือความจุของโมเดล ⇒ แก้ด้วยการเพิ่ม feature ยกกำลัง (\\(x_1^2, x_2^2\\)) หรือเพิ่ม hidden layer.", "ref": "ex1 cell (24)–(26); Lesson 1 §5, §10A", "why_wrong_map": ["overfit ต้องเห็น train สูงมากแต่ validation ต่ำ ข้อนี้แย่พอ ๆ กันทั้งคู่", "cost ลดลงแล้วนิ่ง ไม่ได้ระเบิด จึงไม่ใช่ปัญหา learning rate", "cost แบนแล้ว เพิ่มรอบไม่ช่วยเพราะ boundary ยังเป็นเส้นตรง", ""]}, {"id": "L4-43", "lesson": 4, "topic": "ex2: 4 บรรทัด dropout ฝั่ง forward", "source": "ex2", "type": "code", "difficulty": "easy", "stem": "จากโค้ด dropout ใน <code>nnCostFunction</code> ของ ex2 บรรทัด <code>D = (D &lt; keep_prob).astype(int)</code> ทำหน้าที่อะไร?", "options": ["ปรับค่า activation ที่รอดให้ใหญ่ขึ้นตามสัดส่วน keep_prob เพื่อชดเชย node ที่ถูกปิดไปในรอบนั้น", "สุ่มเลือกว่าจะใช้ dropout ในรอบนี้หรือไม่ โดยอิงจากความน่าจะเป็น keep_prob ของทั้ง layer พร้อมกัน", "แปลงเลขสุ่มในช่วง 0–1 ให้เป็น mask 0/1 โดยใช้ keep_prob เป็นเกณฑ์ ค่าที่น้อยกว่าจะถูกปิดทิ้ง", "แปลงเลขสุ่มในช่วง 0–1 ให้เป็น mask 0/1 โดยใช้ keep_prob เป็นเกณฑ์ ค่าที่น้อยกว่าจะถูกเก็บไว้"], "answer": 3, "explanation": "<p>สี่บรรทัดตรงกับสี่ขั้นบนสไลด์หน้า 31 พอดี: (1) <code>np.random.rand</code> สร้างเลขสุ่มสม่ำเสมอใน [0,1) (2) เทียบกับ keep_prob ได้ mask 0/1 (3) <code>np.multiply</code> ปิด node (4) หารด้วย keep_prob เพื่อ scale</p><p>บรรทัดนี้คือขั้นที่ 2: ค่าที่ <b>น้อยกว่า</b> keep_prob ⇒ True ⇒ 1 ⇒ <b>เก็บไว้</b> ดังนั้นสัดส่วนที่เก็บโดยเฉลี่ยเท่ากับ keep_prob พอดี เช่น keep_prob 0.8 ⇒ เก็บราว 80%</p>", "ref": "ex2 cell nnCostFunction (dropout 4 บรรทัด)", "code": "# Fill your code for dropout (4 lines of code)\nD = np.random.rand(*a1.shape)\nD = (D < keep_prob).astype(int)\na1 = np.multiply(a1, D)\na1 = a1 / keep_prob", "why_wrong_map": ["การ scale เป็นบรรทัดถัดไป (<code>a1 = a1 / keep_prob</code>)", "การสุ่มทำแยกอิสระต่อ node ไม่ใช่ตัดสินทั้ง layer พร้อมกัน", "กลับด้านของเกณฑ์ — ค่าที่น้อยกว่า keep_prob คือค่าที่รอด", ""]}, {"id": "L6-36", "topic": "Random Search: จุดแข็งและจุดอ่อน", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "สไลด์หน้า 26 ทำสีแดงจุดอ่อนของ Random Search ไว้ว่าอย่างไร", "options": ["มันต้องใช้ surrogate model ที่ปรับพารามิเตอร์ยาก ถ้าตั้งผิดจะวนอยู่แต่ย่านเดิมตลอด", "มันเป็น blind search ที่ไม่ใช้ผลของ trial ก่อนหน้า จึงอาจพลาดย่านที่มีแววโดยไม่กลับไปขุดต่อ", "มันตัด configuration ที่ออกตัวช้าทิ้งเร็วเกินไป ทั้งที่บางตัวอาจดีมากในระยะยาวก็ได้", "มันต้องเทรนทุกการจับคู่ในตารางที่กำหนดไว้ล่วงหน้า จึงแพงเกินไปสำหรับงาน deep learning"], "explanation": "<p>สไลด์ระบุว่า Random Search เป็น <mark class=\"src\" data-p=\"26\">blind search</mark> ที่ <mark class=\"src\" data-p=\"26\">does not use results from previous trials</mark> ผลคือ <mark class=\"src\" data-p=\"26\">it may miss promising regions</mark> — trial ที่ 30 สุ่มแบบเดียวกับ trial ที่ 1 ทั้งที่มีข้อมูลแล้ว 29 จุด</p><p>ส่วนจุดแข็ง: ด้วยงบ 9 จุดเท่ากัน Grid ทดสอบพารามิเตอร์สำคัญได้แค่ 3 ค่า แต่ Random ได้ถึง 9 ค่าที่ต่างกัน จึงเป็น <mark class=\"src\" data-p=\"26\">more efficient than Grid Search</mark> โดยเฉพาะเมื่อ <mark class=\"src\" data-p=\"26\">only some hyperparameters have a strong effect</mark></p>", "ref": "Lesson 6 §9 (สไลด์หน้า 26)", "lesson": 6, "answer": 1, "why_wrong_map": ["นั่นคือข้อจำกัดของ Bayesian Optimization ที่ต้องปรับ lambda ให้พอดี", "", "นั่นคือจุดอ่อนของ HyperBand ที่อาจตัดตัวที่ออกตัวช้าทิ้ง", "นั่นคือจุดอ่อนของ Grid Search ที่ไล่ทุกการจับคู่แบบ brute force"]}, {"id": "L1-39", "lesson": 1, "topic": "randInitializeWeights", "source": "ex1", "type": "code", "difficulty": "medium", "stem": "เรียก <code>randInitializeWeights(4, 3, epsilon_init=0.5)</code> จะได้ W shape เท่าใด และค่าอยู่ในช่วงใด?", "code": "def randInitializeWeights(L_in, L_out, epsilon_init=0.12):\n    W = np.zeros((L_out, 1 + L_in))\n    W = np.random.rand(L_out, 1 + L_in) * 2 * epsilon_init - epsilon_init\n    return W", "options": ["shape (5, 3), ค่าใน [−0.5, 0.5)", "shape (3, 5), ค่าใน [−0.5, 0.5)", "shape (3, 4), ค่าใน [−0.5, 0.5)", "shape (3, 5), ค่าใน [0, 1.0)"], "answer": 1, "explanation": "W มี shape <code>(L_out, 1 + L_in)</code> = (3, 1 + 4) = (3, 5): 3 output node, 4 input + 1 bias. <code>np.random.rand</code> ให้ค่าใน [0, 1) → คูณ \\(2\\epsilon=1.0\\) ได้ [0, 1.0) → ลบ \\(\\epsilon=0.5\\) ได้ [−0.5, 0.5). การสุ่มรอบศูนย์ทั้งบวกและลบคือการ break symmetry.", "ref": "ex1 cell (10)", "why_wrong_map": ["สลับแถวกับคอลัมน์ — จำนวนแถวคือ L_out", "", "ลืมคอลัมน์ bias (+1)", "ลืมลบ epsilon_init ท้ายสูตร"]}, {"id": "L4-20", "lesson": 4, "topic": "Momentum กับ local minima", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ทำไม Momentum จึงช่วยให้หลุดจาก local minimum ตื้น ๆ และ plateau ได้ตามสไลด์หน้า 17?", "options": ["เพราะ \\(v\\) ที่สะสมไว้ยังพาก้าวต่อได้แม้ gradient ตรงจุดนั้นจะเป็นศูนย์ ต่างจาก GD ที่หยุดสนิททันที", "เพราะ Momentum เพิ่มค่า \\(\\alpha\\) ให้อัตโนมัติเมื่อตรวจพบว่า gradient มีค่าเข้าใกล้ศูนย์แล้ว จึงก้าวต่อไปได้", "เพราะ Momentum สุ่มเลือก mini-batch ใหม่ทุกครั้งที่ตรวจพบว่า cost หยุดลดลงเป็นเวลานาน", "เพราะ Momentum รับประกันได้ว่าจะพบ global minimum เสมอไม่ว่าเริ่มต้นจากจุดใดของพื้นผิว"], "answer": 0, "explanation": "<p>อุปมาของอาจารย์: ลูกบอลที่มีโมเมนตัมมากพอจะไม่ติดที่ local minimum และหลุดจาก plateau ได้ \\\"เร็วกว่า gradient descent มาก\\\"</p><p>คิดเป็นตัวเลข: กลิ้งลงเนินมา 4 ก้าวด้วย \\(g=+1\\) ได้ \\(v_4=0.3439\\) พอถึงก้นหลุมที่ \\(g=0\\) พอดี ก้าวถัดไปยังเป็น \\(v_5 = 0.9(0.3439)+0.1(0) = 0.3095\\) — ยังเดินต่อได้เกือบเท่าเดิม ขณะที่ GD ธรรมดาได้ \\(\\alpha\\times0 = 0\\) คือหยุดนิ่ง</p>", "ref": "Lesson 4 §4.3 (สไลด์หน้า 17)", "why_wrong_map": ["", "\\(\\alpha\\) ไม่ได้ถูกเปลี่ยน สิ่งที่เปลี่ยนคือใช้ \\(v\\) แทน gradient สด", "การเลือก mini-batch เป็นคนละกลไกและไม่ได้ขึ้นกับ cost", "Momentum แค่เพิ่มโอกาสหลุดหลุมตื้น ไม่มีการรับประกันใด ๆ"]}, {"id": "L3-37", "lesson": 3, "topic": "เติมบรรทัด reshape Theta2", "source": "ex_shallow_nn", "type": "code", "difficulty": "medium", "stem": "พารามิเตอร์ทั้งหมดถูก unroll เป็นเวกเตอร์ <code>nn_params</code> (Theta1 ต่อด้วย Theta2) บรรทัดใดเติมช่อง <code>Theta2 = ...</code> เพื่อดึง Theta2 กลับออกมาได้ถูกต้อง?", "code": "Theta1 = np.reshape(nn_params[:hidden_layer_size * (input_layer_size + 1)],\n                    (hidden_layer_size, (input_layer_size + 1)))\nTheta2 = #### your code #####", "options": ["np.reshape(nn_params[hidden_layer_size * (input_layer_size + 1):], (num_labels, hidden_layer_size + 1))", "np.reshape(nn_params[hidden_layer_size * input_layer_size:], (num_labels, hidden_layer_size + 1))", "np.reshape(nn_params[:hidden_layer_size * (input_layer_size + 1)], (num_labels, hidden_layer_size + 1))", "np.reshape(nn_params[hidden_layer_size * (input_layer_size + 1):], (hidden_layer_size + 1, num_labels))"], "answer": 0, "explanation": "Theta1 ใช้ช่วงแรก \\(h(i+1)\\) ตัว (เช่น hidden 8, input 3 ⇒ \\(8\\times4=32\\) ตัว) ⇒ Theta2 คือ \"ที่เหลือ\" จึง slice เป็น <code>[h*(i+1):]</code> (เครื่องหมาย : อยู่หลัง) แล้วพับเป็น \\(b\\times(a+1)\\) = <code>(num_labels, hidden_layer_size + 1)</code> เช่น (1, 9). ลำดับ row-major ต้องตรงกับตอน ravel.", "ref": "ex_shallow_nn (2) nnCostFunction; Lesson 3 §4A.4", "why_wrong_map": ["", "ลืม +1 ใน offset — เริ่มตัดเร็วไป ข้อมูลของสองชั้นเหลื่อมกัน", "ใช้ slice ช่วงแรกซึ่งเป็นข้อมูลของ Theta1", "shape เป็น transpose (a+1)×b — ผิดกฎ b×(a+1)"]}, {"id": "L5-31", "lesson": 5, "topic": "MNIST: reshape & scale", "source": "mnist_notebook", "type": "code", "difficulty": "easy", "stem": "หลังรันเซลล์นี้ในโน้ตบุ๊ก MNIST ค่าของ <code>X</code> มี shape และช่วงค่าเท่าใด?", "code": "(X, y), (Xtest, ytest) = mnist.load_data()\nX = X.reshape(60000, 28 * 28)\nX = X.astype('float32') / 255", "options": ["(60000, 28, 28), ค่าอยู่ใน [0, 1]", "(60000, 784), ค่าอยู่ใน [0, 1]", "(784, 60000), ค่าอยู่ใน [0, 1]", "(60000, 784), ค่าอยู่ใน [0, 255]"], "answer": 1, "explanation": "<code>mnist.load_data()</code> ให้ X shape (60000, 28, 28) ค่า uint8 0–255. <code>reshape(60000, 28*28)</code> ยืดแต่ละภาพเป็นเวกเตอร์ 784 (row-major) โดยไม่ยุ่งมิติ batch ⇒ (60000, 784). <code>astype('float32')/255</code> เป็น min-max scaling ⇒ [0, 1] (255/255 = 1, 128/255 ≈ 0.502). ต้องทำกับ Xtest แบบเดียวกัน ⇒ (10000, 784).", "ref": "Lecture5 MNIST notebook cell 11; Lesson 5 §5.5", "why_wrong_map": ["ลืมว่ามีการ reshape", "", "สลับมิติ: มิติแรกต้องเป็นจำนวนตัวอย่าง", "ลืมว่ามีการหาร 255"]}, {"id": "L4-57", "lesson": 4, "topic": "นับพารามิเตอร์ของโมเดล Dropout หน้า 31", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "โมเดล Sequential บนสไลด์หน้า 31 นี้มีพารามิเตอร์ที่เรียนได้รวมทั้งหมดกี่ตัว?", "code": "model = keras.models.Sequential([\n    keras.layers.Flatten(input_shape=[28, 28]),\n    keras.layers.Dropout(rate=0.2),\n    keras.layers.Dense(300, activation=\"elu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dropout(rate=0.2),\n    keras.layers.Dense(100, activation=\"elu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dropout(rate=0.2),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "options": ["266,200 ตัว", "266,610 ตัว", "235,500 ตัว", "315,010 ตัว"], "answer": 1, "explanation": "Flatten และ Dropout ทั้งสามชั้นมี <b>0</b> พารามิเตอร์ (ไม่มีอะไรให้เรียน มีแต่การยืดเวกเตอร์กับการสุ่มปิด) จึงนับเฉพาะ Dense 3 ชั้น โดยใช้กฎ \\(s_l\\times(s_{l-1}+1)\\)<br>Flatten: \\(28\\times28 = 784\\) ช่อง<br>Dense(300): \\(300\\times(784+1) = 235{,}500\\)<br>Dense(100): \\(100\\times(300+1) = 30{,}100\\)<br>Dense(10): \\(10\\times(100+1) = 1{,}010\\)<br>รวม \\(235{,}500+30{,}100+1{,}010 = 266{,}610\\) ตัว", "ref": "Lesson 4 §6.2 (สไลด์หน้า 31)", "why_wrong_map": ["ลืมคอลัมน์ bias ทุกชั้น: \\(235{,}200+30{,}000+1{,}000 = 266{,}200\\)", "", "นับเฉพาะ Dense ชั้นแรก แล้วลืมอีกสองชั้นที่เหลือไป", "ใช้ 784 เป็นขาเข้าของ Dense(100) ด้วย: \\(235{,}500+78{,}500+1{,}010\\) — ขาเข้าของชั้นที่สองคือ 300 ไม่ใช่ 784"]}, {"id": "L2-23", "lesson": 2, "topic": "Norm และ unit vector", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "เวกเตอร์ \\(u=(6,8)\\) มี unit vector (เวกเตอร์ทิศทางที่ยาว 1) เท่ากับข้อใด?", "options": ["(0.6, 0.8)", "(1.0, 1.0)", "(0.43, 0.57)", "(6.0, 8.0)"], "answer": 0, "explanation": "<p>วิธีหา unit vector คือ “เอาเวกเตอร์หารด้วยความยาวของตัวเอง”</p>\n<ol><li>\\(\\|u\\| = \\sqrt{6^2+8^2} = \\sqrt{36+64} = \\sqrt{100} = 10\\)</li>\n<li>\\(w = \\left(\\frac{6}{10},\\frac{8}{10}\\right) = (0.6,\\ 0.8)\\)</li>\n<li>ตรวจ: \\(\\sqrt{0.36+0.64} = 1\\) ✓</li></ol>\n<p>เวกเตอร์ที่ชี้ทิศเดียวกันแต่ยาวต่างกัน เช่น \\((3,4)\\) กับ \\((6,8)\\) ให้ unit vector เดียวกันคือ \\((0.6, 0.8)\\) — unit vector เก็บเฉพาะทิศทาง</p>", "ref": "Lesson 2 §5A (Lecture2.pdf p.24)", "why_wrong_map": ["", "unit vector ไม่ได้แปลว่าทุกช่องเท่ากับ 1 แต่แปลว่า<b>ความยาวรวม</b>เท่ากับ 1", "หารด้วยผลบวกของสมาชิก (14) แทนที่จะหารด้วยความยาว (10)", "นี่คือเวกเตอร์เดิมซึ่งยาว 10 ไม่ใช่ 1"]}, {"id": "L4-11", "lesson": 4, "topic": "Iteration ต่อ epoch", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "training set มี 6,400 ตัวอย่าง ใช้ mini-batch size 64 เทรน 20 epoch จะมีการอัปเดต weight ทั้งหมดกี่ครั้ง?", "options": ["100 ครั้ง", "20 ครั้ง", "1,280 ครั้ง", "2,000 ครั้ง"], "answer": 3, "explanation": "<p>นิยามของอาจารย์หน้า 11: \"Iterations now is the number of mini-batches needed to complete one epoch\"</p><p>ขั้นที่ 1 — iteration ต่อ epoch \\(= \\lceil m/B\\rceil = 6{,}400/64 = 100\\)<br>ขั้นที่ 2 — คูณจำนวน epoch: \\(100\\times20 = 2{,}000\\) ครั้ง</p><p>เทียบ: ถ้าใช้ Batch GD (\\(B=m\\)) จะได้แค่ 20 ครั้ง — นี่คือความหมายของ \"weight updated faster\" บนสไลด์</p>", "ref": "Lesson 4 §3.4 (สไลด์หน้า 11)", "why_wrong_map": ["ลืมคูณจำนวน epoch นี่คือ iteration ของ <i>หนึ่ง</i> epoch เท่านั้น", "นับเป็น Batch GD คือ 1 อัปเดตต่อ epoch", "คูณขนาด batch (64) กับจำนวน epoch (20) แทนที่จะใช้จำนวน mini-batch ต่อ epoch", ""]}, {"id": "L2-43", "lesson": 2, "topic": "Forward computation ด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "โครงข่าย 2 layer ใช้ sigmoid โดย \\(\\theta^{[1]}=\\begin{bmatrix}-10&20&0\\\\30&-20&-20\\end{bmatrix}\\) (คอลัมน์ = bias, \\(x_1\\), \\(x_2\\)) และ \\(\\theta^{[2]}=[-30,\\ 20,\\ 20]\\) ที่ \\(x=(1,0)\\) ค่า \\(h_\\theta(x)\\) เป็นเท่าใด (ปัด \\(g(\\pm10)\\) เป็น 1/0)?", "options": ["\\(h\\approx1\\) เพราะ \\(a^{[1]}\\approx(1,1)\\) ⇒ \\(z^{[2]}=10\\)", "\\(h\\approx0\\) เพราะ \\(a^{[1]}\\approx(1,0)\\) ⇒ \\(z^{[2]}=-10\\)", "\\(h\\approx0\\) เพราะ \\(a^{[1]}\\approx(0,1)\\) ⇒ \\(z^{[2]}=-10\\)", "\\(h\\approx0.5\\) เพราะ \\(a^{[1]}\\approx(1,1)\\) ⇒ \\(z^{[2]}=0\\)"], "answer": 0, "explanation": "<p><b>layer 1</b> (bias + weight×input ทีละ node):</p>\n<ul><li>\\(z_1^{[1]} = -10 + 20(1) + 0(0) = 10 \\Rightarrow a_1^{[1]} = g(10) \\approx 1\\)</li>\n<li>\\(z_2^{[1]} = 30 + (-20)(1) + (-20)(0) = 10 \\Rightarrow a_2^{[1]} = g(10) \\approx 1\\)</li></ul>\n<p><b>layer 2</b> (ใช้ \\(a^{[1]}\\) เป็น input ไม่ใช่ \\(x\\)):</p>\n<p>\\(z^{[2]} = -30 + 20(1) + 20(1) = 10 \\Rightarrow h = g(10) \\approx 1\\)</p>\n<p>output node ชุดนี้คือ AND gate ⇒ ให้ 1 ก็ต่อเมื่อ hidden ทั้งสองเป็น 1 ซึ่งเป็นจริงในกรณีนี้พอดี. รูปแบบที่ซ้ำทุกชั้นคือ “คูณ weight บวก bias ได้ \\(z\\) → ผ่าน \\(g\\) ได้ \\(a\\)”</p>", "ref": "Lesson 2 §8 (Lecture2.pdf p.49)", "why_wrong_map": ["", "\\(a_2^{[1]}\\) คิดผิด: \\(30-20-0 = +10\\) ไม่ใช่ค่าลบ", "ลืมบวก bias ของ node 1 (\\(-10\\)) ทำให้ \\(a_1^{[1]}\\) ผิด", "ถ้า \\(a^{[1]}=(1,1)\\) แล้ว \\(z^{[2]} = -30+40 = 10\\) ไม่ใช่ 0"]}, {"id": "L6-24", "topic": "อาร์กิวเมนต์ของ TensorBoard callback", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "เทรนเสร็จแล้วเปิด TensorBoard พบว่าแท็บ Scalars มีกราฟครบ แต่แท็บ Histograms ว่างเปล่า สาเหตุที่เป็นไปได้มากที่สุดคือข้อใด", "options": ["ตั้ง write_graph=False จึงไม่มีการเก็บค่า weight ลงไฟล์ log ให้แท็บนั้นอ่านได้", "ตั้ง update_freq='epoch' จึงเขียน histogram ได้แค่ตอนจบการเทรนเพียงครั้งเดียว", "ไม่ได้ตั้ง histogram_freq=1 จึงใช้ค่าเริ่มต้น 0 ซึ่งแปลว่าไม่คำนวณ histogram เลย", "ระบุ log_dir ผิดโฟลเดอร์ เว็บจึงอ่านไฟล์ของ histogram ไม่เจอแม้ไฟล์จะมีอยู่จริง"], "explanation": "<p><code>histogram_freq</code> มีค่า default = 0 ซึ่งแปลว่า \"ไม่คำนวณ histogram เลย\" — โค้ดไม่ error แต่แท็บ Histograms/Distributions จะว่างเปล่า ต้องตั้ง <code>histogram_freq=1</code> เพื่อคำนวณ histogram ของ activation และ weight ทุก 1 epoch</p><p>อาร์กิวเมนต์อื่นในโค้ดของคาบ: <code>log_dir</code> = โฟลเดอร์ปลายทาง, <code>write_graph=True</code> = เขียน computational graph ให้แท็บ Graphs, <code>update_freq='epoch'</code> = เขียน loss/metric ทุกจบ epoch (ใส่ 'batch' หรือจำนวนเต็มได้แต่ไฟล์จะใหญ่)</p>", "ref": "Lesson 6 §6 (สไลด์หน้า 13) · tensorboard notebook", "lesson": 6, "answer": 2, "why_wrong_map": ["write_graph คุมแท็บ Graphs ไม่ได้คุม histogram ของ weight", "update_freq คุมความถี่ของ scalar metric ซึ่งในกรณีนี้แสดงผลได้ปกติอยู่แล้ว", "", "ถ้า log_dir ผิดจริง แท็บ Scalars ก็ต้องว่างไปด้วย ไม่ใช่ว่างเฉพาะ Histograms"]}, {"id": "L2-04", "lesson": 2, "topic": "นิยาม ANN (inspired by biological brain)", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "นิยาม “ANN is a mathematical model for computation which is based on a large collection of neural units (connectionist) inspired by biological brain” ข้อใดตรงกับนิยามนี้มากที่สุด?", "options": ["เป็นแบบจำลองที่ใช้ได้กับงาน classification เท่านั้น ใช้กับงาน regression ไม่ได้", "เป็นการจำลองปฏิกิริยาเคมีของนิวรอนจริงในสมองมนุษย์อย่างครบถ้วนทุกขั้น", "เป็นวงจรอิเล็กทรอนิกส์ที่ต้องมีหน่วยประมวลผลแยกจริงหนึ่งตัวต่อหนึ่งนิวรอน", "เป็นแบบจำลองคณิตศาสตร์ที่ความสามารถเกิดจากการเชื่อมต่อของหน่วยย่อยจำนวนมาก"], "answer": 3, "explanation": "<p>คำที่ต้องจับคือ <b>mathematical model</b>, <b>large collection of neural units (connectionist)</b> และ <b>inspired by</b>. connectionist แปลว่าความสามารถอยู่ที่การเชื่อมต่อระหว่างหน่วยจำนวนมาก ไม่ใช่ที่หน่วยเดียว และ “inspired by” คือ <em>ได้แรงบันดาลใจ</em> ไม่ใช่จำลองสมองจริง</p>\n<p>NN ถูกมองเป็น universal model ที่ใช้ได้กว้าง ทั้ง regression และ classification และเด่นเป็นพิเศษกับงาน non-linear ซับซ้อนและงานที่ feature เยอะ (เช่น computer vision)</p>", "ref": "Lesson 2 §1A (Lecture2.pdf p.4)", "why_wrong_map": ["NN เป็น universal model ใช้ได้ทั้ง regression และ classification", "นิยามใช้คำว่า inspired by ไม่ใช่การจำลองสมองจริงระดับเคมี", "ANN เป็นโมเดลคณิตศาสตร์ ไม่ได้ผูกกับฮาร์ดแวร์แบบหนึ่งต่อหนึ่ง", ""]}, {"id": "L3-54", "lesson": 3, "topic": "Softmax loss: ทำไมเหลือพจน์เดียว", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "loss ของ softmax คือ \\(J=-\\frac{1}{m}\\sum_i\\sum_k y_k^{(i)}\\log(h)_k\\) ทำไมจึงไม่มีเทอม \\((1-y)\\log(1-h)\\) แบบ binary cross-entropy?", "options": ["เพราะเทอม \\((1-y)\\log(1-h)\\) ถูกย้ายไปรวมอยู่ในเทอม regularization แทน", "เพราะ softmax ใช้ได้กับงาน 2 คลาสเท่านั้น ผลรวม \\(\\sum_k\\) จึงมีแค่สองพจน์", "เพราะ softmax ให้ค่าเป็นบวกเสมอ จึงไม่จำเป็นต้องลงโทษคลาสที่ทำนายผิดเลย", "เพราะ \\(y_k=1\\) เฉพาะคลาสที่ถูก ที่เหลือเป็น 0 ⇒ ผลรวม \\(\\sum_k\\) เหลือพจน์เดียว"], "answer": 3, "explanation": "\\(y_k^{(i)}=1\\) เฉพาะคลาสที่ถูก และเป็น 0 สำหรับคลาสอื่น ⇒ ในผลรวม \\(\\sum_k\\) มีพจน์เดียวที่ไม่เป็นศูนย์ คือของคลาสที่ถูก ⇒ cost \\(=-\\log(\\)ความน่าจะเป็นที่ให้กับคำตอบที่ถูก\\()\\). เช่น \\(a=[0.2,0.7,0.1]\\): ถ้าคำตอบจริงคือคลาสที่ 2 ⇒ \\(-\\ln0.7=0.357\\) (ต่ำ ดี); ถ้าเป็นคลาสที่ 3 ⇒ \\(-\\ln0.1=2.303\\) (โดนปรับหนัก). ไม่ต้องมีเทอม \\((1-y)\\log(1-h)\\) เพราะ softmax บังคับผลรวม = 1 อยู่แล้ว การดันคลาสถูกขึ้นจึงกดคลาสผิดลงโดยอัตโนมัติ.", "ref": "Lesson 3 §6 Softmax (p.38)", "why_wrong_map": ["regularization เป็นเทอมของ \\(\\theta\\) ไม่เกี่ยวกับรูปของ loss", "softmax เป็น generalization ของ logistic สำหรับหลายคลาส ไม่ได้จำกัด 2 คลาส", "คลาสผิดถูกกดลงโดยอ้อมผ่านข้อบังคับผลรวม = 1 ไม่ใช่ไม่ลงโทษ", ""]}, {"id": "L5-52", "lesson": 5, "topic": "mnist.load_data(): รูปแบบ tuple ซ้อน tuple", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "โหลด MNIST ด้วย <code>mnist.load_data()</code> บรรทัดใดรับค่าที่คืนกลับได้ถูกต้อง?", "options": ["<code>X, (y, Xtest, ytest) = mnist.load_data()</code>", "<code>(X, y), (Xtest, ytest) = mnist.load_data()</code>", "<code>(X, Xtest), (y, ytest) = mnist.load_data()</code>", "<code>X, y, Xtest, ytest = mnist.load_data()</code>"], "answer": 1, "explanation": "<p>ฟังก์ชันคืนค่าเป็น <b>tuple สองชั้น</b>: ก้อนแรกคือชุดเทรน (ภาพ, ป้าย) ก้อนที่สองคือชุดทดสอบ (ภาพ, ป้าย) ⇒ ต้องแกะด้วยรูปแบบ <code>(X, y), (Xtest, ytest)</code>.</p><p>ตรวจด้วย shape ที่ได้: <code>X.shape</code> = (60000, 28, 28), <code>y.shape</code> = (60000,), <code>Xtest.shape</code> = (10000, 28, 28), <code>ytest.shape</code> = (10000,). Keras แบ่ง train/test มาให้แล้ว จึงไม่ต้องเรียก <code>train_test_split</code> เอง (ต่างจากกรณีสไลด์หน้า 36).</p>", "ref": "Lesson 5 §5.3 (สไลด์หน้า 24); Lecture5 MNIST notebook cell 5", "why_wrong_map": ["รูปแบบไม่ตรงกับโครงสร้างที่คืนมา จึงเกิด error ตอนแกะค่า", "", "จับคู่ผิดแกน: ก้อนแรกคือ (ภาพเทรน, ป้ายเทรน) ไม่ใช่ (ภาพเทรน, ภาพเทสต์)", "แกะเป็น 4 ตัวแปรเรียงกัน — รันไม่ผ่าน เพราะสิ่งที่คืนมาคือ tuple ซ้อน tuple 2 ชั้น ไม่ใช่ 4 ก้อนเรียงกัน"]}, {"id": "L5-12", "lesson": 5, "topic": "ทำไม He มีเลข 2", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ในสูตร He \\(\\operatorname{Var}(\\theta)=2/\\text{fan\\_in}\\) เลข 2 ในตัวเศษมีไว้ชดเชยอะไร?", "options": ["ReLU ตัดค่าลบครึ่งหนึ่งเป็น 0 พลังงานของ activation จึงหายไปครึ่งหนึ่ง", "truncated normal ตัดหางเกิน 2σ ทิ้ง จึงต้องคูณ 2 เพื่อคืนส่วนที่ตัดไป", "ReLU มีอนุพันธ์เท่ากับ 2 ในฝั่งบวก จึงต้องคูณ 2 ให้ตรงกับอนุพันธ์", "การคิดทั้ง forward และ backward จึงต้องรวมสองทิศทางเข้าด้วยกันเป็น 2"], "answer": 0, "explanation": "\\(\\operatorname{Var}(z')=n\\sigma_\\theta^2E[a^2]\\) และ ReLU ให้ \\(E[a^2]=\\tfrac12\\operatorname{Var}(z)\\) (ครึ่งลบกลายเป็น 0). อยากให้ variance คงที่ ⇒ \\(n\\sigma_\\theta^2\\cdot\\tfrac12=1\\) ⇒ \\(\\sigma_\\theta^2=2/n\\). ถ้าใช้ \\(1/n\\) กับ ReLU ตัวคูณต่อชั้น = ½ ⇒ variance หดครึ่งทุกชั้น (จำลอง 10 ชั้นเหลือ ~0.0018).", "ref": "Lesson 5 §2.3 กล่องพิสูจน์ He", "why_wrong_map": ["", "truncation ไม่ใช่ที่มาของเลข 2", "อนุพันธ์ ReLU ฝั่งบวกคือ 1", "นั่นคือเหตุผลของ Xavier (fan_in+fan_out)"]}, {"id": "L1-29", "lesson": 1, "topic": "k-fold cross validation", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "หลังแบ่ง train-test 80-20 ส่วน train มี 500 แถว ทำ 5-fold cross validation ในแต่ละรอบโมเดลถูก fit ด้วยกี่แถว และวัดผลบนกี่แถว?", "options": ["fit 400 แถว, วัดผล 125 แถว", "fit 400 แถว, วัดผล 100 แถว", "fit 100 แถว, วัดผล 400 แถว", "fit 500 แถว, วัดผล 100 แถว"], "answer": 1, "explanation": "แบ่ง train 500 แถวเป็น k = 5 folds ขนาดใกล้เคียงกัน ⇒ fold ละ 100. แต่ละรอบกัน 1 fold ไว้เป็น validation (100 แถว) และ fit ด้วยอีก \\(k-1=4\\) folds (400 แถว). ทำครบ 5 รอบ ข้อมูลทุกแถวเป็น validation 1 ครั้งพอดี แล้วเฉลี่ย error ทั้ง 5 รอบ (error estimates should be average). Cross-validation เป็น <b>resampling procedure</b>; test 20% ไม่ถูกแตะ.", "ref": "Lesson 1 §9 (p.52–53)", "why_wrong_map": ["หาร 500 ด้วย 4 ผิด — ต้องแบ่งเป็น 5 folds", "", "กลับด้าน — เทรนด้วย k−1 folds ไม่ใช่ 1 fold", "ถ้า fit ทั้ง 500 แถว fold ที่ใช้วัดผลจะถูกเห็นแล้ว"]}, {"id": "L6-18", "topic": "นับพารามิเตอร์ Dense ชั้นเดียว", "source": "callbacks_notebook", "type": "calc", "difficulty": "easy", "stem": "โมเดลที่ใช้สาธิต BackupAndRestore ในคาบมี trainable parameter กี่ตัว", "code": "model = models.Sequential([\n    Input(shape=(20,)),\n    Dense(10)\n])\nmodel.compile(keras.optimizers.SGD(), loss='mse')", "options": ["220", "30", "200", "210"], "explanation": "<p>\\(\\#\\text{params} = n_{in}\\,n_{out} + n_{out} = 20\\times10 + 10 = 200 + 10 = 210\\)</p><p>kernel เป็นเมทริกซ์ \\(20\\times10\\) = 200 ค่า (ทุก input เชื่อมทุก output) และ bias อีก 10 ค่า (unit ละ 1)</p><p>สังเกตว่า Dense นี้ไม่ได้ระบุ activation จึงเป็น linear แต่ไม่กระทบจำนวนพารามิเตอร์ และ <code>Input(shape=(20,))</code> ไม่มีพารามิเตอร์ของตัวเอง</p>", "ref": "callbacks notebook · BackupAndRestore cell", "lesson": 6, "answer": 3, "why_wrong_map": ["นับ bias เกินมาอีก 10 ตัว เช่นเผลอให้ Input มี bias ด้วย", "เอา 20 + 10 มาบวกกันแทนการคูณ", "ลืม bias 10 ตัว นับแต่ kernel 20×10", ""]}, {"id": "L2-45", "lesson": 2, "topic": "สมบัติการแจกแจงของเวกเตอร์ (distribution)", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "สมบัติการแจกแจงของเวกเตอร์ \\(c(\\mathbf{a}+\\mathbf{b}) = c\\mathbf{a}+c\\mathbf{b}\\) ถ้า \\(\\mathbf{a}=[2,-1]^\\top,\\ \\mathbf{b}=[1,3]^\\top,\\ c=2\\) ผลลัพธ์เท่ากับข้อใด?", "options": ["[5, 1]", "[6, 4]", "[3, 2]", "[4, −2]"], "answer": 1, "explanation": "<p>คิดได้สองทางและต้องได้คำตอบเดียวกัน (นั่นคือความหมายของสมบัติแจกแจง):</p>\n<ul><li>ฝั่งซ้าย: \\(\\mathbf{a}+\\mathbf{b} = [3,2]\\) แล้วคูณ 2 ⇒ \\([6,4]\\)</li>\n<li>ฝั่งขวา: \\(2\\mathbf{a}=[4,-2]\\), \\(2\\mathbf{b}=[2,6]\\) แล้วบวกกัน ⇒ \\([6,4]\\) ✓</li></ul>\n<p>สมบัติของการบวกเวกเตอร์กับการคูณสเกลาร์มี 3 ข้อ: commutative (\\(\\mathbf{a}+\\mathbf{b}=\\mathbf{b}+\\mathbf{a}\\)), associative และ distribution. ห้ามยกสมบัติสลับที่ไปใช้กับการคูณเมทริกซ์ ซึ่ง \\(AB\\ne BA\\)</p>", "ref": "Lesson 2 §5A (Lecture2.pdf p.22–23)", "why_wrong_map": ["แจกแจงไม่ครบ — คูณ 2 ให้ \\(\\mathbf{a}\\) ตัวเดียวแล้วบวก \\(\\mathbf{b}\\) ดิบ", "", "ลืมคูณสเกลาร์ \\(c=2\\) (นี่คือ \\(\\mathbf{a}+\\mathbf{b}\\) เฉย ๆ)", "คูณ 2 ให้ \\(\\mathbf{a}\\) ตัวเดียวแล้วลืมบวก \\(\\mathbf{b}\\)"]}, {"id": "L3-27", "lesson": 3, "topic": "Softmax vs หารผลรวมตรง ๆ เมื่อ logit ติดลบ", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "output layer 2 node ให้ logit \\(z=[-2,\\,-3]\\) ถ้าแปลงเป็นความน่าจะเป็นด้วย (1) หารด้วยผลรวม \\(z_i/\\sum z\\) ตรง ๆ กับ (2) softmax จะได้ผลอย่างไร?", "options": ["(1) ได้ [0.4, 0.6] ลำดับกลับด้าน; (2) ได้ [0.27, 0.73] กลับด้านเช่นกัน", "(1) ได้ [0.4, 0.6] ลำดับกลับด้าน; (2) ได้ [0.73, 0.27] ถูกลำดับ", "(1) ได้ [0.6, 0.4] ถูกลำดับ; (2) ได้ [0.73, 0.27] ถูกลำดับเช่นกัน", "(1) หารไม่ได้เพราะผลรวมเป็นศูนย์; (2) ได้ [0.5, 0.5] เท่ากัน"], "answer": 1, "explanation": "(1) \\(\\sum z=-5\\) ⇒ \\([-2/-5,\\,-3/-5]=[0.4,\\,0.6]\\) — node ที่มี logit ต่ำกว่า (−3) กลับได้ความน่าจะเป็นสูงกว่า ⇒ ผิดลำดับ. (2) \\(e^{-2}/(e^{-2}+e^{-3}) = 1/(1+e^{-1}) \\approx 0.73\\) ⇒ \\([0.73,\\,0.27]\\) — ถูกลำดับ. นี่คือเหตุผลที่ softmax ใช้ exponential: some output might be negative และ \\(e^z\\) เป็นบวกเสมอ อีกทั้งขยายค่าสูงสุดให้โมเดล \"less neutral\".", "ref": "Lesson 3 §6 Softmax (p.38)", "why_wrong_map": ["softmax รักษาลำดับของ logit เสมอ เพราะ \\(e^z\\) เป็นฟังก์ชันเพิ่ม", "", "ลืมว่าผลรวมเป็นลบ การหารด้วยค่าลบทำให้ลำดับกลับ", "ผลรวมคือ −5 ไม่ใช่ศูนย์ และ softmax ไม่ได้ให้ค่าเท่ากันเมื่อ logit ต่างกัน"]}, {"id": "L1-02", "lesson": 1, "topic": "AI / ML / DL และนิยาม ANN", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดอธิบายความสัมพันธ์ระหว่าง Deep Learning กับ Machine Learning และความหมายของ ANN ได้ถูกต้อง?", "options": ["ML เป็น subfield ของ DL; ANN คือ mathematical model ที่มี stacked layers ของ nodes", "DL แยกขาดจาก ML; ANN คือโปรแกรมที่ต้องให้มนุษย์กำหนด feature ให้ทุกชั้นเอง", "DL เป็น subfield ของ ML; ANN คือ biological model ที่จำลองเซลล์สมองจริงทุกเซลล์", "DL เป็น subfield ของ ML; ANN คือ mathematical model ที่มี stacked layers ของ nodes"], "answer": 3, "explanation": "Deep Learning (DL) is a specific subfield of Machine Learning — ลำดับการซ้อนคือ AI ⊃ ML ⊃ Representation Learning ⊃ ANN/DL. ANN เป็น <b>mathematical model</b> ที่ประกอบด้วย stacked layers ของ nodes ซึ่ง <i>ได้แรงบันดาลใจ</i> จาก neural units ในสมอง — ยืมแค่รูปทรง ไม่ได้จำลองสมองจริง. จุดเด่นของ DL คือ complex network + automatically learning features from data.", "ref": "Lesson 1 §0A (p.8–9)", "why_wrong_map": ["กลับลำดับการซ้อน: DL อยู่ใน ML ไม่ใช่ ML อยู่ใน DL", "DL เรียน feature เองอัตโนมัติ และเป็นส่วนหนึ่งของ ML", "ANN ไม่ใช่ biological model — เป็นแบบจำลองทางคณิตศาสตร์", ""]}, {"id": "L3-26", "lesson": 3, "topic": "Softmax: คำนวณด้วยมือ", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "output layer 3 node ให้ logit \\(z=[\\ln 3,\\ 0,\\ 0]\\). ผลของ Softmax \\(a_i=e^{z_i}/\\sum e^{z_j}\\) คือข้อใด?", "options": ["[0.5, 0.25, 0.25]", "[1.0, 0.0, 0.0]", "[0.33, 0.33, 0.33]", "[0.6, 0.2, 0.2]"], "answer": 3, "explanation": "ขั้นที่ 1: \\(t=[e^{\\ln3},e^0,e^0]=[3,1,1]\\). ขั้นที่ 2: \\(\\sum t=5\\). ขั้นที่ 3: \\(a=[3/5,1/5,1/5]=[0.6,0.2,0.2]\\) รวมได้ 1 ✓. ถ้าใช้สัดส่วนตรงๆ กับ logit จะได้ \\([1,0,0]\\) (หาร ln3 ด้วย ln3) — exponential ทำให้ทุกคลาสได้ค่าบวก (จัดการค่าติดลบ/ศูนย์) และขยายตัวที่มากที่สุดให้โมเดล &quot;less neutral&quot;.", "ref": "Lesson 3 §6 Softmax (p.38)", "why_wrong_map": ["ใช้ z=[ln 2,0,0] (ผลคือ 2/4) — อ่าน ln3 ผิด", "หารด้วยผลรวมของ logit ตรงๆ โดยไม่ยก e", "คิดว่า softmax ให้ค่าเท่ากันเสมอ ลืมยก e ของ ln3", ""]}, {"id": "L5-06", "lesson": 5, "topic": "Gradient clipping by norm", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "gradient \\(g=[6,\\ -8]\\) ถูก clip แบบ <b>by norm</b> ด้วย threshold 5 (เช่น <code>SGD(clipnorm=5.0)</code>) จะได้ gradient ใหม่เท่าใด?", "options": ["[3, −4]", "[0.6, −0.8]", "[1, −1]", "[5, −5]"], "answer": 0, "explanation": "ขั้น 1: \\(\\|g\\|=\\sqrt{6^2+8^2}=\\sqrt{100}=10\\). ขั้น 2: 10 &gt; 5 จึงย่อทั้งเวกเตอร์ด้วย \\(5/10=0.5\\) ⇒ \\([3,-4]\\) (ความยาว 5 พอดี ทิศเดิม). เทียบ clip by value (\\(c=5\\)) จะได้ \\([5,-5]\\) ซึ่งบิดทิศ. clipping ใช้แก้ <b>exploding</b> และทำก่อนก้าว gradient descent.", "ref": "Lesson 5 §1.2 กล่องคำนวณ gradient clipping", "why_wrong_map": ["", "หารด้วย norm จนเหลือความยาว 1 ลืมคูณ threshold 5", "นั่นคือ clip by value ด้วย threshold 1", "นั่นคือ clip by value ด้วย threshold 5 (ทิศเปลี่ยน)"]}, {"id": "L6-42", "topic": "เติมโค้ด hp.Float กับ sampling='log'", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ต้องการให้ tuner เลือก learning rate ระหว่าง 0.0001 ถึง 0.01 โดยให้โอกาสเท่ากันทุกระดับเลขยกกำลัง บรรทัดใดถูกต้อง", "options": ["hp.Int(\"lr\", 1e-4, 1e-2, sampling='log')", "hp.Float(\"lr\", 1e-4, 1e-2, sampling='linear')", "hp.Choice(\"lr\", values=[1e-4, 1e-3, 1e-2])", "hp.Float(\"lr\", 1e-4, 1e-2, sampling='log')"], "explanation": "<p>learning rate เป็นทศนิยม จึงต้องใช้ <code>hp.Float</code> (hp.Int รับได้เฉพาะจำนวนเต็ม) และต้องเป็น <code>sampling='log'</code></p><p>เหตุผลเชิงตัวเลข: ถ้าสุ่มแบบเส้นตรง \\(P(\\text{lr} < 0.001) = \\frac{0.0009}{0.0099} \\approx 9.1\\%\\) ⇒ 91% ของ trial กองอยู่ในช่วง 0.001–0.01. แต่แบบ log \\(P = \\frac{-3-(-4)}{-2-(-4)} = \\frac{1}{2} = 50\\%\\) ⇒ ให้โอกาสเท่ากันทุก \"ระดับ\"</p><p>กฎง่ายๆ: hyperparameter ที่คิดเป็น \"กี่ยกกำลัง\" (learning rate, \\(\\lambda\\) ของ L2, weight decay) ใช้ log; ที่คิดเป็น \"กี่หน่วย\" (จำนวน unit, dropout rate) ใช้เส้นตรง</p>", "ref": "Lesson 6 §10 (สไลด์หน้า 29)", "lesson": 6, "answer": 3, "why_wrong_map": ["hp.Int รับเฉพาะจำนวนเต็ม จึงใช้กับ learning rate ทศนิยมไม่ได้", "linear ทำให้ trial กว่า 90% กองอยู่ในช่วงค่าสูง ไม่ได้โอกาสเท่ากันทุกระดับ", "hp.Choice จำกัดให้เหลือแค่ 3 ค่า ไม่ใช่การสุ่มต่อเนื่องทั้งช่วง", ""]}, {"id": "L5-44", "lesson": 5, "topic": "ตาราง last-layer activation / loss", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "งาน <b>multiclass, multilabel</b> (ภาพหนึ่งมีวัตถุได้หลายชนิดพร้อมกัน) ควรใช้ last-layer activation และ loss คู่ใดตามสไลด์หน้า 34?", "options": ["ไม่ใส่ activation กับ mse", "sigmoid กับ binary_crossentropy", "softmax กับ categorical_crossentropy", "softmax กับ binary_crossentropy"], "answer": 1, "explanation": "multilabel ⇒ แต่ละคลาสตัดสินอิสระ ความน่าจะเป็นไม่ต้องรวมเป็น 1 ⇒ sigmoid ทุก node + binary_crossentropy. ส่วน single-label (เช่น MNIST) ⇒ softmax + categorical_crossentropy; regression ทั่วไป ⇒ ไม่ใส่ activation + mse; regression ในช่วง 0–1 ⇒ sigmoid + mse/binary_crossentropy.", "ref": "Lesson 5 §6 (สไลด์หน้า 34)", "why_wrong_map": ["นั่นคือ regression to arbitrary values", "", "นั่นคือ multiclass single-label", "softmax บังคับผลรวม 1 ขัดกับหลาย label"]}, {"id": "L4-54", "lesson": 4, "topic": "Shuffling ก่อนแบ่ง mini-batch", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "สไลด์หน้า 11 กำกับคำว่า \"Shuffling\" ไว้ก่อนแบ่งข้อมูลเป็น mini-batch ถ้าข้ามขั้นนี้กับข้อมูลที่เรียงตาม label จะเกิดอะไรขึ้น?", "options": ["mini-batch จะกินหน่วยความจำเพิ่มขึ้นเป็นเท่าตัว เพราะต้องเก็บลำดับเดิมของข้อมูลเอาไว้ด้วยเสมอ", "mini-batch ช่วงต้นจะมีแต่คลาสเดียว ทิศของ gradient แต่ละก้อนจึงเบี่ยงไปจากทิศจริงของข้อมูลทั้งชุด", "mini-batch แต่ละก้อนจะมีขนาดไม่เท่ากัน ทำให้คำนวณจำนวน iteration ต่อ epoch ล่วงหน้าไม่ได้เลย", "mini-batch ก้อนเดิมจะถูกใช้ซ้ำทุก epoch ทำให้โมเดลเห็นข้อมูลไม่ครบทั้งชุดตลอดการเทรนทั้งหมด"], "answer": 1, "explanation": "บนสไลด์ คอลัมน์ซ้ายเรียงเลข 1, 2, 3, …, 10000 ตามลำดับเดิม แต่หลังสลับแล้วก้อนแรกมีสมาชิกอย่าง 2 และ 300, ก้อนที่สองมี 7101 กับ 3030 — เลขกระโดดไปมา ไม่เรียงกันแล้ว<br>เหตุผล: ถ้า 5,000 แถวแรกเป็นคลาส A และ 5,000 แถวหลังเป็นคลาส B การแบ่งโดยไม่สลับทำให้ mini-batch ที่ 1–5 เห็นคลาส A ล้วน ๆ โมเดลจะถูกดึงไปทางคลาส A ห้าก้าวติด แล้วถูกกระชากกลับมาทางคลาส B อีกห้าก้าว<br>การสลับทำให้ทุก mini-batch เป็น \"ตัวแทนย่อ\" ของข้อมูลทั้งชุด ทิศของ gradient แต่ละก้อนจึงใกล้ทิศจริง — ซึ่งเป็นเงื่อนไขที่ทำให้ค่าเฉลี่ยจากกลุ่มขนาด \\(B\\) ใช้แทน gradient จริงได้ตามกฎ \\(1/\\sqrt{B}\\)", "ref": "Lesson 4 §3.4 (สไลด์หน้า 11)", "why_wrong_map": ["การสลับลำดับไม่ได้เพิ่มการใช้หน่วยความจำของ mini-batch ซึ่งขึ้นกับ \\(B\\) เท่านั้น", "", "ขนาดก้อนถูกกำหนดด้วย batch size ไม่ได้ขึ้นกับการสลับ จำนวน iteration ยังเป็น \\(\\lceil m/B\\rceil\\) เหมือนเดิม", "1 epoch ยังวนดูข้อมูลครบทั้งชุดอยู่ดี การสลับเปลี่ยนแค่ว่าใครอยู่ก้อนไหน ไม่ได้ทำให้ข้อมูลหาย"]}, {"id": "L4-48", "lesson": 4, "topic": "ex2: validation curve ของ lambda", "source": "ex2", "type": "code", "difficulty": "medium", "stem": "จากผล validation curve ของ \\(\\lambda\\) ใน ex2 ควรเลือกค่าใด และอ่านค่าที่ \\(\\lambda=10\\) ว่าอย่างไร?", "options": ["เลือก \\(\\lambda=0.1\\) เพราะเป็นจุดที่ train error เริ่มสูงขึ้นชัดเจน ซึ่งแปลว่า regularization เริ่มออกฤทธิ์พอดี", "เลือก \\(\\lambda=0.03\\) เพราะ validation error ต่ำสุด (0.2625) ส่วน \\(\\lambda=10\\) error สูงทั้งคู่ = regularize แรงไปจน underfit", "เลือก \\(\\lambda=10\\) เพราะเป็นค่าที่บีบ weight ได้แรงที่สุด ส่วน \\(\\lambda=0.03\\) ยังปล่อยให้โมเดล overfit อยู่มาก", "เลือก \\(\\lambda=0\\) เพราะ train error ต่ำสุด (0.1404) ส่วน \\(\\lambda=10\\) error สูงทั้งคู่ = regularize แรงไปจน underfit เช่นเดียวกัน"], "answer": 1, "explanation": "<p>กฎการอ่าน validation curve: เลือกค่าที่ให้ <b>validation error ต่ำสุด</b> ไม่ใช่ training error ต่ำสุด (train error จะต่ำสุดที่ \\(\\lambda=0\\) เสมอ เพราะไม่มีการลงโทษ)</p><p>จากตาราง: \\(\\lambda=0.03\\) ให้ val 0.262478 ซึ่งต่ำที่สุด ⇒ โน้ตบุ๊กจึงใช้ \\(\\lambda=0.03\\) ในการ retrain และได้ test accuracy 88% (เทียบกับ 82% ตอนไม่มี regularization)</p><p>ที่ \\(\\lambda=10\\): train 0.3462 / val 0.3486 สูงพอ ๆ กันทั้งคู่ — นี่คือหน้าตาของ underfit (high bias) ตรงกับเกณฑ์หน้า 30 ที่ให้เทียบ train กับ validation</p>", "ref": "ex2 cell validationCurve (ผลตาราง lambda)", "code": "lambda\t\tTrain Error\tValidation Error\n 0.000000\t0.140399\t0.268485\n 0.010000\t0.141594\t0.265295\n 0.030000\t0.143029\t0.262478\n 0.100000\t0.180234\t0.266357\n 1.000000\t0.281662\t0.322830\n10.000000\t0.346163\t0.348565", "why_wrong_map": ["จุดที่ train error เริ่มสูงขึ้นไม่ใช่เกณฑ์การเลือก ต้องดู validation", "", "\\(\\lambda\\) ใหญ่สุดไม่ได้แปลว่าดีสุด ตัวเลขบอกว่ามัน underfit", "เลือกจาก train error เป็นการเลือกโมเดลที่ overfit ที่สุดเสมอ"]}, {"id": "L1-42", "lesson": 1, "topic": "epsilon in log", "source": "ex1", "type": "code", "difficulty": "medium", "stem": "โค้ดคำนวณ log loss เขียนว่า <code>np.log(a1 + epsilon)</code> และ <code>np.log(1 - a1 + epsilon)</code> โดย <code>epsilon = 1e-7</code> การบวก epsilon นี้มีไว้เพื่ออะไร?", "options": ["กัน log(0) = −inf เมื่อ a1 เป็น 0 หรือ 1 พอดี", "ทำให้ sigmoid ส่งค่าออกได้เกินช่วง [0, 1]", "ทำหน้าที่เป็น regularization บีบ θ ให้เล็กลง", "ทำหน้าที่เป็น learning rate ของการอัปเดตแต่ละรอบ"], "answer": 0, "explanation": "log loss \\(-[y\\log h+(1-y)\\log(1-h)]\\) มี \\(\\log h\\to-\\infty\\) เมื่อ \\(h\\to0\\). ถ้า sigmoid ให้ค่าที่ปัดเป็น 0 หรือ 1 พอดีในทศนิยมของคอมพิวเตอร์ จะได้ log(0) = −inf หรือ nan. บวก epsilon เล็ก ๆ ทำให้ค่าในลอการิทึมไม่เป็นศูนย์ — เป็นเรื่องเสถียรภาพเชิงตัวเลข ไม่ได้เปลี่ยนแนวคิดของ cost.", "ref": "ex1 cell (9)", "why_wrong_map": ["", "epsilon อยู่ใน log ไม่ได้เปลี่ยนค่าที่ sigmoid ส่งออกมา", "regularization ต้องเป็นเทอม λθ² ที่บวกเข้า cost ไม่ได้อยู่ใน log", "learning rate อยู่ในขั้นอัปเดต θ ไม่ได้อยู่ในสูตร cost"]}, {"id": "L6-28", "topic": "วินิจฉัยจาก histogram: gradient หาย vs ก้าวเล็ก", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "histogram ใน TensorBoard แสดงแถบ kernel_0 แบนราบตลอด 20 epoch และแกนของ bias_0 ไล่แค่ระดับ \\(10^{-4}\\) ทั้งที่โมเดลใช้ ReLU คู่กับ he_normal อยู่แล้ว สาเหตุที่น่าจะเป็นที่สุดคือข้อใด", "options": ["ยังไม่ได้ใส่ Batch Normalization จึงทำให้ค่า z ของทุกชั้นกระจายกว้างจนเกินไป", "learning rate เล็กเกินไป ขนาดก้าวจึงจิ๋วมากแม้ gradient จะมีขนาดปกติดีอยู่", "activation อิ่มตัวจน gradient เป็นศูนย์ ต้องเปลี่ยนจาก tanh ไปใช้ ReLU ทุกชั้น", "gradient กำลังระเบิด ค่า weight จึงล้นจนกลายเป็น NaN แล้วอัปเดตต่อไม่ได้อีก"], "explanation": "<p>นี่คือกรณี \"How about slow learning rate?\" ในสไลด์หน้า 16: SGD ที่ <code>learning_rate=0.0001</code> ทำให้แกนตั้งของ bias_0 ไล่แค่ \\(+2\\times10^{-4}\\) ถึง \\(-4\\times10^{-4}\\) เล็กกว่ากรณีปกติ (\\(\\pm0.2\\)) ราว 500–1,000 เท่า</p><p>กุญแจคือ \\(\\Delta\\theta = -\\alpha\\,\\nabla J\\) เล็กได้จากสองทาง: \\(\\nabla J\\) เล็ก (vanishing) หรือ \\(\\alpha\\) เล็ก. โจทย์บอกว่าใช้ ReLU + he_normal อยู่แล้ว ซึ่งเป็นยาแก้ vanishing ⇒ ผู้ต้องสงสัยเหลือแต่ learning rate</p><p>วิธีแยกในทางปฏิบัติ: ลองเพิ่ม learning rate — ถ้าแถบเริ่มบานออกคือโรคก้าวเล็ก; ถ้ายังนิ่ง (หรือ layer บนขยับแต่ layer ล่างนิ่ง) คือ vanishing</p>", "ref": "Lesson 6 §7 (สไลด์หน้า 16)", "lesson": 6, "answer": 1, "why_wrong_map": ["ถ้า z กระจายกว้างเกิน weight จะแกว่ง ไม่ใช่นิ่งสนิทแบบที่เห็น", "", "โจทย์ระบุว่าใช้ ReLU อยู่แล้ว จึงไม่ใช่ปัญหา activation อิ่มตัวแบบ tanh", "exploding จะเห็นค่าแกว่งแรงหรือ loss เป็น NaN ไม่ใช่แถบแบนนิ่งระดับ 1e-4"]}, {"id": "L2-38", "lesson": 2, "topic": "นับพารามิเตอร์ของ Shallow NN", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "Shallow Neural Network รับ \\(x_1,x_2,x_3\\) → hidden 4 node → output 1 node มีพารามิเตอร์ทั้งหมดกี่ตัว (รวม bias ทั้งสองชุด)?", "options": ["16", "21", "17", "20"], "answer": 1, "explanation": "<p>ใช้กฎ (node ปลายทาง) × (node ต้นทาง + 1):</p>\n<ul><li>layer 1: \\(4\\times(3+1) = 16\\) ตัว</li>\n<li>layer 2: \\(1\\times(4+1) = 5\\) ตัว</li></ul>\n<p>รวม <b>21</b> ตัว. จุดที่พลาดบ่อยคือลืมว่า bias มี <b>สองชุด</b>: \\(x_0\\) เข้าทุก hidden node และ \\(a_0^{[1]}\\) เข้า output node — ทั้งคู่มีค่า \\(+1\\) เสมอ</p>", "ref": "Lesson 2 §7 (Lecture2.pdf p.45)", "why_wrong_map": ["นับเฉพาะเส้นเชื่อมจริง ไม่นับ bias เลยทั้งสองชั้น (12 + 4)", "", "นับ bias เฉพาะ layer 2 ลืม bias ทั้งสี่ของ layer 1 (12 + 5)", "ลืม bias \\(a_0^{[1]}\\) ของ layer 2 ไป 1 ตัว"]}, {"id": "L5-57", "lesson": 5, "topic": "Dying ReLU และทางแก้", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "สไลด์หน้า 3 เตือนว่า \"some nodes might die\" — node ตายเมื่อใด และสไลด์แนะทางแก้ใด?", "options": ["เมื่อ weighted sum ใกล้ 0 อนุพันธ์แกว่งแรง — แก้ด้วยการเปลี่ยนไปใช้ sigmoid ทุกชั้น", "เมื่อ weighted sum เป็นลบตลอด อนุพันธ์เป็น 0 — แก้ด้วยการเพิ่ม learning rate ให้สูงขึ้น", "เมื่อ weighted sum เป็นลบตลอด อนุพันธ์เป็น 0 — แก้ด้วยตระกูลของ ReLU เช่น Leaky ReLU", "เมื่อ weighted sum เป็นบวกมาก อนุพันธ์โตเกิน — แก้ด้วยตระกูลของ ReLU เช่น Leaky ReLU"], "answer": 2, "explanation": "<p>ReLU มีอนุพันธ์เป็น 0 ทั้งฝั่งลบ. ถ้า node ตัวหนึ่งได้ \\(z&lt;0\\) กับทุกตัวอย่าง gradient ที่ไหลผ่านมันจะเป็น 0 ตลอด ⇒ weight ไม่เคยถูกอัปเดตอีกเลย ⇒ <b>ตายถาวร</b> (สไลด์: \"some nodes might die when its weighted sum of its inputs are negative\").</p><p>ทางแก้ที่สไลด์ให้คือใช้ตระกูลของ ReLU เช่น <b>Leaky ReLU</b> ที่ฝั่งลบมีความชันเล็กๆ (เช่น 0.01) แทนที่จะเป็น 0 — gradient จึงยังรั่วผ่านไปได้ node จึงฟื้นได้. (ELU ในโค้ดหน้า 38 ก็อยู่ตระกูลเดียวกัน)</p>", "ref": "Lesson 5 §1.2 (สไลด์หน้า 3)", "why_wrong_map": ["สลับกับปัญหาของ sigmoid — และ sigmoid คือสิ่งที่ ReLU มาแทนเพราะ \\(g'\\le0.25\\)", "เงื่อนไขถูกแต่ทางแก้ผิด: learning rate สูงขึ้นก็คูณกับ gradient ที่เป็น 0 อยู่ดี ได้ 0 เท่าเดิม", "", "ทางแก้ถูกแต่เงื่อนไขผิด: ฝั่งบวกอนุพันธ์เป็น 1 พอดี ปัญหาฝั่งบวกคือ activation blow up ไม่ใช่ node ตาย"]}, {"id": "L6-07", "topic": "EarlyStopping: หาจุดหยุดจากลำดับ val_loss", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ลำดับ val_loss ตามตารางหน้า 4 คือ 28→0.4806, 29→0.4855, 30→0.4763, 31→0.4750, 32→0.4887, 33→0.4982, 34→0.4904, 35→0.4957, 36→0.5149 ถ้าตั้ง <code>patience=3, min_delta=0.001</code> การเทรนจะหยุดที่ epoch ใด", "options": ["epoch 36", "epoch 34", "epoch 35", "epoch 33"], "explanation": "<p>กติกา: นับว่า \"ดีขึ้น\" เมื่อ \\(\\text{best} - \\text{val\\_loss}_t \\ge \\text{min\\_delta}\\) ถ้าดีขึ้น → อัปเดต best และรีเซ็ตตัวนับเป็น 0; ถ้าไม่ → ตัวนับ +1</p><ul><li>e29: \\(0.4806-0.4855 = -0.0049\\) ⇒ ตัวนับ 1</li><li>e30: \\(0.4806-0.4763 = 0.0043 \\ge 0.001\\) ⇒ best = 0.4763, ตัวนับ 0</li><li>e31: \\(0.4763-0.4750 = 0.0013 \\ge 0.001\\) ⇒ best = 0.4750, ตัวนับ 0</li><li>e32, e33, e34 แย่กว่า 0.4750 ทั้งหมด ⇒ ตัวนับ 1, 2, 3 = patience ⇒ <b>STOP ที่ epoch 34</b></li></ul><p>จุดที่พลาดบ่อย: e34 (0.4904) ดีกว่า e33 (0.4982) แต่ตัวนับไม่รีเซ็ต เพราะเทียบกับ <b>best</b> ไม่ใช่ epoch ก่อนหน้า</p>", "ref": "Lesson 6 §2 (สไลด์หน้า 4)", "lesson": 6, "answer": 1, "why_wrong_map": ["เป็นคำตอบของ patience=5 ตามที่สไลด์ตั้งไว้เดิม", "", "นับ epoch ที่แย่เกินไป 1 ครั้ง (32–35) ซึ่งจะตรงกับ patience=4", "นับ epoch ที่แย่ได้แค่ 2 ครั้ง (32, 33) แล้วหยุด ซึ่งตรงกับ patience=2 ไม่ใช่ 3"]}, {"id": "L3-22", "lesson": 3, "topic": "Activation ที่ hidden layer", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดเป็นแนวทางเลือก activation ของ hidden layer ที่ถูกต้อง?", "options": ["ใช้ ReLU ก่อน เพราะแก้ได้เฉพาะ vanishing gradient ถ้าไม่เวิร์คลอง Softmax ที่ hidden", "ใช้ ReLU ก่อน เพราะ gradient เป็น 0 หรือค่าคงที่ ถ้าไม่เวิร์คลอง leaky ReLU, ELU, SELU", "ใช้ sigmoid ก่อน เพราะ output อยู่ใน [0,1] ถ้าไม่เวิร์คค่อยเปลี่ยนเป็น ReLU หรือ Softmax", "ใช้ Softplus แทน ReLU เสมอ เพราะหาอนุพันธ์ได้ทุกจุดบนกราฟและคำนวณเร็วกว่า ReLU มาก"], "answer": 1, "explanation": "ReLU <i>are the current state of the art</i> และ \"Because the gradient of a ReLU is either zero or a constant, it is possible to reign in the vanishing exploding gradient issue\" — ผลคูณหลายชั้นเป็นได้แค่ 0 หรือ 1 ไม่หดทีละนิด (0.25¹⁰) และไม่โตทีละนิด. ถ้าไม่เวิร์คให้ลอง leaky ReLU หรือ variances เช่น ELU, SELU, GELU. Softplus \\(\\ln(1+e^x)\\) คือ smooth version ของ ReLU (differentiable everywhere) แต่ช้ากว่า.", "ref": "Lesson 3 §5B.4 (p.33)", "why_wrong_map": ["ReLU ช่วยทั้ง vanishing และ exploding และ Softmax ไม่ใช้ที่ hidden", "", "sigmoid ไม่ใช่ state of the art ของ hidden และ Softmax เป็นของ output layer", "Softplus ช้ากว่า (ต้องคำนวณ exp, ln) และไม่ได้แนะนำให้แทน ReLU"]}, {"id": "L6-40", "topic": "UCB และ exploration–exploitation", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "candidate A มี \\(\\mu=0.85,\\ \\sigma=0.02\\) และ B มี \\(\\mu=0.80,\\ \\sigma=0.20\\) ใช้ \\(\\text{UCB} = \\mu + \\lambda\\sigma\\) ที่ \\(\\lambda = 1.2\\) tuner จะเลือกลองจุดใดต่อ และเพราะอะไร", "options": ["เลือก A เพราะ sigma ของ A ต่ำกว่า จึงมั่นใจได้ว่าคะแนนจริงจะไม่ต่ำกว่าที่ทำนายไว้มากนัก", "เลือก A เพราะ UCB ของ A = 0.874 มากกว่าของ B ที่ได้ 0.84 และค่าเฉลี่ยของ A ก็สูงกว่าด้วย", "เลือก B เพราะกติกาของ UCB คือเลือกจุดที่ sigma สูงที่สุดเสมอ ไม่ว่าค่าเฉลี่ยจะต่ำเพียงใด", "เลือก B เพราะ UCB ของ B = 1.04 มากกว่าของ A ที่ได้ 0.874 จากโบนัสความไม่แน่ใจที่สูงกว่า"], "explanation": "<p>\\(\\text{UCB}(A) = 0.85 + 1.2(0.02) = 0.874\\)</p><p>\\(\\text{UCB}(B) = 0.80 + 1.2(0.20) = 1.040\\) ⇒ B ชนะ เพราะโบนัสความไม่แน่ใจของ B (0.24) ใหญ่กว่าส่วนต่างของ \\(\\mu\\) (0.05) มาก</p><p>จุดพลิกอยู่ที่ \\(0.85+0.02\\lambda = 0.80+0.20\\lambda \\Rightarrow \\lambda \\approx 0.28\\) — ต่ำกว่านี้เลือก A (exploit) สูงกว่านี้เลือก B (explore) ตรงกับที่สไลด์สรุปว่า \\(\\lambda\\) ใหญ่เอื้อย่านที่ไม่แน่ใจ \\(\\lambda\\) เล็กเอื้อย่านที่คาดว่าคะแนนสูง</p>", "ref": "Lesson 6 §9 (สไลด์หน้า 28)", "lesson": 6, "answer": 3, "why_wrong_map": ["ตัดสินจาก sigma ต่ำอย่างเดียว ซึ่งไม่ใช่กติกาของ UCB", "คำนวณ UCB ของ B ด้วย \\(\\lambda=0.2\\) (ได้ 0.84) แทนที่จะใช้ 1.2", "UCB ไม่ได้เลือก sigma สูงสุดเสมอ แต่ชั่งน้ำหนัก \\(\\mu\\) กับ \\(\\lambda\\sigma\\) รวมกัน", ""]}, {"id": "L4-52", "lesson": 4, "topic": "ex2: เปรียบเทียบ regularization กับ dropout", "source": "ex2", "type": "concept", "difficulty": "medium", "stem": "ผลของ ex2: ไม่ทำอะไรเลย test 82%, L2 (\\(\\lambda=0.03\\)) test 88%, dropout (keep_prob 0.9) test 86% ข้อสรุปที่เหมาะสมคือข้อใด?", "options": ["dropout ให้ผลแย่กว่าการไม่ทำอะไรเลย จึงไม่ควรใช้ dropout กับข้อมูลสองมิติชุดเล็กแบบนี้อีก", "ทั้งสองเทคนิคช่วยให้ test accuracy ดีขึ้นจากเดิม โดยรอบการทดลองนี้ L2 ให้ผลดีกว่า dropout เล็กน้อย", "ทั้งสองเทคนิคให้ผลเท่ากันเสมอ เพราะทั้งคู่เป็นการเพิ่มเทอมลงโทษเข้าไปใน cost function เหมือนกัน", "ตัวเลขนี้พิสูจน์ว่า dropout ต้องใช้ร่วมกับ early stopping เท่านั้นจึงจะให้ผลดีกว่า L2 ได้จริง"], "answer": 1, "explanation": "<p>82% → 88% (L2) และ 82% → 86% (dropout) — ทั้งคู่ดีขึ้นจาก baseline ซึ่งเป็นสิ่งที่โจทย์ข้อ (3) ให้สังเกต (\"ให้นิสิตสังเกตุผลว่าดีกว่าการทำ regularization หรือไม่\")</p><p>ข้อควรระวังในการตีความ: test set มีแค่ 50 ตัวอย่าง ⇒ ต่างกัน 1 ตัวอย่างคือ 2% ดังนั้น 88% vs 86% คือต่างกันแค่ <b>1 ตัวอย่าง</b> — สรุปได้อย่างมากว่า \"ใกล้เคียงกัน โดยรอบนี้ L2 นำเล็กน้อย\" ไม่ใช่ \"L2 ดีกว่าเสมอ\"</p><p>และโน้ตท้ายโจทย์บอกว่า ex นี้ <b>ไม่ได้</b> ใช้ early stopping ร่วมด้วย ซึ่งในโจทย์ครั้งถัดไปจะช่วยให้ได้โมเดลที่ดีขึ้น</p>", "ref": "ex2 cells retrain (regularization / dropout) และ markdown ข้อ (2)-(3)", "why_wrong_map": ["dropout ได้ 86% ซึ่งดีกว่า baseline 82% ไม่ใช่แย่กว่า", "", "dropout ไม่ได้เพิ่มเทอมใน cost แต่สุ่มปิด node — คนละกลไกกับ L2", "โน้ตบอกว่า ex นี้ยังไม่ได้ใช้ early stopping แต่ไม่ได้แปลว่าจำเป็นต้องใช้คู่กัน"]}, {"id": "L4-22", "lesson": 4, "topic": "โค้ด ExponentialDecay", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "จากโค้ดหน้า 19 ข้อใดอธิบายการใช้งาน learning rate schedule ได้ถูกต้อง?", "options": ["ต้องสลับค่าเป็น decay_steps=0.1 กับ decay_rate=8 เพราะ steps คืออัตราส่วนและ rate คือจำนวนรอบ", "ต้องส่งอ็อบเจ็กต์ schedule เข้าทางช่อง decay= ของ optimizer เพราะช่อง learning_rate= รับได้เฉพาะตัวเลขคงที่เท่านั้น", "ต้องส่งอ็อบเจ็กต์ schedule เข้าทางช่อง learning_rate= ของ optimizer เพราะช่องนี้รับได้ทั้งตัวเลขและ schedule", "ต้องเรียก ExponentialDecay จาก keras.callbacks เพราะการลด learning rate ถือเป็น callback ชนิดหนึ่ง"], "answer": 2, "explanation": "<p>จุดสำคัญที่สุดของโค้ดนี้: ช่อง <code>learning_rate=</code> รับได้ทั้ง <i>ตัวเลข</i> และ <i>อ็อบเจ็กต์ schedule</i> — schedule คือ \"ตารางเวลา\" ที่ถูกเรียกทุก step แล้วคืนค่า \\(\\alpha\\) ของ step นั้น</p><p>ค่าที่ได้: \\(\\alpha = 0.1\\times0.1^{\\text{step}/8}\\) ⇒ step 0: 0.1, step 8: 0.01, step 16: 0.001</p><p>สองข้อควรระวังในสไลด์: <code>lr=0.001</code> ในบรรทัดเดียวกันขัดกันเอง (schedule ทับอยู่ดี) และสไลด์สะกด <code>mometum</code> ผิด ซึ่ง Keras จะฟ้อง error</p>", "ref": "Lesson 4 §4.4 (สไลด์หน้า 19)", "code": "lr_schedule = keras.optimizers.schedules.ExponentialDecay(\n    initial_learning_rate=0.1,\n    decay_steps=8,\n    decay_rate=0.1\n)\noptimizer = keras.optimizers.SGD(..., learning_rate=lr_schedule)", "why_wrong_map": ["สลับความหมายของสองอาร์กิวเมนต์ — steps=8 คือทุก 8 step, rate=0.1 คือตัวคูณ", "ไม่มีช่อง decay= สำหรับ schedule ในการเขียนแบบนี้", "", "ExponentialDecay อยู่ใต้ keras.optimizers.schedules ไม่ใช่ callbacks"]}, {"id": "L6-33", "topic": "คำแนะนำค่าเริ่มต้นของแต่ละปุ่ม (หน้า 22)", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใด<b>ไม่ตรง</b>กับคำแนะนำในสไลด์หน้า 22 เรื่อง Learning and optimization", "options": ["จำนวน epoch ควรหาค่าที่ดีที่สุดด้วย grid search เพราะเป็นปุ่มที่กระทบผลลัพธ์มากที่สุด", "weight initialization ใช้ He สำหรับ ReLU และใช้ Xavier (Glorot) สำหรับ sigmoid หรือ tanh", "batch size ที่ใช้กันบ่อยเป็นจุดเริ่มต้นคือช่วง 32 ถึง 256 แต่ค่าที่ดีที่สุดขึ้นกับงาน", "momentum ของ batch normalization ที่ลองกันคือ 0.9, 0.99, 0.999 ปรับเมื่อจำเป็นเท่านั้น"], "explanation": "<p>สไลด์เขียนตรงข้ามกับตัวเลือกแรก: <mark class=\"src\" data-p=\"22\">Number of training iterations or epochs</mark> <b>ไม่ต้องจูนเลย</b> — ตั้งจำนวน epoch ไว้เยอะๆ แล้วใช้ early stopping แทน (§2) ซึ่งตัดทิ้งไปได้ทั้งมิติของพื้นที่ค้นหา</p><p>อีกสามข้อตรงกับสไลด์: batch size เริ่มที่ 32–256; initializer ไม่ใช่การค้นหาแต่เป็นการ<b>จับคู่</b>กับ activation (ReLU↔He, sigmoid/tanh↔Xavier) ซึ่งเป็นกับดักที่ชอบสลับคู่กัน; BN momentum ลอง 0.9/0.99/0.999. ส่วน learning rate ใช้ scheduling หรือ adaptive optimizer (Adam/RMSProp)</p>", "ref": "Lesson 6 §8 (สไลด์หน้า 22)", "lesson": 6, "answer": 0, "why_wrong_map": ["", "ตรงกับสไลด์ — He คู่ ReLU, Xavier คู่ sigmoid/tanh", "ตรงกับสไลด์ — 32–256 คือจุดเริ่มต้นที่ใช้กันบ่อย", "ตรงกับสไลด์ — ค่าที่ลองกันคือ 0.9, 0.99, 0.999"]}, {"id": "L4-46", "lesson": 4, "topic": "ex2: ค่า default keep_prob = 1", "source": "ex2", "type": "code", "difficulty": "medium", "stem": "ในลูป <code>optimize1</code> บรรทัดที่วัด error เรียก <code>nnCostFunction(w, ..., X, y)</code> โดยไม่ส่ง keep_prob ผลคืออะไร?", "options": ["ใช้ keep_prob = 1 ตาม default ⇒ mask เป็น 0 ทั้งหมด ⇒ activation ของ hidden layer กลายเป็นศูนย์ทั้งชั้น", "ใช้ keep_prob = 1 ตาม default ⇒ mask เป็น 1 ทั้งหมด ⇒ วัด cost โดยไม่มี dropout ซึ่งเป็นสิ่งที่ต้องการ", "ใช้ keep_prob เดิมที่ส่งเข้ามาในการเทรน ⇒ cost ที่วัดได้จึงมีความสุ่มของ dropout ปนอยู่ทุกครั้ง", "เกิด error เพราะ keep_prob เป็นอาร์กิวเมนต์บังคับที่ต้องส่งทุกครั้งที่เรียกใช้ฟังก์ชันนี้เสมอ"], "answer": 1, "explanation": "<p>ลายเซ็นของฟังก์ชันคือ <code>nnCostFunction(..., lambda_=0, keep_prob=1)</code> — ทั้งสองตัวมีค่า default</p><p>เมื่อ keep_prob = 1: <code>np.random.rand</code> คืนค่าในช่วง [0, 1) ซึ่ง <b>น้อยกว่า 1 เสมอ</b> ⇒ <code>D</code> เป็น 1 ทั้งหมด ⇒ <code>a1 * D / 1</code> = <code>a1</code> เดิม ⇒ ไม่มี dropout เลย</p><p>นี่คือสิ่งที่ถูกต้อง: เราอยากให้เส้น error_train/error_val เป็นค่าที่เทียบกันได้ระหว่างรอบ ถ้าวัดโดยเปิด dropout ค่าที่ได้จะแกว่งตามความสุ่มจนอ่านแนวโน้มไม่ออก (ตรงกับคำเตือนหน้า 30) — และเป็นเหตุผลเดียวกับที่ Keras ปิด Dropout ให้เองตอน evaluate/predict</p>", "ref": "ex2 cell optimize1 / nnCostFunction", "code": "def nnCostFunction(nn_params, input_layer_size, hidden_layer_size,\n                   num_labels, X, y, lambda_=0, keep_prob=1):\n    ...\n\n# in optimize1:\nerror_train[i], _ = nnCostFunction(w, input_layer_size, hidden_layer_size,\n                                   num_labels, X, y)", "why_wrong_map": ["keep_prob = 1 ให้ mask เป็น 1 ทั้งหมด ไม่ใช่ 0", "", "Python ใช้ค่า default เมื่อไม่ส่งอาร์กิวเมนต์ ไม่ได้จำค่าเดิมไว้", "ทั้ง lambda_ และ keep_prob เป็นอาร์กิวเมนต์ที่มี default จึงไม่บังคับ"]}, {"id": "L1-53", "lesson": 1, "topic": "แก้หา θ จากข้อมูล 3 แถว", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ข้อมูลบ้าน 3 หลัง (size \\(x_1\\), #bedroom \\(x_2\\), price \\(y\\)) = (50, 2, 400{,}000), (100, 4, 800{,}000), (150, 2, 1{,}200{,}000) และ \\(h_\\theta(x)=\\theta_0+\\theta_1x_1+\\theta_2x_2\\) พอดีทุกจุด ค่า \\(\\theta_1\\) และสมการสุดท้ายคือข้อใด?", "options": ["\\(\\theta_1=4{,}000\\); สมการคือ \\(h_\\theta(x)=4{,}000\\,x_1\\) เพราะ \\(\\theta_0=\\theta_2=0\\)", "\\(\\theta_1=8{,}000\\); สมการคือ \\(h_\\theta(x)=8{,}000\\,x_1+2x_2\\) เพราะ \\(\\theta_2=2\\)", "\\(\\theta_1=8{,}000\\); สมการคือ \\(h_\\theta(x)=8{,}000\\,x_1\\) เพราะ \\(\\theta_0=\\theta_2=0\\)", "\\(\\theta_1=8{,}000\\); สมการคือ \\(h_\\theta(x)=8{,}000\\,x_1+400{,}000\\) เพราะ \\(\\theta_0\\ne 0\\)"], "answer": 2, "explanation": "เลือกคู่แถวที่ \\(x_2\\) เท่ากันเพื่อตัด \\(\\theta_2\\) ทิ้ง คือแถว 3 ลบแถว 1 (ทั้งคู่มี \\(x_2=2\\)): \\(100\\theta_1 = 1{,}200{,}000-400{,}000 = 800{,}000 \\Rightarrow \\theta_1 = 8{,}000\\). แทนกลับ: แถว 1 ได้ \\(\\theta_0+2\\theta_2=400{,}000-50(8{,}000)=0\\) และแถว 2 ได้ \\(\\theta_0+4\\theta_2=800{,}000-100(8{,}000)=0\\); ลบกันได้ \\(\\theta_2=0\\) จึง \\(\\theta_0=0\\) ⇒ \\(h_\\theta(x)=8{,}000\\,x_1\\). ตรวจกลับ: \\(8{,}000\\times100=800{,}000\\) ✓. \\(\\theta_j=0\\) คือวิธีที่โมเดลบอกว่า \"feature นี้ไม่ช่วยอะไร\" — แนวคิดเดียวกับ regularization ที่บีบ θ ของ feature ไร้ประโยชน์ให้เข้าใกล้ศูนย์.", "ref": "Lesson 1 §2 (p.28)", "why_wrong_map": ["ผลต่างของ \\(x_1\\) ระหว่างแถว 1 กับ 3 คือ 100 ไม่ใช่ 200 จึงได้ \\(\\theta_1=8{,}000\\)", "สับสนระหว่างค่าของ \\(x_2\\) (= 2) กับสัมประสิทธิ์ \\(\\theta_2\\) ซึ่งแก้ออกมาได้ 0", "", "แทน \\(\\theta_1\\) กลับเข้าแถว 1 และ 2 แล้วได้ \\(\\theta_0=0\\) ไม่ใช่ 400,000"]}, {"id": "L3-45", "lesson": 3, "topic": "epsilon ใน log ของ cost", "source": "ex_shallow_nn", "type": "code", "difficulty": "easy", "stem": "ในฟังก์ชันคำนวณ cost ทำไมจึงบวก <code>epsilon = 1e-6</code> เข้าไปใน <code>np.log(a2+epsilon)</code>?", "code": "epsilon = 1e-6\nJ = (-1 / m) * np.sum((np.log(a2+epsilon) * y_matrix) + np.log(1 - a2+epsilon) * (1 - y_matrix))", "options": ["เป็นเทอม regularization ที่บีบ weight ให้เล็กลงเพื่อลด overfitting", "เป็น learning rate ของ gradient descent ที่ใช้ภายในการคำนวณ cost", "เป็นค่า ε ของการสุ่ม weight เริ่มต้นเพื่อ break the symmetry ของ node", "กันไม่ให้เกิด log(0) เมื่อ a2 อิ่มตัวเป็น 0 หรือ 1 จน cost เป็น nan"], "answer": 3, "explanation": "cost cross-entropy มี \\(\\log h\\) และ \\(\\log(1-h)\\). เมื่อ sigmoid อิ่มตัว <code>a2</code> อาจกลายเป็น 0 หรือ 1 เป๊ะในเลขทศนิยม ⇒ \\(\\log 0=-\\infty\\) ⇒ cost เป็น inf/nan. บวกค่าเล็ก ๆ เพื่อความเสถียรเชิงตัวเลข โดยแทบไม่เปลี่ยนค่า cost. ไม่มีผลต่อ gradient เพราะ <code>delta_2 = a2 - y_matrix</code> ไม่ได้ใช้ epsilon.", "ref": "ex_shallow_nn (2) nnCostFunction cost", "why_wrong_map": ["regularization ต้องเป็นเทอม λ/m·Σθ² ไม่ใช่ค่าคงที่ใน log", "learning rate ใช้ในขั้นอัปเดต w ไม่ได้อยู่ในการคำนวณ cost", "ε ของการสุ่ม weight เป็นอีกตัวแปรหนึ่ง (epsilon_init) คนละหน้าที่", ""]}, {"id": "L4-13", "lesson": 4, "topic": "เลือก batch size", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "คุณมีข้อมูลเพียง 1,500 ตัวอย่าง คำแนะนำของสไลด์หน้า 12 คือข้อใด?", "options": ["ใช้ batch size เท่ากับ m ไปเลย เพราะข้อมูลที่น้อยกว่า 2,000 ถือว่าเป็นชุดเล็ก", "ใช้ batch size ระหว่าง 32 ถึง 256 เสมอ เพราะเป็นช่วงที่ดีกับข้อมูลทุกขนาด", "ใช้ค่าที่เป็นกำลังของ 2 เท่านั้น เพราะเป็นข้อบังคับของฮาร์ดแวร์ GPU ทุกรุ่น", "ใช้ batch size เท่ากับ 1 เสมอ เพราะข้อมูลชุดเล็กต้องการการอัปเดตที่ถี่ที่สุด"], "answer": 0, "explanation": "<p>สไลด์แยกเป็นเงื่อนไขคู่: <b>ข้อมูลเล็ก (i.e. &lt; 2,000)</b> ⇒ ใช้ batch size = \\(m\\) (Batch GD เต็ม) เพราะคำนวณครบทั้งชุดต่อก้าวก็ยังไม่ช้า จึงไม่มีเหตุผลต้องยอมรับ noise</p><p><b>ข้อมูลใหญ่</b> ⇒ ใช้ค่าระหว่าง 1 ถึง \\(m\\) โดยจุดเริ่มต้นที่นิยมคือ 32–256 และเลขกำลังของ 2 เป็นที่นิยม แต่สไลด์ขีดเส้นใต้เองว่า \"but this is not a requirement\"</p>", "ref": "Lesson 4 §3.5 (สไลด์หน้า 12)", "why_wrong_map": ["", "ช่วง 32–256 เป็นคำแนะนำสำหรับข้อมูล<i>ใหญ่</i> ไม่ใช่ทุกขนาด", "สไลด์ระบุชัดว่ากำลังของ 2 ไม่ใช่ข้อบังคับ", "สุดขั้วฝั่ง SGD ซึ่งจะได้ทิศที่ noisy โดยไม่จำเป็น"]}, {"id": "L3-50", "lesson": 3, "topic": "weight ขาออกเป็นศูนย์กับการไหลของ gradient", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "ใน backward computation ถ้า weight ขาออกจาก hidden node หนึ่งไปยัง output node เป็น 0 พอดี ค่า \\(\\delta\\) ของ hidden node นั้นในรอบนั้นเป็นเท่าใด และแปลว่าอะไร?", "options": ["เท่ากับ \\(g'(z)\\) ของ node นั้น เพราะเหลือตัวคูณเดียวที่ยังไม่เป็นศูนย์", "เท่ากับ \\(\\delta\\) ของ output เพราะ error ถูกส่งต่อมาทั้งก้อนโดยไม่ลดทอน", "เป็น 0 — รอบนี้ไม่มี gradient ไหลย้อนผ่าน แม้ \\(a\\) ของ node จะไม่เป็นศูนย์", "เป็น 0 — node นี้จะไม่มีวันได้เรียนรู้อีกเลยตลอดการเทรนที่เหลือทั้งหมด"], "answer": 2, "explanation": "\\(\\delta_j^{(1)}=\\theta_{1j}^{[2]}\\,\\delta_1^{(2)}\\,g'(z_j^{[1]})\\) เป็นผลคูณ 3 ตัว — ตัวใดเป็น 0 ผลคูณก็เป็น 0. ความหมาย: &quot;ฉันไม่ได้ส่งอะไรไปให้ปลายทางเลย จึงไม่ต้องรับผิด&quot; ⇒ gradient ของ weight ขาเข้าทุกเส้นของ node นี้เป็น 0 ในรอบนี้. แต่ข้อสำคัญคือ weight ขาออกตัวนั้นเอง **ถูกอัปเดต** เพราะ gradient ของมันคือ \\(a_j^{[1]}\\delta^{(2)}\\neq0\\) ⇒ รอบถัดไปมันจะไม่เป็น 0 อีก และ node กลับมาเรียนรู้ได้. การปิดกั้นจึงเป็นของรอบปัจจุบันเท่านั้น ไม่ใช่ตลอดไป.", "ref": "Lesson 3 §3 Backward ตัวอย่างที่ 1 (p.12) และ §2.2", "why_wrong_map": ["ผลคูณที่มีตัวประกอบเป็น 0 ย่อมเป็น 0 ไม่ใช่เหลือ \\(g'\\)", "ไม่มีการส่งผ่านเลย เพราะตัวคูณ \\(\\theta\\) ที่เชื่อมเป็นศูนย์", "", "เกินจริง — weight ขาออกเองมี gradient ไม่เป็นศูนย์ จึงพ้นจาก 0 ในรอบถัดไป"]}, {"id": "L3-07", "lesson": 3, "topic": "Backprop: ทำไมต้อง forward ก่อน backward", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "backpropagation ต่อ 1 ตัวอย่างทำ 2 ขั้นต่อกัน คือ forward แล้วจึง backward เหตุผลเชิงกลไกที่ต้อง forward ก่อนคือข้อใด?", "options": ["forward ต้องใช้ δ ของทุก layer เพื่อคำนวณ h(x) ถ้าไม่มี δ มาก่อนจะทำนายไม่ได้เลย", "forward เป็นขั้นที่อัปเดต θ ให้เสร็จก่อน backward จึงจะวัด error ของ θ ชุดใหม่ได้", "backward ต้องใช้ z และ a ที่ forward เก็บไว้ ทั้งใน g′(z)=a(1−a) และ gradient a·δ", "ลำดับไม่สำคัญ สลับเป็น backward ก่อน forward ก็ได้ค่า gradient เท่ากันทุกครั้ง"], "answer": 2, "explanation": "backward ต้องการตัวเลขจาก forward สามจุด: \\(\\delta^{(L)}=a^{[L]}-y\\) ต้องมี \\(a^{[L]}\\); \\(g'(z^{[l]})=a^{[l]}(1-a^{[l]})\\) ต้องมี \\(a^{[l]}\\); และ gradient \\(\\partial J/\\partial\\theta_{ij}^{[l]}=a_j^{[l-1]}\\delta_i^{(l)}\\) ต้องมี \\(a^{[l-1]}\\). ไม่มีค่าที่ cache จาก forward ก็ backward ไม่ได้. การอัปเดต θ ไม่ใช่ขั้นย่อยของ backprop ต่อตัวอย่าง.", "ref": "Lesson 3 §2 (p.6) และ §3 กลไก", "why_wrong_map": ["กลับด้าน — forward ผลิตแค่ z กับ a ไม่ได้ใช้ δ", "update ทำหลังเฉลี่ย D ครบทุกตัวอย่าง ไม่ใช่ใน forward", "", "backward ต้องใช้ค่าจาก forward จึงสลับไม่ได้เด็ดขาด"]}, {"id": "L5-56", "lesson": 5, "topic": "BN ดึง z กลับเข้าโซน Linear", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "สไลด์หน้า 10 แบ่งกราฟ sigmoid เป็นโซน Linear (ราว \\(z\\in[-2,2]\\)) กับ Saturating เป้าหมายของ BN ที่ทำให้ \\(z\\) มี mean 0 variance 1 คืออะไร?", "options": ["บีบ \\(z\\) ให้เป็น 0 ทุกตัว เพื่อให้ทุก neuron เริ่มจากจุดเดียวกันทุกรอบ", "ดึง \\(z\\) ส่วนใหญ่กลับเข้าโซน Linear ที่ \\(g'\\) ยังสูง gradient จึงไหลผ่านได้", "ทำให้ output ของ sigmoid ทุก node รวมกันได้ 1 เหมือน softmax ชั้นสุดท้าย", "ดัน \\(z\\) ออกไปโซน Saturating ที่กราฟแบน ค่า activation จึงนิ่งไม่แกว่ง"], "answer": 1, "explanation": "<p>mean 0 variance 1 แปลว่าราว 95% ของตัวอย่างตกในช่วง \\([-2,+2]\\) ซึ่งเป็นโซน Linear พอดี. ในโซนนี้ \\(g'\\) ใกล้ 0.25 (ค่าสูงสุดที่เป็นไปได้) แทนที่จะเป็นเกือบศูนย์.</p><p>เทียบกับปัญหาหน้า 5: ถ้าไม่คุมอะไรเลย \\(\\operatorname{Var}(z)=100\\Rightarrow\\sigma_z=10\\) ⇒ \\(g'(10)=4.5\\times10^{-5}\\) ⇒ gradient ตายตั้งแต่ชั้นแรก. BN จึงเป็นเวอร์ชัน \"ทำให้ทุกรอบ\" ของสิ่งที่ initialization ทำได้แค่รอบแรก.</p>", "ref": "Lesson 5 §3.0B (สไลด์หน้า 10–11)", "why_wrong_map": ["BN ็น predictive model"], "answer": 1, "explanation": "มีคำตอบให้ (labelled) = supervised: regression ทำนายค่าต่อเนื่อง classification ทำนายค่าไม่ต่อเนื่อง และ \\(h\\) เป็น <b>predictive model</b>. ไม่มีคำตอบให้ = unsupervised และ \\(h\\) เป็น <b>descriptive model</b> — บรรยายโครงสร้างข้อมูล เช่น clustering ด้วย k-means ไม่ได้ทำนาย label.", "ref": "Lesson 1 §1B (p.24, p.60)", "why_wrong_map": ["ประเภทถูกแต่บทบาทผิด — unsupervised ไม่ทำนาย", "", "ไม่มีป้ายคำตอบ จึงไม่ใช่ supervised", "ไม่มีค่าตัวเลขเป้าหมายให้ทำนาย จึงไม่ใช่ regression"]}, {"id": "L4-33", "lesson": 4, "topic": "Max-norm regularization", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "neuron ตัวหนึ่งมี weight ขาเข้า \\(w=(6,8)\\) และตั้ง max-norm \\(r=5\\) หลังผ่านการบังคับข้อจำกัด \\(w\\) จะกลายเป็นอะไร?", "options": ["\\((1.2,1.6)\\)", "\\((6,8)\\)", "\\((5,5)\\)", "\\((3,4)\\)"], "answer": 3, "explanation": "<p>ขั้นที่ 1 — \\(\\|w\\|_2 = \\sqrt{6^2+8^2} = \\sqrt{100} = 10\\) เทียบกับ \\(r=5\\): \\(10>5\\) ⇒ ต้อง rescale</p><p>ขั้นที่ 2 — ตัวคูณ \\(= r/\\|w\\|_2 = 5/10 = 0.5\\) (\\(\\le 1\\) เสมอตามที่สไลด์ระบุ)</p><p>ขั้นที่ 3 — \\(w := (6,8)\\times0.5 = (3,4)\\) ตรวจ: \\(\\sqrt{9+16}=5\\) พอดี</p><p>ทิศของ \\(w\\) ไม่เปลี่ยน (\\(3:4 = 6:8\\)) เปลี่ยนแค่ความยาว — max-norm คือการ \\\"ตัดยอด\\\" หลังทุก training step ไม่ใช่การเพิ่ม penalty ใน cost และ <b>ลด \\(r\\) = regularize แรงขึ้น</b></p>", "ref": "Lesson 4 §6.1 (สไลด์หน้า 27)", "why_wrong_map": ["หารด้วย \\(r\\) แทนที่จะคูณด้วย \\(r/\\|w\\|_2\\) — ได้เวกเตอร์ที่ยาว 2 ไม่ใช่ 5 ตามที่ตั้งไว้", "จะไม่ rescale ก็ต่อเมื่อ \\(\\|w\\|_2 \\le r\\) ซึ่งไม่ใช่กรณีนี้", "ตัดยอดทีละองค์ประกอบให้ไม่เกิน \\(r\\) ซึ่งผิด max-norm คุมความยาวของเวกเตอร์ทั้งก้อน", ""]}, {"id": "L6-19", "topic": "สเปกของ schedule function", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ข้อใดอธิบายการใช้ <code>LearningRateScheduler</code> ตามสเปกในสไลด์หน้า 10 ได้ถูกต้อง", "options": ["ส่งชื่อฟังก์ชันโดยใส่วงเล็บเรียกทันที ฟังก์ชันรับ (epoch index, logs) แล้วคืนค่า float ใหม่ออกมา", "ส่งชื่อฟังก์ชันโดยไม่ใส่วงเล็บ ฟังก์ชันรับ (epoch index, learning rate ปัจจุบัน) แล้วคืนค่า float ใหม่", "ส่งชื่อฟังก์ชันโดยไม่ใส่วงเล็บ ฟังก์ชันรับ (learning rate ปัจจุบัน, epoch index) แล้วคืนค่า dict", "ส่งชื่อฟังก์ชันโดยไม่ใส่วงเล็บ ฟังก์ชันถูกเรียกทุก batch แล้วคืน learning rate ใหม่เป็น float"], "explanation": "<p>สไลด์เขียนว่าที่ต้นของทุก epoch callback จะไปเอา <mark class=\"src\" data-p=\"10\">updated learning rate value from schedule function</mark> โดยฟังก์ชันนั้น <mark class=\"src\" data-p=\"10\">takes an epoch index and current learning rate as inputs</mark> แล้วคืน <mark class=\"src\" data-p=\"10\">a new learning rate as output</mark></p><p>ใน Python ฟังก์ชันเป็น \"ค่า\" ที่ส่งต่อได้ — เขียน <code>LearningRateScheduler(lr_function, verbose=1)</code> คือยื่นสูตรให้ Keras เก็บไว้เรียกเอง. ถ้าเผลอเขียน <code>lr_function()</code> จะกลายเป็นการเรียกทันทีแล้วส่งตัวเลขไปแทน ⇒ error</p><p><code>verbose</code> เป็น int: 0 = เงียบ, 1 = พิมพ์บรรทัด \"Epoch N: LearningRateScheduler setting learning rate to ...\" ทุก epoch</p>", "ref": "Lesson 6 §5.1 (สไลด์หน้า 10)", "lesson": 6, "answer": 1, "why_wrong_map": ["ใส่วงเล็บจะเป็นการเรียกฟังก์ชันทันที และพารามิเตอร์ตัวที่สองคือ lr ไม่ใช่ logs", "", "ลำดับพารามิเตอร์ต้องเป็น (epoch, lr) และต้องคืน float ไม่ใช่ dict", "scheduler ทำงานที่ต้นทุก epoch ไม่ใช่ทุก batch"]}, {"id": "L3-06", "lesson": 3, "topic": "δ: นิยาม", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ในสูตร backpropagation ค่า \\(\\delta_j^{(l)}\\) ของ node \\(j\\) ใน layer \\(l\\) นิยามเป็นข้อใด?", "options": ["\\(\\partial J/\\partial a_j^{[l]}\\)", "\\(\\partial J/\\partial z_j^{[l]}\\)", "\\(\\partial J/\\partial \\theta_{ij}^{[l]}\\)", "\\(\\partial a_j^{[l]}/\\partial z_j^{[l]}\\)"], "answer": 1, "explanation": "\\(\\delta_j^{(l)}=\\dfrac{\\partial J}{\\partial z_j^{[l]}}\\) — \"ถ้าดัน \\(z\\) ของ node นี้ขึ้นนิดเดียว cost เปลี่ยนเท่าไร\" (ส่วนแบ่งความผิดของ node). บางครั้ง δ ถูกเรียกส eature ไปแตกโพลิโนเมียลดีกรี 2 จะได้ \\(2(3072)+\\binom{3072}{2}\\) ≈ 4.7 ล้านเทอม จากภาพเล็ก ๆ ภาพเดียว — เหตุผลที่ต้องใช้ neural network แทน</p>", "ref": "Lesson 2 §1 (Lecture2.pdf p.3)", "why_wrong_map": ["", "นี่คือจำนวน feature ของภาพขาวดำ ยังไม่ได้คูณ 3 ช่องสี", "คูณด้วย 4 (คิดว่ามีช่อง alpha เพิ่ม) ซึ่งภาพ RGB ไม่มี", "คูณด้วย 2 แทนที่จะเป็น 3 ช่องสี"]}, {"id": "L3-34", "lesson": 3, "topic": "Hyperparameter tuning guideline & best practice", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดเป็นแนวทางเลือกขนาดเครือข่าย (จำนวน layer และ hidden unit) ที่ถูกต้อง?", "options": ["เริ่มจากใหญ่ ลดขนาดจน training loss หยุดลด; #layer 10-20; #hidden เป็นพีระมิดลดหลั่น", "เริ่มจากเล็ก ขยายจน validation loss ได้ผลน้อยลง; #layer 1-5; #hidden 5-100 เท่ากันทุกชั้น", "เริ่มจากเล็ก ขยายจน validation loss ได้ผลน้อยลง; #layer 1-5; #hidden จัดเป็นพีระมิดลดหลั่นลง", "เริ่มจากเล็ก ขยายจน training loss หยุดลด; #layer 1-5; #hidden 100-1000 ยิ่งมากยิ่งดี"], "answer": 1, "explanation": "เริ่มจาก layer จำนวนน้อย → ค่อย ๆ เพิ่มจนเห็น diminishing returns ของ <b>validation loss</b> → ใช้เทคนิคลด overfitting. จำนวน layer มักอยู่ที่ 1–5 (1 hidden layer เป็นค่าเริ่มต้น, 2 อาจพอแล้ว); hidden units ช่วง 5 ถึง 100; รูปพีระมิด \"has been largely abandoned\" เพราะจำนวนเท่ากันทุกชั้นได้ผลพอกันหรือดีกว่า และเหลือ hyperparameter ให้จูนตัวเดียว.", "ref": "Lesson 3 §7A (p.44, 46)", "why_wrong_map": ["ผิดทุกส่วน — ทิศการขยาย เกณฑ์ จำนวน layer และพีระมิด", "", "ถูกครึ่งแรก แต่พีระมิดถูกเลิกใช้ไปแล้ว", "ดู training loss (ซึ่งลดได้เรื่อยๆ) และช่วง hidden ผิด"]}, {"id": "L1-16", "lesson": 1, "topic": "Feature scaling & z-score", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดถูกต้องเกี่ยวกับ feature scaling และ mean normalization (z-score)?", "options": ["scaling ใช้เฉพาะกับ test set; z-score คือ (x − min) หารด้วย (max − min)", "scaling ทำให้ contour กลมขึ้น GD ลู่เข้าเร็วขึ้น; z-score ไม่มี min/max ตายตัว", "scaling ทำให้ค่า cost ต่ำสุดลดลง; z-score บีบทุกค่าให้อยู่ในช่วง 0 ถึง 1", "scaling ทำให้ contour กลมขึ้น GD ลู่เข้าเร็วขึ้น; z-score บีบค่าอยู่ใน [−1, 1]"], "answer": 1, "explanation": "เป้าหมายของ feature scaling คือทำให้ทุก feature อยู่ในสเกลใกล้กัน — ถ้าสเกลต่างกันมาก (ขนาดบ้าน 1000–5000 กับจำนวนห้อง 1–5) contour ของ cost เป็นวงรีแคบ GD เดินซิกแซก; ปรับสเกลแล้ว contour กลมขึ้น เดินตรงเข้าก้นชาม. <b>z-score</b> คือ \\(x_{new}=(x-\\mu)/\\sigma\\) ซึ่ง <b>ไม่มี min/max ตายตัว</b> (เช่น 10, 20, 30 ได้ประมาณ −1.22, 0, +1.22) และเหมาะเมื่อข้อมูลกระจายแบบ normal.", "ref": "Lesson 1 §4 (p.34–36)", "why_wrong_map": ["ต้อง scale ทุกชุดด้วยค่าจาก train; สูตรนั้นคือ min-max", "", "scaling เร่ง GD ไม่ได้เปลี่ยนคุณภาพจุดต่ำสุด; ช่วง [0,1] คือ min-max", "z-score ไม่มีช่วงตายตัว ติดลบหรือเกิน 1 ได้"]}, {"id": "L6-13", "topic": "ModelCheckpoint แบบไม่ตั้ง save_best_only", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ใช้ <code>ModelCheckpoint('my_model.weights.h5', save_weights_only=True)</code> คู่กับ EarlyStopping ที่ restore_best_weights=True เมื่อเทรนจบ ไฟล์บนดิสก์เป็น weight ของ epoch ใด", "options": ["ของ epoch สุดท้ายที่เทรน เพราะเซฟทุกจบ epoch ด้วยชื่อไฟล์เดิม ไฟล์ใหม่จึงเขียนทับตัวเก่าตลอด", "ของ epoch ที่ val_loss ต่ำที่สุด เพราะ ModelCheckpoint เลือกเซฟเฉพาะตัวที่ดีที่สุดให้โดยปริยาย", "ของ epoch ที่ EarlyStopping คืน weight กลับมา เพราะ callback สองตัวนี้แชร์สถานะเดียวกันเสมอ", "ไม่มีไฟล์เหลือเลย เพราะ ModelCheckpoint ลบไฟล์ทิ้งอัตโนมัติเมื่อการเทรนจบลงอย่างสมบูรณ์"], "explanation": "<p>สไลด์บอกว่า ModelCheckpoint <mark class=\"src\" data-p=\"6\">saves the model (or its weights) during training, typically at the end of each epoch by default</mark> และ <mark class=\"src\" data-p=\"2\">Saving the current state of the model</mark> — คำว่า <b>current state</b> แปลว่าสภาพ ณ ตอนนั้น ไม่ใช่ตัวที่ดีที่สุด</p><p>ชื่อไฟล์คงที่ ⇒ เขียนทับทุก epoch ⇒ เหลือของ epoch สุดท้าย. ในสคริปต์ที่รันในคาบเห็นชัด: โมเดลในหน่วยความจำ (จาก EarlyStopping ที่ restore แล้ว) ให้ test_loss 0.4264 แต่ weight จากไฟล์ checkpoint ให้ 0.3993 — คนละตัวกัน. ถ้าอยากได้ตัวที่ดีที่สุดต้องสั่ง <code>save_best_only=True</code></p>", "ref": "Lesson 6 §3 (สไลด์หน้า 6) · callbacks notebook", "lesson": 6, "answer": 0, "why_wrong_map": ["", "save_best_only มีค่า default เป็น False จึงเซฟทุก epoch ไม่เลือกตัวที่ดีที่สุด", "callback สองตัวทำงานแยกกัน EarlyStopping เก็บ weight ในหน่วยความจำ ไม่เกี่ยวกับไฟล์", "ModelCheckpoint ไม่ลบไฟล์ให้ (delete_checkpoint เป็นของ BackupAndRestore)"]}, {"id": "L6-43", "topic": "conditional hyperparameter กับ search_space_summary", "source": "tuning_notebook", "type": "code", "difficulty": "hard", "stem": "build_model ของ notebook IMDB นิยาม activation, num_layers, dropout, units_i, learning_rate, optimizer แต่ <code>search_space_summary()</code> พิมพ์ว่า Default search space size: 6 และไม่มี units_1 เพราะอะไร", "code": "num_layers = hp.Int(\"num_layers\", min_value=1, max_value=2)\nfor i in range(num_layers):\n    units = hp.Choice(f\"units_{i}\", values=[32, 64, 128])", "options": ["units_1 ถูกนับรวมเป็นตัวเดียวกับ units_0 เพราะทั้งสอง layer ใช้ hp.Choice ที่มีรายการค่าชุดเดียวกัน", "เพราะยังไม่ได้เรียก tuner.search() ระบบจึงยังไม่สร้าง hyperparameter ใดๆ นอกจากค่าที่ประกาศตายตัว", "hyperparameter เกิดขึ้นตอนโค้ดรันผ่านบรรทัดนั้นจริง สรุป search space รันด้วยค่า default num_layers = 1 จึงมีแค่ units_0", "KerasTuner จำกัดจำนวน hyperparameter ที่แสดงไว้สูงสุด 6 ตัวต่อการเรียก search_space_summary หนึ่งครั้ง"], "explanation": "<p>hyperparameter ใน KerasTuner ถูกสร้างขึ้น<b>ตอนที่โค้ดรันผ่านบรรทัดนั้นจริงๆ</b>. ตอนเรียก <code>search_space_summary()</code> ระบบรัน build_model หนึ่งรอบด้วยค่า default ซึ่ง num_layers ได้ค่าน้อยสุด = 1 ⇒ loop วนรอบเดียว ⇒ เกิดแค่ <code>units_0</code></p><p>ผลที่ notebook พิมพ์จึงมี 6 ตัว: activation, num_layers, dropout, units_0, learning_rate, optimizer</p><p><code>units_1</code> จะโผล่มาเมื่อ tuner สุ่มได้ num_layers = 2 ระหว่างค้นหา — เรียกว่า <b>conditional hyperparameter</b> และเป็นเหตุผลที่การนับขนาด search space ด้วยมือต้องแ
