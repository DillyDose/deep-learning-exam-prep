<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="270" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">จำนวนการคูณ = ขนาด output × ขนาด filter × depth ของ input</text><rect x="30" y="60" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="86.5" font-size="13" text-anchor="middle" fill="#222" font-weight="normal">28×28×192</text><line x1="150" y1="82" x2="250" y2="82" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="200" y="74" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">5×5, 32 filter</text><rect x="250" y="60" width="120" height="44" rx="6" fill="#d9efd9" stroke="#2e7d32"/><text x="310.0" y="86.5" font-size="13" text-anchor="middle" fill="#222" font-weight="normal">28×28×32</text><text x="400" y="80" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">naive: 25,088 × 25 × 192</text><text x="400" y="100" font-size="13" text-anchor="start" fill="#b3261e" font-weight="bold">= 120,422,400</text><rect x="30" y="160" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="186.5" font-size="13" text-anchor="middle" fill="#222" font-weight="normal">28×28×192</text><line x1="150" y1="182" x2="196" y2="182" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="173" y="154" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">1×1, 16</text><rect x="196" y="166" width="70" height="32" rx="6" fill="#fde7d4" stroke="#c