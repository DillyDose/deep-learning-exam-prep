<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Functional API: tensor มีชื่อ จึงแยกกิ่ง รวมกิ่ง และมีหลาย output ได้</text><rect x="30" y="60" width="120" height="40" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="84.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">input_A (5)</text><rect x="30" y="190" width="120" height="40" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="90.0" y="214.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">input_B (6)</text><rect x="200" y="190" width="120" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="260.0" y="214.5" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">hidden1 Dense 30</text><text x="260" y="248" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">6·30 + 30 = 210</text><rect x="360" y="190" width="120" height="40" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="420.0" y="214.5" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">hidden2 Dense 30</text><text x="420" y="248" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">30·30 + 30 = 930</text><rect x="400" y="60" width="120" height="40" rx="6" fill="#f4f4f4" stroke="#ccc"/><text x="460.0" y="84.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">concat (35)</text><text x="460" y="50" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">5 + 30 = 35 · ไม่มี parameter</text><rect x="580" y="60" width="140" height="40" rx="6" fill="#d9efd9" stroke="#2e7d32"/><text x="650.0" y="84.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">output Dense 1</text><text x="650" y="116" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">35 + 1 = 36</text><rect x="580" y="190" width="140" height="40" rx="6" fill="#d9efd9" stroke="#2e7d32"/><text x="650.0" y="214.5" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">aux_output Dense 1</text><text x="650" y="248" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">30 + 1 = 31</text><line x1="150" y1="80" x2="398" y2="80" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="270" y="72" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">wide path ข้าม hidden</text><line x1="150" y1="210" x2="198" y2="210" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="320" y1="210" x2="358" y2="210" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="420" y1="190" x2="450" y2="102" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="520" y1="80" x2="578" y2="80" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="480" y1="210" x2="578" y2="210" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="380" y="286" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">hidden2 ถูกใช้สองครั้ง · total 210 + 930 + 36 + 31 = 1,207 · ไม่มี aux = 1,176</text></svg>