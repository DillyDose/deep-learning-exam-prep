>Refund 3s</text><rect x="130" y="144" width="224" height="20" fill="#c25e00" fill-opacity="0.5" stroke="#c25e00"/><text x="242.0" y="159" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Order 4s</text><line x1="354" y1="88" x2="354" y2="172" stroke="#2e7d32" stroke-dasharray="4 3"/><text x="360" y="130" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">max(2, 3, 4) = 4s</text><text x="380" y="200" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">ลดลง (9 − 4)/9 = 55.6% · ตัวเลขสมมติ ไม่รวมเวลาเรียก LLM · lab: 3 tool × 1s ได้ 3.0s เทียบ 1.0s</text></svg>