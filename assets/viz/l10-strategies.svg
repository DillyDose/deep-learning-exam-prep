<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="312" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">อยากรู้ 10 ค่าถัดไปจาก 50 ค่าที่มี: สี่วิธีจัด input → output</text><rect x="20" y="50" width="720" height="50" rx="6" fill="#fbeaea" stroke="#ddd"/><text x="34" y="71" font-size="12.5" text-anchor="start" fill="#c25e00" font-weight="bold">1 recursive</text><text x="220" y="71" font-size="12" text-anchor="start" fill="#222" font-weight="normal">x₁…x₅₀ → x̂₅₁ → ป้อนกลับ → x̂₅₂ … x̂₆₀</text><text x="220" y="90" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">error สะสม ยิ่งไกลยิ่งผิด</text><rect x="20" y="110" width="720" height="50" rx="6" fill="#f7f7f7" stroke="#ddd"/><text x="34" y="131" font-size="12.5" text-anchor="start" fill="#c25e00" font-weight="bold">2 direct multi-output</text><text x="220" y="131" font-size="12" text-anchor="start" fill="#222" font-weight="normal">x₁…x₅₀ → [x̂₅₁ … x̂₆₀] ครั้งเดียว</text><text x="220" y="150" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">ไม่สะสม · horizon ไกลยากกว่า</text><rect x="20" y="170" width="720" height="50" rx="6" fill="#f7f7f7" stroke="#ddd"/><text x="34" y="191" font-size="12.5" text-anchor="start" fill="#c25e00" font-weight="bold">3 direct horizon เดียว</text><text x="220" y="191" font-size="12" text-anchor="start" fill="#222" font-weight="normal">x₁…x₅₀ → x̂₆₀</text><text x="220" y="210" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">ง่ายสุดถ้าสนใจค่าเดียว · แบบฝึกอุณหภูมิใช้แบบนี้</text><rect x="20" y="230" width="720" height="50" rx="6" fill="#f7f7f7" stroke="#ddd"/><text x="34" y="251" font-size="12.5" text-anchor="start" fill="#c25e00" font-weight="bold">4 forecast every step</text><text x="220" y="251" font-size="12" text-anchor="start" fill="#222" font-weight="normal">x₁ → [x̂₂…x̂₁₁], x₂ → [x̂₃…x̂₁₂] … x₅₀ → [x̂₅₁…x̂₆₀]</text><text x="220" y="270" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">loss ทุก step สัญญาณเทรนตรงกว่า</text><text x="380" y="302" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">3 = sequence-to-vector · 4 = sequence-to-sequence (return_sequences=True)</text></svg>