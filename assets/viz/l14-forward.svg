<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="285" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">x_t = √ᾱ·x₀ + √(1−ᾱ)·ε : ส่วนของรูปเดิมกับส่วนของ noise (variance รวม = 1 เสมอ)</text><rect x="50" y="50" width="56" height="0.0" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="50" y="50.0" width="56" height="150.0" fill="#cde8cf" stroke="#2e7d32"/><text x="78" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 0</text><text x="78" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 1.00</text><rect x="150" y="50" width="56" height="15.7" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="150" y="65.7" width="56" height="134.3" fill="#cde8cf" stroke="#2e7d32"/><text x="178" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 0.1</text><text x="178" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 0.90</text><rect x="250" y="50" width="56" height="51.5" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="250" y="101.5" width="56" height="98.5" fill="#cde8cf" stroke="#2e7d32"/><text x="278" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 0.2</text><text x="278" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 0.66</text><rect x="350" y="50" width="56" height="90.8" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="350" y="140.8" width="56" height="59.2" fill="#cde8cf" stroke="#2e7d32"/><text x="378" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 0.3</text><text x="378" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 0.39</text><rect x="450" y="50" width="56" height="120.9" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="450" y="170.9" width="56" height="29.1" fill="#cde8cf" stroke="#2e7d32"/><text x="478" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 0.4</text><text x="478" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 0.19</text><rect x="550" y="50" width="56" height="138.3" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="550" y="188.3" width="56" height="11.7" fill="#cde8cf" stroke="#2e7d32"/><text x="578" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 0.5</text><text x="578" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 0.08</text><rect x="650" y="50" width="56" height="150.0" fill="#cfe3f7" stroke="#1d6fb8"/><rect x="650" y="200.0" width="56" height="0.0" fill="#cde8cf" stroke="#2e7d32"/><text x="678" y="218" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">t = 1</text><text x="678" y="234" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="normal">ᾱ = 0.00</text><rect x="640" y="262" width="12" height="12" fill="#cde8cf" stroke="#2e7d32"/><text x="658" y="272" font-size="11.5" text-anchor="start" fill="#2e7d32" font-weight="normal">รูปเดิม ᾱ</text><rect x="540" y="262" width="12" height="12" fill="#cfe3f7" stroke="#1d6fb8"/><text x="558" y="272" font-size="11.5" text-anchor="start" fill="#1d6fb8" font-weight="normal">noise 1−ᾱ</text><text x="50" y="272" font-size="11.5" text-anchor="start" fill="#666" font-weight="normal">linear schedule, T = 1000 (t = สัดส่วนของเวลา)</text></svg>