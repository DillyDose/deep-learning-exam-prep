<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="270" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">โจทย์เดียวกัน "refund" ทำได้หลายระดับ · ยิ่งขวา ระบบยิ่งตัดสินใจเอง</text><rect x="20" y="190" width="175" height="40" rx="6" fill="#fde7d4" fill-opacity="0.25" stroke="#c25e00"/><text x="107" y="212" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Rule-Based System</text><rect x="205" y="150" width="175" height="80" rx="6" fill="#fde7d4" fill-opacity="0.45" stroke="#c25e00"/><text x="292" y="172" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">AI Workflow</text><rect x="390" y="110" width="175" height="120" rx="6" fill="#fde7d4" fill-opacity="0.65" stroke="#c25e00"/><text x="477" y="132" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Tool-Using Agent</text><rect x="575" y="70" width="175" height="160" rx="6" fill="#fde7d4" fill-opacity="0.8500000000000001" stroke="#c25e00"/><text x="662" y="92" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Autonomous Agent</text><text x="107" y="250" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">เจอคำ refund แสดงข้อความตายตัว</text><text x="107" y="266" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">ไม่มีโมเดลตัดสินใจ</text><text x="292" y="250" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">LLM จัดหมวด แล้วเดิน branch เดิม</text><text x="292" y="266" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">ลำดับกำหนดโดยนักพัฒนา</text><text x="477" y="250" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">LLM เลือก tool ตามคำขอ</text><text x="477" y="266" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">เลือก action ได้</text><text x="662" y="250" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">วางแผนหลายขั้น ดูผล ปรับแผน</text><text x="662" y="266" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">ปรับตัวตามผลลัพธ์</text><line x1="30" y1="52" x2="720" y2="52" stroke="#c25e00" stroke-width="1.6" marker-end="url(#ar)"/><text x="375" y="46" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">autonomy เพิ่มขึ้น · ไม่ใช่ทุก agent ต้องทำงานโดยไม่มีคนดูแล</text></svg>