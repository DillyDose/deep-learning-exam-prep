<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Learning MCQ Review</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script defer src="assets/katex/katex.min.js"></script>
<script defer src="assets/katex/auto-render.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #55554f;
  --rule: #e2ddd2;
  --accent: #a5502c;
  --accent-soft: #f6ece3;
  --good: #2f6d3e;
  --good-bg: #e8f3ea;
  --bad: #a5342c;
  --bad-bg: #f9e9e7;
  --code-bg: #f4f2eb;
  --panel: #faf9f5;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: -apple-system, "Helvetica Neue", "Noto Sans Thai", "Sukhumvit Set", Arial, sans-serif;
  font-size: 17px; line-height: 1.6;
  max-width: 820px; margin: 0 auto; padding: 2rem 16px 5rem;
}
h1 { font-size: 1.7rem; margin: 0 0 .2em; }
.sub { color: var(--ink-soft); margin: 0 0 1.2em; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
.panel h2 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; font-size: .88rem; background: #fff; cursor: pointer; user-select: none; }
.chip input { margin: 0; }
button { font: inherit; font-size: .9rem; border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: .75rem; color: var(--ink-soft); }
.stat .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--rule); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.weak { margin: 10px 0 0; padding-left: 1.2em; font-size: .92rem; }
.weak li { margin: 2px 0; }
.weak a { color: var(--bad); }
.progress { font-size: .9rem; color: var(--ink-soft); margin: 18px 0 8px; }
.q { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; margin: 0 0 16px; background: #fff; scroll-margin-top: 12px; }
.q.done-good { border-left: 5px solid var(--good); }
.q.done-bad { border-left: 5px solid var(--bad); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: .74rem; margin-bottom: 8px; }
.tag { border-radius: 4px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent); }
.tag.t-code { background: #e7eef8; color: #2b5a91; }
.tag.t-calc { background: #efe8f6; color: #6a3d8f; }
.tag.d-easy { background: #eaf3e8; color: #3d6b33; }
.tag.d-medium { background: #f7f0dc; color: #7a5b12; }
.tag.d-hard { background: #f8e4e1; color: #8e3a2f; }
.num { font-weight: 700; color: var(--ink-soft); margin-right: 4px; }
.stem { margin: 0 0 10px; }
pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: .84rem; line-height: 1.45; margin: 8px 0 12px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
:not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; text-align: left; width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--rule); background: #fff; font-size: .97rem; line-height: 1.5; }
.opt .L { font-weight: 700; min-width: 1.4em; color: var(--ink-soft); }
.opt:not([disabled]):hover { background: var(--panel); border-color: var(--accent); }
.opt[disabled] { cursor: default; color: var(--ink); }
.opt.correct { background: var(--good-bg); border-color: var(--good); }
.opt.correct .L { color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .L { color: var(--bad); }
.verdict { margin: 10px 0 0; font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.explain { margin-top: 10px; padding: 12px 14px; background: var(--panel); border-radius: 9px; border: 1px solid var(--rule); font-size: .95rem; }
.explain h4 { margin: 10px 0 4px; font-size: .85rem; color: var(--accent); }
.explain h4:first-child { margin-top: 0; }
.explain ul { margin: 4px 0; padding-left: 1.2em; }
.explain .ref { margin-top: 8px; font-size: .82rem; color: var(--ink-soft); }
.empty { color: var(--ink-soft); padding: 30px 0; text-align: center; }
.katex { font-size: 1.02em; }
@media (max-width: 560px) { body { font-size: 16px; } .q { padding: 14px 12px; } }
</style>
</head>
<body>
<h1>Deep Learning MCQ Review</h1>
<p class="sub">ข้อสอบทบทวน Lesson 1-6 + ex1-3 + notebook ในห้อง · ลำดับข้อคงที่ ปิดแล้วกลับมาทำต่อได้ · ตอบแล้วเห็นผลทันที กด “ดูเฉลย” เมื่อไม่เข้าใจ · export ผลเป็น JSON ไปให้ AI วิเคราะห์ได้</p>

<div class="panel">
  <h2>เลือกชุดที่จะทำ</h2>
  <div class="row" id="lessonFilters"></div>
  <div class="row" style="margin-top:8px" id="typeFilters"></div>
  <div class="row" style="margin-top:8px">
    <label class="chip"><input type="radio" name="mode" value="all" checked> ทุกข้อ</label>
    <label class="chip"><input type="radio" name="mode" value="unanswered"> ยังไม่ได้ทำ</label>
    <label class="chip"><input type="radio" name="mode" value="wrong"> เฉพาะข้อที่ผิด (ทำซ้ำ)</label>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="primary" id="nextBtn">ไปข้อถัดไปที่ยังไม่ได้ทำ</button>
    <button id="exportBtn">Export ผลเป็น JSON</button>
    <button id="importBtn">นำเข้าผลที่ export ไว้</button>
    <button id="resetBtn">ล้างคำตอบทั้งหมด</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<div class="panel">
  <h2>คะแนนและจุดอ่อน</h2>
  <div class="stats" id="stats"></div>
  <div id="weakWrap"></div>
</div>

<div class="progress" id="progress"></div>
<div id="list"></div>

) ของ hidden layer?", "options": ["เพราะ \\(\\delta\\) ที่ output นิยามจาก \\(\\partial J/\\partial a\\) ไม่ใช่ \\(\\partial J/\\partial z\\)", "เพราะ cross-entropy ไม่ได้ใช้ activation ที่ output จึงไม่มี \\(g'\\) ให้คูณเลย", "เพราะที่ output layer ค่า \\(g'(z)\\) เท่ากับ 1 เสมอไม่ว่า \\(z\\) จะเป็นเท่าใด", "เพราะ \\(\\partial J/\\partial a=(a-y)/[a(1-a)]\\) ไปหักล้างกับ \\(g'=a(1-a)\\) พอดี"], "answer": 3, "explanation": "โซ่มี 2 ทอด: \\(\\dfrac{\\partial J}{\\partial z^{[2]}}=\\dfrac{\\partial J}{\\partial a}\\cdot\\dfrac{\\partial a}{\\partial z^{[2]}}\\). ทอดแรกจาก cross-entropy \\(J=-[y\\ln a+(1-y)\\ln(1-a)]\\): \\(\\dfrac{\\partial J}{\\partial a}=-\\dfrac{y}{a}+\\dfrac{1-y}{1-a}=\\dfrac{a-y}{a(1-a)}\\). ทอดที่สองคือ \\(g'=a(1-a)\\). คูณกันแล้ว \\(a(1-a)\\) หักล้างพอดี เหลือ \\(a-y\\). นี่ไม่ใช่ความบังเอิญ — cross-entropy ถูกออกแบบคู่กับ sigmoid เพื่อให้ตัวคูณ \\(g'\\) ที่ output หายไป ⇒ เมื่อโมเดล &quot;มั่นใจผิด&quot; (\\(a\\) ใกล้ 0 แต่ \\(y=1\\)) gradient ยังใหญ่พอจะแก้ตัว ไม่ถูก \\(g'\\approx0\\) ฆ่าทิ้งแบบที่จะเกิดถ้าใช้ MSE.", "ref": "Lesson 3 §2.4 พิสูจน์ ① (p.10)", "why_wrong_map": ["นิยามที่ใช้จริงคือ \\(\\delta=\\partial J/\\partial z\\) เหมือนกันทุก layer", "output layer ก็ใช้ activation (sigmoid) — \\(g'\\) มีอยู่ แต่ถูกหักล้าง", "\\(g'\\) ของ sigmoid สูงสุดแค่ 0.25 ที่ \\(z=0\\) ไม่ใช่ 1", ""]}, {"id": "L1-30", "lesson": 1, "topic": "Bias vs Variance diagnosis", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "โมเดลหนึ่งได้ \\(J_{train}=0.30\\) และ \\(J_{cv}=0.32\\) (ทั้งคู่สูงกว่าที่ต้องการมาก) วินิจฉัยว่าอะไรและควรแก้อย่างไร?", "options": ["High bias (underfit) — เพิ่ม feature/degree หรือลด λ", "High bias (underfit) — เก็บตัวอย่างข้อมูลเพิ่มให้มากขึ้น", "High variance (overfit) — เพิ่มข้อมูลหรือเพิ่ม λ ให้แรงขึ้น", "High variance (overfit) — ลด degree ของ polynomial ลง"], "answer": 0, "explanation": "<b>high bias (underfitting)</b>: ทั้ง \\(J_{train}\\) และ \\(J_{cv}\\) สูงและใกล้กัน; <b>high variance</b>: \\(J_{train}\\) ต่ำ แต่ \\(J_{cv}\\) สูงกว่ามาก. ข้อนี้ทั้งคู่สูงและใกล้กัน ⇒ โมเดลง่ายเกินไป. วิธีแก้ underfitting: เพิ่มจำนวน feature, เพิ่ม feature ที่เกี่ยวข้อง, เพิ่ม degree ของ feature หรือลด regularization parameter.", "ref": "Lesson 1 §10–10A (p.54–56)", "why_wrong_map": ["", "การเก็บข้อมูลเพิ่มไม่ช่วยมากในกรณี high bias", "overfit ต้องเห็น J_train ต่ำแต่ J_cv สูงกว่ามาก", "วินิจฉัยผิดฝั่ง และลด degree ยิ่งทำให้ underfit หนักขึ้น"]}, {"id": "L4-30", "lesson": 4, "topic": "โค้ด optimizer: ช่องอาร์กิวเมนต์", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "ข้อใดจับคู่ optimizer กับชื่ออาร์กิวเมนต์ใน Keras ได้ถูกต้องตามสไลด์หน้า 21, 22 และ 25?", "options": ["RMSprop ใช้ decay_rate=, Adam ใช้ epsilon=/rho=, AdamW เพิ่ม kernel_constraint= ขึ้นมาอีกตัว", "RMSprop ใช้ momentum=, Adam ใช้ beta1=/beta2=, AdamW เพิ่ม kernel_regularizer= ขึ้นมาอีกตัว", "RMSprop ใช้ beta_2=, Adam ใช้ rho=/momentum=, AdamW เพิ่ม max_norm= ขึ้นมาอีกหนึ่งตัวเสมอ", "RMSprop ใช้ rho=, Adam ใช้ beta_1=/beta_2=, AdamW เพิ่ม weight_decay= ขึ้นมาอีกหนึ่งตัว"], "answer": 3, "explanation": "<p><code>keras.optimizers.RMSprop(lr=0.001, rho=0.9)</code> — RMSProp ไม่มีช่อง momentum เพราะไม่เก็บค่าเฉลี่ยของ gradient (เก็บแต่กำลังสอง)</p><p><code>keras.optimizers.Adam(lr=0.001, beta_1=0.9, beta_2=0.999)</code> — ชื่อมี<b>ขีดล่าง</b> ไม่ใช่ beta1</p><p><code>keras.optimizers.AdamW(learning_rate=0.001, beta_1=0.9, beta_2=0.999, weight_decay=0.004)</code> — <code>weight_decay</code> คือ \\(\\lambda\\) และเป็นอาร์กิวเมนต์เดียวที่เพิ่มจาก Adam (ตั้งเป็น 0 ก็กลายเป็น Adam)</p>", "ref": "Lesson 4 §5.1–5.5 (สไลด์หน้า 21, 22, 25)", "why_wrong_map": ["kernel_constraint เป็นช่องของ Dense layer สำหรับ max-norm", "สะกด beta1 ไม่มีขีดล่าง และ kernel_regularizer เป็นอาร์กิวเมนต์ของ layer ไม่ใช่ optimizer", "สลับชื่อระหว่าง RMSProp กับ Adam", ""]}, {"id": "L4-41", "lesson": 4, "topic": "Data augmentation", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดตรงกับนิยามของ data augmentation ในสไลด์หน้า 34?", "options": ["ออกไปเก็บข้อมูลจริงเพิ่มจากแหล่งใหม่ เพราะเป็นวิธีเดียวที่แก้ปัญหาตัวอย่างน้อยได้จริง", "สร้างข้อมูลเทรนเพิ่มแบบสังเคราะห์จากตัวอย่างที่มีอยู่ ด้วยการแปลงแบบสุ่มที่ไม่เปลี่ยน label", "แปลงข้อมูลชุด test ด้วยวิธีเดียวกับชุดเทรน เพื่อให้การวัดผลมีความยุติธรรมกับทุกโมเดล", "สร้างข้อมูลชุดใหม่ที่ไม่เกี่ยวข้องกับข้อมูลเดิม เพื่อเพิ่มความหลากหลายให้ชุดเทรนมากที่สุด"], "answer": 1, "explanation": "<p>สไลด์เริ่มจาก \"ตัวอย่างเทรนที่มีน้อยก่อให้เกิด overfitting\" ทางหนึ่งคือ get more data แต่วงเล็บสีแดงตามมาว่า <i>(not always a feasible option)</i></p><p>Data augmentation = generate training data เพิ่มแบบสังเคราะห์ (artificially) จาก <b>existing training examples</b> ด้วย <b>random transformations</b></p><p>ผลที่ได้: โมเดลปรับตัวเข้ากับความแปรผันของ position, orientation และ size ได้ดีขึ้น — เห็ดที่หมุน 15° ก็ยังเป็นเห็ด แต่ถ้าใส่ \"หมุน 180°\" ในงานแยก 6 กับ 9 จะทำร้ายโมเดลทันที เพราะ label เปลี่ยน</p>", "ref": "Lesson 4 §7 (สไลด์หน้า 34)", "why_wrong_map": ["การเก็บข้อมูลจริงเพิ่มเป็นทางที่ดีแต่ \"ทำไม่ได้เสมอ\" — augmentation คือทางเลือกเมื่อทำไม่ได้", "", "เป็นเทคนิคของชุดเทรน ไม่ใช่ของชุด test", "ต้องสร้างจากตัวอย่างเดิม ไม่ใช่ข้อมูลที่ไม่เกี่ยวกัน"]}, {"id": "L5-39", "lesson": 5, "topic": "Learning curves & overfitting", "source": "ex3", "type": "concept", "difficulty": "easy", "stem": "จาก history ของ ex3 (ไม่มี regularization): train loss ลดจาก 0.50 เหลือ 0.0025 แต่ val_loss ต่ำสุด 0.29 ที่ epoch 2 แล้วขึ้นไปถึง 0.77 ที่ epoch 20 สรุปได้ว่าอย่างไร?", "options": ["โมเดล overfit: จำข้อมูลเทรนแทนการเรียนรูปแบบทั่วไป หลัง epoch 2", "learning rate สูงเกินไป gradient ระเบิด loss ของเทรนจึงลดลงเร็ว", "validation set มีข้อมูลน้อยเกินไป ค่า val_loss จึงเชื่อถือไม่ได้เลย", "โมเดล underfit: ยังเรียนข้อมูลเทรนไม่พอ ควรเพิ่มจำนวน epoch อีก"], "answer": 0, "explanation": "เส้น loss (train) ลงต่อเนื่องแต่ val_loss หยุดลดแล้วกระดกขึ้น = หน้าตาของ overfitting (เหมือนกราฟ 40 epochs ของ MNIST ที่ val_loss ต่ำสุดที่ epoch 13 = 0.1642). จุดที่ควรหยุดคือ val dam (Lesson 4) เก็บค่าเฉลี่ยเคลื่อนที่ 2 ชุดต่อ<b>ทุก</b>พารามิเตอร์ — \\(m\\) ของ gradient และ \\(v\\) ของ gradient กำลังสอง:</p><p>\\(2 \\times 261 = 522\\) แล้วบวกตัวแปรเดี่ยวอีก 2 ตัว (ตัวนับ step และ learning rate) ⇒ \\(524\\)</p><p>\\(\\text{Total} = 261 + 524 = 785\\). ข้อสรุปสำหรับข้อสอบ: ตัวเลข Optimizer params โผล่เฉพาะตอนโหลดไฟล์ <code>.keras</code> — ถ้าโหลดด้วย <code>load_weights</code> summary จะขึ้น Total 261 เฉยๆ เพราะไม่มีสถานะ optimizer ติดมา</p>", "ref": "Lesson 6 §3 · callbacks notebook load_model", "lesson": 6, "answer": 2, "why_wrong_map": ["261 รวม weight และ bias อยู่แล้ว ไม่มีชุด bias 263 ตัวแยกต่างหาก", "bias นับรวมอยู่ใน 261 แล้ว ตัวแปรที่บวกเพิ่มคือ step counter กับ learning rate", "", "Adam ไม่ได้เก็บ gradient ย้อนหลังเป็น epoch แต่เก็บ moving average m และ v"]}, {"id": "L5-38", "lesson": 5, "topic": "Compile: metric ไม่ต้อง differentiable", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ทำไม accuracy ใช้เป็น <code>metrics</code> ได้ แต่ไม่นิยมใช้เป็น loss ที่ optimize?", "options": ["accuracy ใช้ได้กับ validation set เท่านั้น จึงเอามาเทรนโมเดลไม่ได้เลย", "loss ต้องมีค่าระหว่าง 0 ถึง 1 เสมอ ขณะที่ accuracy อาจเกินช่วงนี้ได้", "metric ต้องหาอนุพันธ์ได้เหมือน loss แต่ accuracy คำนวณได้ช้าเกินไปมาก", "metric ไม่ได้ถูก optimize จึงไม่ต้องหาอนุพันธ์ได้ แต่ loss ต้องใช้ใน backprop"], "answer": 3, "explanation": "สไลด์หน้า 30: loss = <i>the quantity to be minimized during training</i>; optimizer = วิธีอัปเดตตาม loss; metrics = <i>measures of success to be monitored</i> ซึ่ง <i>doesn't need to be differentiable</i>. accuracy เป็นฟังก์ชันขั้นบันได อนุพันธ์ = 0 เกือบทุกจุด backprop จึงใช้ไม่ได้.", "ref": "Lesson 5 §5.9 (สไลด์หน้า 30)", "why_wrong_map": ["accuracy ดูได้ทั้ง train และ val", "loss ไม่จำเป็นต้องอยู่ใน [0,1] (เช่น MSE) และ accuracy อยู่ใน [0,1] เสมอ", "กลับด้าน: metric ไม่ต้อง differentiable", ""]}, {"id": "L4-56", "lesson": 4, "topic": "โค้ด: kernel_regularizer vs kernel_constraint", "source": "lesson", "type": "code", "difficulty": "medium", "stem": "จากโค้ดสองชิ้นบนสไลด์หน้า 27 ข้อใดอธิบายความต่างของสองช่องนี้ได้ถูกต้อง?", "code": "keras.layers.Dense(100, activation=\"elu\",\n                   kernel_initializer=\"he_normal\",\n                   kernel_regularizer=keras.regularizers.l2(0.01))\n\nkeras.layers.Dense(100, activation=\"elu\", kernel_initializer=\"he_normal\",\n                   kernel_constraint=keras.constraints.max_norm(1.))", "options": ["ทั้งสองช่องเพิ่มเทอมลงโทษ \\(\\lambda\\sum w^2\\) เข้าไปใน cost เหมือนกันทุกประการ ต่างกันแค่ชื่อเรียก จึงใส่พร้อมกันในบรรทัดเดียวไม่ได้", "kernel_constraint เพิ่มเทอม \\(\\lambda\\sum w^2\\) เข้าไปใน cost ส่วน kernel_regularizer rescale \\(w\\) หลังทุก training step และการ <b>ลด</b> \\(r\\) ทำให้ regularize แรงขึ้น", "kernel_regularizer เพิ่มเทอม \\(\\lambda\\sum w^2\\) เข้าไปใน cost ส่วน kernel_constraint rescale \\(w\\) หลังทุก training step และการ <b>เพิ่ม</b> \\(r\\) ทำให้ regularize แรงขึ้น", "kernel_regularizer เพิ่มเทอม \\(\\lambda\\sum w^2\\) เข้าไปใน cost ส่วน kernel_constraint rescale \\(w\\) หลังทุก training step และการ <b>ลด</b> \\(r\\) ทำให้ regularize แรงขึ้น"], "answer": 3, "explanation": "สองช่องนี้ทำงานคนละกลไก จึงใส่พร้อมกันในบรรทัดเดียวได้:<br><b>kernel_regularizer=keras.regularizers.l2(0.01)</b> — เพิ่มเทอม \\(\\lambda\\sum w^2\\) (\\(\\lambda=0.01\\)) เข้าไปใน cost ผลคือ loss ที่รายงานจะสูงกว่า loss จริงของข้อมูล (คำว่า kernel ใน Keras คือเมทริกซ์ weight ไม่รวม bias)<br><b>kernel_constraint=keras.constraints.max_norm(1.)</b> — ไม่แตะ cost เลย แต่หลังทุก training step จะคำนวณ \\(\\|w\\|_2\\) ของแต่ละ neuron แล้ว rescale ด้วย \\(r/\\|w\\|_2 \\le 1\\) ถ้ามันเกิน \\(r\\)<br>ทิศทางที่สลับกันง่ายที่สุดในข้อสอบ: \\(\\lambda\\) ของ L2 ต้อง <b>เพิ่ม</b> เพื่อให้แรงขึ้น แต่ \\(r\\) ของ max-norm ต้อง <b>ลด</b> (เช่นจาก 1. เหลือ 0.5) เพื่อให้แรงขึ้น เพราะกรอบแคบลง", "ref": "Lesson 4 §6.1 (สไลด์หน้า 27)", "why_wrong_map": ["max-norm ไม่เพิ่มเทอมใน cost และทั้งสองช่องใส่พร้อมกันได้ เพราะทำงานคนละกลไก", "สลับชื่อสองช่อง — เทอมใน cost มาจาก kernel_regularizer ส่วน kernel_constraint คือข้อจำกัดหลัง step", "สลับทิศของ \\(r\\) — สไลด์บรรทัดสุดท้ายระบุว่าลด \\(r\\) แล้ว regularization แรงขึ้น", ""]}, {"id": "L3-28", "lesson": 3, "topic": "Train/Validation/Test", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดถูกต้องเกี่ยวกับการแบ่งข้อมูลเป็น training / validation / test?", "options": ["สัดส่วน 80-20; ใช้ test เลือก architecture/λ; แต่ละชุดควรมาจาก distribution ที่ต่างกัน", "สัดส่วน 60-20-20; ใช้ validation เลือก architecture/λ; ทุกชุดมาจาก distribution เดียวกัน", "สัดส่วน 70-15-15; ใช้ training เลือก architecture/λ; test ใช้ปรับ θ ในรอบสุดท้าย", "สัดส่วน 60-20-20; ใช้ test set เลือก architecture/λ; ทุกชุดต้องมีจำนวนตัวอย่างเท่ากันเป๊ะ"], "answer": 1, "explanation": "เป้าหมายคือวัดผลบน <b>unseen examples</b>. สัดส่วนที่ใช้บ่อยคือ 60-20-20 หรือ 70-15-15 (80-20 / 70-30 เป็นแบบ train/test + cross validation). training ปรับ θ; validation ใช้เปรียบเทียบ architecture ต่าง ๆ (#hidden units, #layer, lambda…); test รายงานผลครั้งเดียว. และทุกชุดต้องมาจาก <b>same distribution</b> เพื่อป้องกัน data leakage.", "ref": "Lesson 3 §6A Model Evaluation (p.39)", "why_wrong_map": ["80-20 เป็นแบบ train/test และ test ห้ามใช้ตัดสินใจ", "", "training ใช้ปรับ θ ไม่ใช่เลือก architecture และ test ห้ามใช้ปรับ θ", "test ห้ามใช้เลือก hyperparameter และไม่จำเป็นต้องมีขนาดเท่ากัน"]}, {"id": "L5-24", "lesson": 5, "topic": "BN เป็น regularizer", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ทำไมสไลด์หน้า 17 จึงบอกว่า BN ให้ผล <b>regularization</b> มาด้วย?", "options": ["สถิติจาก mini-batch เล็กแกว่งแบบสุ่ม ทำหน้าที่เหมือน noise ตอนเทรน", "BN สุ่มปิด node บางส่วนในแต่ละ step เหมือนกับ dropout ทุกประการ", "moving average ทำให้ loss ตอน test ต่ำกว่าตอนเทรนเสมอทุกกรณี", "γ และ β บีบขนาดของ weight ให้เล็กลงทุก step เหมือนการใช้ L2"], "answer": 0, "explanation": "เมื่อทำงานกับ <i>a small batch of instances</i> สถิติ \\(\\mu_B,\\sigma_B\\) จะ <i>unreliable (stochastic properties)</i> — ความแกว่งนี้เหมือนใส่ noise กันการจำข้อมูลเทรน. แต่ถ้า batch เล็กเกิน (เช่น 2 ⇒ \\(z_{norm}=[-1,+1]\\) เสมอ) BN ก็ทำงานแย่ลงจริง.", "ref": "Lesson 5 §3.5 (สไลด์หน้า 17)", "why_wrong_map": ["", "BN ไม่ได้ปิด node — นั่นคือ dropout", "ไม่มีข้อความนี้บนสไลด์ และไม่จริงเสมอ", "γ, β ไม่ได้ลงโทษขนาด weight"]}, {"id": "L1-50", "lesson": 1, "topic": "ทำไม DL ทรงพลัง (scale + representation learning)", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "เหตุผลสองข้อที่ทำให้ deep learning ทรงพลังกว่า machine learning แบบดั้งเดิมคือข้อใด?", "options": ["Scale for complex tasks (non-linear boundary และ feature จำนวนมาก) และต้องให้ผู้เชี่ยวชาญออกแบบ feature ให้ครบก่อนเข้าโมเดลเสมอ", "เหมาะกับข้อมูลตารางขนาดเล็กที่มี feature ไม่กี่คอลัมน์ และ automate feature engineering คือเรียน feature เองจากข้อมูล", "รับประกันว่าเจอ global minimum ของ cost เสมอ และใช้ cost function คนละชนิดกับ machine learning แบบดั้งเดิมโดยสิ้นเชิง", "Scale for complex tasks (non-linear boundary และ feature จำนวนมาก) และ automate feature engineering คือเรียน feature เองจากข้อมูล"], "answer": 3, "explanation": "ข้อแรก <b>Scale for complex tasks</b>: งานที่ต้องการ complex non-linear decision boundary และงานที่มี input feature จำนวนมาก — เช่นภาพสี RGB 100×100 มี \\(100\\times100\\times3=30{,}000\\) feature ต่อหนึ่งภาพ. ข้อที่สอง <b>Automate feature engineering (representation learning)</b>: เรียน feature จากข้อมูลเองโดยไม่ต้องมีคนออกแบบให้ ซึ่งเป็นเหตุผลที่ DL จัดการ unstructured data (ภาพ เสียง ข้อความ) ได้ดี. ML แบบดั้งเดิมต้องมีขั้น feature extraction ที่คนทำก่อนเข้าตัวจำแนก ส่วน DL รวมขั้นนั้นไว้ในโครงข่ายเดียวกัน.", "ref": "Lesson 1 §1 (p.12–13)", "why_wrong_map": ["กลับด้านข้อที่สอง — จุดเด่นคือเรียน feature เองโดยไม่ต้องมีคนออกแบบ", "DL ได้เปรียบที่สุดกับ unstructured data (ภาพ เสียง ข้อความ) ไม่ใช่ตารางเล็ก ๆ", "DL ไม่รับประกัน global minimum และใช้ cost function ชุดเดียวกัน (MSE / log loss)", ""]}, {"id": "L6-50", "topic": "จับคู่เครื่องมือกัน overfitting กับปุ่มที่ต้องจูน", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามสไลด์หน้า 23 ข้อใดจับคู่ \"เครื่องมือกัน overfitting → ปุ่มที่ต้องจูน\" ได้ถูกต้องทั้งสามคู่", "options": ["L2 regularization → lambda, Dropout layers → จำนวน unit ต่อชั้น, Data augmentation → learning rate", "L2 regularization → learning rate, Dropout layers → dropout rate, Data augmentation → จำนวน epoch", "L2 regularization → lambda, Dropout layers → dropout rate, Data augmentation → random transformations", "L2 regularization → dropout rate, Dropout layers → lambda, Data augmentation → ขนาดของ mini-batch"], "explanation": "<p>หน้า 23 เขียนทุกบรรทัดในรูปแบบ \"เครื่องมือ → ปุ่มของมัน\":</p><ul><li>L2 regularization → <mark class=\"src\" data-p=\"23\">regularization parameter (lambda)</mark> คือ \\(\\lambda\\) ในพจน์โทษ \\(\\frac{\\lambda}{2m}\\sum\\theta^2\\)</li><li>Dropout layers → <mark class=\"src\" data-p=\"23\">dropout rate</mark> = สัดส่วน unit ที่ถูกปิดสุ่มในแต่ละก้าว</li><li>Batch normalization → <mark class=\"src\" data-p=\"23\">mini-batch size</mark> หรือ momentum parameter</li><li>Data augmentation → <mark class=\"src\" data-p=\"23\">random transformations metrics</mark> (หมุนกี่องศา ซูมเท่าไร พลิกไหม)</li></ul><p>สังเกตว่า Batch Normalization โผล่ทั้งหน้า 20, 22 และ 23 — มันมีสองบทบาท แต่สไลด์จัดหมวดให้อยู่ Learning and optimization</p>", "ref": "Lesson 6 §8 (สไลด์หน้า 23)", "lesson": 6, "answer": 2, "why_wrong_map": ["ปุ่มของ dropout คืออัตราการปิด ไม่ใช่จำนวน unit และ data augmentation ไม่ได้จูน learning rate", "\\(\\lambda\\) ต่างหากที่เป็นปุ่มของ L2 ส่วนจำนวน epoch ไม่ใช่ปุ่มของ data augmentation", "", "สลับปุ่มของ L2 กับ dropout และ mini-batch size เป็นปุ่มของ batch normalization ไม่ใช่ data augmentation"]}, {"id": "L2-41", "lesson": 2, "topic": "output gate ที่ทำให้โครงข่ายตอบค่าคงที่", "source": "lesson", "type": "concept", "difficulty": "hard", "stem": "โครงข่าย 2 ชั้น (sigmoid): \\(a_1^{[1]}=g(-30+20x_1+20x_2)\\) (AND), \\(a_2^{[1]}=g(10-20x_1-20x_2)\\) (NOR) และ output \\(h=g(-30+20a_1^{[1]}+20a_2^{[1]})\\) (AND ของสอง hidden) โครงข่ายนี้ให้ผลอย่างไร?", "options": ["ให้ค่า \\(\\approx1\\) ทุกกรณี เพราะ AND ของ hidden ทำให้ผ่านด่านง่ายขึ้น", "ให้ผลเป็น AND ของ \\(x_1\\) กับ \\(x_2\\) เพราะ output node เป็น AND แล้ว", "ให้ค่า \\(\\approx0\\) ทุกกรณี เพราะ hidden สองตัวไม่มีวันเป็น 1 พร้อมกัน", "ให้ผลเป็น XOR พอดี เพราะการเปลี่ยน gate ทำให้คำตอบกลับด้านทุกแถว"], "answer": 2, "explanation": "<p>ดู hidden ทีละตัว: \\(a_1^{[1]}\\) (AND) เป็น 1 <b>เฉพาะ</b> \\((1,1)\\) ส่วน \\(a_2^{[1]}\\) (NOR) เป็น 1 <b>เฉพาะ</b> \\((0,0)\\) — เงื่อนไขทั้งสองขัดกันเอง จึงไม่มี input ใดที่ทำให้ทั้งคู่เป็น 1 พร้อมกัน</p>\n<p>AND ที่ output ต้องการ \\(z^{[2]} = -30+20a_1+20a_2 \\ge 0\\) ซึ่งต้องให้ \\(a_1=a_2=1\\) ⇒ เป็นไปไม่ได้ ⇒ \\(z^{[2]} \\le -10\\) เสมอ ⇒ \\(h\\approx0\\) ทุกกรณี</p>\n<p>ถ้าเปลี่ยน output เป็น OR \\((-10,20,20)\\) จะได้ XNOR \\([1,0,0,1]\\) — โครงสร้างเหมือนเดิมทุกอย่าง แต่ <b>ชั้นรวมผล (output) สำคัญพอ ๆ กับ hidden</b></p>", "ref": "Lesson 2 §7 กล่องกลไก (Lecture2.pdf p.47)", "why_wrong_map": ["AND เข้มงวดกว่า OR ไม่ใช่ง่ายกว่า — ด่านอยู่ที่ \\(-30\\)", "output node ทำ AND กับ \\(a^{[1]}\\) ไม่ใช่กับ \\(x_1,x_2\\) โดยตรง", "", "XOR คือ \\([0,1,1,0]\\) ซึ่งต้องใช้ hidden คนละชุด"]}, {"id": "L2-24", "lesson": 2, "topic": "Euclidean distance", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ระยะห่างแบบ Euclidean ระหว่าง \\(a=[2,-1,4]\\) กับ \\(b=[5,3,4]\\) เท่ากับเท่าใด?", "options": ["25.00", "7.00", "5.00", "7.07"], "answer": 2, "explanation": "<ol><li>เวกเตอร์ผลต่าง: \\(b-a = [3,\\ 4,\\ 0]\\)</li>\n<li>ยกกำลังสองแล้วบวก: \\(9+16+0 = 25\\)</li>\n<li>ถอดราก: \\(d = \\sqrt{25} = 5\\)</li></ol>\n<p>Euclidean distance คือ “ขนาดของเวกเตอร์ผลต่าง” \\(d(a,b)=\\|b-a\\|\\) และ \\(d(a,b)=d(b,a)\\) เพราะการยกกำลังสองทำให้เครื่องหมายลบหายไป</p>\n<p>ข้อสังเกต: ช่องที่สาม (4 กับ 4) เท่ากันจึงไม่ส่งผลต่อระยะเลย — feature ที่มีค่าเหมือนกันไม่ช่วยแยกสองตัวอย่าง</p>", "ref": "Lesson 2 §5A (Lecture2.pdf p.25)", "why_wrong_map": ["ลืมถอดรากที่สองในขั้นสุดท้าย (25 คือผลรวมกำลังสอง)", "บวกค่าสัมบูรณ์ของผลต่างตรง ๆ (3+4+0=7) ซึ่งเป็นระยะแบบ Manhattan", "", "คิดขนาดของ \\(b\\) เอง (\\(\\sqrt{25+9+16}=\\sqrt{50}\\approx7.07\\)) แทนที่จะใช้เวกเตอร์ผลต่าง"]}, {"id": "L1-09", "lesson": 1, "topic": "Linear regression hypothesis", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "ให้ \\(h_\\theta(x)=\\theta_0+\\theta_1x_1+\\theta_2x_2\\) โดย \\(\\theta_0=10,\\ \\theta_1=2,\\ \\theta_2=5\\) และ \\(x_1=3,\\ x_2=4\\) ค่าทำนายคือเท่าใด?", "options": ["36", "31", "33", "26"], "answer": 0, "explanation": "แทนค่าทีละเทอม: \\(10 + 2(3) + 5(4) = 10 + 6 + 20 = 36\\). เขียนรูปรวมได้ว่า \\(h_\\theta(x)=\\sum_{i=0}^{n}\\theta_ix_i\\) โดยกำหนด \\(x_0=1\\) ทำให้ \\(\\theta_0x_0=\\theta_0\\) (ถ้า \\(x_0=0\\) เทอม intercept จะหายไป).", "ref": "Lesson 1 §2 (p.28)", "why_wrong_map": ["", "จับคู่ \\(\\theta_2\\) กับ \\(x_1\\): 10 + 6 + 15 = 31", "สลับค่า x: 10 + 2(4) + 5(3) = 33", "ลืม \\(\\theta_0=10\\) (เหมือนตั้ง \\(x_0=0\\))"]}, {"id": "L3-52", "lesson": 3, "topic": "Output range ของ activation", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ช่วงค่า output (output range) ของ activation ทั้งสี่ตัว ข้อใดถูกต้องครบทุกตัว?", "options": ["Sigmoid [0,1] · Tanh [−1,1] · ReLU [−∞,∞] · Leaky ReLU [0,∞]", "Sigmoid [−1,1] · Tanh [0,1] · ReLU [0,∞] · Leaky ReLU [−∞,∞]", "Sigmoid [0,1] · Tanh [−1,1] · ReLU [0,1] · Leaky ReLU [−1,1]", "Sigmoid [0,1] · Tanh [−1,1] · ReLU [0,∞] · Leaky ReLU [−∞,∞]"], "answer": 3, "explanation": "อ่านจากรูปฟังก์ชันได้เลยโดยไม่ต้องท่อง: sigmoid บีบเป็น \\([0,1]\\); tanh บีบเป็น \\([-1,1]\\) (จึง zero-centered); ReLU ตัดฝั่งลบทิ้งแต่ฝั่งบวกปล่อยผ่านไม่จำกัด ⇒ \\([0,\\infty]\\); Leaky ReLU ให้ฝั่งลบเป็น \\(0.01x\\) ซึ่งก็ไม่มีขอบล่าง ⇒ \\([-\\infty,\\infty]\\). ข้อเสีย \"output can be Infinite\" จึงเป็นของทั้ง ReLU และ Leaky ReLU.", "ref": "Lesson 3 §5B.3 ตารางหน้า 32", "why_wrong_map": ["สลับช่วงของ ReLU กับ Leaky ReLU — ReLU ไม่มีค่าติดลบ", "สลับช่วงของ sigmoid กับ tanh — sigmoid ไม่ให้ค่าลบ", "ReLU และ Leaky ReLU ไม่มีขอบบน จึงไม่ใช่ [0,1] หรือ [−1,1]", ""]}, {"id": "L2-29", "lesson": 2, "topic": "สมบัติการคูณเมทริกซ์และ identity", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดกล่าวถูกต้องเกี่ยวกับสมบัติของการคูณเมทริกซ์และ identity matrix?", "options": ["การบวกเมทริกซ์ต้องการแค่มิติในตรงกัน ส่วนการคูณต้องการขนาดเท่ากันทุกมิติ", "โดยทั่วไป \\(AB = BA\\) แต่ \\(A(BC)\\ne(AB)C\\) และ \\(A\\times I\\) ให้ผลเป็น \\(I\\) เสมอ", "identity matrix คือเมทริกซ์จัตุรัสที่ทุกช่องมีค่าเท่ากับ 1 ทั้งเมทริกซ์", "โดยทั่วไป \\(AB\\ne BA\\) แต่ \\(A(BC)=(AB)C\\) และ \\(A\\times I = I\\times A = A\\) เสมอ"], "answer": 3, "explanation": "<p>สรุปสามสมบัติที่ต้องแยกให้ออก:</p>\n<ul><li><b>Commutative ใช้ไม่ได้</b>: \\(\\begin{bmatrix}2&1\\\\0&3\\end{bmatrix}\\begin{bmatrix}1&2\\\\1&0\\end{bmatrix}=\\begin{bmatrix}3&4\\\\3&0\\end{bmatrix}\\) แต่สลับลำดับได้ \\(\\begin{bmatrix}2&7\\\\2&1\\end{bmatrix}\\)</li>\n<li><b>Associative ใช้ได้</b>: \\(A(BC)=(AB)C\\) จับคู่คูณก่อนหลังได้ตามสะดวก ขอแค่ไม่สลับซ้ายขวา — เป็นเหตุผลที่เขียน forward computation ต่อกันเป็นทอด ๆ ได้</li>\n<li><b>Identity</b>: เมทริกซ์จัตุรัสที่เส้นทแยงมุมเป็น 1 ที่เหลือเป็น 0 และ \\(AI = IA = A\\) (ขนาดของ \\(I\\) สองข้างอาจต่างกันถ้า \\(A\\) ไม่จัตุรัส)</li></ul>\n<p>ส่วนการบวกต้องมีขนาด \\(m\\times n\\) เท่ากันเป๊ะ ขณะที่การคูณขอแค่ “มิติในตรงกัน”</p>", "ref": "Lesson 2 §5B (Lecture2.pdf p.29, 35, 37)", "why_wrong_map": ["สลับเงื่อนไขของการบวกกับการคูณ", "สลับสองสมบัติกัน — ที่สลับที่ไม่ได้คือการคูณ ที่เปลี่ยนหมู่ได้ก็คือการคูณ", "identity มี 1 เฉพาะบนเส้นทแยงมุม ช่องอื่นเป็น 0", ""]}, {"id": "L5-48", "lesson": 5, "topic": "IMDB predict: threshold 0.5", "source": "ex3", "type": "code", "difficulty": "hard", "stem": "<code>pred_reg = model_reg.predict(Xtest[0:1])</code> ได้ shape (1, 1) มีค่า 0.3036 วิธีใดแปลงเป็น class ได้ถูกต้องและได้คำตอบใด?", "options": ["int(pred_reg[0][0] > 0.5) ได้ class 0 (negative)", "round(pred_reg[0][0] * 10) ได้ class 3 ตามดัชนี", "int(pred_reg[0][0] > 0.5) ได้ class 1 (positive)", "np.argmax(pred_reg) ได้ class ที่ถูกเหมือน MNIST"], "answer": 0, "explanation": "output sigmoid 1 node = P(positive) ⇒ ต้องเทียบ threshold: 0.3036 &gt; 0.5 เป็น False ⇒ 0 = negative (ตรงกับ Actual label 0). <code>np.argmax</code> บน (1, 1) คืน 0 <b>เสมอ</b>ไม่ว่าความน่าจะเป็นเท่าไร จึงใช้ไม่ได้กับ binary 1 node — argmax ใช้กับ softmax หลายคลาสแบบ MNIST.", "ref": "ex3 cell (4) Regularization — make a prediction", "why_wrong_map": ["", "ไม่มีหลักการนี้ — output คือความน่าจะเป็น", "อ่าน threshold กลับด้าน", "argmax บนค่าเดียวได้ 0 เสมอ ไม่มีความหมาย"]}, {"id": "L4-60", "lesson": 4, "topic": "ex2: การแบ่งข้อมูลและผล baseline", "source": "ex2", "type": "code", "difficulty": "medium", "stem": "จากการแบ่งข้อมูลและผล baseline ของ ex2 (ยังไม่ใส่ regularization และ dropout) ข้อใดถูกต้อง?", "code": "df = pd.read_csv(\"circle.csv\")   # df.shape -> (250, 3)\nX     = data[0:150, 0:2];   y     = data[0:150, 2]\nXval  = data[150:200, 0:2]; yval  = data[150:200, 2]\nXtest = data[200:250, 0:2]; ytest = data[200:250, 2]\n\n# Train Set Accuracy: 86.000000\n# Validation Set Accuracy: 80.000000\n# Test Set Accuracy: 82.000000", "options": ["แบ่งเป็น train 150 / validation 50 / test 50 จาก 250 แถว และ train สูงกว่า validation 6 จุด = overfit เล็กน้อย", "แบ่งเป็น train 150 / validation 100 / test 100 จาก 350 แถว และ validation สูงกว่า test 6 จุด = ข้อมูลรั่วไหล", "แบ่งเป็น train 200 / validation 25 / test 25 จาก 250 แถว และความแม่นยำทั้งสามชุดเท่ากัน = ไม่มี overfit เลย", "แบ่งเป็น train 150 / validation 50 / test 50 จาก 250 แถว และ train ต่ำกว่า validation 6 จุด = underfit อย่างชัดเจน"], "answer": 0, "explanation": "df.shape คือ (250, 3) และการสไลซ์แบ่งเป็นสามช่วงติดกัน: 0–149 (150 แถว), 150–199 (50 แถว), 200–249 (50 แถว)<br>ผล baseline: train 86%, validation 80%, test 82% ⇒ ช่องว่าง train − val \\(= 86-80 = 6\\) จุด<br>อ่านตามเกณฑ์หน้า 30 (เทียบ training กับ validation): training ดีกว่า validation อยู่บ้าง = ยัง overfit เล็กน้อย จึงมีที่ให้ regularization/dropout เข้ามาช่วย — และช่วยได้จริง (L2 \\(\\lambda=0.03\\) ดันผล test จาก 82% เป็น 88%)<br>ข้อควรระวัง: test set มีแค่ 50 ตัวอย่าง ⇒ ต่างกัน 1 ตัวอย่างคือ 2% ตัวเลขระดับ 2 จุดจึงไม่ใช่ความต่างที่หนักแน่น", "ref": "ex2 cells (20)-(21) และ Evaluation (30)-(32)", "why_wrong_map": ["", "ข้อมูลมี 250 แถว ไม่ใช่ 350 และ validation ได้ 80% ซึ่งต่ำกว่า test ที่ได้ 82%", "การสไลซ์ระบุขอบเขต 150/200/250 ชัดเจน และตัวเลขทั้งสามชุด (86/80/82) ไม่เท่ากัน", "กลับทิศ: 86% (train) สูงกว่า 80% (validation) ไม่ใช่ต่ำกว่า และ underfit คือกรณีที่ทั้งคู่แย่พอ ๆ กัน"]}, {"id": "L4-24", "lesson": 4, "topic": "RMSProp", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "พารามิเตอร์ที่มี gradient ขนาดใหญ่ต่อเนื่องหลาย iteration จะเกิดอะไรขึ้นกับ effective learning rate ของมันใน RMSProp?", "options": ["เพิ่มขึ้น เพราะ RMSProp ต้องการเร่งให้พารามิเตอร์ที่มี gradient ใหญ่ต่อเนื่องเปลี่ยนค่าได้เร็วยิ่งขึ้นไปอีกในทุก step", "ลดลง เพราะ \\(s_i\\) ซึ่งเป็นค่าเฉลี่ยของ gradient กำลังสองสูงขึ้น ตัวหาร \\(\\sqrt{s_i+\\epsilon}\\) จึงใหญ่ตาม", "หยุดอัปเดตทันที เพื่อกันไม่ให้ gradient ที่ใหญ่ผิดปกติทำให้การเทรนทั้งหมดไม่เสถียรจนล้มเหลว", "ไม่เปลี่ยนเลย เพราะ RMSProp ใช้ค่า \\(\\alpha\\) ค่าเดียวเท่ากันหมดทุกพารามิเตอร์ตลอดการเทรน"], "answer": 1, "explanation": "<p>สูตร: \\(s_i := \\rho s_i + (1-\\rho)g_i^2\\) แล้ว \\(\\theta_i := \\theta_i - \\alpha\\,g_i/\\sqrt{s_i+\\epsilon}\\)</p><p>ตัวอย่างตัวเลขของบทนี้: A มี \\(g=10\\), B มี \\(g=0.1\\) ⇒ \\(s_A=0.1(100)=10\\), \\(s_B=0.1(0.01)=0.001\\) ⇒ ก้าวของทั้งคู่ \\(=0.001\\times g/\\sqrt{s} = 0.00316\\) เท่ากันเป๊ะ ทั้งที่ gradient ต่างกัน 100 เท่า</p><p>เมื่อเทรนไปนาน ๆ \\(s\\to g^2\\) ทำให้ \\(g/\\sqrt{s}\\to 1\\) — ขนาดก้าวไม่ขึ้นกับขนาด gradient อีกต่อไป เหลือแต่ทิศ</p>", "ref": "Lesson 4 §5.1 (สไลด์หน้า 21)", "why_wrong_map": ["กลับทิศจากสไลด์ (gradient ใหญ่ ⇒ หด ไม่ใช่ขยาย)", "", "ไม่มีการหยุดอัปเดต มีแต่การหารด้วยรากของค่าเฉลี่ยกำลังสอง", "\\(\\alpha\\) เท่ากันจริง แต่ <i>effective</i> learning rate \\(\\alpha/\\sqrt{s_i}\\) ต่างกันรายตัว"]}, {"id": "L3-33", "lesson": 3, "topic": "Parameter vs Hyperparameter", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดเป็น parameter (ไม่ใช่ hyperparameter) ของ neural network?", "options": ["lambda (λ) ที่ควบคุมความแรงของ regularization ในสูตร cost", "จำนวน iteration ที่ใช้ในการเทรนเครือข่ายทั้งหมดจนจบการเทรน", "weight θ ที่สุ่มค่าเริ่มต้นแล้วเรียนรู้เองด้วย gradient descent", "learning rate α ที่กำหนดขนาดก้าวของ gradient descent แต่ละรอบ"], "answer": 2, "explanation": "Parameter = \\(\\theta\\) (initialized randomly แล้วโมเดลเรียนเอง). Hyperparameter = \"a parameter that control θ\" ที่เราตั้งเองก่อนเทรน เช่น <b>learning rate α</b>, <b>#layer, #hidden units</b>, lambda, keep_prob, activation functions, #iterations — ไม่มีตัวไหนถูกอัปเดตโดย gradient descent.", "ref": "Lesson 3 §7A (p.45)", "why_wrong_map": ["λ เป็น hyperparameter", "#iterations เป็น hyperparameter", "", "α เป็น hyperparameter ที่เราตั้งเอง"]}, {"id": "L2-25", "lesson": 2, "topic": "Dot product vs element-wise", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "โค้ดต่อไปนี้พิมพ์อะไรออกมาตามลำดับ?", "code": "import numpy as np\nx = np.array([2,0,1])\ny = np.array([1,3,4])\nprint(np.dot(x,y))\nprint(x*y)", "options": ["[2 0 4] แล้ว [2 0 4]", "6 แล้ว [2 0 4]", "[2 0 4] แล้ว 6", "6 แล้ว 6 ทั้งคู่"], "answer": 1, "explanation": "<ul><li><code>np.dot(x,y)</code> = \\(2(1)+0(3)+1(4) = 2+0+4 = 6\\) ⇒ ผลเป็น <b>สเกลาร์</b> ตัวเดียว</li>\n<li><code>x*y</code> = คูณทีละช่อง (element-wise) ⇒ <code>[2 0 4]</code> ซึ่งยังเป็น array 3 ช่อง</li></ul>\n<p>ความต่างนี้สำคัญมาก: \\(z = \\theta_0x_0+\\theta_1x_1+\\theta_2x_2\\) ของทุก node คือ dot product (ยุบเป็นค่าเดียว) ไม่ใช่ element-wise. และ <code>np.dot(x,y)</code> กับ <code>x.dot(y)</code> ให้ผลเหมือนกันทุกประการ</p>", "ref": "Lesson 2 §5A (Lecture2.pdf p.26)", "why_wrong_map": ["np.dot ยุบผลรวมเป็นค่าเดียว ไม่ได้คืน array", "", "สลับผลของสองคำสั่ง — dot ให้สเกลาร์ ส่วน * ให้ array", "x*y ไม่ได้รวมผลคูณ จึงไม่ใช่ 6"]}, {"id": "L2-48", "lesson": 2, "topic": "computeCost เวอร์ชัน for loop: X.shape[0] / X.shape[1]", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "ในฟังก์ชัน <code>computeCost</code> เวอร์ชัน for loop ด้านล่าง ตัวแปร <code>m</code> และ <code>n</code> คืออะไรตามลำดับ (X มีคอลัมน์แรกเป็น \\(x_0=1\\))?", "code": "def computeCost(X, y, theta):\n  J = 0\n  m = X.shape[0]\n  n = X.shape[1]\n  error = np.zeros(m)\n\n  for i in range(m):\n    h = 0\n    for j in range(n):\n      h = h + X[i,j] * theta[j]\n    error[i] = h - y[i]\n\n  J = (1/(m)) * np.sum(np.square(error))\n  return J", "options": ["m = จำนวน feature ที่ไม่รวม \\(x_0\\), n = จำนวนพารามิเตอร์ทั้งหมดของ \\(\\theta\\) ที่ต้องเรียน", "m = จำนวนแถว = จำนวน training example, n = จำนวนคอลัมน์ = จำนวน feature รวม \\(x_0\\)", "m = จำนวนแถว = จำนวน training example, n = จำนวน iteration ของ gradient descent ที่ตั้งไว้", "m = จำนวนคอลัมน์ = จำนวน feature รวม \\(x_0\\), n = จำนวนแถว = จำนวน training example"], "answer": 1, "explanation": "<p><code>.shape</code> คืนรูปร่างเป็น tuple ตามกฎ “แถวก่อน คอลัมน์หลัง” ดังนั้น <code>X.shape[0]</code> = จำนวนแถว และ <code>X.shape[1]</code> = จำนวนคอลัมน์</p>\n<p>1 แถว = 1 training example และ 1 คอลัมน์ = 1 feature โดยคอลัมน์แรกคือ \\(x_0=1\\) ⇒ \\(m\\) = จำนวนตัวอย่าง, \\(n = n_{\\text{feature}}+1\\) (รวม bias)</p>\n<p>ดูการใช้งานเป็นหลักฐาน: ลูปนอก <code>for i in range(m)</code> ไล่ทีละตัวอย่าง ลูปใน <code>for j in range(n)</code> ไล่ทีละ feature เพื่อสะสม \\(h=\\sum_j \\theta_j x_j\\) (dot product ที่เขียนมือ) และ <code>error = np.zeros(m)</code> จองที่เก็บค่าคลาดเคลื่อนหนึ่งช่องต่อหนึ่งตัวอย่าง — ลูปสองชั้นนี้ทำงาน \\(m\\times n\\) รอบ จึงควรแปลงเป็น <code>np.dot(X, theta)</code></p>", "ref": "Lesson 2 §6 (Lecture2.pdf p.42)", "why_wrong_map": ["<code>X.shape</code> ไม่ได้บอกจำนวน feature ที่หัก \\(x_0\\) ออก และ \\(m\\) คือจำนวนตัวอย่าง ไม่ใช่ feature", "", "จำนวน iteration เป็นอาร์กิวเมนต์ <code>num_iters</code> ของ gradientDescent ไม่ได้อ่านจาก <code>X.shape</code>", "สลับสอง index กัน — <code>shape[0]</code> คือแถวเสมอ ไม่ใช่คอลัมน์"]}, {"id": "L3-03", "lesson": 3, "topic": "Parameter learning: nonconvex / local optima", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "cost function ของ neural network เป็น nonconvex ข้อใดสรุปผลต่อการเทรนได้ถูกต้อง?", "options": ["cost ของ NN เป็น nonconvex จึงต้องตั้ง weight เริ่มต้นเป็นศูนย์ทุกตัวเพื่อให้ได้ global", "cost ของ NN เป็น nonconvex ทำให้ gradient descent เทรนเครือข่ายไม่สำเร็จในทางปฏิบัติจริง", "cost ของ NN ไม่ใช่ชามใบเดียว อาจติด local minimum แต่ในทางปฏิบัติพบยากและมักใกล้ global", "cost ของ NN เป็น convex เหมือน logistic regression จึงไม่มีปัญหา local minimum เลยแม้แต่น้อย"], "answer": 2, "explanation": "พื้นผิว cost ของ NN มีหลายหุบ (nonconvex) gradient descent จึงอาจตกหุบเล็ก (local optimum) — และนี่คือเหตุผลที่เทรนสองครั้งได้ weight คนละชุด. แต่ในทางปฏิบัติ <i>\"this is rather rare in practice and usually fairly close to the global optimum\"</i> ⇒ เป็นปัญหาทางทฤษฎีมากกว่าปัญหาร้ายแรงในการใช้งานจริง.", "ref": "Lesson 3 §0 Parameter Learning (p.2)", "why_wrong_map": ["ตั้งศูนย์ทุกตัวทำให้เกิด symmetry (redundant hidden units) ไม่ได้ช่วยหา global", "เกินจริง — ในทางปฏิบัติ gradient descent ยังเทรน NN ได้ดี", "", "convex เป็นสมบัติของ linear/logistic regression ไม่ใช่ NN"]}, {"id": "L3-36", "lesson": 3, "topic": "sigmoidGradient", "source": "ex_shallow_nn", "type": "code", "difficulty": "easy", "stem": "เรียก <code>sigmoidGradient(0)</code> จากโค้ดด้านล่าง จะได้ค่าเท่าใด และค่านี้มีความหมายอย่างไร?", "code": "def sigmoidGradient(z):\n  z  =  np.array(z)\n  g = np.zeros(z.shape)\n  g = sigmoid(z) * (1 - sigmoid(z))\n  return g", "options": ["0.25 — ค่าสูงสุดของอนุพันธ์ sigmoid", "0.0 — จุดที่อนุพันธ์ sigmoid ตาย", "1.0 — ค่าสูงสุดของอนุพันธ์ sigmoid", "0.5 — ค่าสูงสุดของอนุพันธ์ sigmoid"], "answer": 0, "explanation": "<code>sigmoid(0)</code> \\(=1/(1+e^0)=0.5\\) ⇒ \\(0.5\\times(1-0.5)=0.25\\). ฟังก์ชันนี้คือ \\(g'(z)=\\sigma(z)(1-\\sigma(z))\\) ที่ใช้คำนวณ δ ของ hidden layer. 0.25 เป็นค่าสูงสุด (ที่ z=0) และลดลงเมื่อ |z| โต — ถ้าพล็อตช่วง −8 ถึง 8 จะเห็นกราฟระฆังยอด 0.25.", "ref": "ex_shallow_nn cell sigmoidGradient / (1)", "why_wrong_map": ["", "อนุพันธ์ sigmoid ไม่เป็น 0 ที่ z=0 (เข้าใกล้ 0 เมื่อ |z| ใหญ่)", "1.0 คือยอดอนุพันธ์ของ tanh", "0.5 คือ sigmoid(0) ไม่ใช่อนุพันธ์"]}, {"id": "L2-36", "lesson": 2, "topic": "เติมโค้ด L1 / L2 loss", "source": "lesson", "type": "code", "difficulty": "hard", "stem": "เติมช่อง <code>#Fill your code</code> ของ <code>L2</code> ให้ตรงกับสูตร Mean Square Error แล้ว <code>print(L2(h, y))</code> จะได้ค่าเท่าใด?", "code": "import numpy as np\nh = np.array([3,1,2,3,4])\ny = np.array([1,1,4,2,3])\n\ndef L2(h, y):\n  loss = #Fill your code\n  return loss\n\nprint(L2(h, y))", "options": ["<code>(1/h.size) * np.sum(np.square(h - y))</code> ⇒ ได้ 2.0", "<code>np.sum(np.square(h - y)) / len(y) ** 2</code> ⇒ ได้ 0.4", "<code>(1/h.size) * np.sum(np.abs(h - y))</code> ⇒ ได้ 1.2", "<code>(1/h.size) * np.square(np.sum(h - y))</code> ⇒ ได้ 0.8"], "answer": 0, "explanation": "<p>ลำดับที่ถูกคือ “ลบ → ยกกำลังสองทีละช่อง → รวม → หารด้วย \\(m\\)”:</p>\n<p>\\(h-y = [2, 0, -2, 1, 1]\\) ⇒ ยกกำลังสอง \\([4,0,4,1,1]\\) ⇒ รวม = 10 ⇒ \\(J = 10/5 = 2.0\\)</p>\n<p>ตัวเลือกอื่นคำนวณอะไรออกมา:</p>\n<ul><li><code>np.square(np.sum(h - y))</code> สลับลำดับ sum กับ square ⇒ ค่าลบหักล้างค่าบวกก่อน \\((2+0-2+1+1)^2 = 4\\) ⇒ \\(4/5=0.8\\)</li>\n<li><code>np.sum(np.abs(h - y))</code> คือ L1 (MAE) ⇒ \\((2+0+2+1+1)/5 = 1.2\\)</li>\n<li>หารด้วย <code>len(y) ** 2</code> = \\(m^2=25\\) ⇒ \\(10/25 = 0.4\\)</li></ul>\n<p>L2 ลงโทษค่าคลาดเคลื่อนใหญ่ (\\(2^2=4\\)) หนักกว่า L1 (\\(|2|=2\\)) เสมอ</p>", "ref": "Lesson 2 §6 (Lecture2.pdf p.44)", "why_wrong_map": ["", "หารด้วย \\(m^2=25\\) แทนที่จะหารด้วย \\(m=5\\)", "นี่คือสูตร L1 (Mean Absolute Error) ไม่ใช่ Mean Square Error", "สลับลำดับ sum กับ square ⇒ ค่าลบหักล้างค่าบวกก่อนยกกำลังสอง ได้ 0.8"]}, {"id": "L1-21", "lesson": 1, "topic": "Why log loss instead of MSE", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ทำไม logistic regression จึงใช้ Cross-Entropy (Log Loss) แทน MSE?", "options": ["MSE คำนวณไม่ได้เมื่อ y เป็น 0 หรือ 1 เพราะหารด้วยศูนย์", "log loss ให้ค่าติดลบได้ จึงช่วยให้ gradient descent เร็วขึ้น", "MSE ร่วมกับ sigmoid ให้ cost ไม่นูน มีหลายหลุม ส่วน log loss นูน", "log loss ไม่ต้องใช้ gradient descent เพราะมีคำตอบปิดเสมอ"], "answer": 2, "explanation": "ถ้าเอา \\(h=g(z)\\) (sigmoid) ใส่ MSE ผิวของ cost จะ <b>ไม่นูน</b> มีหลุมหลอกหลายจุด GD อาจติด; cross-entropy ให้ผิวนูน และยังลงโทษการมั่นใจผิดแบบไม่มีเพดาน. สูตรอัปเดตที่ได้หน้าตาเหมือน linear regression: \\(\\theta_j:=\\theta_j-\\frac{\\alpha}{m}\\sum(h-y)x_j\\) ต่างแค่ \\(h\\) ผ่าน sigmoid.", "ref": "Lesson 1 §6 (p.44–45)", "why_wrong_map": ["MSE คำนวณได้ ปัญหาคือความไม่นูน", "log loss ไม่ติดลบ (มีเครื่องหมายลบหน้า log)", "", "logistic regression ไม่มีคำตอบปิด ต้องใช้ GD"]}, {"id": "L1-04", "lesson": 1, "topic": "ทำไม DL ดังในยุคนี้", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "เมื่อพล็อต performance เทียบกับจำนวนข้อมูลฝึก ของอัลกอริทึม ML แบบดั้งเดิมเทียบกับ neural network ขนาดเล็ก กลาง และใหญ่ ข้อสรุปใดถูกต้อง?", "options": ["neural network ใหญ่ดีกว่า traditional algorithms เสมอ แม้ในช่วงที่มีข้อมูลฝึกน้อยมาก ๆ", "traditional algorithms ดีขึ้นเรื่อย ๆ เมื่อข้อมูลเพิ่ม ส่วน neural network แบนราบเร็วกว่า", "traditional algorithms แบนราบเมื่อข้อมูลเยอะ ส่วน neural network ใหญ่ยังดีขึ้นต่อเมื่อข้อมูลเพิ่ม", "DL เพิ่งดังเพราะอัลกอริทึม neural network เพิ่งถูกคิดค้นขึ้นหลังปี 2010 เป็นต้นมา"], "answer": 2, "explanation": "เหตุผลที่ DL ดังในยุคนี้มีสองข้อ: <b>ข้อมูลจำนวนมหาศาล</b> และ <b>พลังประมวลผล</b> (GPU). เมื่อข้อมูลเพิ่ม อัลกอริทึมดั้งเดิมไต่ขึ้นแล้วแบน (ความจุของโมเดลตัน) ส่วน neural network ยิ่งใหญ่ยิ่งไต่ต่อได้. แต่ในช่วงที่ข้อมูลน้อย เส้นทั้งหมดแทบทับกัน — โครงข่ายใหญ่จึงไม่ได้ดีกว่าเสมอ ข้อได้เปรียบโผล่เมื่อข้อมูลมากพอ.", "ref": "Lesson 1 §1 (p.14)", "why_wrong_map": ["ช่วงข้อมูลน้อยเส้นแทบทับกัน ข้อได้เปรียบโผล่เมื่อข้อมูลมากพอ", "สลับพฤติกรรมของสองกลุ่ม", "", "ทฤษฎีมีตั้งแต่ 1943/1989 ที่เปลี่ยนคือข้อมูลกับพลังประมวลผล"]}, {"id": "L3-23", "lesson": 3, "topic": "ผลของ activation ต่อความเร็วในการลู่เข้า", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "เทรนเครือข่ายเดียวกันสามครั้ง เปลี่ยนแค่ activation ของ hidden layer เป็น sigmoid, tanh และ ReLU ผลแบบใดสอดคล้องกับคุณสมบัติของ activation ทั้งสามมากที่สุด?", "options": ["ทั้งสามลู่เข้าเร็วเท่ากัน เพราะ activation มีผลแค่ที่ output layer", "ReLU ลู่เข้าเร็วสุด sigmoid ช้าสุด เพราะอนุพันธ์ของ sigmoid สูงสุดแค่ 0.25", "tanh ลู่เข้าช้าสุด เพราะ output ติดลบได้ทำให้ gradient หักล้างกันหมด", "sigmoid ลู่เข้าเร็วสุด เพราะ output อยู่ใน [0,1] เหมาะกับ binary classification"], "answer": 1, "explanation": "ความเร็วในการลู่เข้าขึ้นกับว่า gradient ไหลผ่าน activation ได้ดีแค่ไหน: sigmoid มี \\(g'\\) สูงสุด 0.25 และไม่ zero-centered ⇒ ช้าสุด; tanh มี \\(g'\\) สูงสุด 1 และ zero-centered ⇒ ดีขึ้น; ReLU มี \\(g'=1\\) ทั้งฝั่งบวกและคำนวณง่าย ⇒ fast calculation (better convergence). ข้อควรระวัง: ถ้าวัดแค่บน training set จะบอกได้แค่ความสามารถในการ fit ไม่ได้บอกว่า generalize ดี.", "ref": "Lesson 3 §5A.5, §5B.5 (p.29, 34)", "why_wrong_map": ["activation ของ hidden layer มีผลโดยตรงต่อ gradient ทุกชั้นที่อยู่ก่อนหน้า", "", "tanh ที่ zero-centered ช่วยให้ gradient มีทั้งบวกและลบ จึงเร็วกว่า sigmoid", "ช่วง [0,1] เหมาะกับ output layer ของ binary ไม่ได้ช่วยให้ hidden เรียนเร็ว"]}, {"id": "L1-45", "lesson": 1, "topic": "predict", "source": "ex1", "type": "code", "difficulty": "medium", "stem": "ฟังก์ชันทำนายคลาสเขียนว่า <code>p = np.round(sigmoid(z1))</code> โดย <code>z1 = a0 @ Theta1.T</code> บรรทัดนี้ทำหน้าที่อะไร?", "options": ["คำนวณความน่าจะเป็นของคลาส 0 แล้วปัดเป็นทศนิยมสองตำแหน่ง", "ปัดค่า z1 ให้เป็นจำนวนเต็มที่ใกล้ที่สุด แล้วใช้เป็นคลาส", "ตัดสินคลาสด้วย threshold 0.5 เท่ากับดูเครื่องหมายของ z1", "ตัดสินคลาสด้วย threshold 0.7 เพื่อให้ precision สูงขึ้น"], "answer": 2, "explanation": "sigmoid ให้ความน่าจะเป็น \\(P(y=1\\mid x)\\) ใน [0,1]; ปัดเศษ ⇒ มากกว่า 0.5 เป็น 1, น้อยกว่า 0.5 เป็น 0. เพราะ \\(g(z)>0.5\\iff z>0\\) บรรทัดนี้จึงเท่ากับการใช้ decision boundary \\(z=0\\). จากนั้นวัด accuracy ได้ด้วย <code>np.mean(p == y) * 100</code>.", "ref": "ex1 cell (13), (26)", "why_wrong_map": ["sigmoid ให้ P(y=1) และ round ปัดเป็นจำนวนเต็ม", "ปัด sigmoid(z1) ไม่ใช่ z1", "", "np.round ใช้จุดตัด 0.5"]}, {"id": "L1-24", "lesson": 1, "topic": "ROC curve & AUC", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดอธิบาย ROC curve และ AUC ได้ถูกต้อง?", "options": ["พล็อต TPR (แกนตั้ง) เทียบ FPR (แกนนอน) ทุก threshold; AUC 0.5 เท่ากับเดาสุ่ม", "พล็อต precision เทียบ recall ทุก threshold; AUC 1.0 เท่ากับการเดาสุ่ม", "พล็อต FPR (แกนตั้ง) เทียบ TPR (แกนนอน) ทุก threshold; AUC 0.5 เท่ากับเดาสุ่ม", "พล็อต TPR (แกนตั้ง) เทียบ FPR (แกนนอน) ทุก threshold; AUC 0 เท่ากับเดาสุ่ม"], "answer": 0, "explanation": "ROC curve แสดงประสิทธิภาพของ binary classifier เมื่อเปลี่ยน threshold โดยพล็อต <b>TPR</b> = TP/(TP+FN) (แกนตั้ง) เทียบ <b>FPR</b> = FP/(FP+TN) (แกนนอน). เส้นเริ่มที่ (0,0) จบที่ (1,1); ยิ่งเข้าใกล้ (0,1) ยิ่งดี. เส้นทแยงคือเดาสุ่ม (TPR = FPR) ⇒ AUC = 0.5; แยกได้สมบูรณ์ AUC = 1.0.", "ref": "Lesson 1 §7 (p.47)", "why_wrong_map": ["", "นั่นคือ PR curve และ AUC 1.0 คือสมบูรณ์แบบ", "สลับแกน", "เดาสุ่มได้ 0.5 ไม่ใช่ 0"]}, {"id": "L5-59", "lesson": 5, "topic": "BN เมื่อ batch มีตัวอย่างเดียว", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "mini-batch มีตัวอย่างเดียว ค่า \\(z\\) ของ layer ที่มี 2 neuron คือ \\([1,\\ 5]\\) ถ้า normalize ด้วย BatchNorm (ละ \\(\\epsilon\\)) output ที่ได้คืออะไร?", "options": ["\\([-1,\\ +1]\\) เพราะยัง normalize ภายในตัวอย่างนั้นได้ตามปกติ", "\\(\\beta\\) ทั้งสอง neuron เพราะ \\(z-\\mu_B=0\\) ทุกตัว ข้อมูลเดิมหายหมด", "\\([\\gamma,\\ 5\\gamma]\\) เพราะคูณ \\(\\gamma\\) แต่ไม่ต้องลบ mean เมื่อมีตัวอย่างเดียว", "\\([1,\\ 5]\\) เท่าเดิม เพราะ BN ข้ามการ normalize เมื่อ batch เล็กเกิน"], "answer": 1, "explanation": "<p>BN เฉลี่ย <b>ข้ามตัวอย่าง</b> (ลงตามคอลัมน์) แยกทีละ neuron. เมื่อ batch มีตัวอย่างเดียว neuron ที่ 1 มีค่าชุดเดียวคือ \\(\\{1\\}\\) ⇒ \\(\\mu_B=1,\\ \\sigma_B^2=0\\) ⇒ \\(z_{norm}=(1-1)/\\sqrt{0}=0\\); neuron ที่ 2 ก็ได้ 0 เช่นกัน ⇒ \\(\\tilde z=\\gamma(0)+\\beta=\\beta\\) ทั้งคู่.</p><p>เทียบ LayerNorm ที่เฉลี่ย <b>ข้าม neuron ภายในตัวอย่าง</b>: \\(\\mu=(1+5)/2=3,\\ \\sigma^2=4,\\ \\sigma=2\\) ⇒ \\([-1,+1]\\) ทำงานได้ตามปกติ. นี่คือเหตุผลตัวเลขของข้อดีข้อแรกในสไลด์หน้า 19: LN is <b>independent of batch size</b>.</p>", "ref": "Lesson 5 §4 กล่องเปรียบเทียบ BN กับ LayerNorm (สไลด์หน้า 18–19)", "why_wrong_map": ["นั่นคือผลของ LayerNorm (เฉลี่ยข้าม 2 neuron ได้ μ=3, σ=2) ไม่ใช่ BatchNorm", "", "ขั้นลบ mean ทำก่อนเสมอ และตรงนี้ \\(\\mu_B\\) เท่ากับค่าของตัวมันเองพอดี", "BN ไม่มีเงื่อนไขข้ามการทำงานตาม batch size — มันใช้สูตรเดิมเสมอ"]}, {"id": "L4-01", "lesson": 4, "topic": "Deep NN: นิยาม", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามสไลด์หน้า 2 อะไรคือนิยามของ <b>deep neural network</b>?", "options": ["neural network ที่มี hidden layer จำนวนมาก จึงเรียนรู้ representation ระดับสูงจากข้อมูลได้", "neural network ที่มี output node จำนวนมาก จึงทำนายได้หลายคลาสพร้อมกันจากโมเดลเพียงตัวเดียวโดยไม่ต้องเทรนซ้ำ", "neural network ที่มี node ต่อชั้นจำนวนมาก จึงรับ input ที่มีมิติสูงมาก ๆ ได้ในชั้นเดียว", "neural network ที่ใช้ข้อมูลเทรนจำนวนมาก จึงต้องใช้ GPU ช่วยคำนวณทุกครั้งที่เทรนโมเดล"], "answer": 0, "explanation": "<p>อาจารย์นิยามสั้นมาก: deep neural network คือ neural network ที่มี <b>many hidden layers</b> เหตุผลที่ซ้อนหลายชั้นคือให้โมเดลเรียน <i>high-level representations</i> — ชั้นแรกเรียนของง่าย (เส้น ขอบ) ชั้นถัดไปเอาของง่ายมาประกอบเป็นของยาก</p><p>ความ \"ลึก\" อยู่ที่จำนวนชั้นซ่อนเท่านั้น ไม่เกี่ยวกับความกว้าง จำนวน output หรือขนาดข้อมูล</p>", "ref": "Lesson 4 §1 (สไลด์หน้า 2)", "why_wrong_map": ["", "สับสนความลึกกับจำนวน output — โครงข่ายหน้า 2 มี output ตัวเดียวแต่ก็ยังเป็น deep", "นั่นคือความ \"กว้าง\" (จำนวน node ต่อชั้น) ไม่ใช่ความลึก", "ปริมาณข้อมูล/ฮาร์ดแวร์ไม่ได้อยู่ในนิยามของคำว่า deep"]}, {"id": "L5-08", "lesson": 5, "topic": "Scale of initial weights matters", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "สไลด์หน้า 4 สรุปจาก <i>empirical evidence</i> ว่าอะไรมีผลต่อ optimization และ generalization มากที่สุดตอนตั้งค่าเริ่มต้น?", "options": ["ขนาด (scale) ของ weight เริ่มต้น มากกว่าชนิดของการแจกแจงที่ใช้สุ่ม", "ค่า bias เริ่มต้น ซึ่งต้องไม่เป็น 0 เพื่อทำลายความสมมาตรของ node", "การตั้ง weight ทุกตัวให้เท่ากัน เพื่อให้ทุก node เริ่มจากจุดที่เป็นกลาง", "ชนิดของการแจกแจง (uniform หรือ Gaussian) มากกว่าขนาดของ weight"], "answer": 0, "explanation": "ข้อความที่อาจารย์ทำสี: การเลือก uniform หรือ Gaussian แทบไม่ต่างกัน แต่ <b>scale of the initial weights matters</b>. เหตุผลเชิงตัวเลข (หน้า 5): input 100 ตัว weight \\(N(0,1)\\) ⇒ \\(\\operatorname{Var}(z)=100\\) ⇒ sigmoid saturate; ถ้าลด variance เป็น \\(1/100\\) ⇒ \\(\\operatorname{Var}(z)=1\\) อยู่ในช่วงเชิงเส้น.", "ref": "Lesson 5 §2 (สไลด์หน้า 4)", "why_wrong_map": ["", "สไลด์หน้า 5 บอกว่า it is fine to set bias = 0", "นั่นคือ zero/constant init ที่ทำให้เกิด redundant nodes", "สลับกับข้อความบนสไลด์"]}, {"id": "L5-53", "lesson": 5, "topic": "ลำดับค่าที่ evaluate คืนกลับ", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "compile ด้วย <code>metrics=['accuracy']</code> แล้วเรียก <code>a, b = model.evaluate(Xtest, ytest)</code> ค่า <code>a</code> และ <code>b</code> คืออะไรตามลำดับ?", "options": ["accuracy ก่อน แล้วตามด้วยจำนวน batch", "val_loss ก่อน แล้วตามด้วย val_accuracy", "accuracy ก่อน แล้วตามด้วย loss", "loss ก่อน แล้วตามด้วย accuracy"], "answer": 3, "explanation": "<p><code>evaluate()</code> รัน forward pass บนชุดที่ส่งเข้าไป (ไม่อัปเดต weight) แล้วคืน <b>[loss, metric]</b> ตามลำดับที่ตั้งไว้ตอน compile — loss มาก่อนเสมอ แล้วจึงตามด้วย metric ที่ระบุใน <code>metrics=[...]</code>.</p><p>ผลจริงของโน้ตบุ๊ก MNIST: <code>313/313 - loss: 0.1581 - accuracy: 0.9547</code> ⇒ <code>test_loss 0.1581</code>, <code>test_acc 0.9547</code>. ถ้าสลับตัวแปรจะรายงานตัวเลขผิดที่.</p>", "ref": "Lesson 5 §5.1, §5.12 (สไลด์หน้า 22, 33)", "why_wrong_map": ["จำนวน batch เป็นแค่สิ่งที่แสดงในแถบความคืบหน้า ไม่ใช่ค่าที่คืนกลับ", "evaluate คืนค่าของชุดที่ส่งเข้าไป ไม่ใช่ค่า val_ ซึ่งมาจาก history ของ fit", "สลับลำดับ — เป็นกับดักที่สไลด์หน้า 22 เตือนไว้ตรงๆ ว่า loss มาก่อน acc", ""]}, {"id": "L1-22", "lesson": 1, "topic": "Confusion matrix metrics", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "ผลทำนาย 100 ตัวอย่าง: TP = 30, FP = 10, FN = 20, TN = 40 ค่า precision และ recall คือเท่าใด?", "options": ["precision 0.75, recall 0.60", "precision 0.70, recall 0.60", "precision 0.75, recall 0.70", "precision 0.60, recall 0.75"], "answer": 0, "explanation": "precision = \\(\\frac{TP}{TP+FP}=\\frac{30}{40}=0.75\\) (ที่ทำนายว่าบวก ถูกกี่ %); recall = \\(\\frac{TP}{TP+FN}=\\frac{30}{50}=0.60\\) (บวกจริงทั้งหมด จับได้กี่ %). accuracy = \\((30+40)/100=0.70\\); \\(F_1=\\frac{2(0.75)(0.6)}{1.35}\\approx0.667\\).", "ref": "Lesson 1 §7 (p.46)", "why_wrong_map": ["", "เอา accuracy 0.70 มาเป็น precision", "เอา accuracy 0.70 มาเป็น recall", "สลับตัวส่วนของ precision (TP+FP) กับ recall (TP+FN)"]}, {"id": "L4-61", "lesson": 4, "topic": "กราฟ Loss กับ learning rate สี่แบบ", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "กราฟ Loss–Epoch หน้า 18 ติดป้ายเส้นไว้สี่แบบ เส้นที่ \"ลดเร็วแต่ไปจอดที่ค่าสูงกว่าที่ควร\" ตรงกับป้ายใด และกลยุทธ์ที่สไลด์สรุปไว้คืออะไร?", "options": ["ป้าย \"η too small: slow\" และกลยุทธ์คือเริ่มด้วย learning rate ต่ำแล้วค่อย ๆ เพิ่มขึ้นตามเวลาที่เทรน", "ป้าย \"η too high: suboptimal\" และกลยุทธ์คือเริ่มด้วย learning rate สูงแล้วค่อย ๆ ลดลงระหว่างเทรน", "ป้าย \"η way too high: diverges\" และกลยุทธ์คือคงค่า learning rate ไว้เท่าเดิมตลอดการเทรนทั้งหมด", "ป้าย \"η just right\" และกลยุทธ์คือปล่อยให้ค่า learning rate ถูกเลือกให้เองโดยกลไก early stopping"], "answer": 1, "explanation": "ป้ายทั้งสี่บนกราฟหน้า 18 คือชุดคำตอบสำเร็จรูปของข้อสอบเรื่อง learning rate:<br>เส้นที่พุ่งขึ้น = \"η way too high: diverges\"<br>เส้นที่ลดช้าและยังสูงอยู่ตอนจบ = \"η too small: slow\"<br>เส้นที่ลดเร็วแต่ไปจอดที่ค่าสูงกว่าที่ควร = \"η too high: suboptimal\" ⇐ ข้อนี้<br>เส้นที่ลดเร็วและลงต่ำสุด = \"η just right\"<br>ข้อความสีม่วงใต้กราฟสรุปกลยุทธ์ไว้เอง: \"Start with a high learning rate then reduce it: perfect!\" ซึ่งคือที่มาของ learning rate decay ในหน้า 19<br>และประโยคที่มักเข้าใจผิด: \\(\\eta\\) สูงที่ไม่ diverge ก็ยัง \"แกว่งรอบจุดต่ำสุด\" ได้ — ไม่ระเบิดไม่ได้แปลว่าดี", "ref": "Lesson 4 §4.4 (สไลด์หน้า 18)", "why_wrong_map": ["\"too small: slow\" คือเส้นที่ลดช้าและยังสูงตอนจบ และสไลด์บอกให้ <b>ลด</b> ไม่ใช่เพิ่ม learning rate", "", "\"way too high\" คือเส้นที่พุ่งขึ้น (diverges) ไม่ใช่เส้นที่ลดเร็วแล้วไปจอดสูง", "\"just right\" คือเส้นที่ลดเร็วและลงต่ำสุด ส่วน early stopping ไม่ได้ทำหน้าที่เลือก learning rate ให้"]}, {"id": "L3-04", "lesson": 3, "topic": "Backprop: ทำหน้าที่อะไร", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ข้อใดอธิบายหน้าที่ของ backpropagation algorithm ได้ถูกต้อง?", "options": ["สุ่มค่าเริ่มต้นของ weight ให้อยู่ในช่วง −ε ถึง ε เพื่อ break symmetry", "คำนวณ partial derivative (gradient) ของ cost เทียบกับ weight แต่ละตัว", "อัปเดต weight ทุกตัวด้วยสูตร θ := θ − α·gradient ให้ cost ลดลง", "คำนวณ h(x) จากซ้ายไปขวาเพื่อให้ได้ค่าทำนายของตัวอย่างแต่ละตัว"], "answer": 1, "explanation": "backprop ใช้ <b>compute partial derivative</b> (= <b>gradient</b>) ของ output error (= <b>cost</b>) เทียบกับ parameter (= <b>weight</b>) เพื่อส่งต่อให้ <b>gradient descent</b> ใช้เรียนรู้ — สรุปสั้นคือ \"how much each weight connection contributed to the error\". ลำดับงานคือ backprop คำนวณ \\(\\partial J/\\partial\\theta\\) → gradient descent นำไปอัปเดต.", "ref": "Lesson 3 §1 Chain Rule (p.3)", "why_wrong_map": ["นี่คือ parameter initialization ซึ่งเป็นคนละขั้นตอน", "", "นี่คืองานของ gradient descent ที่รับ gradient จาก backprop ไปใช้", "นี่คือ forward computation ซึ่งเป็นขั้นที่ต้องทำก่อน backward"]}, {"id": "L2-18", "lesson": 2, "topic": "NOT gate จาก neuron เดียว", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "neuron เดียวใช้ \\(h_\\theta(x)=g(15-30x_1)\\) ที่ \\(x_1=1\\) ได้ค่าประมาณเท่าใด และ neuron นี้ทำหน้าที่เป็น gate ใด?", "options": ["\\(g(45)\\approx 1\\) — ทำหน้าที่ OR", "\\(g(0)=0.5\\) — ยังตัดสินไม่ได้", "\\(g(15)\\approx 1\\) — ทำหน้าที่ NOT", "\\(g(-15)\\approx 0\\) — ทำหน้าที่ NOT"], "answer": 3, "explanation": "<p>แทนค่า: \\(z = 15-30(1) = -15\\) ⇒ \\(g(-15)=\\frac{1}{1+e^{15}}\\approx 3\\times10^{-7} \\approx 0\\)</p>\n<p>อีกกรณี \\(x_1=0\\): \\(z = 15 \\Rightarrow g(15)\\approx 1\\) ⇒ ได้ \\([1,0]\\) ซึ่งกลับค่า input พอดี = NOT</p>\n<p>weight ติดลบทำหน้าที่ “ดึง” \\(z\\) ลงเมื่อ input เป็น 1 ส่วน bias บวกทำให้ output เป็น 1 เมื่อ input เป็น 0 — และขนาด \\(|z|=15\\) ทำให้ sigmoid อิ่มตัว คำตอบจึงเด็ดขาด</p>", "ref": "Lesson 2 §4 (Lecture2.pdf p.18)", "why_wrong_map": ["บวก 30 แทนที่จะลบ (ลืมว่า weight เป็นลบ) และ gate input เดียวไม่ใช่ OR", "คิดว่า bias หักล้างกับ weight พอดี ทั้งที่ \\(15-30=-15\\)", "นี่คือค่าที่ \\(x_1=0\\) ไม่ใช่ \\(x_1=1\\)", ""]}, {"id": "L3-09", "lesson": 3, "topic": "g'(z)=a(1−a): ความหมาย", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "hidden node หนึ่งใช้ sigmoid และจาก forward ได้ \\(a=0.9\\). ค่า \\(g'(z)\\) ที่ใช้ใน δ ของ node นี้คือเท่าใด และบอกอะไร?", "options": ["0.25 — sigmoid มีอนุพันธ์คงที่ 0.25 ไม่ว่า a จะมีค่าเท่าใด", "0.09 — ใกล้อิ่มตัว gradient ผ่าน node นี้เหลือไม่ถึง 1/10", "0.81 — ยกกำลังสองของ a จึงผ่าน gradient ได้เกือบเต็มที่", "0.19 — เป็น 1 − a² แบบ tanh จึงเหลือ gradient ราวหนึ่งในห้า"], "answer": 1, "explanation": "สำหรับ sigmoid \\(g'(z)=a(1-a)=0.9\\times0.1=0.09\\). จุดสำคัญคือคำนวณจาก \\(a\\) ที่ forward เก็บไว้ได้เลย ไม่ต้องคำนวณ \\(e^{-z}\\) ใหม่. ค่านี้เป็นตัวคูณใน \\(\\delta^{(l-1)}\\) ⇒ ถ้า \\(a\\) ใกล้ 0 หรือ 1 (อิ่มตัว) \\(g'\\) เล็กมาก gradient ที่ไหลผ่านก็เล็กตาม. ยอดสูงสุด 0.25 เกิดเฉพาะตอน \\(a=0.5\\) (\\(z=0\\)).", "ref": "Lesson 3 §5A.1 Sigmoid Derivative (p.25)", "why_wrong_map": ["0.25 คือค่าสูงสุดที่ z=0 เท่านั้น ไม่ใช่ค่าคงที่", "", "เอา a² แทน a(1−a) — ไม่ใช่อนุพันธ์ของ sigmoid", "ใช้สูตรของ tanh (1 − f²) กับ sigmoid"]}, {"id": "L1-38", "lesson": 1, "topic": "sigmoidGradient", "source": "ex1", "type": "calc", "difficulty": "medium", "stem": "ฟังก์ชัน <code>sigmoidGradient(z) = sigmoid(z) * (1 - sigmoid(z))</code> มีค่าสูงสุดที่ z เท่าใด และค่าสูงสุดเท่าใด?", "options": ["z = 0, ค่า 1.0", "z = 0, ค่า 0.5", "z = 8, ค่า 1.0", "z = 0, ค่า 0.25"], "answer": 3, "explanation": "\\(g'(z)=g(z)(1-g(z))\\) เป็นผลคูณของสองจำนวนที่รวมกันได้ 1 ⇒ มากที่สุดเมื่อทั้งคู่เท่ากับ 0.5 คือ \\(g(z)=0.5\\iff z=0\\) ได้ \\(0.5\\times0.5=0.25\\). เมื่อ \\(|z|\\) ใหญ่ \\(g\\) เข้าใกล้ 0 หรือ 1 ทำให้ \\(g'\\to0\\) — ต้นเหตุของ vanishing gradient ในบทหลัง.", "ref": "ex1 cell (6)–(7)", "why_wrong_map": ["gradient ของ sigmoid ไม่เคยถึง 1", "นั่นคือค่า sigmoid(0) ไม่ใช่ gradient", "ที่ z ใหญ่ gradient เกือบเป็นศูนย์", ""]}, {"id": "L4-34", "lesson": 4, "topic": "Dropout: นิยามและ train/test", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามสไลด์หน้า 28–29 dropout ทำงานอย่างไรในช่วง training และ test?", "options": ["ตอน train สุ่มตั้ง activation ของบาง node เป็นศูนย์ตาม dropout rate ส่วนตอน test ไม่ทำ dropout เลย", "ตอน train ตั้ง weight ของบางเส้นเป็นศูนย์อย่างถาวร ส่วนตอน test คืนค่า weight เดิมกลับมาทั้งหมด", "ตอน train ลบ node ที่ไม่สำคัญออกอย่างถาวร ส่วนตอน test ใช้เฉพาะ node ที่เหลือรอดจากการเทรน", "ตอน train สุ่มตั้ง activation ของบาง node เป็นศูนย์ ส่วนตอน test ก็สุ่มปิดด้วยอัตราเดียวกันเพื่อความสม่ำเสมอ"], "answer": 0, "explanation": "<p>นิยาม: dropout คือการ <i>randomly dropping out nodes</i> ของ layer นั้น \"deactivating them by setting their activations to zero\" <b>เฉพาะตอน training</b></p><p><b>dropout rate</b> = สัดส่วนของ node ที่ถูกทำให้เป็นศูนย์ชั่วคราว มักตั้งระหว่าง 0.1–0.5 (อย่าสับสนกับ keep_prob = \\(1-\\)rate)</p><p>ตอน test: \"no need to do dropout\" เพราะ \"เราไม่ต้องการความสุ่มใด ๆ\" และเพราะเราปรับ activation ชดเชยไว้แล้วตอนเทรน</p><p>การปิดเป็นเรื่อง<b>ชั่วคราว</b> — รอบถัดไปสุ่มใหม่ทั้งหมด</p>", "ref": "Lesson 4 §6.2 (สไลด์หน้า 28–29)", "why_wrong_map": ["", "dropout ปิดที่ activation ของ node ไม่ใช่ตั้ง weight เป็นศูนย์ถาวร", "ไม่มีการลบ node ถาวร แต่ละ iteration สุ่มใหม่", "ตอน test ไม่ทำ dropout เพราะไม่ต้องการความสุ่ม"]}, {"id": "L4-21", "lesson": 4, "topic": "Learning rate decay", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "ใช้ linear decay แบบสไลด์หน้า 19 (\\\"หารครึ่งทุก 5 epoch\\\") โดยเริ่มที่ \\(\\alpha_0=0.2\\) ที่ epoch 12 ค่า learning rate เป็นเท่าใด?", "options": ["0.002", "0.05", "0.10", "0.025"], "answer": 1, "explanation": "<p>หารครึ่งทุก 5 epoch แปลว่าค่าคงที่เป็นช่วง ๆ ละ 5 epoch:</p><p>epoch 1–5: 0.2 → epoch 6–10: 0.1 → epoch 11–15: <b>0.05</b> → epoch 16–20: 0.025</p><p>epoch 12 อยู่ในช่วงที่สาม จึงได้ 0.05</p><p>เทียบกับ exponential decay (\\\"คูณ 0.1 ทุก 8 epoch\\\") ที่ epoch 12 จะได้ \\(0.2\\times0.1 = 0.02\\) — ต่างกัน 2.5 เท่า ทั้งที่เริ่มจากค่าเดียวกัน จุดที่ข้อสอบชอบสลับคือคู่ตัวเลขของสองกลยุทธ์ (ครึ่งหนึ่งทุก 5 vs คูณ 0.1 ทุก 8)</p>", "ref": "Lesson 4 §4.4 (สไลด์หน้า 19)", "why_wrong_map": ["สับสนกับ exponential decay ที่คูณด้วย 0.1", "", "นับช่วงพลาดไปหนึ่งช่วง (คิดว่า epoch 12 ยังอยู่ช่วง 6–10)", "นับเกินไปหนึ่งช่วง (เป็นค่าของ epoch 16–20)"]}, {"id": "L2-19", "lesson": 2, "topic": "ออกแบบ gate ใหม่จากชุด θ", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "neuron เดียวใช้ \\(h_\\theta(x)=g(-10+20x_1-20x_2)\\) (sigmoid, \\(|z|\\ge10\\) ปัดเป็น 0/1) ให้ผลลัพธ์ของ \\((0,0),(0,1),(1,0),(1,1)\\) เป็นอะไร และเทียบเท่า gate ใด?", "options": ["\\([1,0,1,1]\\) คือ \\(x_1 \\vee \\neg x_2\\)", "\\([0,1,0,0]\\) คือ \\(\\neg x_1 \\wedge x_2\\)", "\\([0,0,1,0]\\) คือ \\(x_1 \\wedge \\neg x_2\\)", "\\([0,1,1,0]\\) คือ \\(x_1 \\oplus x_2\\)"], "answer": 2, "explanation": "<p>แทนค่าทีละแถว:</p>\n<ul><li>\\((0,0)\\): \\(z=-10 \\Rightarrow \\approx 0\\)</li>\n<li>\\((0,1)\\): \\(z=-10-20=-30 \\Rightarrow \\approx 0\\)</li>\n<li>\\((1,0)\\): \\(z=-10+20=10 \\Rightarrow \\approx 1\\)</li>\n<li>\\((1,1)\\): \\(z=-10+20-20=-10 \\Rightarrow \\approx 0\\)</li></ul>\n<p>ได้ \\([0,0,1,0]\\) ซึ่งเป็น 1 แถวเดียวคือ \\(x_1=1, x_2=0\\) นั่นคือ \\(x_1 \\wedge \\neg x_2\\) (input \\(x_2\\) ทำหน้าที่ “ยับยั้ง” แบบ inhibitory)</p>\n<p>วิธีคิดเร็ว: weight บวกที่ \\(x_1\\) “ดัน” \\(z\\) ขึ้น weight ลบที่ \\(x_2\\) “ดึง” ลง และ bias \\(-10\\) ตั้งด่านให้ต้องมี \\(x_1\\) อย่างเดียวจึงข้ามได้</p>", "ref": "Lesson 2 §4 (Lecture2.pdf p.16–18)", "why_wrong_map": ["ตีความ bias ผิดเป็นบวก ทำให้ได้ 1 หลายแถวเกินจริง", "สลับบทบาทของ \\(x_1\\) กับ \\(x_2\\) (เครื่องหมาย weight สลับกัน)", "", "XOR ต้องใช้สองชั้น neuron เดียวให้ผลนี้ไม่ได้"]}, {"id": "L2-08", "lesson": 2, "topic": "5 เหตุผลที่ NN โมเดลรูปแบบซับซ้อนได้", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "Universal Approximation Theorem กล่าวว่า neural network ที่มี hidden unit ใน<b>จำนวนที่เพียงพอ (sufficient)</b> และใช้ activation ที่<b>เหมาะสม (appropriate)</b> สามารถประมาณฟังก์ชันต่อเนื่องได้ สองคำนี้สื่ออะไร?", "options": ["โครงข่ายขนาดใดก็ได้และ activation ชนิดใดก็ได้ ย่อมประมาณฟังก์ชันได้เสมอ", "ต้องมี hidden layer อย่างน้อย 6 ชั้นตามจำนวนชั้นของเปลือกสมองมนุษย์", "ต้องมี hidden unit มากพอและ activation ไม่เชิงเส้นที่เหมาะสม ทฤษฎีจึงจะรับประกัน", "ต้องมี training example มากพอและ learning rate ที่เหมาะสมเท่านั้นจึงจะลู่เข้า"], "answer": 2, "explanation": "<p>ใจความของ Universal Approximation Theorem: <em>ถ้ามี hidden unit เพียงพอ (sufficient) และ activation ไม่เชิงเส้นที่เหมาะสม (appropriate)</em> โครงข่ายประมาณฟังก์ชันต่อเนื่องได้กว้างมาก — สองคำนี้คือ <b>เงื่อนไข</b> ไม่ใช่คำประดับ</p>\n<p>อีกประเด็นคือแยก “กว้าง” ออกจาก “ลึก”: unit เยอะในชั้นเดียวให้กำลังประมาณฟังก์ชัน ส่วนหลายชั้นให้ hierarchical representations (ขอบ → ตา/จมูก → ใบหน้า) ซึ่งประหยัดพารามิเตอร์กว่ามากในงานจริง</p>", "ref": "Lesson 2 §1A (Lecture2.pdf p.7)", "why_wrong_map": ["ขัดกับคำว่า sufficient/appropriate โดยตรง — ขนาดและ activation มีเงื่อนไข", "จำนวนชั้นของเปลือกสมองเป็นแรงบันดาลใจ ไม่ใช่เงื่อนไขของทฤษฎี", "", "สองคำนี้ขยาย hidden unit และ activation ไม่ใช่ข้อมูลกับ learning rate"]}, {"id": "L4-26", "lesson": 4, "topic": "Bias correction ที่ t = 1", "source": "lesson", "type": "calc", "difficulty": "hard", "stem": "Adam ที่ก้าวแรก (\\(t=1\\)) ด้วย \\(\\beta_1=0.9,\\ \\beta_2=0.999\\) ตัวคูณชดเชยของ \\(v\\) และ \\(s\\) เป็นเท่าใด?", "options": ["คูณ \\(v\\) ด้วย 10 และคูณ \\(s\\) ด้วย 1000", "คูณ \\(v\\) ด้วย 1.11 และคูณ \\(s\\) ด้วย 1.001", "คูณ \\(v\\) ด้วย 0.1 และคูณ \\(s\\) ด้วย 0.001", "คูณ \\(v\\) ด้วย 1000 และคูณ \\(s\\) ด้วย 10"], "answer": 0, "explanation": "<p>สูตร: \\(\\hat v = v/(1-\\beta_1^{\\,t})\\), \\(\\hat s = s/(1-\\beta_2^{\\,t})\\)</p><p>ที่ \\(t=1\\): \\(1-0.9^1 = 0.1\\) ⇒ หารด้วย 0.1 = คูณ 10; \\(1-0.999^1 = 0.001\\) ⇒ หารด้วย 0.001 = คูณ 1000</p><p>ตรวจด้วยตัวเลข: ถ้า \\(g=0.2\\) คงที่ ⇒ \\(v_1=0.02\\), \\(s_1=0.00004\\); แก้แล้วได้ \\(\\hat v_1=0.2\\) (เท่ากับ \\(g\\)) และ \\(\\hat s_1=0.04\\) (เท่ากับ \\(g^2\\)) พอดี ⇒ \\(\\hat v/\\sqrt{\\hat s}=1\\) ก้าวแรกจึงมีขนาด \\(\\alpha\\) พอดี ไม่ใช่ \\(3.16\\alpha\\)</p>", "ref": "Lesson 4 §5.3 (สไลด์หน้า 23)", "why_wrong_map": ["", "หารด้วย \\(\\beta\\) แทนที่จะเป็น \\(1-\\beta^t\\)", "คูณด้วย \\(1-\\beta^t\\) แทนที่จะหาร ซึ่งยิ่งทำให้ค่าเล็กลงไปอีก", "สลับตัวคูณของ \\(v\\) กับ \\(s\\) — ตัวที่ \\(\\beta\\) ใหญ่กว่าต้องชดเชยแรงกว่า"]}, {"id": "L6-26", "topic": "นับ step ต่อ epoch เมื่อใช้ validation_split", "source": "tensorboard_notebook", "type": "calc", "difficulty": "medium", "stem": "ใน notebook ของ TensorBoard ใช้ <code>X_train</code> ที่มี 1,000 แถว และเทรนด้วย <code>validation_split=0.2</code> โดยไม่ระบุ batch_size progress bar จะขึ้นกี่ step ต่อ epoch", "code": "X_train, y_train = make_circles(1000, noise = 0.1)\nmodel.fit(X_train, y_train, epochs=20, validation_split=0.2, callbacks=callbacks)", "options": ["40", "25", "32", "20"], "explanation": "<p>ขั้นที่ 1 — validation_split ตัดออกจากข้อมูลที่ส่งเข้ามา: validation = \\(0.2\\times1000 = 200\\) ⇒ ข้อมูลที่ใช้เทรนจริงเหลือ \\(1000-200 = 800\\)</p><p>ขั้นที่ 2 — batch_size default ของ Keras คือ 32 ⇒ \\(\\lceil 800/32 \\rceil = 25\\) step ต่อ epoch ตรงกับ <code>25/25</code> ที่ขึ้นทุก epoch ในคาบ</p><p>ตัวเลขนี้ใช้ตรวจความเข้าใจได้ดี: ถ้าเห็น 32/32 แปลว่าลืมหัก validation ออก (\\(1000/32 = 31.25 \\Rightarrow 32\\))</p>", "ref": "tensorboard notebook · Lesson 6 §6 (สไลด์หน้า 14)", "lesson": 6, "answer": 1, "why_wrong_map": ["ใช้ batch size 20 แทนค่า default 32 จึงได้ 800/20 = 40", "", "ลืมหัก validation ออก จึงคิดจาก 1000/32 แล้วปัดขึ้นเป็น 32", "เอาจำนวน epoch (20) มาตอบ หรือคิดจาก 800/40 ซึ่งไม่ใช่ค่า default"]}, {"id": "L1-33", "lesson": 1, "topic": "Regularization: meaning & λ too large", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ข้อใดอธิบาย L2 regularization และผลของ \\(\\lambda\\) ที่ใหญ่เกินไปได้ถูกต้อง?", "options": ["เก็บ feature ครบแต่บีบ \\(\\theta\\) ให้เล็ก; λ ใหญ่เกิน ⇒ \\(h\\approx\\theta_0\\) underfit", "ตัด feature ที่ไม่สำคัญทิ้ง; λ ใหญ่เกิน ⇒ เหลือ feature เดียว overfit", "เก็บ feature ครบแต่บีบ \\(\\theta\\) ให้เล็ก; λ ใหญ่เกิน ⇒ โมเดล overfit หนัก", "L2 เรียกว่า lasso บีบ \\(\\theta\\) ทุกตัวรวม \\(\\theta_0\\) ให้เป็นศูนย์พอดี"], "answer": 0, "explanation": "Regularization — <b>Keep all features</b> (แต่ละตัวช่วยคนละนิด) แต่บีบพารามิเตอร์ให้เล็ก (เข้าใกล้ศูนย์แต่ไม่เป็นศูนย์พอดี). L1 = lasso, L2 = ridge (ใช้แพร่หลายกว่า). ถ้า \\(\\lambda\\) ใหญ่เกิน ⇒ ค่าปรับครอง cost ⇒ \\(\\theta_1..\\theta_n\\to0\\) ⇒ \\(h_\\theta(x)\\approx\\theta_0\\) เส้นแบน = underfitting / high bias.", "ref": "Lesson 1 §11 (p.57)", "why_wrong_map": ["", "การตัด feature คือวิธีแรก (reduce features) ไม่ใช่ regularization", "λ ใหญ่ทำให้ underfit ไม่ใช่ overfit", "L2 = ridge, ไม่ปรับ θ₀ และไม่ถึงศูนย์พอดี"]}, {"id": "L3-13", "lesson": 3, "topic": "Autodiff: ลำดับโค้ด PyTorch", "source": "lesson", "type": "code", "difficulty": "easy", "stem": "โค้ด PyTorch สี่บรรทัดด้านล่าง (a)–(d) ใช้เทรนเครือข่าย 1 รอบ ต้องเรียงลำดับอย่างไรจึงถูกต้อง?", "code": "(a) optimizer.step()             # update parameters\n(b) loss = criterion(y_pred, y)   # scalar loss\n(c) y_pred = model(x)             # forward pass\n(d) loss.backward()               # reverse-mode autodiff", "options": ["(b) → (c) → (d) → (a)", "(c) → (d) → (b) → (a)", "(c) → (b) → (a) → (d)", "(c) → (b) → (d) → (a)"], "answer": 3, "explanation": "ลำดับ = forward (<code>y_pred = model(x)</code>) → คำนวณ loss สเกลาร์ → <code>loss.backward()</code> คือ reverse-mode autodiff/backprop ที่เติม \\(\\partial J/\\partial\\theta\\) ลงช่อง <code>.grad</code> (ยังไม่เปลี่ยน θ) → <code>optimizer.step()</code> อ่าน .grad แล้วอัปเดต \\(\\theta:=\\theta-\\alpha\\,\\partial J/\\partial\\theta\\).", "ref": "Lesson 3 §4A.1 (p.19)", "why_wrong_map": ["คำนวณ loss ก่อนมีคำทำนาย y_pred ไม่ได้", "ยังไม่มี loss จะ backward จากอะไร — backward ต้องเรียกจากสเกลาร์ loss", "step ก่อน backward จะอัปเดตด้วย gradient เก่าหรือว่าง", ""]}, {"id": "L4-05", "lesson": 4, "topic": "ขนาดของ gradient matrix", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ในเครือข่าย \\([3,5,4,1]\\) เมทริกซ์ \\(\\partial J/\\partial\\theta^{[2]}\\) มีขนาดเท่าใด และเพราะอะไร?", "options": ["\\(4\\times6\\) เพราะ gradient ต้องมีขนาดเท่ากับ \\(\\theta^{[2]}\\) ซึ่งเป็น \\(4\\times(5+1)\\) พอดี", "\\(6\\times4\\) เพราะต้องสลับแกนให้เป็นทรานสโพสของ \\(\\theta^{[2]}\\) ก่อนนำไปอัปเดต weight ในแต่ละรอบ", "\\(5\\times4\\) เพราะ gradient นับจากจำนวน node ของสองชั้นที่ติดกันโดยไม่รวม bias เลย", "\\(4\\times5\\) เพราะ bias ของชั้นนี้ถูกอัปเดตแยกต่างหาก จึงไม่นับรวมอยู่ในเมทริกซ์นี้"], "answer": 0, "explanation": "<p>กฎง่าย ๆ ที่ใช้ตรวจโค้ดได้เสมอ: <b>gradient ของพารามิเตอร์ต้องมีรูปร่างเท่ากับพารามิเตอร์เอง</b> เพราะกฎอัปเดตคือ \\(\\theta := \\theta - \\alpha\\,\\partial J/\\partial\\theta\\) ซึ่งเป็นการลบทีละตำแหน่ง</p><p>\\(\\theta^{[2]}\\) มีขนาด \\(s_2\\times(s_1+1)=4\\times6\\) ดังนั้น gradient ก็ \\(4\\times6\\) (ในโค้ด ex2 ก็เป็นแบบนี้: <code>Theta1_grad = np.zeros(Theta1.shape)</code>)</p>", "ref": "Lesson 4 §1.1–1.2; ex2 cell nnCostFunction", "why_wrong_map": ["", "ทรานสโพสทำให้บวกลบกับ \\(\\theta\\) ตรง ๆ ไม่ได้", "ลืมคอลัมน์ bias และยังสลับลำดับแกนด้วย", "ในการ implement แบบนี้ bias อยู่ในคอลัมน์แรกของเมทริกซ์เดียวกัน"]}, {"id": "L5-13", "lesson": 5, "topic": "Circle experiment: zero vs random vs He", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ในการทดลองสไลด์หน้า 7 (Circle Dataset) ทำไม cost ของ <b>Zero Initialization</b> ค้างอยู่ที่ประมาณ 0.693 ตลอดการเทรน?", "options": ["ข้อมูลวงกลมแยกไม่ได้ ทุกวิธี init จึงได้ cost 0.693 เท่ากันหมด", "learning rate สูงเกิน gradient จึงระเบิดแล้วค้างอยู่ที่ค่า 0.693", "variance ของ z ถูกคุมให้พอดี cost จึงนิ่งตั้งแต่ก้าวแรกของการเทรน", "โมเดลทำนาย 0.5 ให้ทุกตัวอย่าง cost จึงเป็น −ln 0.5 ≈ 0.693 ไม่ขยับ"], "answer": 3, "explanation": "zero init ⇒ \\(z=0\\) ทุก node ⇒ \\(h=g(0)=0.5\\) ⇒ \\(J=-\\ln0.5=0.6931\\) และความสมมาตรไม่ถูกทำลาย จึงเปลี่ยนน้อยกว่า 0.0001 ทั้งกราฟ. Random init: ค้างแถว 0.70 หลายบล็อกก่อนลงถึง ~0.30 (train acc 84.14%); He: ลงถึง ~0.30 ภายในไม่กี่บล็อกแรก เพราะคุม variance ตั้งแต่ก้าวแรก.", "ref": "Lesson 5 §2.4 (สไลด์หน้า 7)", "why_wrong_map": ["Random และ He ลด cost ลงถึง ~0.30 ได้", "ไม่ใช่ exploding — gradient เป็น 0/สมมาตร", "นั่นคือคำอธิบายของ He ที่ cost ลดเร็ว", ""]}, {"id": "L5-05", "lesson": 5, "topic": "ReLU: ข้อดีและข้อเสีย", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ตามสไลด์หน้า 3 ข้อใดเป็น<b>ข้อเสีย</b>ของ ReLU ที่นำไปสู่การใช้ gradient clipping?", "options": ["อนุพันธ์เท่ากับ 1 ทุกค่าของ z จึงไม่มี node ใดหยุดเรียนรู้เลย", "ฝั่งบวกไม่มีเพดาน activation อาจ blow up จนเกิด exploding gradient", "อนุพันธ์สูงสุดแค่ 0.25 จึงทำให้ gradient หดลงทุกชั้นที่ผ่านไป", "ต้องใช้คู่กับ Xavier เท่านั้น มิฉะนั้น variance จะหดครึ่งทุกชั้น"], "answer": 1, "explanation": "ReLU เป็น preferred choice เพราะ \\(z>0\\) ⇒ <i>differentiation is 1</i>. แต่มีข้อเสีย 2 ข้อ: (1) node ตายเมื่อ weighted sum เป็นลบ (แก้ด้วย Leaky ReLU) และ (2) <i>activation blow up</i> ⇒ <i>exploding the gradients</i> ซึ่งแก้ได้ด้วย gradient clipping (ตัด gradient ด้วย threshold <b>ก่อน</b>ก้าว gradient descent).", "ref": "Lesson 5 §1.2 (สไลด์หน้า 3)", "why_wrong_map": ["ผิด: ฝั่งลบอนุพันธ์เป็น 0 จึงมี dying ReLU", "", "นั่นคือ sigmoid", "สลับคู่: ReLU คู่กับ He; LeCun/Xavier กับ ReLU ต่างหากที่ทำให้หด"]}, {"id": "L2-37", "lesson": 2, "topic": "สูตร update ที่ไม่มีเลข 2", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ถ้านิยาม cost \\(J=\\frac{1}{m}\\sum(h-y)^2\\) แต่เขียนสูตร update ว่า \\(\\theta_j := \\theta_j - \\frac{\\alpha}{m}\\sum(h-y)x_j\\) โดยไม่มีเลข 2 นำหน้า ควรเข้าใจเรื่องนี้อย่างไร?", "options": ["เป็นความผิดพลาดที่ทำให้ gradient descent ลู่ออกเสมอ ต้องแก้เป็น \\(2\\alpha/m\\)", "อนุพันธ์ของ \\((h-y)^2\\) ไม่มีเลข 2 อยู่แล้ว สูตรนี้จึงถูกต้องทุกประการ", "อนุพันธ์จริงมีเลข 2 แต่ค่าคงที่ถูกดูดซับเข้ากับ learning rate \\(\\alpha\\) ได้", "เลข 2 หายไปเพราะสูตรนี้ใช้ได้เฉพาะตอนที่ \\(h-y\\) มีค่าเป็นบวกเท่านั้น"], "answer": 2, "explanation": "<p>อนุพันธ์จริงของ \\(J=\\frac{1}{m}\\sum(h-y)^2\\) คือ \\(\\frac{2}{m}\\sum(h-y)x_j\\) — มีเลข 2</p>\n<p>แต่ 2 เป็นแค่ค่าคงที่คูณทิศทาง ⇒ เทรนด้วย \\(\\alpha\\) ครึ่งหนึ่งให้ผลเท่ากันทุกประการ อัลกอริทึมจึงไม่พัง. ด้วยเหตุนี้ตำราจำนวนมากจึงนิยาม cost เป็น \\(\\frac{1}{2m}\\sum(h-y)^2\\) เพื่อให้ 2 ตัดกันพอดี</p>", "ref": "Lesson 2 §6 กล่อง “จุดที่สไลด์ไม่ตรงกันเป๊ะ” (Lecture2.pdf p.43)", "why_wrong_map": ["ค่าคงที่ไม่ได้ทำให้ลู่ออก แค่เปลี่ยนขนาดก้าวเท่านั้น", "อนุพันธ์ของกำลังสองให้เลข 2 ออกมาเสมอตามกฎลูกโซ่", "", "เครื่องหมายของ \\(h-y\\) ไม่เกี่ยวกับการมีหรือไม่มีเลข 2"]}, {"id": "L5-47", "lesson": 5, "topic": "IMDB data preparation: vectorize", "source": "ex3", "type": "code", "difficulty": "medium", "stem": "หลัง <code>X = vectorize_sequences(X)</code> ใน ex3 (<code>num_words=10000</code>) X มี shape อะไร และ Input ของโมเดลต้องเขียนอย่างไร?", "code": "def vectorize_sequences(sequences, dimension=10000):\n    results = np.zeros((len(sequences), dimension))\n    for i, sequence in enumerate(sequences):\n        results[i, sequence] = 1.\n    return results", "options": ["(25000, 10000) ใช้ Input(shape=(10000,))", "(25000,) ใช้ Input(shape=(25000,))", "(25000, 10000) ใช้ Input(input_shape=(10000,))", "(10000, 25000) ใช้ Input(shape=(25000,))"], "answer": 0, "explanation": "ก่อน vectorize X เป็นลิสต์ของรีวิวยาวไม่เท่ากัน shape (25000,). ฟังก์ชันสร้างเมทริกซ์ศูนย์ (len(sequences), 10000) แล้ว <code>results[i, sequence] = 1.</code> = multi-hot ความยาวคงที่ 10,000 ⇒ (25000, 10000). Input รับ shape ของหนึ่งตัวอย่างด้วย <code>shape=(10000,)</code>.", "ref": "ex3 Data Preparation (vectorize_sequences)", "why_wrong_map": ["", "นั่นคือก่อน vectorize และ Input ผิดมิติ", "ชื่ออาร์กิวเมนต์ของ Input คือ shape", "สลับมิติ"]}, {"id": "L4-08", "lesson": 4, "topic": "Batch GD: Pros/Cons", "source": "lesson", "type": "concept", "difficulty": "easy", "stem": "ตามสไลด์หน้า 7 ข้อดีและข้อเสียข้อแรกของ Batch Gradient Descent คือข้อใด?", "options": ["ดี: หนีจาก local minimum ได้ดีที่สุด / เสีย: ต้องสลับข้อมูลใหม่ทุกครั้งก่อนเริ่มแต่ละ epoch", "ดี: ใช้หน่วยความจำน้อยที่สุดในสามวิธี / เสีย: ไม่สามารถใช้การคูณเมทริกซ์ได้เลยตอนเทรน", "ดี: noise ต่ำและก้าวใหญ่ตรงไปยังจุดต่ำสุด / เสีย: แพงและช้ามากต่อการก้าวเพียงหนึ่งก้าว", "ดี: อัปเดต weight ได้ถี่มากในหนึ่ง epoch / เสีย: ทิศของแต่ละก้าวแกว่งจนอาจไปผิดทาง"], "answer": 2, "explanation": "<p>Batch GD อัปเดตหลังเห็น <i>all training examples</i> ครบ (1 iteration = 1 epoch)</p><p><b>Pros:</b> \"relatively low noise and larger steps towards the minimum\" — เพราะเฉลี่ยจากทุกตัวอย่าง \\(B=m\\) ซึ่งเป็นค่ามากที่สุดที่เป็นไปได้ (ความแกว่ง \\(\\propto 1/\\sqrt{B}\\))</p><p><b>Cons1:</b> \"computationally expensive and slow to take one training step\" — ตัวอย่างของอาจารย์: ข้อมูล 100 ล้านแถว ต้องรวมทั้ง 100 ล้านแถวต่อ <i>หนึ่ง</i> ก้าว</p>", "ref": "Lesson 4 §3.1 (สไลด์หน้า 7)", "why_wrong_map": ["การหนีหลุมเป็นข้อดีของความสุ่มใน SGD/mini-batch ต่างหาก", "Batch GD ใช้หน่วยความจำมากที่สุด และได้ประโยชน์จากการคูณเมทริกซ์เต็มที่", "", "อัปเดตถี่และทิศแกว่งคือลักษณะของ SGD/mini-batch ไม่ใช่ Batch GD"]}, {"id": "L4-09", "lesson": 4, "topic": "Local minima", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "สไลด์หน้า 8 สรุปเรื่อง local minima ของ deep network ไว้อย่างไร?", "options": ["เป็นปัญหาเฉพาะเมื่อใช้ batch size เล็กเท่านั้น ส่วน Batch GD ที่ใช้ข้อมูลครบชุดจะไม่มีทางติด local minimum", "ไม่เคยเป็นปัญหาเลยในทางปฏิบัติ เพราะ cost function ของเครือข่ายลึกเป็นฟังก์ชันนูนที่มีจุดต่ำสุดเพียงจุดเดียว", "เป็นปัญหาในทางทฤษฎี แต่งานวิจัยใหม่ชี้ว่าส่วนใหญ่ error ใกล้เคียง global จะร้ายแรงก็ต่อเมื่อ error สูงกว่าอย่างมีนัยสำคัญ", "เป็นปัญหาร้ายแรงเสมอในทุกเครือข่าย จึงต้องใช้ optimizer ที่รับประกันว่าจะพบ global minimum ได้ทุกครั้งที่เทรนโมเดลใหม่เสมอ"], "answer": 2, "explanation": "<p>อาจารย์เล่าสามจังหวะที่ต้องอ่านให้ครบ: (1) ปัญหาเกิดเพราะ optimizer พึ่ง <i>minimal local information</i> — gradient บอกได้แค่ความชันตรงจุดที่ยืน (2) \"recent studies suggest\" ว่า local minima ส่วนใหญ่มี error rate ใกล้เคียงกันและมี generalization traits พอ ๆ กับ global minimum (3) จะเป็น <i>significant local minima issue</i> ก็ต่อเมื่อให้ higher errors สูงกว่า global อย่างมีนัยสำคัญ</p><p>อย่าตอบสุดโต่งไปข้างใดข้างหนึ่ง เพราะสไลด์พูดครบทั้งสองด้าน</p>", "ref": "Lesson 4 §3.2 (สไลด์หน้า 8)", "why_wrong_map": ["กลับด้าน: Batch GD ที่ทิศแม่นและไม่มี noise ต่างหากที่จอดในหุบแรกที่เจอ", "สุดโต่งฝั่ง \"ไม่เป็นปัญหาเลย\" และ cost ของเครือข่ายลึกไม่ใช่ฟังก์ชันนูน", "", "สุดโต่งฝั่ง \"เป็นปัญหาเสมอ\" และไม่มี optimizer ใดรับประกัน global minimum"]}, {"id": "L4-50", "lesson": 4, "topic": "ex2: ReLU gradient ในฝั่ง backward", "source": "ex2", "type": "code", "difficulty": "hard", "stem": "บรรทัด <code>delta_1 = np.dot(delta_2, Theta2)[:, 1:] * reluGradient(a0.dot(Theta1.T))</code> มีจุดใดที่ต้องเข้าใจให้ถูก?", "options": ["ตัด <code>[:, 1:]</code> ทิ้งคอลัมน์ของ bias และ \\(g'\\) ถูกประเมินที่ \\(z_1\\) ไม่ใช่ที่ \\(a_1\\)", "ตัด <code>[:, 1:]</code> เพื่อให้เหลือเฉพาะตัวอย่างแรก และ \\(g'\\) ถูกประเมินที่ค่า \\(y\\) ของตัวอย่างนั้น", "ตัด <code>[:, 1:]</code> ทิ้ง hidden unit ตัวแรกเสมอ และ \\(g'\\) ถูกประเมินที่ \\(z_2\\) ของชั้น output", "ตัด <code>[:, 1:]</code> ทิ้งคอลัมน์แรกของข้อมูล และ \\(g'\\) ถูกประเมินที่ \\(a_1\\) หลังผ่าน ReLU แล้ว"], "answer": 0, "explanation": "<p><code>np.dot(delta_2, Theta2)</code> ได้ขนาด (m, 11) เพราะ <code>Theta2</code> เป็น (1, 11) ซึ่งรวมคอลัมน์ bias ⇒ <code>[:, 1:]</code> ตัดคอลัมน์ bias ออกให้เหลือ (m, 10) เท่ากับจำนวน hidden unit — bias ไม่มี \\\"error ย้อนกลับ\\\" เพราะไม่มีขาเข้า</p><p><code>a0.dot(Theta1.T)</code> คือ \\(z_1\\) (ค่าก่อนผ่าน activation) ⇒ \\(g'\\) ต้องประเมินที่ \\(z\\) เสมอ ตรงกับสูตร \\(\\delta^{[l-1]} = (\\theta^{[l]T}\\delta^{[l]})\\odot g'(z^{[l-1]})\\) ของ Lesson 3–4</p><p><code>reluGradient</code> คืน 1 เมื่อ \\(z>0\\) และ 0 เมื่อ \\(z\\le0\\) — unit ที่ \\\"ตาย\\\" จึงไม่ได้รับ gradient เลยในรอบนั้น</p>", "ref": "ex2 cell nnCostFunction / reluGradient", "code": "def reluGradient(z):\n    g = np.zeros(z.shape)\n    g[z<=0] = 0\n    g[z>0] = 1\n    return g", "why_wrong_map": ["", "การสไลซ์นี้ทำกับแกนคอลัมน์ ไม่ใช่แกนตัวอย่าง", "คอลัมน์ที่ตัดคือ bias ไม่ใช่ hidden unit ตัวแรก", "\\(g'\\) ต้องประเมินที่ \\(z\\) แม้สำหรับ ReLU ที่เขียนกลับเป็นฟังก์ชันของ \\(a\\) ได้ก็ตาม"]}, {"id": "L4-16", "lesson": 4, "topic": "ความหมายของ β ใน EWMA", "source": "lesson", "type": "concept", "difficulty": "medium", "stem": "ถ้าเพิ่ม \\(\\beta\\) ของ EWMA จาก 0.9 เป็น 0.98 ผลที่ได้คือข้อใด?", "options": ["ขนาดของ \\(v\\) ใหญ่ขึ้นเป็นสองเท่าเสมอ เพราะน้ำหนักที่ให้กับค่าใหม่เพิ่มขึ้นตาม \\(\\beta\\) โดยตรง", "เฉลี่ยย้อนหลังสั้นลงราว \\(1/(1-\\beta)\\) คือจาก ~50 ค่าเหลือ ~10 ค่า เส้นจึงตอบสนองไวขึ้นแต่ noisy ขึ้นมาก", "เฉลี่ยย้อนหลังยาวขึ้นราว \\(1/(1-\\beta)\\) คือจาก ~10 ค่าเป็น ~50 ค่า เส้นจึงเรียบขึ้นแต่ตอบสนองช้าลง", "ไม่มีผลใด ๆ ต่อความเรียบของเส้น เพราะ \\(\\beta\\) มีผลเฉพาะกับ bias correction ของ Adam เท่านั้
