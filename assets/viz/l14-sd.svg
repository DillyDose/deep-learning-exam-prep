<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="250" fill="#fff"/><text x="380" y="20" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Stable Diffusion ตอนสร้างรูป: ทุกขั้น denoise ทำใน latent 64×64×4</text><rect x="5" y="50" width="140" height="40" rx="6" fill="#fff" stroke="#ccc"/><text x="75.0" y="74.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">"a close up photo of a cat"</text><rect x="165" y="50" width="125" height="40" rx="6" fill="#efe7f6" stroke="#6a3d9a"/><text x="227.5" y="74.5" font-size="12" text-anchor="middle" fill="#6a3d9a" font-weight="normal">CLIP text encoder</text><text x="228" y="106" font-size="12" text-anchor="middle" fill="#6a3d9a" font-weight="normal">77 × 768</text><rect x="15" y="150" width="120" height="40" rx="6" fill="#e8f1fb" stroke="#1d6fb8"/><text x="75.0" y="174.5" font-size="12" text-anchor="middle" fill="#1d6fb8" font-weight="normal">noise 64×64×4</text><rect x="330" y="110" width="150" height="50" rx="6" fill="#fde7d4" stroke="#c25e00"/><text x="405.0" y="139.5" font-size="12.5" text-anchor="middle" fill="#c25e00" font-weight="normal">U-Net ทาย noise</text><text x="405" y="178" font-size="11.5" text-anchor="middle" fill="#6a3d9a" font-weight="normal">cross-attention กับข้อความ</text><rect x="520" y="110" width="95" height="50" rx="6" fill="#fff" stroke="#ccc"/><text x="567.5" y="139.5" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">ลบ noise</text><rect x="650" y="110" width="100" height="50" rx="6" fill="#d9efd9" stroke="#2e7d32"/><text x="700.0" y="139.5" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="normal">VAE decoder</text><text x="700" y="182" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="normal">512×512×3</text><line x1="145" y1="70" x2="163" y2="70" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="290" y1="78" x2="345" y2="108" stroke="#6a3d9a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="135" y1="170" x2="328" y2="140" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="480" y1="135" x2="518" y2="135" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><line x1="615" y1="135" x2="648" y2="135" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><path d="M567 108 C 560 70, 420 70, 410 106" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ar)"/><text x="490" y="66" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">วนซ้ำ เช่น 20 ขั้น</text><text x="380" y="230" font-size="11.5" text-anchor="middle" fill="#666" font-weight="normal">encoder ของ VAE ใช้ตอน train เท่านั้น ตอนสร้างรูปใช้แค่ decoder</text></svg>