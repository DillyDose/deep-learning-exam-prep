<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="270" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">conv 3×3 สองชั้นมองเห็น 5×5 เท่า conv 5×5 หนึ่งชั้น แต่ parameter น้อยกว่า</text><rect x="40" y="60" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="66" y="60" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="92" y="60" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="118" y="60" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="144" y="60" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="40" y="86" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="66" y="86" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="92" y="86" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="118" y="86" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="144" y="86" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="40" y="112" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="66" y="112" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="92" y="112" width="26" height="26" fill="#fde7d4" stroke="#aaa"/><rect x="118" y="112" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="144" y="112" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="40" y="138" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="66" y="138" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="92" y="138" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="118" y="138" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="144" y="138" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="40" y="164" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="66" y="164" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="92" y="164" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="118" y="164" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="144" y="164" width="26" height="26" fill="#fff" stroke="#aaa"/><rect x="92" y="112" width="78" height="78" fill="#1d6fb8" fill-opacity="0.18" stroke="#1d6fb8" stroke-width="2"/><rect x="40" y="60" width="130" height="130" fill="none" stroke="#222" stroke-width="2"/><text x="105.0" y="210" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">input 5×5</text><text x="105.0" y="228" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">หน้าต่างแรก (ส้ม) กับหน้าต่างสุดท้าย (ฟ้า)</text><rect x="240" y="86" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="266" y="86" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="292" y="86" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="240" y="112" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="266" y="112" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="292" y="112" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="240" y="138" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="266" y="138" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><rect x="292" y="138" width="26" height="26" fill="#f4f4f4" stroke="#aaa"/><text x="279.0" y="184" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">ชั้นที่ 1: 3×3</text><line x1="200" y1="125" x2="232" y2="125" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><rect x="370" y="112" width="26" height="26" fill="#d9efd9" stroke="#2e7d32"/><text x="383" y="158" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="normal">ชั้นที่ 2: 1 ค่า</text><line x1="326" y1="125" x2="362" y2="125" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/><text x="440" y="70" font-size="13" text-anchor="start" fill="#222" font-weight="bold">receptive field: 3 + (3 − 1) = 5</text><text x="440" y="102" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">conv 5×5 หนึ่งชั้น (64 → 64)</text><text x="440" y="122" font-size="13" text-anchor="start" fill="#c25e00" font-weight="bold">(5·5·64 + 1)·64 = 102,464</text><text x="440" y="154" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">conv 3×3 สองชั้น (64 → 64 → 64)</text><text x="440" y="174" font-size="13" text-anchor="start" fill="#c25e00" font-weight="bold">2 × (3·3·64 + 1)·64 = 73,856</text><text x="440" y="206" font-size="12" text-anchor="start" fill="#222" font-weight="normal">น้อยกว่า 28% และมี ReLU สองครั้งแทนครั้งเดียว</text><text x="440" y="226" font-size="12" text-anchor="start" fill="#666" font-weight="normal">7×7: 200,768 เทียบ 3×3 สามชั้น 110,784</text></svg>