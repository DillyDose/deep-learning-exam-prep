<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="-apple-system, Helvetica Neue, Arial, Sarabun, sans-serif" font-size="13"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect width="760" height="280" fill="#fff"/><text x="380" y="22" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">LoRA: ล็อก W₀ แล้วเรียนแค่ BA ที่ rank ต่ำ · h = W₀x + (α/r)·BAx</text><rect x="40" y="60" width="150" height="150" fill="#cfe3f7" stroke="#1d6fb8" stroke-width="2"/><text x="115" y="130" font-size="18" text-anchor="middle" fill="#1d6fb8" font-weight="bold">W₀</text><text x="115" y="152" font-size="12" text-anchor="middle" fill="#1d6fb8" font-weight="normal">768 × 768</text><text x="115" y="232" font-size="12" text-anchor="middle" fill="#1d6fb8" font-weight="normal">frozen 589,824</text><text x="220" y="140" font-size="24" text-anchor="middle" fill="#222" font-weight="normal">+</text><rect x="250" y="60" width="20" height="150" fill="#fde7d4" stroke="#c25e00" stroke-width="2"/><text x="260" y="232" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">B 768×8</text><text x="285" y="140" font-size="18" text-anchor="middle" fill="#222" font-weight="normal">×</text><rect x="300" y="125" width="150" height="20" fill="#fde7d4" stroke="#c25e00" stroke-width="2"/><text x="375" y="118" font-size="11.5" text-anchor="middle" fill="#c25e00" font-weight="normal">A 8×768</text><text x="375" y="172" font-size="12.5" text-anchor="middle" fill="#c25e00" font-weight="bold">6,144 + 6,144 = 12,288</text><text x="375" y="192" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">เทรนแค่ 2.08% = 2r/d</text><text x="500" y="70" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">workshop: r = 8, α = 16</text><text x="500" y="92" font-size="12" text-anchor="start" fill="#222" font-weight="normal">α/r = 2 · ใส่แค่ q_lin, v_lin</text><text x="500" y="120" font-size="12" text-anchor="start" fill="#222" font-weight="normal">adapter 6 layer × 2 × 12,288</text><text x="500" y="140" font-size="12.5" text-anchor="start" fill="#c25e00" font-weight="bold">= 147,456</text><text x="500" y="166" font-size="12" text-anchor="start" fill="#222" font-weight="normal">head pre_classifier + classifier</text><text x="500" y="186" font-size="12.5" text-anchor="start" fill="#c25e00" font-weight="bold">= 595,206 เทรนเต็ม</text><text x="500" y="214" font-size="13" text-anchor="start" fill="#2e7d32" font-weight="bold">trainable 742,662 = 1.10%</text><text x="380" y="266" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">เริ่มเทรน B = 0 จึง BA = 0 โมเดลเริ่มเหมือนเดิม · inference รวม W₀ + (α/r)BA เป็น matrix เดียว ไม่ช้าลง</text></svg>