<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Learning MCQ Final</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">

<style>
:root {
  --bg: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #55554f;
  --rule: #e2ddd2;
  --accent: #a5502c;
  --accent-soft: #f6ece3;
  --good: #2f6d3e;
  --good-bg: #e8f3ea;
  --bad: #a5342c;
  --bad-bg: #f9e9e7;
  --code-bg: #f4f2eb;
  --panel: #faf9f5;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: -apple-system, "Helvetica Neue", "Noto Sans Thai", "Sukhumvit Set", Arial, sans-serif;
  font-size: 17px; line-height: 1.6;
  max-width: 820px; margin: 0 auto; padding: 2rem 16px 5rem;
}
h1 { font-size: 1.7rem; margin: 0 0 .2em; }
.sub { color: var(--ink-soft); margin: 0 0 1.2em; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
.panel h2 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; font-size: .88rem; background: #fff; cursor: pointer; user-select: none; }
.chip input { margin: 0; }
button { font: inherit; font-size: .9rem; border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: .75rem; color: var(--ink-soft); }
.stat .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--rule); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.weak { margin: 10px 0 0; padding-left: 1.2em; font-size: .92rem; }
.weak li { margin: 2px 0; }
.weak a { color: var(--bad); }
.progress { font-size: .9rem; color: var(--ink-soft); margin: 18px 0 8px; }
.q { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; margin: 0 0 16px; background: #fff; scroll-margin-top: 12px; }
.q.done-good { border-left: 5px solid var(--good); }
.q.done-bad { border-left: 5px solid var(--bad); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: .74rem; margin-bottom: 8px; }
.tag { border-radius: 4px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent); }
.tag.t-recall { background: #e7eef8; color: #2b5a91; }
.tag.t-apply { background: #e6f3ee; color: #23684f; }
.explain dl.terms { margin: 4px 0 8px; }
.explain dl.terms dt { font-weight: 600; display: inline; }
.explain dl.terms dt::after { content: " — "; font-weight: 400; }
.explain dl.terms dd { display: inline; margin: 0; }
.explain dl.terms dd::after { content: ""; display: block; margin-bottom: 3px; }
.tag.t-calc { background: #efe8f6; color: #6a3d8f; }
.tag.d-easy { background: #eaf3e8; color: #3d6b33; }
.tag.d-medium { background: #f7f0dc; color: #7a5b12; }
.tag.d-hard { background: #f8e4e1; color: #8e3a2f; }
.num { font-weight: 700; color: var(--ink-soft); margin-right: 4px; }
.stem { margin: 0 0 10px; }
pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: .84rem; line-height: 1.45; margin: 8px 0 12px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
:not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; text-align: left; width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--rule); background: #fff; font-size: .97rem; line-height: 1.5; }
.opt .L { font-weight: 700; min-width: 1.4em; color: var(--ink-soft); }
.opt:not([disabled]):hover { background: var(--panel); border-color: var(--accent); }
.opt[disabled] { cursor: default; color: var(--ink); }
.opt.correct { background: var(--good-bg); border-color: var(--good); }
.opt.correct .L { color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .L { color: var(--bad); }
.verdict { margin: 10px 0 0; font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.explain { margin-top: 10px; padding: 12px 14px; background: var(--panel); border-radius: 9px; border: 1px solid var(--rule); font-size: .95rem; }
.explain h4 { margin: 10px 0 4px; font-size: .85rem; color: var(--accent); }
.explain h4:first-child { margin-top: 0; }
.explain ul { margin: 4px 0; padding-left: 1.2em; }
.explain .ref { margin-top: 8px; font-size: .82rem; color: var(--ink-soft); }
.empty { color: var(--ink-soft); padding: 30px 0; text-align: center; }
.katex { font-size: 1.02em; }
@media (max-width: 560px) { body { font-size: 16px; } .q { padding: 14px 12px; } }
</style>
</head>

<h1>Deep Learning MCQ Final</h1>
<p class="sub">ข้อสอบทบทวน final Lesson 7-15 + โค้ดและ notebook ในห้อง ยากกว่าระดับข้อสอบจริงเพื่อฝึกความเข้าใจ · ลำดับข้อคงที่ ปิดแล้วกลับมาทำต่อได้ · ตอบแล้วเห็นผลทันที กด “ดูเฉลย” เมื่อไม่เข้าใจ · export ผลเป็น JSON ไปให้ AI วิเคราะห์ได้</p>

den state"], ["feature m", "จำนวนตัวแปรต่อ step"], ["W_a", "weight ที่คูณ state ของ step ก่อน"]], "why_wrong_map": ["ลืม bias", "นับ bias เป็น 2 เท่า", "ลืม W_a ที่ต่อ state ก่อนหน้า", ""]}, {"id": "L12-25", "lesson": 12, "topic": "เลือกงาน pipeline", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "อยากหาชื่อบริษัท สถานที่ และคนในข่าว ควรใช้ pipeline งานใด", "options": ["text-generation", "ner", "summarization", "question-answering"], "answer": 1, "explanation": "<p>NER หาชื่อเฉพาะและติดประเภทเช่น ORG, MISC aggregation_strategy=\"simple\" รวม token ย่อยที่ติดกันเป็นแถวเดียว</p>", "link": "NER เป็นงานของ encoder-only แบบ BERT", "ref": "Lesson 12 §2.2", "terms": [["NER", "Named Entity Recognition หาชื่อเฉพาะในข้อความ"]], "why_wrong_map": ["สร้างข้อความใหม่", "", "สรุปความไม่ได้ติดป้าย", "ต้องมีคำถาม"]}, {"id": "L11-15", "lesson": 11, "topic": "ทำไมต้อง positional encoding", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "ทำไม Transformer ต้องบวก positional encoding", "options": ["เพื่อปิดตำแหน่งอนาคตไม่ให้มองเห็น", "เพื่อเพิ่มจำนวนมิติของ embedding", "เพื่อแทน softmax ใน attention", "self-attention ไม่รู้ลำดับ ต้องบอกตำแหน่งให้"], "answer": 3, "explanation": "<p>self-attention เหมือนเทลูกปัดลงถุงแล้วดูว่าลูกไหนเข้ากับลูกไหน ลำดับหายไป จึงบวกตำแหน่งเข้า embedding บวกไม่ใช่ต่อ มิติจึงเท่าเดิม</p>", "link": "ระยะระหว่างตำแหน่งติดกันเท่ากันทุกคู่ โมเดลจึงเรียนตำแหน่งสัมพัทธ์ได้", "ref": "Lesson 11 §5.1", "terms": [], "why_wrong_map": ["นั่นคือ causal mask", "บวกไม่ใช่ต่อ มิติเท่าเดิม", "softmax ยังอยู่", ""]}, {"id": "L15-05", "lesson": 15, "topic": "hierarchical ลด token", "source": "lesson", "type": "calc", "difficulty": "medium", "stem": "มี 100 tool แบ่ง 10 กลุ่ม กลุ่มละ 10 tool แบบ hierarchical ส่งนิยามให้ LLM รวมกี่รายการเทียบ standard", "options": ["110 รายการ เทียบ 100", "20 รายการ เทียบ 100", "10 รายการ เทียบ 100", "100 รายการ เทียบ 100"], "answer": 1, "explanation": "<p>ครั้งแรกส่ง 10 กลุ่มให้เลือกกลุ่ม ครั้งที่สองส่ง iculty": "medium", "stem": "ทำไม autoencoder ใช้สร้างรูปใหม่ไม่ดี", "options": ["decoder ไม่มี parameter ให้เรียนจากข้อมูลเลย", "reconstruct รูปเดิมกลับมาไม่ได้เลยสักรูป", "encoder ต้องใช้ label ของทุกรูปตอนเทรน", "latent มีช่องว่าง ไม่สมมาตร ไม่มีการแจกแจงที่นิยาม"], "answer": 3, "explanation": "<p>autoencoder reconstruct ได้ชัด แต่ loss สนแค่สร้างรูปเดิมกลับได้ ไม่สนพื้นที่ระหว่างจุด สุ่มจุดในช่องว่างจึง decode ออกมาไม่เป็นเสื้อผ้า</p>", "link": "reconstruct ได้กับสร้างของใหม่ได้เป็นคนละเรื่อง VAE แก้ด้วย KL", "ref": "Lesson 13 §2.5", "terms": [], "why_wrong_map": ["decoder มี 65,089 parameter", "reconstruct ได้ดี", "ไม่ใช้ label", ""]}, {"id": "L10-05", "lesson": 10, "topic": "Embedding parameter", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "Embedding(input_dim=1000, output_dim=8) มี parameter เท่าใด และประโยค 5 คำได้ output shape อะไร", "options": ["8,008 และ (5, 8)", "8,000 และ (5, 8)", "8,000 และ (8, 5)", "1,008 และ (5, 1000)"], "answer": 1, "explanation": "<p>embedding matrix มีหนึ่งแถวต่อคำ 1,000 คำ × 8 มิติ = 8,000 ไม่มี bias แต่ละคำได้ vector 8 ค่า ประโยค 5 คำจึงได้ (5, 8)</p>", "link": "embedding คือการหยิบแถวตาม index ไม่ต้องคูณ one-hot จริง ประหยัดกว่า one-hot ที่ยาว 1,000 ต่อคำ", "ref": "Lesson 10 §5.3", "terms": [["input_dim", "ขนาด vocabulary"], ["output_dim", "จำนวนมิติของ vector แต่ละคำ"]], "why_wrong_map": ["Embedding ไม่มี bias", "", "สลับแกน", "นั่นคือขนาด one-hot"]}, {"id": "L12-18", "lesson": 12, "topic": "fine-tune ต้อง differentiable", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "ทำไม fine-tuning ใช้ logistic regression ของ scikit-learn เป็น head ไม่ได้", "options": ["logistic regression ให้ได้แค่สอง class", "logistic regression ช้ากว่า neural network", "scikit-learn อ่าน hidden state ไม่ได้", "head ต้อง differentiable ให้ gradient ย้อนเข้า encoder"], "answer": 3, "explanation": "<p>fine-tuning เทรน hidden state ไปด้วย gradient ต้องไหลจาก loss ผ่าน head ย้อนเข้า encoder logistic regression ของ ing"], "answer": 3, "explanation": "<p>stride ใหญ่ทำให้วางหน้าต่างน้อยลง output เล็กลง คำนวณน้อยลง และความละเอียดที่ลดลงทำหน้าที่คล้าย regularization แต่แลกกับการอาจข้ามบริเวณสำคัญ</p>", "link": "stride ใหญ่กับ pooling ลดขนาดได้ทั้งคู่ ResNet ใช้ stride 2 แทน pooling", "ref": "Lesson 7 §3.3", "terms": [["regularization", "สิ่งที่ช่วยไม่ให้โมเดลจำ training data จนใช้กับข้อมูลใหม่ไม่ได้"], ["overfitting", "เก่งบน training แต่แย่บนข้อมูลใหม่"]], "why_wrong_map": ["หน้าต่างซ้อนกันน้อยลง", "stride ไม่อยู่ในสูตร parameter", "stride ใหญ่ทำให้ output เล็กลงและอาจข้ามรายละเอียด", ""]}, {"id": "L8-20", "lesson": 8, "topic": "include_top", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "บรรทัดนี้ให้อะไร", "options": ["conv base ที่ freeze แล้ว trainable parameter เป็นศูนย์ทันที", "conv base ของ VGG16 ไม่มี head output shape (None, 7, 7, 512)", "conv base ไม่มี weight ต้องเทรนใหม่ทั้งหมดก่อนใช้งาน", "VGG16 เต็มพร้อม head 1,000 class output shape (None, 1000)"], "answer": 1, "explanation": "<p>include_top=False ตัด FC สามชั้นท้ายออก เหลือ conv base ที่จบที่ block5_pool ภาพ 224 ลดครึ่งห้าครั้งเหลือ 7 channel 512 weights='imagenet' โหลด weight ที่เทรนแล้ว</p>", "link": "จาก output นี้ต้อง Flatten ได้ 25,088 ค่าก่อนต่อ head ใหม่", "ref": "Lesson 8 §5.3", "terms": [], "code": "VGG16(weights='imagenet', include_top=False, input_shape=(224, 224, 3))", "why_wrong_map": ["ตัด head ไม่ได้ freeze ต้องตั้ง trainable เอง", "", "weights='imagenet' โหลด weight มาแล้ว", "include_top=False คือไม่เอา head"]}, {"id": "L10-28", "lesson": 10, "topic": "bigram ชนะ Bi-LSTM", "source": "lesson", "type": "apply", "difficulty": "hard", "stem": "IMDB bag-of-bigrams TF-IDF ได้ 0.892 Bi-LSTM ได้ 0.882 สรุปอะไรได้", "options": ["รู้แค่ว่ามีคำอะไรก็พอ โมเดลซับซ้อนกว่าไม่ชนะเสมอ", "Bi-LSTM ต้องเทรนผิดพลาด เพราะควรชนะทุกครั้ง", "ทั้งสองเท่ากัน เพราะต่างกันไม่ถึง 5 เปอร์เซ็นต์", "TF-IDF รักษาลำดับคำได้ดีกว่า LSTM ทั้งประโยค"], "answer": 0, "explanation": "<p>bigram ไม่สนลำดับทั้งประโยค แต่  "ถ้า flatten ก่อน conv จะเสียตำแหน่งซึ่งคือปัญหาของ dense"]}, {"id": "L9-02", "lesson": 9, "topic": "concatenate", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "input_A shape (None, 5) concat กับ hidden2 shape (None, 30) ได้ shape อะไร", "options": ["(None, 30)", "(None, 150)", "(None, 35)", "(None, 5, 30)"], "answer": 2, "explanation": "<p>concatenate ต่อค่าเรียงกันตามแกนสุดท้าย 5 + 30 = 35 ไม่ใช่คูณ</p>", "link": "นี่คือจุดรวมทาง wide กับทาง deep ในตอน 1.2", "ref": "Lesson 9 §1.2", "terms": [["concatenate", "ต่อ tensor เรียงกัน ขนาดรวมคือผลบวก"]], "why_wrong_map": ["concat ไม่ได้ทิ้งกิ่งใด", "คูณแทนบวก", "", "concat ไม่สร้างมิติใหม่"]}, {"id": "L15-14", "lesson": 15, "topic": "LCEL", "source": "lesson", "type": "recall", "difficulty": "easy", "stem": "ใน LCEL เครื่องหมาย | ทำอะไร", "options": ["เลือก component ตัวใดตัวหนึ่งตามเงื่อนไขที่ตั้ง", "ต่อ component ให้ output ก่อนหน้าเป็น input ถัดไป", "รัน component สองตัวพร้อมกันแล้วรวมผลลัพธ์", "วนซ้ำ component เดิมไปเรื่อยๆ จนกว่าจะสำเร็จ"], "answer": 1, "explanation": "<p>chain = a | b | c ทุก component เป็น Runnable จึงประกอบและรันแบบเดียวกันได้ ผลของ a เข้า b แล้วเข้า c</p>", "link": "ถ้าต้องแตกกิ่งหรือวน ให้ใช้ graph", "ref": "Lesson 15 §5.1", "terms": [["LCEL", "LangChain Expression Language"], ["Runnable", "interface กลางที่ประกอบต่อกันได้"]], "why_wrong_map": ["นั่นคือ conditional edge ของ graph", "", "นั่นคือ parallel", "chain ตายตัวไม่วน"]}, {"id": "L13-27", "lesson": 13, "topic": "loss GAN ไม่บอกคุณภาพ", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "ทีมดู loss ของ generator ตอน epoch 30 สูงกว่าตอน epoch 5 แล้วสรุปว่าแย่ลง ผิดตรงไหน", "options": ["loss ที่สูงขึ้นแปลว่ารูปดีขึ้นเสมอในทุกกรณี", "GAN ไม่มี loss ของ generator ให้ดูตั้งแต่แรก", "ต้องดู KL divergence แทน loss ของ generator", "G ถูกวัดกับ D ที่เก่งขึ้นตลอด loss ต่างเวลาเทียบไม่ได้"], "answer": 3, "explanation": "<p>คู่แข่งของ G เปลี่ยนไปทุก epoch loss จึงไม่ใช่มาตรวัดคงที่ ต้องดูรูปที่สร้างหรือใช้ FID แ ly T5 กับ BART เป็น encoder-decoder</p>", "link": "workshop ใน L12 ใช้ DistilBERT ซึ่งเป็น encoder-only", "ref": "Lesson 11 §6.3", "terms": [], "why_wrong_map": ["นั่นคือ GPT", "", "ไม่มีชนิดนี้", "นั่นคือ T5 BART"]}, {"id": "L12-14", "lesson": 12, "topic": "DistilBERT", "source": "lesson", "type": "recall", "difficulty": "easy", "stem": "ข้อใดตรงกับ DistilBERT", "options": ["decoder-only ที่ใช้สร้างข้อความทีละ token", "encoder-decoder สำหรับแปลภาษาโดยเฉพาะ", "6 layer ราว 66 ล้าน parameter เล็กกว่า BERT", "12 layer ราว 110 ล้าน parameter ใหญ่กว่า BERT"], "answer": 2, "explanation": "<p>DistilBERT เล็กกว่า BERT ที่มี 12 layer 110 ล้าน แต่แม่นใกล้เคียงกัน เป็น encoder-only เปลี่ยนเป็น BERT ได้แค่เปลี่ยนชื่อ checkpoint</p>", "link": "encoder-only เหมาะกับ classification ซึ่งคือ workshop emotion", "ref": "Lesson 12 §5.1", "terms": [["checkpoint", "ชื่อชุด weight บน Hub"]], "why_wrong_map": ["นั่นคือ GPT", "นั่นคือ T5", "", "นั่นคือ BERT base"]}, {"id": "L13-13", "lesson": 13, "topic": "β-VAE", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "ถ้าให้น้ำหนัก KL มากเกินไปใน β-VAE จะเกิดอะไร", "options": ["latent มีช่องว่างระหว่างกลุ่มแบบ autoencoder", "รูปที่ reconstruct ได้เบลอและซ้ำกันหลายแถว", "loss รวมเป็นศูนย์ทันทีหลัง epoch แรก", "รูปคมขึ้นและหลากหลายขึ้นกว่าเดิมมาก"], "answer": 1, "explanation": "<p>KL หนักเกินทำให้ทุกรูปถูกดึงไปรอบ 0 จนแยกกันไม่ออก ตาราง 0.1 reconstruction + 0.9 kl ตัวเลขเบลอและหลายแถวเหมือนกัน ถ้า reconstruction หนักเกินจะกลับไปมีปัญหาแบบ autoencoder</p>", "link": "ต้องจูน β ให้สมดุลสองฝั่ง", "ref": "Lesson 13 §3.5", "terms": [], "why_wrong_map": ["นั่นคือ reconstruction หนักเกิน", "", "loss ไม่เป็นศูนย์", "ตรงข้าม"]}, {"id": "L10-20", "lesson": 10, "topic": "งานไหนใช้ seq-to-vector", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "งานใดเป็น sequence-to-vector", "options": ["แปลประโยคไทยเป็นอังกฤษ", "รับแนวเพลงแล้วสร้างลำดับโน้ต", "ติดป้ายชื่อคนให้ทุกคำในประโยค", "อ่านรีวิวยาวแล้วให้ดาว 1 ค่า"], "answer": um", "stem": "จากตารางเปรียบเทียบสี่สถาปัตยกรรม ข้อใดถูก", "options": ["ทั้งสี่ตัวมี parameter ใกล้กันราว 60M", "ResNet-152 มี parameter มากสุดเพราะลึกที่สุด", "AlexNet มี parameter น้อยสุดเพราะตื้นที่สุด", "VGG มี parameter มากสุด 138M ส่วน Inception น้อยสุด 6.4M"], "answer": 3, "explanation": "<p>VGG ใหญ่สุดเพราะ FC สามชั้นท้าย ResNet-152 ลึกเกือบ 10 เท่าของ VGG16 แต่มี 60.3M ไม่ถึงครึ่ง Inception ได้ accuracy สูงกว่า VGG ด้วย parameter น้อยกว่าราว 21 เท่า</p>", "link": "ข้อสรุปของตารางคือ accuracy สูงขึ้นไม่จำเป็นต้องใช้ parameter มากขึ้น", "ref": "Lesson 8 §3.3", "terms": [["FLOP", "จำนวนการคำนวณใน forward pass หนึ่งครั้ง"]], "why_wrong_map": ["ต่างกันหลายสิบเท่า", "ลึกไม่ได้แปลว่า parameter มาก", "AlexNet มี 62M มากกว่า Inception", ""]}, {"id": "L10-14", "lesson": 10, "topic": "exploding gradient", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "สไลด์แนะนำอะไรเพื่อลดความเสี่ยง exploding gradient ใน RNN", "options": ["ใช้ sigmoid ทุก gate และตัด bias ออก", "ใช้ tanh ลด learning rate และ gradient clipping", "ใช้ ReLU เพื่อให้ gradient ไม่ถูกจำกัด", "เพิ่ม learning rate ให้หลุดจากจุดที่ระเบิด"], "answer": 1, "explanation": "<p>ReLU ไม่มีเพดาน weight ที่ใช้ซ้ำทุก step จึงขยายค่าต่อไปได้ tanh อิ่มตัวใน −1 ถึง 1 learning rate เล็กกับ clipping ช่วยคุมขนาด</p>", "link": "คำแนะนำนี้กลับกับ feedforward ใน L5 ที่ให้ใช้ ReLU", "ref": "Lesson 10 §4.1", "terms": [], "why_wrong_map": ["ไม่ใช่วิธีที่สไลด์ให้", "", "ตรงข้ามกับคำแนะนำ", "learning rate ใหญ่ทำให้แย่ลง"]}, {"id": "L9-19", "lesson": 9, "topic": "วงเล็บสองชุด", "source": "lesson", "type": "apply", "difficulty": "easy", "stem": "ในบรรทัดนี้ วงเล็บชุดที่สองทำอะไร", "options": ["ป้อน tensor input_tensor เข้า layer ที่เพิ่งสร้าง", "ตั้งค่า activation เพิ่มเติมให้ layer นี้", "บอกจำนวน node ของ layer ที่อยู่ถัดไป", "สร้าง layer ชุดที่สองที่ใช้ weight ร่วมกัน"], "answer": 0, "explanation": "<p>ชุดแรกสร้าง instance ของ layer พร้อมค่าตั้ง ชุดที่สองเรียก layer นั้นเหมือนฟังก์ชันกับ tensor ได้ tensor ใหม on": "<p>filter หนึ่งตัวลึกเท่า input คือ 2 จึงมี weight 3 × 3 × 2 = 18 บวก bias 1 ได้ 19 คูณ 10 filter ได้ 190 ขนาด 20×20 ไม่อยู่ในสูตร</p>", "link": "สูตรนี้ไม่มีขนาดภาพ conv จึงใช้กับภาพใหญ่ได้โดย parameter ไม่โต ต่างจาก dense ใน §1.2", "ref": "Lesson 7 §4.2", "terms": [["n_C", "จำนวน channel ของ input ชั้นนั้น filter ต้องลึกเท่านี้"], ["bias", "ค่าบวกเพิ่มหนึ่งตัวต่อ filter"]], "why_wrong_map": ["นับ bias เป็น 2 ต่อ filter", "ลืมความลึก 2 ของ filter", "", "ลืม bias 10 ตัว"]}, {"id": "L15-11", "lesson": 15, "topic": "bind_tools", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "ข้อใดถูกเกี่ยวกับ bind_tools", "options": ["ให้นิยาม tool กับโมเดล แต่ไม่รับประกันว่าจะเรียก", "รัน tool ทุกตัวทันทีที่ bind เข้ากับโมเดล", "ทำให้ LLM ไม่ต้องรับ prompt จากผู้ใช้อีก", "บังคับให้โมเดลเรียกทุก tool ในทุกคำขอ"], "answer": 0, "explanation": "<p>หลัง bind โมเดลรู้จัก tool สร้าง tool call ได้ แต่จะเรียกหรือไม่ขึ้นกับโมเดล นิยาม คำสั่ง และบริบท lab ใช้ tool_choice=\"required\" เพื่อบังคับ</p>", "link": "schema ที่โมเดลเห็นสร้างจาก signature และ docstring ไม่ใช่ตัวโค้ด", "ref": "Lesson 15 §3.2", "terms": [], "why_wrong_map": ["", "ไม่ได้รัน", "ยังต้องมีข้อความ", "ไม่ได้บังคับ"]}, {"id": "L10-29", "lesson": 10, "topic": "embedding ใน vector space", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "embedding 2 มิติ Dog (0.3, 0.3) Wolf (0.3, 0.7) Cat (0.6, 0.2) คำที่อยู่ตำแหน่ง Cat + (Wolf − Dog) ควรเป็นอะไร", "options": ["Dog", "Kitten", "Tiger", "Wolf"], "answer": 2, "explanation": "<p>Wolf − Dog = (0, 0.4) คือทิศสัตว์เลี้ยงไปสัตว์ป่า Cat + (0, 0.4) = (0.6, 0.6) ได้สัตว์ป่าตระกูลแมว คือ Tiger</p>", "link": "ทิศทางใน embedding แทนความสัมพันธ์ one-hot ทำแบบนี้ไม่ได้เพราะทุกคำห่างเท่ากัน", "ref": "Lesson 10 §5.3", "terms": [], "why_wrong_map": ["Dog อยู่จุดเริ่ม", "Kitten คือทิศโตไปเด็ก", "", "Wolf อยู่ตระกูลสุนัข"]}, {"id": "L15-28", "lesson": 15, "topic": "ประเมิน agent", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": " บกราฟ", "ref": "Lesson 15 §2.4", "terms": [["orchestration", "ส่วนที่ประสานทุกส่วนให้ทำงานต่อกัน"]], "why_wrong_map": ["", "เก็บความรู้โดเมน", "ตีความและตัดสินใจ แต่ไม่ได้รันฟังก์ชัน", "เก็บข้อมูลจาก interaction ก่อน"]}, {"id": "L10-27", "lesson": 10, "topic": "TextVectorization", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "vocabulary คือ [\"\", \"[UNK]\", \"the\", \"cat\", \"sat\"] ประโยค \"The dog sat\" ได้ลำดับ index อะไร", "options": ["[2, 4]", "[2, 1, 4]", "[2, 0, 4]", "[3, 1, 5]"], "answer": 1, "explanation": "<p>TextVectorization แปลงเป็นตัวพิมพ์เล็กก่อน the อยู่ index 2 dog ไม่อยู่ใน vocabulary จึงเป็น [UNK] index 1 sat อยู่ index 4</p>", "link": "subword tokenizer ใน L12 ตัดคำที่ไม่รู้จักเป็นชิ้นเล็ก จึงไม่ค่อยเจอ [UNK]", "ref": "Lesson 10 §6.1", "terms": [["index 0", "mask token สำหรับ padding"], ["index 1", "OOV token แทนคำที่ไม่รู้จัก"]], "why_wrong_map": ["คำที่ไม่รู้จักไม่ถูกทิ้ง", "", "0 สงวนให้ padding", "นับ index เริ่มที่ 1"]}, {"id": "L11-28", "lesson": 11, "topic": "เลือกชนิด Transformer", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "งานสรุปบทความยาวเป็นย่อหน้าสั้น ควรเลือก Transformer ชนิดใด", "options": ["encoder-only เช่น BERT", "encoder-decoder เช่น T5 หรือ BART", "encoder-only ที่ต่อ Dense หนึ่งค่า", "decoder-only แบบไม่มี mask"], "answer": 1, "explanation": "<p>สรุปความคือ map ลำดับหนึ่งไปอีกลำดับที่ยาวไม่เท่ากัน encoder อ่านต้นฉบับ decoder สร้างข้อความใหม่ทีละ token</p>", "link": "pipeline summarization ใน L12 ใช้โมเดลชนิดนี้", "ref": "Lesson 11 §6.3", "terms": [], "why_wrong_map": ["BERT ไม่ได้สร้างข้อความ", "", "Dense ให้ค่าเดียว ไม่ใช่ข้อความ", "decoder ต้องมี mask"]}, {"id": "L14-07", "lesson": 14, "topic": "ส่วนไหนเรียนได้", "source": "lesson", "type": "recall", "difficulty": "easy", "stem": "ส่วนใดของ diffusion model มี parameter ที่เรียนได้", "options": ["ทั้งสองส่วน", "reverse process เท่านั้น", "ไม่มีส่วนใดเรียนได้", "forward process เท่านั้น"], "answer": 1, "explanation": "<p>forward เติม noise ตาม schedule ที่ตั้งไว้ก่อน เป็นสูตรตายตัว reverse เป็น neural network ที่ train ให้ลบ noise</p>", "link": "ต่างจาก VAE ที่ encoder ก็เรียนได้", "ref": "Lesson 14 §1.1", "terms": [["forward diffusion", "เติม noise ทีละขั้น"], ["reverse diffusion", "ลบ noise ทีละขั้น"]], "why_wrong_map": ["forward ไม่มี parameter", "", "reverse เรียนได้", "forward ตายตัว"]}, {"id": "L11-29", "lesson": 11, "topic": "QKV ค้นรูป", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "ค้นรูปด้วย query dogs on the beach รูปที่มีป้าย Beach, Dog, Tree ได้ match 1.0 ส่วน Dog อย่างเดียวได้ 0.5 output ของ attention จะเป็นอย่างไร", "options": ["เฉลี่ยทุกรูปเท่ากันไม่สนคะแนน", "เลือกรูปที่ป้ายน้อยที่สุด", "ผสมทุกรูปโดยรูปแรกได้น้ำหนักมากที่สุด", "เลือกรูปแรกรูปเดียวทิ้งรูปอื่น"], "answer": 2, "explanation": "<p>outputs = sum(values × scores) ทุก value ถูกนำมาผสมตามคะแนน ไม่ได้เลือกตัวเดียว รูปที่ตรงมากจึงมีผลมาก</p>", "link": "นี่คือผลรวมถ่วงน้ำหนักแบบเดียวกับ context ของ Bahdanau", "ref": "Lesson 11 §6.1", "terms": [], "why_wrong_map": ["คะแนนกำหนดน้ำหนัก", "ป้ายน้อยไม่ได้แปลว่าตรง", "", "attention ผสม ไม่ได้เลือก"]}, {"id": "L14-01", "lesson": 14, "topic": "forward หนึ่งขั้น", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "β = 0.36 pixel ของ x_{t−1} เป็น 1 สุ่มได้ ε = −0.5 ได้ x_t เท่าใด", "options": ["0.5", "1.1", "0.64", "0.82"], "answer": 0, "explanation": "<p>√(1 − 0.36) = 0.8 และ √0.36 = 0.6 x_t = 0.8 × 1 + 0.6 × (−0.5) = 0.8 − 0.3 = 0.5</p>", "link": "β จริงในโมเดลเล็กกว่านี้มาก เช่น 0.0001 ถึง 0.02 ค่านี้เลือกให้คิดง่าย", "ref": "Lesson 14 §2.1", "terms": [["β_t", "variance ของ noise ที่เติมในขั้น t"], ["ε", "noise สุ่มจาก normal มาตรฐาน"]], "why_wrong_map": ["", "ลืมเครื่องหมายลบของ ε", "ใช้ 1 − β แทน √(1 − β)", "ใช้ β แทน √β"]}, {"id": "L13-30", "lesson": 13, "topic": "VAE สุ่มรูปใหม่", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "หลังเทรน VAE แล้วอยากสร้างรูปใหม่ ควรสุ่ม z จากไหน", "options": ["สุ่มจากช่วง 0 ถึง 255 แบบ pixel", "normal มาตรฐาน N(0, 1) แล้วส่งเข้า decoder", "สุ่มจุดจากช่องว่างระหว่างกลุ่ม", "ใช้ μ ของรูปใน training set เท่านั้น"], "answer": 1, "explanation": "<p>KL ดันให้ latent มีการแจกแจงแบบ normal มาตรฐาน สุ่มจาก N(0, 1) แล้วจุดมักตกในบริเวณที่ decoder เคยเห็น</p>", "link": "นี่คือเหตุผลที่ต้องมี KL ถ้าไม่มีก็ไม่รู้ว่าจะสุ่มจากไหน", "ref": "Lesson 13 §3.4", "terms": [], "why_wrong_map": ["latent ไม่ใช่ pixel", "", "ช่องว่างเป็นปัญหาของ autoencoder", "ได้แค่รูปเดิม"]}, {"id": "L15-21", "lesson": 15, "topic": "เลือก tool และถามเพิ่ม", "source": "lesson", "type": "apply", "difficulty": "medium", "stem": "ลูกค้าพิมพ์ I returned my product last week. Has my money been sent back? โดยไม่บอก ID agent ควรทำอย่างไร", "options": ["ตอบว่าเงินคืนแล้วโดยไม่เรียก tool", "เลือก get_refund_status แล้วถามหา customer ID", "เรียก cancel_order ทันทีเพื่อความปลอดภัย", "เรียก get_refund_status ด้วย ID ที่แต่งขึ้นเอง"], "answer": 1, "explanation": "<p>ต้องใช้ tool ใช่ tool ที่ถูกคือ get_refund_status argument คือ customer ID ซึ่งยังไม่มี จึงต้องถามก่อน</p>", "link": "test case Where is my order ก็ต้องถาม ID ก่อน", "ref": "Lesson 15 §3.3", "terms": [], "why_wrong_map": ["ตอบโดยไม่มีข้อมูล", "", "ผิด tool และเป็น tool ที่แก้ระบบ", "แต่งค่าขึ้นเองคือข้อผิดพลาด"]}, {"id": "L13-21", "lesson": 13, "topic": "ลืม 0.5", "source": "lesson", "type": "apply", "difficulty": "hard", "stem": "ถ้าเขียน Sampling layer เป็น z = z_mean + exp(z_log_var) × ε ลืม 0.5 จะผิดอย่างไร", "options": ["gradient ไหลผ่าน μ ไม่ได้เลย", "z จะติดลบทุกครั้งที่สุ่ม", "ได้ σ ถูกต้องเหมือนเดิมทุกครั้ง", "ได้ σ² แทน σ ก้อนกว้างผิดขนาด"], "answer": 3, "explanation": "<p>exp(log σ²) = σ² ไม่ใช่ σ ต้อง exp(0.5 × log σ²) จึงได้ σ ถ้า σ² = 0.04 จะคูณ 0.04 แทน 0.2 ก้อนแคบเกินห้าเท่า</p>", "link": "Sampling layer ไม่มี weight parameter ใน summary จึงเป็น 0", "ref": "Lesson 13 §3.2", "terms": [], "code": "z = z_mean + ops.exp(z_log_var) * epsilon", "why_wrong_map": ["gradient ยังไหลได้", "z ขึ้นกับ ε", "ผิดเพราะลืมถอดราก "GRU ได้ MAE 2.53 ส่วน baseline ที่ทายว่าเท่าตอนนี้ได้ 2.62 ควรสรุปอย่างไร", "options": ["GRU ชนะ baseline แค่ราว 0.1 องศา ต้องเทียบเสมอ", "สองตัวเลขเทียบกันไม่ได้ เพราะคนละหน่วย", "baseline ดีกว่า เพราะไม่ต้องเทรนอะไรเลย", "GRU แม่นมากแล้ว เพราะ MAE ต่ำกว่า 3 องศา"], "answer": 0, "explanation": "<p>MAE อยู่หน่วยองศา ตัวเลขดูต่ำ แต่ baseline ที่ไม่ใช้ ML ก็ได้ใกล้กัน ถ้าไม่เทียบ baseline จะไม่รู้ว่าโมเดลดีจริงไหม Conv1D ใน notebook ได้ 2.94 แพ้ baseline ด้วย</p>", "link": "หลักเดียวกับ baseline ที่ทาย joy ทุกข้อใน L12", "ref": "Lesson 10 §4.4", "terms": [["MAE", "mean absolute error ค่าเฉลี่ยของความคลาดเคลื่อนแบบไม่คิดเครื่องหมาย"], ["baseline", "วิธีง่ายที่สุดที่ใช้เป็นจุดเทียบ"]], "why_wrong_map": ["", "ทั้งคู่หน่วยองศา", "baseline แพ้เล็กน้อย", "ต่ำกว่า 3 ไม่ได้บอกอะไรถ้าไม่มีจุดเทียบ"]}, {"id": "L10-22", "lesson": 10, "topic": "GRU กับ LSTM เก็บสองอย่าง", "source": "lesson", "type": "apply", "difficulty": "hard", "stem": "งานต้องเก็บข้อมูลเก่าไว้เต็มที่และรับข้อมูลใหม่เต็มที่ในขั้นเดียวกัน ข้อใดถูก", "options": ["GRU ทำได้เพราะ Γ_r แยกเป็นอิสระจาก Γ_u", "ทั้งสองทำได้เท่ากันเพราะมี gate สองตัวขึ้นไป", "ทั้งสองทำไม่ได้เพราะ memory ต้องอยู่ในช่วง 0 ถึง 1", "LSTM ทำได้เพราะ Γ_f แยกจาก Γ_u ส่วน GRU ต้องแลก"], "answer": 3, "explanation": "<p>LSTM ใช้ c = Γ_u c̃ + Γ_f c_prev ตั้ง Γ_u = Γ_f = 1 ได้พร้อมกัน ค่าเก่า 1.0 กับใหม่ 0.4 ได้ 1.4 GRU บังคับน้ำหนักของค่าเดิมเป็น 1 − Γ_u ยิ่งรับใหม่มากยิ่งลืมเก่ามาก</p>", "link": "ราคาที่ LSTM จ่ายคือ parameter 4 เท่าเทียบ 3 เท่าของ GRU", "ref": "Lesson 10 §3.2", "terms": [], "why_wrong_map": ["Γ_r คุมการสร้าง candidate ไม่ใช่การเก็บของเก่า", "GRU ผูก forget กับ update", "LSTM memory เกิน 1 ได้", ""]}, {"id": "L12-12", "lesson": 12, "topic": "LoRA เริ่มต้น", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "ตอนเริ่มเทรน LoRA ตั้ง B = 0 ผลคืออะไร", "options": ["BA = I โมเดลเริ่มเป็น identity", "BA = 0 โมเดลเริ่มเท่าโมเดลเดิม", "A = 0 ด้วย gradient จึงไม่ไหล", "W₀ = 0 ต้องเรียนใหม่ทั้งหมด"], "answer": 1, "explanation": "<p>h = W₀x + (α/r)BAx ถ้า B = 0 ส่วนที่เพิ่มเป็นศูนย์ โมเดลเริ่มเหมือนเดิมทุกประการ แล้วค่อยเรียนการแก้ ตอน inference รวม BA เข้า W₀ เป็น matrix เดียว ไม่ช้าลง</p>", "link": "แนวคิดเดียวกับ residual block ใน L8 ที่ f(x) = 0 แล้วได้ identity", "ref": "Lesson 12 §4.1", "terms": [], "why_wrong_map": ["ผลคูณกับศูนย์คือศูนย์", "", "A ยังสุ่ม gradient ไหลได้", "W₀ ถูกล็อกไว้"]}, {"id": "L14-04", "lesson": 14, "topic": "กระโดดไป x_t", "source": "lesson", "type": "calc", "difficulty": "easy", "stem": "pixel ของ x₀ เป็น 2 ᾱ = 0.64 ε = 1 ได้ x_t เท่าใด", "options": ["1.6", "1.64", "2.2", "3.28"], "answer": 2, "explanation": "<p>x_t = √ᾱ x₀ + √(1 − ᾱ) ε = 0.8 × 2 + 0.6 × 1 = 1.6 + 0.6 = 2.2 ได้ทันทีโดยไม่ผ่านขั้นกลาง</p>", "link": "ตอน train สุ่ม t แล้วสร้าง x_t ในบรรทัดเดียว ε ที่ใช้คือเฉลย", "ref": "Lesson 14 §2.3", "terms": [], "why_wrong_map": ["ลืม noise", "ใช้ ᾱ ไม่ถอดราก", "", "ใช้ ᾱ แล้วบวก 2"]}, {"id": "L12-13", "lesson": 12, "topic": "RAG similarity", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "similarity score ใน RAG วัดอะไร", "options": ["โมเดลมั่นใจในคำตอบแค่ไหน", "เอกสารที่ค้นได้เกี่ยวกับคำถามแค่ไหน", "คำตอบที่สร้างถูกต้องแค่ไหน", "เอกสารยาวแค่ไหนเทียบคำถาม"], "answer": 1, "explanation": "<p>สไลด์บอกว่า similarity วัด retrieval relevance ไม่ได้วัด correctness หรือ confidence ใน notebook ค้นได้เอกสารถูกที่ 0.420 แต่ FLAN-T5-small ตอบแค่ 2.</p>", "link": "RAG เหมือนสอบเปิดหนังสือ เปิดถูกหน้าแต่อ่านไม่เก่งก็ยังตอบผิด", "ref": "Lesson 12 §4.2", "terms": [["retrieval", "ขั้นค้นเอกสาร"], ["generator", "โมเดลที่สร้างคำตอบ"]], "why_wrong_map": ["ไม่ใช่ความมั่นใจของ generator", "", "ค้นถูกไม่ได้แปลว่าตอบถูก", "ไม่เกี่ยวกับความยาว"]}, {"id": "L7-26", "lesson": 7, "topic": "Global Average Pooling", "source": "lesson", "type": "apply", "difficulty": "hard", "stem": "feature map สุดท้าย 7×7×256 ต่อ Dense 10 ถ้าเปลี่ยน Flatten เป็น Global Average Pooling ผลข้อใดถูก", "options": ["Dense ได้ input 7 แทน 12,544 เพราะเฉลี่ยทีละแถวของแผ่น", "Dense ได้ input 256 แทน 12,544 parameter ลดราว 49 เท่า", "Dense ได้ input 49 แทน 12,544 parameter ลดราว 256 เท่า", "Dense ได้ input เท่าเดิม แต่ GAP เพิ่ม parameter อีก 256"], "answer": 1, "explanation": "<p>GAP เฉลี่ยทั้งแผ่น 7×7 = 49 ค่าให้เหลือ 1 ค่าต่อ channel จึงเหลือ 256 ค่า เทียบกับ flatten 7 × 7 × 256 = 12,544 input ของ Dense ลด 49 เท่า และ GAP ไม่มี parameter</p>", "link": "CNN รุ่นใหม่อย่าง ResNet ใช้ GAP แทน flatten กับ FC ใหญ่ ดู §6.1 และ L8", "ref": "Lesson 7 §6.1", "terms": [["Global Average Pooling", "เฉลี่ยทุกค่าในแต่ละแผ่นให้เหลือหนึ่งค่าต่อ channel"]], "why_wrong_map": ["GAP เฉลี่ยทั้งแผ่น ไม่ใช่ทีละแถว", "", "GAP เก็บ channel ไว้ เฉลี่ยกว้างสูงทิ้ง", "GAP ไม่มี parameter"]}, {"id": "L15-07", "lesson": 15, "topic": "agent คืออะไร", "source": "lesson", "type": "recall", "difficulty": "easy", "stem": "AI agent ต่างจาก automation ปกติตรงไหน", "options": ["เลือก action ตามสถานการณ์ ไม่ต้องเดินลำดับตายตัว", "ทำงานได้โดยไม่ต้องมีโมเดลภาษาใดๆ อยู่เบื้องหลัง", "ต้องทำงานโดยไม่มีคนดูแลเลยในทุกกรณี", "ใช้ได้กับงานคำนวณตัวเลขที่มีสูตรแน่นอนเท่านั้น"], "answer": 0, "explanation": "<p>agent ตีความสภาพแวดล้อม ตัดสินใจ และลงมือทำเพื่อเป้าหมาย ใช้ tool และปรับ action ตามผลที่ได้ ระดับความอิสระต่างกันได้</p>", "link": "Agentic AI คือคลื่นที่สาม จากทำนาย สู่สร้าง สู่ลงมือทำ", "ref": "Lesson 15 §1.1", "terms": [["autonomy", "ระดับที่ระบบตัดสินใจเองโดยไม่ต้องรอคนสั่ง"]], "why_wrong_map": ["", "agent ในบทใช้ foundation model", "ไม่จำเป็นต้องอิสระเต็มที่", "ใช้กับงานหลายแบบ"]}, {"id": "L8-08", "lesson": 8, "topic": "LeNet-5", "source": "lesson", "type": "recall", "difficulty": "medium", "stem": "ข้อใดตรงกับ LeNet-5", "options": ["8 weight layer ใช้ ReLU และ dropout กับ ImageNet", "16 weight layer ใช้ 3×3 ทุกชั้นกับ ImageNet", "5 weight layer ใช้ tanh และ average pooling กับ MNIST", "22 layer ใช้ inception module กับ MNIST"], "answer": 2, "explanation": "<p>LeNet-5 ปี 1998 มี 3 conv + 2 FC ใช้ tanh กับ average pooling พิสูจน์ว่า convolution สกัด feature ได้จริง ได้เกิน 99% บ let sessionAnswered = {}; // for "wrong" mode: questions re-answered in this view
const openExplain = new Set();

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildFilters() {
  const lf = document.getElementById("lessonFilters");
  for (const n of [7,8,9,10,11,12,13,14,15]) {
    const c = QUESTIONS.filter(q => q.lesson === n).length;
    lf.insertAdjacentHTML("beforeend", `<label class="chip"><input type="checkbox" class="lf" value="${n}" checked> ${LESSON_NAMES[n]} <span style="color:var(--ink-soft)">(${c})</span></label>`);
  }
  const tf = document.getElementById("typeFilters");
  for (const t of ["recall","apply","calc"]) {
    const c = QUESTIONS.filter(q => q.type === t).length;
    tf.insertAdjacentHTML("beforeend", `<label class="chip"><input type="checkbox" class="tf" value="${t}" checked> ${TYPE_NAMES[t]} <span style="color:var(--ink-soft)">(${c})</span></label>`);
  }
  document.querySelectorAll(".lf,.tf,input[name=mode]").forEach(el => el.addEventListener("change", () => { sessionAnswered = {}; newOrder(); }));
}

function currentPool() {
  const ls = new Set([...document.querySelectorAll(".lf:checked")].map(e => +e.value));
  const ts = new Set([...document.querySelectorAll(".tf:checked")].map(e => e.value));
  const mode = document.querySelector("input[name=mode]:checked").value;
  return QUESTIONS.filter(q => ls.has(q.lesson) && ts.has(q.type)).filter(q => {
    const a = answers[q.id];
    if (mode === "unanswered") return !a || sessionAnswered[q.id];
    if (mode === "wrong") return (a && !a.correct) || sessionAnswered[q.id];
    return true;
  });
}

function newOrder() { order = currentPool().map(q => q.id); openExplain.clear(); render(); }

function renderMath(el) {
  if (typeof renderMathInElement !== "function") return;
  renderMathInElement(el, { delimiters: [ {left:"$$",right:"$$",display:true}, {left:"\\[",right:"\\]",display:true}, {left:"\\(",right:"\\)",display:false} ], ignoredTags: ["script","noscript","style","textarea","pre","code"], throwOnError: false });
}

function cardHTML(q, idx) {
  const a = sessionAnswered[q.id] || (document.querySelector("input[name=mode]:checked").value === "wrong" ? null : answers[q.id]);
  const done = !!a;
  const cls = done ? (a.choice === q.answer ? "done-good" : "done-bad") : "";
  let opts = q.options.map((o, i) => {
    let c = "opt";
    if (done && i === q.answer) c += " correct";
    if (done && i === a.choice && i !== q.answer) c += " wrong";
    return `<button class="${c}" data-q="${q.id}" data-i="${i}" ${done ? "disabled" : ""}><span class="L">${LETTERS[i]}.</span><span>${o}</span></button>`;
  }).join("");
  let verdict = "";
  if (done) {
    verdict = a.choice === q.answer
      ? `<div class="verdict good">ถูกต้อง — คำตอบคือ ${LETTERS[q.answer]}</div>`
      : `<div class="verdict bad">ยังไม่ถูก — คุณตอบ ${LETTERS[a.choice]} · คำตอบที่ถูกคือ ${LETTERS[q.answer]}</div>`;
    verdict += `<div class="actions"><button data-explain="${q.id}">${openExplain.has(q.id) ? "ซ่อนเฉลย" : "ดูเฉลย"}</button></div>`;
    if (openExplain.has(q.id)) {
      const ww = q.options.map((o, i) => i === q.answer ? "" : `<li><b>${LETTERS[i]}.</b> ${q.why_wrong_map[i]}</li>`).join("");
      const terms = (q.terms && q.terms.length) ? `<h4>ศัพท์ในข้อนี้</h4><dl class="terms">${q.terms.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "";
      const link = q.link ? `<h4>ต่อกับเรื่องไหน</h4><div>${q.link}</div>` : "";
      verdict += `<div class="explain">${terms}<h4>คิดทีละขั้น: ทำไม ${LETTERS[q.answer]} ถูก</h4><div>${q.explanation}</div><h4>ตัวเลือกอื่นผิดเพราะ</h4><ul>${ww}</ul>${link}<div class="ref">ทบทวนที่: ${esc(q.ref)}</div></div>`;
    }
  }
  const code = q.code ? `<pre><code>${esc(q.code)}</code></pre>` : "";
  return `<div class="q ${cls}" id="card-${q.id}">
    <div class="meta"><span class="tag">${LESSON_NAMES[q.lesson]}</span><span class="tag t-${q.type}">${TYPE_NAMES[q.type]}</span><span class="tag d-${q.difficulty}">${DIFF_NAMES[q.difficulty]}</span>${done ? `<span class="tag" style="background:#f1f1ee;color:var(--ink-soft)">${esc(q.topic)}</span>` : ""}</div>
    <div class="stem"><span class="num">${idx + 1}.</span>${q.stem}</div>${code}
    <div class="opts">${opts}</div>${verdict}</div>`;
}

function render() {
  const list = document.getElementById("list");
  if (!order.length) { list.innerHTML = `<div class="empty">ไม่มีข้อในชุดนี้ ${document.querySelector("input[name=mode]:checked").value === "wrong" ? "— ยังไม่มีข้อที่ตอบผิด 🎉" : ""}</div>`; }
  else list.innerHTML = order.map((id, i) => cardHTML(byId[id], i)).join("");
  renderMath(list);
  const done = order.filter(id => answers[id]).length;
  document.getElementById("progress").textContent = order.length ? `กำลังแสดง ${order.length} ข้อ · ทำไปแล้วในชุดนี้ ${done} ข้อ` : "";
  renderStats();
}

function rerenderCard(id) {
  const el = document.getElementById("card-" + id);
  const idx = order.indexOf(id);
  const tmp = document.createElement("div");
  tmp.innerHTML = cardHTML(byId[id], idx);
  const nu = tmp.firstElementChild;
  el.replaceWith(nu);
  renderMath(nu);
  renderStats();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.opt");
  if (b && !b.disabled) {
    const q = byId[b.dataset.q], i = +b.dataset.i;
    const prev = answers[q.id];
    answers[q.id] = { choice: i, correct: i === q.answer, tries: (prev ? prev.tries : 0) + 1, everWrong: (prev && prev.everWrong) || i !== q.answer };
    sessionAnswered[q.id] = answers[q.id];
    save();
    rerenderCard(q.id);
    return;
  }
  const x = e.target.closest("button[data-explain]");
  if (x) { const id = x.dataset.explain; openExplain.has(id) ? openExplain.delete(id) : openExplain.add(id); rerenderCard(id); }
});

function pct(c, n) { return n ? Math.round(100 * c / n) : 0; }
function renderStats() {
  const st = document.getElementById("stats");
  const all = QUESTIONS.filter(q => answers[q.id]);
  const cor = all.filter(q => answers[q.id].correct).length;
  let html = `<div class="stat"><div class="k">ทำไปแล้ว</div><div class="v">${all.length}/${QUESTIONS.length}</div><div class="bar"><i style="width:${pct(all.length, QUESTIONS.length)}%"></i></div></div>`;
  html += `<div class="stat"><div class="k">ถูก (ล่าสุด)</div><div class="v">${cor}/${all.length} · ${pct(cor, all.length)}%</div><div class="bar"><i style="width:${pct(cor, all.length)}%"></i></div></div>`;
  for (const n of [7,8,9,10,11,12,13,14,15]) {
    const qs = QUESTIONS.filter(q => q.lesson === n && answers[q.id]);
    const c = qs.filter(q => answers[q.id].correct).length;
    html += `<div class="stat"><div class="k">${LESSON_NAMES[n]}</div><div class="v">${qs.length ? pct(c, qs.length) + "%" : "–"}</div><div class="k">${c}/${qs.length} ข้อที่ทำ</div><div class="bar"><i style="width:${pct(c, qs.length)}%"></i></div></div>`;
  }
  for (const t of ["recall","apply","calc"]) {
    const qs = QUESTIONS.filter(q => q.type === t && answers[q.id]);
    const c = qs.filter(q => answers[q.id].correct).length;
    html += `<div class="stat"><div class="k">ประเภท: ${TYPE_NAMES[t]}</div><div class="v">${qs.length ? pct(c, qs.length) + "%" : "–"}</div><div class="k">${c}/${qs.length}</div><div class="bar"><i style="width:${pct(c, qs.length)}%"></i></div></div>`;
  }
  st.innerHTML = html;
  const wrong = QUESTIONS.filter(q => answers[q.id] && !answers[q.id].correct);
  const w = document.getElementById("weakWrap");
  if (!wrong.length) { w.innerHTML = `<p class="k" style="color:var(--ink-soft);font-size:.9rem;margin:10px 0 0">ยังไม่มีข้อที่ผิด — จุดอ่อนจะขึ้นที่นี่ พร้อมตำแหน่งที่ควรกลับไปอ่าน</p>`; return; }
  w.innerHTML = `<p style="margin:12px 0 0;font-size:.9rem"><b>หัวข้อที่ยังผิดอยู่ (${wrong.length})</b> — กดเพื่อไปที่ข้อ หรือเลือกโหมด “เฉพาะข้อที่ผิด” เพื่อทำซ้ำ</p><ul class="weak">` +
    wrong.sort((a, b) => a.lesson - b.lesson).map(q => `<li><a href="#card-${q.id}" data-jump="${q.id}">L${q.lesson} · ${esc(q.topic)}</a> <span style="color:var(--ink-soft)">— ${esc(q.ref)}</span></li>`).join("") + `</ul>`;
}

document.getElementById("weakWrap").addEventListener("click", e => {
  const a = e.target.closest("a[data-jump]");
  if (!a) return;
  if (!document.getElementById("card-" + a.dataset.jump)) { e.preventDefault(); alert("ข้อนี้ไม่อยู่ในชุดที่กรองไว้ตอนนี้ — เปิดตัวกรองบท/ประเภทให้ครอบคลุมก่อน"); }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  const next = order.find(id => !answers[id]);
  if (!next) { alert("ทำครบทุกข้อในชุดนี้แล้ว"); return; }
  document.getElementById("card-" + next).scrollIntoView({ behavior: "smooth", block: "start" });
});
function buildExport() {
  const items = QUESTIONS.filter(q => answers[q.id]).map(q => {
    const a = answers[q.id];
    return { id: q.id, lesson: q.lesson, lessonName: LESSON_NAMES[q.lesson], topic: q.topic, source: q.source,
      type: q.type, difficulty: q.difficulty, ref: q.ref,
      question: q.stem.replace(/<[^>]+>/g, "").trim(),
      chosen: LETTERS[a.choice], chosenText: q.options[a.choice].replace(/<[^>]+>/g, "").trim(),
      correctLetter: LETTERS[q.answer], correctText: q.options[q.answer].replace(/<[^>]+>/g, "").trim(),
      isCorrect: a.correct, attempts: a.tries, everWrong: !!a.everWrong };
  });
  const byLesson = {};
  for (const n of [7,8,9,10,11,12,13,14,15]) {
    const qs = items.filter(i => i.lesson === n);
    byLesson[LESSON_NAMES[n]] = { answered: qs.length, correct: qs.filter(i => i.isCorrect).length, total: QUESTIONS.filter(q => q.lesson === n).length };
  }
  const byType = {};
  for (const t of ["recall","apply","calc"]) {
    const qs = items.filter(i => i.type === t);
    byType[t] = { answered: qs.length, correct: qs.filter(i => i.isCorrect).length };
  }
  return {
    exportedAt: new Date().toISOString(),
    source: "Deep Learning MCQ Final (Lessons 7-15)",
    totals: { questionsInBank: QUESTIONS.length, answered: items.length, correct: items.filter(i => i.isCorrect).length },
    byLesson, byType,
    weakTopics: items.filter(i => !i.isCorrect).map(i => ({ id: i.id, lesson: i.lessonName, topic: i.topic, ref: i.ref })),
    answersRaw: answers,
    items
  };
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = buildExport();
  if (!data.totals.answered) { alert("ยังไม่มีข้อที่ทำ — ตอบอย่างน้อย 1 ข้อก่อน"); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `dl-mcq-result-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const incoming = d.answersRaw || d;
      let n = 0;
      for (const [id, a] of Object.entries(incoming)) {
        if (!byId[id] || !a || typeof a.choice !== "number") continue;
        answers[id] = { choice: a.choice, correct: a.choice === byId[id].answer, tries: a.tries || 1, everWrong: !!a.everWrong || a.choice !== byId[id].answer };
        n++;
      }
      save(); sessionAnswered = {}; newOrder();
      alert(`นำเข้าแล้ว ${n} ข้อ`);
    } catch (err) { alert("ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON ที่ export จากหน้านี้"); }
    e.target.value = "";
  };
  r.readAsText(f);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("ล้างคำตอบทั้งหมดแล้วเริ่มใหม่?")) return;
  answers = {}; sessionAnswered = {}; save(); newOrder();
});

document.addEventListener("DOMContentLoaded", () => { buildFilters(); newOrder(); });
</script>
</body>
</html>
